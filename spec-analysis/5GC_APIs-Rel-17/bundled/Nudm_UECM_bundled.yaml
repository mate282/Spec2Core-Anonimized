      - name: nwdafRegistrationId
        in: path
        description: NWDAF registration identifier
        required: true
        schema:
          type: string
      - name: supported-features
        in: query
        description: Supported Features
        schema:
          $ref: '#/components/schemas/SupportedFeatures'
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/NwdafRegistrationModification'
        required: true
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/NwdafRegistration'
                - $ref: '#/components/schemas/PatchResult'
        '204':
          description: Expected response to a valid request
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Unprocessable Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          description: Unexpected error
components:
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://nrf:8000/oauth2/token
          scopes:
            nudm-uecm: Access to the nudm-uecm API
            nudm_uecm:amf-registration:write: Write access (update/modify) to representations
              of the Amf3GppAccessRegistration and AmfNon3GppAccessRegistration resources
            nudm_uecm:smf-registration:write: Write access (create/delete/modify)
              to the representations of individualSmfRegistration resources
            nudm_uecm:smsf-registration:write: Write access (create/delete/modify)
              to representations of the Smsf3GppAccessRegistration and SmsfNon3GppAccessRegistration
              resources
            nudm_uecm:ip-sm-gw-registration:write: Write access (create/delete/modify)
              to the representation of the IpSmGwRegistration resource
            nudm_uecm:nwdaf-registration:write: Write access (create/delete/modify)
              to the representation of the NwdafRegistration resource
  schemas:
    Amf3GppAccessRegistration:
      type: object
      required:
      - amfInstanceId
      - deregCallbackUri
      - guami
      - ratType
      properties:
        amfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        purgeFlag:
          $ref: '#/components/schemas/PurgeFlag'
        pei:
          $ref: '#/components/schemas/Pei'
        imsVoPs:
          $ref: '#/components/schemas/ImsVoPs'
        deregCallbackUri:
          $ref: '#/components/schemas/Uri'
        amfServiceNameDereg:
          $ref: '#/components/schemas/ServiceName'
        pcscfRestorationCallbackUri:
          $ref: '#/components/schemas/Uri'
        amfServiceNamePcscfRest:
          $ref: '#/components/schemas/ServiceName'
        initialRegistrationInd:
          type: boolean
        emergencyRegistrationInd:
          type: boolean
        guami:
          $ref: '#/components/schemas/Guami'
        backupAmfInfo:
          type: array
          items:
            $ref: '#/components/schemas/BackupAmfInfo'
          minItems: 1
        drFlag:
          $ref: '#/components/schemas/DualRegistrationFlag'
        ratType:
          $ref: '#/components/schemas/RatType'
        urrpIndicator:
          type: boolean
        amfEeSubscriptionId:
          $ref: '#/components/schemas/Uri'
        epsInterworkingInfo:
          $ref: '#/components/schemas/EpsInterworkingInfo'
        ueSrvccCapability:
          type: boolean
        registrationTime:
          $ref: '#/components/schemas/DateTime'
        vgmlcAddress:
          $ref: '#/components/schemas/VgmlcAddress'
        contextInfo:
          $ref: '#/components/schemas/ContextInfo'
        noEeSubscriptionInd:
          type: boolean
        supi:
          $ref: '#/components/schemas/Supi'
        ueReachableInd:
          $ref: '#/components/schemas/UeReachableInd'
        reRegistrationRequired:
          type: boolean
        adminDeregSubWithdrawn:
          type: boolean
        dataRestorationCallbackUri:
          $ref: '#/components/schemas/Uri'
        resetIds:
          type: array
          items:
            type: string
          minItems: 1
        disasterRoamingInd:
          type: boolean
          default: false
        ueMINTCapability:
          type: boolean
        sorSnpnSiSupported:
          type: boolean
          default: false
        udrRestartInd:
          type: boolean
          default: false
        lastSynchronizationTime:
          $ref: '#/components/schemas/DateTime'
    Amf3GppAccessRegistrationModification:
      type: object
      required:
      - guami
      properties:
        guami:
          $ref: '#/components/schemas/Guami'
        purgeFlag:
          $ref: '#/components/schemas/PurgeFlag'
        pei:
          $ref: '#/components/schemas/Pei'
        imsVoPs:
          $ref: '#/components/schemas/ImsVoPs'
        backupAmfInfo:
          type: array
          items:
            $ref: '#/components/schemas/BackupAmfInfo'
        epsInterworkingInfo:
          $ref: '#/components/schemas/EpsInterworkingInfo'
        ueSrvccCapability:
          type: boolean
          nullable: true
        ueMINTCapability:
          type: boolean
    EpsInterworkingInfo:
      type: object
      properties:
        epsIwkPgws:
          description: A map (list of key-value pairs where Dnn serves as key) of
            EpsIwkPgws
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EpsIwkPgw'
    EpsIwkPgw:
      type: object
      required:
      - pgwFqdn
      - smfInstanceId
      properties:
        pgwFqdn:
          $ref: '#/components/schemas/Fqdn'
        smfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        plmnId:
          $ref: '#/components/schemas/PlmnId'
    AmfNon3GppAccessRegistration:
      type: object
      required:
      - amfInstanceId
      - imsVoPs
      - deregCallbackUri
      - guami
      - ratType
      properties:
        amfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        purgeFlag:
          $ref: '#/components/schemas/PurgeFlag'
        pei:
          $ref: '#/components/schemas/Pei'
        imsVoPs:
          $ref: '#/components/schemas/ImsVoPs'
        deregCallbackUri:
          $ref: '#/components/schemas/Uri'
        amfServiceNameDereg:
          $ref: '#/components/schemas/ServiceName'
        pcscfRestorationCallbackUri:
          $ref: '#/components/schemas/Uri'
        amfServiceNamePcscfRest:
          $ref: '#/components/schemas/ServiceName'
        guami:
          $ref: '#/components/schemas/Guami'
        backupAmfInfo:
          type: array
          items:
            $ref: '#/components/schemas/BackupAmfInfo'
          minItems: 1
        ratType:
          $ref: '#/components/schemas/RatType'
        urrpIndicator:
          type: boolean
        amfEeSubscriptionId:
          $ref: '#/components/schemas/Uri'
        registrationTime:
          $ref: '#/components/schemas/DateTime'
        vgmlcAddress:
          $ref: '#/components/schemas/VgmlcAddress'
        contextInfo:
          $ref: '#/components/schemas/ContextInfo'
        noEeSubscriptionInd:
          type: boolean
        supi:
          $ref: '#/components/schemas/Supi'
        reRegistrationRequired:
          type: boolean
        adminDeregSubWithdrawn:
          type: boolean
        dataRestorationCallbackUri:
          $ref: '#/components/schemas/Uri'
        resetIds:
          type: array
          items:
            type: string
          minItems: 1
        disasterRoamingInd:
          type: boolean
          default: false
        sorSnpnSiSupported:
          type: boolean
          default: false
        udrRestartInd:
          type: boolean
          default: false
        lastSynchronizationTime:
          $ref: '#/components/schemas/DateTime'
    AmfNon3GppAccessRegistrationModification:
      type: object
      required:
      - guami
      properties:
        guami:
          $ref: '#/components/schemas/Guami'
        purgeFlag:
          $ref: '#/components/schemas/PurgeFlag'
        pei:
          $ref: '#/components/schemas/Pei'
        imsVoPs:
          $ref: '#/components/schemas/ImsVoPs'
        backupAmfInfo:
          type: array
          items:
            $ref: '#/components/schemas/BackupAmfInfo'
    SmfRegistration:
      type: object
      required:
      - smfInstanceId
      - pduSessionId
      - singleNssai
      - plmnId
      properties:
        smfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        smfSetId:
          $ref: '#/components/schemas/NfSetId'
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        pduSessionId:
          $ref: '#/components/schemas/PduSessionId'
        singleNssai:
          $ref: '#/components/schemas/Snssai'
        dnn:
          $ref: '#/components/schemas/Dnn'
        emergencyServices:
          type: boolean
        pcscfRestorationCallbackUri:
          $ref: '#/components/schemas/Uri'
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        pgwFqdn:
          $ref: '#/components/schemas/Fqdn'
        pgwIpAddr:
          $ref: '#/components/schemas/IpAddress'
        epdgInd:
          type: boolean
          default: false
        deregCallbackUri:
          $ref: '#/components/schemas/Uri'
        registrationReason:
          $ref: '#/components/schemas/RegistrationReason'
        registrationTime:
          $ref: '#/components/schemas/DateTime'
        contextInfo:
          $ref: '#/components/schemas/ContextInfo'
        pcfId:
          $ref: '#/components/schemas/NfInstanceId'
        dataRestorationCallbackUri:
          $ref: '#/components/schemas/Uri'
        resetIds:
          type: array
          items:
            type: string
          minItems: 1
        udrRestartInd:
          type: boolean
          default: false
        lastSynchronizationTime:
          $ref: '#/components/schemas/DateTime'
    SmsfRegistration:
      type: object
      required:
      - smsfInstanceId
      - plmnId
      properties:
        smsfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        smsfSetId:
          $ref: '#/components/schemas/NfSetId'
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        smsfMAPAddress:
          $ref: '#/components/schemas/E164Number'
        smsfDiameterAddress:
          $ref: '#/components/schemas/NetworkNodeDiameterAddress'
        registrationTime:
          $ref: '#/components/schemas/DateTime'
        contextInfo:
          $ref: '#/components/schemas/ContextInfo'
        dataRestorationCallbackUri:
          $ref: '#/components/schemas/Uri'
        resetIds:
          type: array
          items:
            type: string
          minItems: 1
        smsfSbiSupInd:
          type: boolean
          default: false
        udrRestartInd:
          type: boolean
          default: false
        lastSynchronizationTime:
          $ref: '#/components/schemas/DateTime'
        ueMemoryAvailableInd:
          type: boolean
          enum:
          - true
    DeregistrationData:
      type: object
      required:
      - deregReason
      properties:
        deregReason:
          $ref: '#/components/schemas/DeregistrationReason'
        accessType:
          $ref: '#/components/schemas/AccessType'
        pduSessionId:
          $ref: '#/components/schemas/PduSessionId'
        newSmfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
    PcscfRestorationNotification:
      type: object
      required:
      - supi
      properties:
        supi:
          $ref: '#/components/schemas/Supi'
        failedPcscf:
          $ref: '#/components/schemas/PcscfAddress'
    NetworkNodeDiameterAddress:
      type: object
      required:
      - name
      - realm
      properties:
        name:
          $ref: '#/components/schemas/Fqdn'
        realm:
          $ref: '#/components/schemas/Fqdn'
    TriggerRequest:
      type: object
      required:
      - supi
      properties:
        supi:
          $ref: '#/components/schemas/Supi'
        failedPcscf:
          $ref: '#/components/schemas/PcscfAddress'
    SmfRegistrationInfo:
      type: object
      required:
      - smfRegistrationList
      properties:
        smfRegistrationList:
          type: array
          items:
            $ref: '#/components/schemas/SmfRegistration'
          minItems: 1
    IpSmGwRegistration:
      type: object
      anyOf:
      - required:
        - ipSmGwMapAddress
      - required:
        - ipSmGwDiameterAddress
      - required:
        - ipsmgwIpv4
      - required:
        - ipsmgwIpv6
      - required:
        - ipsmgwFqdn
      properties:
        ipSmGwMapAddress:
          $ref: '#/components/schemas/E164Number'
        ipSmGwDiameterAddress:
          $ref: '#/components/schemas/NetworkNodeDiameterAddress'
        ipsmgwIpv4:
          $ref: '#/components/schemas/Ipv4Addr'
        ipsmgwIpv6:
          $ref: '#/components/schemas/Ipv6Addr'
        ipsmgwFqdn:
          $ref: '#/components/schemas/Fqdn'
        nfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        unriIndicator:
          type: boolean
          default: false
        resetIds:
          type: array
          items:
            type: string
          minItems: 1
        ipSmGwSbiSupInd:
          type: boolean
          default: false
    AmfDeregInfo:
      type: object
      required:
      - deregReason
      properties:
        deregReason:
          $ref: '#/components/schemas/DeregistrationReason'
    LocationInfo:
      type: object
      required:
      - registrationLocationInfoList
      properties:
        supi:
          $ref: '#/components/schemas/Supi'
        gpsi:
          $ref: '#/components/schemas/Gpsi'
        registrationLocationInfoList:
          type: array
          items:
            $ref: '#/components/schemas/RegistrationLocationInfo'
          minItems: 1
          maxItems: 2
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
    RegistrationLocationInfo:
      type: object
      required:
      - amfInstanceId
      - accessTypeList
      properties:
        amfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        guami:
          $ref: '#/components/schemas/Guami'
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        vgmlcAddress:
          $ref: '#/components/schemas/VgmlcAddress'
        accessTypeList:
          type: array
          items:
            $ref: '#/components/schemas/AccessType'
          minItems: 1
          maxItems: 2
    VgmlcAddress:
      type: object
      properties:
        vgmlcAddressIpv4:
          $ref: '#/components/schemas/Ipv4Addr'
        vgmlcAddressIpv6:
          $ref: '#/components/schemas/Ipv6Addr'
        vgmlcFqdn:
          $ref: '#/components/schemas/Fqdn'
    PeiUpdateInfo:
      type: object
      required:
      - pei
      properties:
        pei:
          $ref: '#/components/schemas/Pei'
    RegistrationDatasetNames:
      type: array
      items:
        $ref: '#/components/schemas/RegistrationDataSetName'
      minItems: 2
      uniqueItems: true
    RegistrationDataSets:
      type: object
      properties:
        amf3Gpp:
          $ref: '#/components/schemas/Amf3GppAccessRegistration'
        amfNon3Gpp:
          $ref: '#/components/schemas/AmfNon3GppAccessRegistration'
        smfRegistration:
          $ref: '#/components/schemas/SmfRegistrationInfo'
        smsf3Gpp:
          $ref: '#/components/schemas/SmsfRegistration'
        smsfNon3Gpp:
          $ref: '#/components/schemas/SmsfRegistration'
        ipSmGw:
          $ref: '#/components/schemas/IpSmGwRegistration'
        nwdafRegistration:
          $ref: '#/components/schemas/NwdafRegistrationInfo'
    NwdafRegistration:
      description: The complete set of information relevant to an NWDAF serving the
        UE
      type: object
      required:
      - nwdafInstanceId
      - analyticsIds
      properties:
        nwdafInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        analyticsIds:
          type: array
          items:
            $ref: '#/components/schemas/EventId'
          minItems: 1
        nwdafSetId:
          $ref: '#/components/schemas/NfSetId'
        registrationTime:
          $ref: '#/components/schemas/DateTime'
        contextInfo:
          $ref: '#/components/schemas/ContextInfo'
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        resetIds:
          type: array
          items:
            type: string
          minItems: 1
    NwdafRegistrationModification:
      description: Contains attributes of NwdafRegistration that can be modified using
        PATCH
      type: object
      required:
      - nwdafInstanceId
      properties:
        nwdafInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        nwdafSetId:
          $ref: '#/components/schemas/NfSetId'
        analyticsIds:
          type: array
          items:
            $ref: '#/components/schemas/EventId'
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
    SmfRegistrationModification:
      description: Contains attributes of SmfRegistration that can be modified using
        PATCH
      type: object
      required:
      - smfInstanceId
      properties:
        smfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        smfSetId:
          $ref: '#/components/schemas/NfSetId'
        pgwFqdn:
          $ref: '#/components/schemas/FqdnRm'
    DataRestorationNotification:
      description: Contains identities representing those UEs potentially affected
        by a data-loss event at the UDR
      type: object
      properties:
        lastReplicationTime:
          $ref: '#/components/schemas/DateTime'
        recoveryTime:
          $ref: '#/components/schemas/DateTime'
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        supiRanges:
          type: array
          items:
            $ref: '#/components/schemas/SupiRange'
          minItems: 1
        gpsiRanges:
          type: array
          items:
            $ref: '#/components/schemas/IdentityRange'
          minItems: 1
        resetIds:
          type: array
          items:
            type: string
          minItems: 1
        sNssaiList:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        dnnList:
          type: array
          items:
            $ref: '#/components/schemas/Dnn'
          minItems: 1
        udmGroupId:
          $ref: '#/components/schemas/NfGroupId'
    RoamingInfoUpdate:
      description: Contains the Roaming Information Update
      type: object
      required:
      - servingPlmn
      properties:
        roaming:
          type: boolean
        servingPlmn:
          $ref: '#/components/schemas/PlmnId'
    PcscfAddress:
      description: Contains the addressing information (IP addresses and/or FQDN)
        of the P-CSCF
      type: object
      anyOf:
      - required:
        - ipv4Addrs
      - required:
        - ipv6Addrs
      - required:
        - fqdn
      properties:
        ipv4Addrs:
          type: array
          items:
            $ref: '#/components/schemas/Ipv4Addr'
          minItems: 1
        ipv6Addrs:
          type: array
          items:
            $ref: '#/components/schemas/Ipv6Addr'
          minItems: 1
        fqdn:
          $ref: '#/components/schemas/Fqdn'
    NwdafRegistrationInfo:
      description: List of NwdafRegistration
      type: object
      required:
      - nwdafRegistrationList
      properties:
        nwdafRegistrationList:
          type: array
          items:
            $ref: '#/components/schemas/NwdafRegistration'
          minItems: 1
    RoutingInfoSmRequest:
      description: Request body of the send-routing-info-sm custom operation
      type: object
      properties:
        ipSmGwInd:
          type: boolean
          default: false
        correlationId:
          type: string
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
    RoutingInfoSmResponse:
      description: Addressing information of available nodes for SMS delivery
      type: object
      properties:
        supi:
          $ref: '#/components/schemas/Supi'
        smsf3Gpp:
          $ref: '#/components/schemas/SmsfRegistration'
        smsfNon3Gpp:
          $ref: '#/components/schemas/SmsfRegistration'
        ipSmGw:
          $ref: '#/components/schemas/IpSmGwInfo'
        smsRouter:
          $ref: '#/components/schemas/SmsRouterInfo'
    IpSmGwInfo:
      description: Contains the IP-SM-GW Information
      type: object
      properties:
        ipSmGwRegistration:
          $ref: '#/components/schemas/IpSmGwRegistration'
        ipSmGwGuidance:
          $ref: '#/components/schemas/IpSmGwGuidance'
    IpSmGwGuidance:
      description: 'Contains guidance information (e.g. minimum and recommended delivery
        times) of the IP-SM-GW

        '
      type: object
      required:
      - minDeliveryTime
      - recommDeliveryTime
      properties:
        minDeliveryTime:
          type: integer
          minimum: 30
          maximum: 600
        recommDeliveryTime:
          type: integer
          minimum: 30
          maximum: 600
    SmsRouterInfo:
      description: Addressing information of the SMS Router configured at the UDM
      type: object
      properties:
        nfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        diameterAddress:
          $ref: '#/components/schemas/NetworkNodeDiameterAddress'
        mapAddress:
          $ref: '#/components/schemas/E164Number'
        routerIpv4:
          $ref: '#/components/schemas/Ipv4Addr'
        routerIpv6:
          $ref: '#/components/schemas/Ipv6Addr'
        routerFqdn:
          $ref: '#/components/schemas/Fqdn'
    PurgeFlag:
      type: boolean
    E164Number:
      type: string
      pattern: ^[0-9]{1,15}$
    DualRegistrationFlag:
      type: boolean
    ImsVoPs:
      anyOf:
      - type: string
        enum:
        - HOMOGENEOUS_SUPPORT
        - HOMOGENEOUS_NON_SUPPORT
        - NON_HOMOGENEOUS_OR_UNKNOWN
      - type: string
    DeregistrationReason:
      anyOf:
      - type: string
        enum:
        - UE_INITIAL_REGISTRATION
        - UE_REGISTRATION_AREA_CHANGE
        - SUBSCRIPTION_WITHDRAWN
        - 5GS_TO_EPS_MOBILITY
        - 5GS_TO_EPS_MOBILITY_UE_INITIAL_REGISTRATION
        - REREGISTRATION_REQUIRED
        - SMF_CONTEXT_TRANSFERRED
        - DUPLICATE_PDU_SESSION
        - DISASTER_CONDITION_TERMINATED
      - type: string
    RegistrationReason:
      anyOf:
      - type: string
        enum:
        - SMF_CONTEXT_TRANSFERRED
      - type: string
    RegistrationDataSetName:
      anyOf:
      - type: string
        enum:
        - AMF_3GPP
        - AMF_NON_3GPP
        - SMF_PDU_SESSIONS
        - SMSF_3GPP
        - SMSF_NON_3GPP
        - IP_SM_GW
        - NWDAF
      - type: string
    UeReachableInd:
      description: UE Reachable Indication
      anyOf:
      - type: string
        enum:
        - REACHABLE
        - NOT_REACHABLE
        - UNKNOWN
      - type: string
    VarUeId:
      type: string
      pattern: ^(imsi-[0-9]{5,15}|nai-.+|msisdn-[0-9]{5,15}|extid-[^@]+@[^@]+|gci-.+|gli-.+|.+)$
      description: String represents the SUPI or GPSI
    SupportedFeatures:
      type: string
      pattern: ^[A-Fa-f0-9]*$
      description: "A string used to indicate the features supported by an API that\
        \ is used as defined in clause  6.6 in 3GPP TS 29.500. The string shall contain\
        \ a bitmask indicating supported features in  hexadecimal representation Each\
        \ character in the string shall take a value of \"0\" to \"9\",  \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent the support of 4 features as\
        \ described in  table\_5.2.2-3. The most significant character representing\
        \ the highest-numbered features shall  appear first in the string, and the\
        \ character representing features 1 to 4 shall appear last  in the string.\
        \ The list of features and their numbering (starting with 1) are defined \
        \ separately for each API. If the string contains a lower number of characters\
        \ than there are  defined features for an API, all features that would be\
        \ represented by characters that are not  present in the string are not supported.\n"
    Snssai:
      type: object
      properties:
        sst:
          type: integer
          minimum: 0
          maximum: 255
          description: "Unsigned integer, within the range 0 to 255, representing\
            \ the Slice/Service Type.  It indicates the expected Network Slice behaviour\
            \ in terms of features and services. Values 0 to 127 correspond to the\
            \ standardized SST range. Values 128 to 255 correspond  to the Operator-specific\
            \ range. See clause 28.4.2 of 3GPP TS 23.003. Standardized values are\
            \ defined in clause 5.15.2.2 of 3GPP TS 23.501. \n"
        sd:
          type: string
          pattern: ^[A-Fa-f0-9]{6}$
          description: '3-octet string, representing the Slice Differentiator, in
            hexadecimal representation. Each character in the string shall take a
            value of "0" to "9", "a" to "f" or "A" to "F" and shall represent 4 bits.
            The most significant character representing the 4 most significant bits
            of the SD shall appear first in the string, and the character representing
            the 4 least significant bit of the SD shall appear last in the string.
            This is an optional parameter that complements the Slice/Service type(s)
            to allow to  differentiate amongst multiple Network Slices of the same
            Slice/Service type. This IE shall be absent if no SD value is associated
            with the SST.

            '
      description: 'When Snssai needs to be converted to string (e.g. when used in
        maps as key), the string shall be composed of one to three digits "sst" optionally
        followed by "-" and 6 hexadecimal digits "sd".

        '
      required:
      - sst
    Dnn:
      type: string
      description: 'String representing a Data Network as defined in clause 9A of
        3GPP TS 23.003;  it shall contain either a DNN Network Identifier, or a full
        DNN with both the Network  Identifier and Operator Identifier, as specified
        in 3GPP TS 23.003 clause 9.1.1 and 9.1.2. It shall be coded as string in which
        the labels are separated by dots  (e.g. "Label1.Label2.Label3").

        '
    NfInstanceId:
      type: string
      format: uuid
      description: "String uniquely identifying a NF instance. The format of the NF\
        \ Instance ID shall be a  Universally Unique Identifier (UUID) version 4,\
        \ as described in IETF RFC 4122. \n"
    Pei:
      type: string
      pattern: ^(imei-[0-9]{15}|imeisv-[0-9]{16}|mac((-[0-9a-fA-F]{2}){6})(-untrusted)?|eui((-[0-9a-fA-F]{2}){8})|.+)$
      description: "String representing a Permanent Equipment Identifier that may\
        \ contain - an IMEI or IMEISV, as  specified in clause 6.2 of 3GPP TS 23.003;\
        \ a MAC address for a 5G-RG or FN-RG via  wireline  access, with an indication\
        \ that this address cannot be trusted for regulatory purpose if this  address\
        \ cannot be used as an Equipment Identifier of the FN-RG, as specified in\
        \ clause 4.7.7  of 3GPP TS23.316. Examples are imei-012345678901234 or imeisv-0123456789012345.\
        \ \n"
    Uri:
