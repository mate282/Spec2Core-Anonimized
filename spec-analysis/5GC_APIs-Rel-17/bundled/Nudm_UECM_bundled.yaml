        instance:
          $ref: '#/components/schemas/Uri'
        cause:
          type: string
          description: 'A machine-readable application error cause specific to this
            occurrence of the problem.  This IE should be present and provide application-related
            error information, if available.

            '
        invalidParams:
          type: array
          items:
            $ref: '#/components/schemas/InvalidParam'
          minItems: 1
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        accessTokenError:
          $ref: '#/components/schemas/AccessTokenErr'
        accessTokenRequest:
          $ref: '#/components/schemas/AccessTokenReq'
        nrfId:
          $ref: '#/components/schemas/Fqdn'
    AccessType:
      type: string
      enum:
      - 3GPP_ACCESS
      - NON_3GPP_ACCESS
      description: Indicates whether the access is  via 3GPP or via non-3GPP.
    RedirectResponse:
      description: 'The response shall include a Location header field containing
        a different URI  (pointing to a different URI of an other service instance),
        or the same URI if a request  is redirected to the same target resource via
        a different SCP.

        '
      type: object
      properties:
        cause:
          type: string
        targetScp:
          $ref: '#/components/schemas/Uri'
        targetSepp:
          $ref: '#/components/schemas/Uri'
    SupiRange:
      description: 'A range of SUPIs (subscriber identities), either based on a numeric
        range, or based on regular-expression matching

        '
      type: object
      properties:
        start:
          type: string
          pattern: ^[0-9]+$
        end:
          type: string
          pattern: ^[0-9]+$
        pattern:
          type: string
    IdentityRange:
      description: 'A range of GPSIs (subscriber identities), either based on a numeric
        range, or based on regular-expression matching

        '
      type: object
      properties:
        start:
          type: string
          pattern: ^[0-9]+$
        end:
          type: string
          pattern: ^[0-9]+$
        pattern:
          type: string
    NfGroupId:
      type: string
      description: Identifier of a group of NFs.
    ReportItem:
      type: object
      required:
      - path
      properties:
        path:
          type: string
          description: 'Contains a JSON pointer value (as defined in IETF RFC 6901)
            that references a  location of a resource to which the modification is
            subject.

            '
        reason:
          type: string
          description: 'A human-readable reason providing details on the reported
            modification failure.  The reason string should identify the operation
            that failed using the operation''s  array index to assist in correlation
            of the invalid parameter with the failed  operation, e.g. "Replacement
            value invalid for attribute (failed operation index= 4)".

            '
      description: indicates performed modivications.
    PatchResult:
      description: The execution report result on failed modification.
      type: object
      required:
      - report
      properties:
        report:
          type: array
          items:
            $ref: '#/components/schemas/ReportItem'
          minItems: 1
          description: 'The execution report contains an array of report items. Each
            report item indicates one  failed modification.

            '
    NullValue:
      enum:
      - null
      description: JSON's null value.
    FqdnRm:
      description: Fully Qualified Domain Name, but it also allows the null value
      anyOf:
      - $ref: '#/components/schemas/Fqdn'
      - $ref: '#/components/schemas/NullValue'
    Gpsi:
      type: string
      pattern: ^(msisdn-[0-9]{5,15}|extid-[^@]+@[^@]+|.+)$
      description: "String identifying a Gpsi shall contain either an External Id\
        \ or an MSISDN.  It shall be formatted as follows -External Identifier= \"\
        extid-'extid', where 'extid'  shall be formatted according to clause 19.7.2\
        \ of 3GPP TS 23.003 that describes an  External Identifier. \n"
  responses:
    '307':
      description: Temporary Redirect
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RedirectResponse'
      headers:
        Location:
          description: The URI pointing to the resource located on the redirect target
          required: true
          schema:
            type: string
        3gpp-Sbi-Target-Nf-Id:
          description: Identifier of target NF (service) instance towards which the
            request is redirected
          schema:
            type: string
    '308':
      description: Permanent Redirect
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RedirectResponse'
      headers:
        Location:
          description: The URI pointing to the resource located on the redirect target
          required: true
          schema:
            type: string
        3gpp-Sbi-Target-Nf-Id:
          description: '''Identifier of target NF (service) instance towards which
            the request is redirected''

            '
          schema:
            type: string
    '400':
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '403':
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '404':
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '409':
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '500':
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '501':
      description: Not Implemented
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '503':
      description: Service Unavailable
      content:
