openapi: 3.0.0
info:
  version: 1.2.6
  title: Nudm_UECM
  description: "Nudm Context Management Service.  \n\xA9 2024, 3GPP Organizational\
    \ Partners (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC).  \nAll rights reserved.\n"
servers:
- url: http://udm:8000/nudm-uecm/v1
security:
- oAuth2ClientCredentials:
  - nudm-uecm
- {}
externalDocs:
  description: 3GPP TS 29.503 Unified Data Management Services, version 17.14.0
  url: https://www.3gpp.org/ftp/Specs/archive/29_series/29.503/
paths:
  /{ueId}/registrations:
    get:
      summary: retrieve UE registration data sets
      operationId: GetRegistrations
      tags:
      - UECM Registration Info Retrieval
      parameters:
      - name: ueId
        in: path
        description: Identifier of the UE
        required: true
        schema:
          $ref: '#/components/schemas/VarUeId'
      - name: supported-features
        in: query
        schema:
          $ref: '#/components/schemas/SupportedFeatures'
      - name: registration-dataset-names
        in: query
        style: form
        explode: false
        description: List of UECM registration dataset names
        required: true
        schema:
          $ref: '#/components/schemas/RegistrationDatasetNames'
      - name: single-nssai
        in: query
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Snssai'
      - name: dnn
        in: query
        schema:
          $ref: '#/components/schemas/Dnn'
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationDataSets'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          description: Unexpected error
  /{ueId}/registrations/send-routing-info-sm:
    post:
      summary: Retreive addressing information for SMS delivery
      operationId: SendRoutingInfoSm
      tags:
      - SendRoutingInfoSM (Custom Operation)
      parameters:
      - name: ueId
        in: path
        description: Identifier of the UE
        required: true
        schema:
          $ref: '#/components/schemas/VarUeId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutingInfoSmRequest'
        required: true
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingInfoSmResponse'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
