openapi: 3.0.0
info:
  version: 1.2.3
  title: Nudm_PP
  description: "Nudm Parameter Provision Service.  \n\xA9 2024, 3GPP Organizational\
    \ Partners (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC).  \nAll rights reserved.\n"
servers:
- url: http://udm:8000/nudm-pp/v1
security:
- oAuth2ClientCredentials:
  - nudm-pp
- {}
externalDocs:
  description: 3GPP TS 29.503 Unified Data Management Services, version 17.14.0
  url: https://www.3gpp.org/ftp/Specs/archive/29_series/29.503/
paths:
  /{ueId}/pp-data:
    patch:
      summary: provision parameters
      operationId: Update
      tags:
      - Subscription Data Update
      parameters:
      - name: ueId
        in: path
        description: Identifier of the UE
        required: true
        schema:
          anyOf:
          - $ref: '#/components/schemas/VarUeId'
          - $ref: '#/components/schemas/ExtGroupId'
      - name: supported-features
        in: query
        description: Features required to be supported by the target NF
        schema:
          $ref: '#/components/schemas/SupportedFeatures'
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PpData'
        required: true
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchResult'
        '204':
          description: Expected response to a valid request
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          description: Unexpected error
  /5g-vn-groups/{extGroupId}:
    put:
      summary: create a 5G VN Group
      operationId: Create 5G VN Group
      tags:
      - 5G VN Group Creation
      parameters:
      - name: extGroupId
        in: path
        description: External Identifier of the Group
        required: true
        schema:
          $ref: '#/components/schemas/ExtGroupId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/5GVnGroupConfiguration'
        required: true
      responses:
        '201':
          description: Expected response to a valid request
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          description: Unexpected error
    delete:
      summary: delete a 5G VN Group
      operationId: Delete 5G VN Group
      tags:
      - 5G VN Group Deletion
      parameters:
      - name: extGroupId
        in: path
        description: External Identifier of the Group
        required: true
        schema:
          $ref: '#/components/schemas/ExtGroupId'
      - name: mtc-provider-info
        in: query
        description: MTC Provider Information that originated the service operation
        schema:
          $ref: '#/components/schemas/MtcProviderInformation'
      - name: af-id
        in: query
        description: AF ID that originated the service operation
        schema:
          type: string
      responses:
        '204':
          description: Expected response to a valid request
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          description: Unexpected error
    patch:
      summary: modify a 5G VN Group
      operationId: Modify 5G VN Group
      tags:
      - 5G VN Group Modification
      parameters:
      - name: extGroupId
        in: path
        description: External Identifier of the group
        required: true
        schema:
          $ref: '#/components/schemas/ExtGroupId'
      - name: supported-features
        in: query
        description: Features required to be supported by the target NF
        schema:
          $ref: '#/components/schemas/SupportedFeatures'
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/5GVnGroupConfiguration'
        required: true
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchResult'
        '204':
          description: Expected response to a valid request
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          description: Unexpected error
    get:
      summary: get 5G VN Group
      operationId: Get 5G VN Group
      tags:
      - 5G VN Group Modification
      parameters:
      - name: extGroupId
        in: path
        description: External Identifier of the group
        required: true
        schema:
          $ref: '#/components/schemas/ExtGroupId'
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/5GVnGroupConfiguration'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          description: Unexpected error
  /{ueId}/pp-data-store/{afInstanceId}:
    put:
      summary: Create a Provisioning Parameter Data Entry
      operationId: Create PP Data Entry
      tags:
      - ParameterProvisioningDataEntry (Document)
      parameters:
      - name: ueId
        in: path
        description: Identifier of the UE
        required: true
        schema:
          anyOf:
          - $ref: '#/components/schemas/VarUeId'
          - $ref: '#/components/schemas/ExtGroupId'
          - type: string
            pattern: ^anyUE$
      - name: afInstanceId
        in: path
        description: Application Function Instance Identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PpDataEntry'
        required: true
      responses:
        '201':
          description: Indicating a successful creation of the resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PpDataEntry'
        '204':
          description: Indicating a successful update of the resource
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          description: Unexpected error
    delete:
      summary: Delete a Provisioning Parameter Data Entry
      operationId: Delete PP Data Entry
      tags:
      - ParameterProvisioningDataEntry (Document)
      parameters:
      - name: ueId
        in: path
        description: Identifier of the UE
        required: true
        schema:
          anyOf:
          - $ref: '#/components/schemas/VarUeId'
          - $ref: '#/components/schemas/ExtGroupId'
          - type: string
            pattern: ^anyUE$
      - name: afInstanceId
        in: path
        description: Application Function Instance Identifier
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Expected response to a valid request
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          description: Unexpected error
    get:
      summary: get Parameter Provisioning Data Entry
      operationId: Get PP Data Entry
      tags:
      - ParameterProvisioningDataEntry (Document)
      parameters:
      - name: ueId
        in: path
        description: Identifier of the UE
        required: true
        schema:
          anyOf:
          - $ref: '#/components/schemas/VarUeId'
          - $ref: '#/components/schemas/ExtGroupId'
          - type: string
            pattern: ^anyUE$
      - name: afInstanceId
        in: path
        description: Application Function Instance Identifier
        required: true
        schema:
          type: string
      - name: supported-features
        in: query
        description: Features required to be supported by the target NF
        schema:
          $ref: '#/components/schemas/SupportedFeatures'
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PpDataEntry'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          description: Unexpected error
  /mbs-group-membership/{extGroupId}:
    put:
      summary: create a 5G MBS Group
      operationId: Create 5G MBS Group
      tags:
      - 5G MBS Group Creation
      parameters:
      - name: extGroupId
        in: path
        description: External Identifier of the Group
        required: true
        schema:
          $ref: '#/components/schemas/ExtGroupId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MulticastMbsGroupMemb'
        required: true
      responses:
        '201':
          description: Expected response to a valid request
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '411':
          $ref: '#/components/responses/411'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        '503':
          $ref: '#/components/responses/503'
        default:
          description: Unexpected error
    delete:
      summary: delete a 5G MBS Group
      operationId: Delete 5G MBS Group
      tags:
      - 5G MBS Group Deletion
      parameters:
      - name: extGroupId
        in: path
        description: External Identifier of the Group
        required: true
        schema:
          $ref: '#/components/schemas/ExtGroupId'
      responses:
        '204':
          description: Expected response to a valid request
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        '503':
          $ref: '#/components/responses/503'
        default:
          description: Unexpected error
    patch:
      summary: modify a 5G MBS Group
      operationId: Modify 5G MBS Group
      tags:
      - 5G MBS Group Modification
      parameters:
      - name: extGroupId
        in: path
        description: External Identifier of the group
        required: true
        schema:
          $ref: '#/components/schemas/ExtGroupId'
      - name: supported-features
        in: query
        description: Features required to be supported by the target NF
        schema:
          $ref: '#/components/schemas/SupportedFeatures'
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/MulticastMbsGroupMemb'
        required: true
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchResult'
        '204':
          description: Expected response to a valid request
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '411':
          $ref: '#/components/responses/411'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        '503':
          $ref: '#/components/responses/503'
        default:
          description: Unexpected error
    get:
      summary: get 5G MBS Group
      operationId: Get 5G MBS Group
      tags:
      - 5G MBS Group Modification
      parameters:
      - name: extGroupId
        in: path
        description: External Identifier of the group
        required: true
        schema:
          $ref: '#/components/schemas/ExtGroupId'
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MulticastMbsGroupMemb'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        '503':
          $ref: '#/components/responses/503'
        default:
          description: Unexpected error
components:
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://nrf:8000/oauth2/token
          scopes:
            nudm-pp: Access to the nudm-pp API
  schemas:
    PpData:
      type: object
      properties:
        communicationCharacteristics:
          $ref: '#/components/schemas/CommunicationCharacteristics'
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        expectedUeBehaviourParameters:
          $ref: '#/components/schemas/ExpectedUeBehaviour'
        ecRestriction:
          $ref: '#/components/schemas/EcRestriction'
        acsInfo:
          $ref: '#/components/schemas/AcsInfoRm'
        stnSr:
          $ref: '#/components/schemas/StnSrRm'
        lcsPrivacy:
          $ref: '#/components/schemas/LcsPrivacy'
        sorInfo:
          $ref: '#/components/schemas/SorInfo'
        5mbsAuthorizationInfo:
          $ref: '#/components/schemas/5MbsAuthorizationInfo'
      nullable: true
    CommunicationCharacteristics:
      type: object
      properties:
        ppSubsRegTimer:
          $ref: '#/components/schemas/PpSubsRegTimer'
        ppActiveTime:
          $ref: '#/components/schemas/PpActiveTime'
        ppDlPacketCount:
          $ref: '#/components/schemas/PpDlPacketCount'
        ppDlPacketCountExt:
          $ref: '#/components/schemas/PpDlPacketCountExt'
        ppMaximumResponseTime:
          $ref: '#/components/schemas/PpMaximumResponseTime'
        ppMaximumLatency:
          $ref: '#/components/schemas/PpMaximumLatency'
      nullable: true
    PpSubsRegTimer:
      type: object
      required:
      - subsRegTimer
      - afInstanceId
      - referenceId
      properties:
        subsRegTimer:
          $ref: '#/components/schemas/DurationSec'
        afInstanceId:
          type: string
        referenceId:
          $ref: '#/components/schemas/ReferenceId'
        validityTime:
          $ref: '#/components/schemas/DateTime'
        mtcProviderInformation:
          $ref: '#/components/schemas/MtcProviderInformation'
      nullable: true
    PpActiveTime:
      type: object
      required:
      - activeTime
      - afInstanceId
      - referenceId
      properties:
        activeTime:
          $ref: '#/components/schemas/DurationSec'
        afInstanceId:
          type: string
        referenceId:
          $ref: '#/components/schemas/ReferenceId'
        validityTime:
          $ref: '#/components/schemas/DateTime'
        mtcProviderInformation:
          $ref: '#/components/schemas/MtcProviderInformation'
      nullable: true
    5GVnGroupConfiguration:
      type: object
      properties:
        5gVnGroupData:
          $ref: '#/components/schemas/5GVnGroupData'
        members:
          type: array
          items:
            $ref: '#/components/schemas/Gpsi'
          minItems: 1
        referenceId:
          $ref: '#/components/schemas/ReferenceId'
        afInstanceId:
          type: string
        internalGroupIdentifier:
          $ref: '#/components/schemas/GroupId'
        mtcProviderInformation:
          $ref: '#/components/schemas/MtcProviderInformation'
    5GVnGroupData:
      type: object
      required:
      - dnn
      - sNssai
      properties:
        dnn:
          $ref: '#/components/schemas/Dnn'
        sNssai:
          $ref: '#/components/schemas/Snssai'
        pduSessionTypes:
          type: array
          items:
            $ref: '#/components/schemas/PduSessionType'
          minItems: 1
        appDescriptors:
          type: array
          items:
            $ref: '#/components/schemas/AppDescriptor'
          minItems: 1
        secondaryAuth:
          type: boolean
        dnAaaIpAddressAllocation:
          type: boolean
        dnAaaAddress:
          $ref: '#/components/schemas/IpAddress'
        additionalDnAaaAddresses:
          type: array
          items:
            $ref: '#/components/schemas/IpAddress'
          minItems: 1
        dnAaaFqdn:
          $ref: '#/components/schemas/Fqdn'
    ExpectedUeBehaviour:
      type: object
      required:
      - afInstanceId
      - referenceId
      properties:
        afInstanceId:
          type: string
        referenceId:
          $ref: '#/components/schemas/ReferenceId'
        stationaryIndication:
          $ref: '#/components/schemas/StationaryIndicationRm'
        communicationDurationTime:
          $ref: '#/components/schemas/DurationSecRm'
        scheduledCommunicationType:
          $ref: '#/components/schemas/ScheduledCommunicationTypeRm'
        periodicTime:
          $ref: '#/components/schemas/DurationSecRm'
        scheduledCommunicationTime:
          $ref: '#/components/schemas/ScheduledCommunicationTimeRm'
        expectedUmts:
          type: array
          items:
            $ref: '#/components/schemas/LocationArea'
          minItems: 1
          nullable: true
          description: Identifies the UE's expected geographical movement. The attribute
            is only applicable in 5G.
        trafficProfile:
          $ref: '#/components/schemas/TrafficProfileRm'
        batteryIndication:
          $ref: '#/components/schemas/BatteryIndicationRm'
        validityTime:
          $ref: '#/components/schemas/DateTime'
        mtcProviderInformation:
          $ref: '#/components/schemas/MtcProviderInformation'
      nullable: true
    LocationArea:
      type: object
      properties:
        geographicAreas:
          type: array
          items:
            $ref: '#/components/schemas/GeographicArea'
          minItems: 0
          description: Identifies a list of geographic area of the user where the
            UE is located.
        civicAddresses:
          type: array
          items:
            $ref: '#/components/schemas/CivicAddress'
          minItems: 0
          description: Identifies a list of civic addresses of the user where the
            UE is located.
        nwAreaInfo:
          $ref: '#/components/schemas/NetworkAreaInfo'
        umtTime:
          $ref: '#/components/schemas/UmtTime'
    UmtTime:
      type: object
      required:
      - timeOfDay
      - dayOfWeek
      properties:
        timeOfDay:
          $ref: '#/components/schemas/TimeOfDay'
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeek'
    NetworkAreaInfo:
      description: Describes a network area information in which the NF service consumer
        requests the number of UEs.
      type: object
      properties:
        ecgis:
          description: Contains a list of E-UTRA cell identities.
          type: array
          items:
            $ref: '#/components/schemas/Ecgi'
          minItems: 1
        ncgis:
          description: Contains a list of NR cell identities.
          type: array
          items:
            $ref: '#/components/schemas/Ncgi'
          minItems: 1
        gRanNodeIds:
          description: Contains a list of NG RAN nodes.
          type: array
          items:
            $ref: '#/components/schemas/GlobalRanNodeId'
          minItems: 1
        tais:
          description: Contains a list of tracking area identities.
          type: array
          items:
            $ref: '#/components/schemas/Tai'
          minItems: 1
    EcRestriction:
      type: object
      required:
      - afInstanceId
      - referenceId
      properties:
        afInstanceId:
          type: string
        referenceId:
          $ref: '#/components/schemas/ReferenceId'
        plmnEcInfos:
          type: array
          items:
            $ref: '#/components/schemas/PlmnEcInfo'
          minItems: 1
        mtcProviderInformation:
          $ref: '#/components/schemas/MtcProviderInformation'
      nullable: true
    PlmnEcInfo:
      type: object
      required:
      - plmnId
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        ecRestrictionDataWb:
          $ref: '#/components/schemas/EcRestrictionDataWb'
        ecRestrictionDataNb:
          type: boolean
          default: false
    PpDlPacketCountExt:
      type: object
      required:
      - afInstanceId
      - referenceId
      properties:
        afInstanceId:
          type: string
        referenceId:
          $ref: '#/components/schemas/ReferenceId'
        dnn:
          $ref: '#/components/schemas/Dnn'
        singleNssai:
          $ref: '#/components/schemas/Snssai'
        validityTime:
          $ref: '#/components/schemas/DateTime'
        mtcProviderInformation:
          $ref: '#/components/schemas/MtcProviderInformation'
      nullable: true
    PpMaximumResponseTime:
      type: object
      required:
      - maximumResponseTime
      - afInstanceId
      - referenceId
      properties:
        maximumResponseTime:
          $ref: '#/components/schemas/DurationSec'
        afInstanceId:
          type: string
        referenceId:
          $ref: '#/components/schemas/ReferenceId'
        validityTime:
          $ref: '#/components/schemas/DateTime'
        mtcProviderInformation:
          $ref: '#/components/schemas/MtcProviderInformation'
      nullable: true
    PpMaximumLatency:
      type: object
      required:
      - maximumLatency
      - afInstanceId
      - referenceId
      properties:
        maximumLatency:
          $ref: '#/components/schemas/DurationSec'
        afInstanceId:
          type: string
        referenceId:
          $ref: '#/components/schemas/ReferenceId'
        validityTime:
          $ref: '#/components/schemas/DateTime'
        mtcProviderInformation:
          $ref: '#/components/schemas/MtcProviderInformation'
      nullable: true
    LcsPrivacy:
      type: object
      properties:
        afInstanceId:
          type: string
        referenceId:
          $ref: '#/components/schemas/ReferenceId'
        lpi:
          $ref: '#/components/schemas/Lpi'
        mtcProviderInformation:
          $ref: '#/components/schemas/MtcProviderInformation'
      nullable: true
    PpDataEntry:
      type: object
      properties:
        communicationCharacteristics:
          $ref: '#/components/schemas/CommunicationCharacteristicsAF'
        referenceId:
          $ref: '#/components/schemas/ReferenceId'
        validityTime:
          $ref: '#/components/schemas/DateTime'
        mtcProviderInformation:
          $ref: '#/components/schemas/MtcProviderInformation'
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        ecsAddrConfigInfo:
          $ref: '#/components/schemas/EcsAddrConfigInfo'
        additionalEcsAddrConfigInfos:
          type: array
          items:
            $ref: '#/components/schemas/EcsAddrConfigInfo'
          minItems: 1
        ecRestriction:
          $ref: '#/components/schemas/EcRestriction'
      nullable: true
    CommunicationCharacteristicsAF:
      type: object
      properties:
        ppDlPacketCount:
          $ref: '#/components/schemas/PpDlPacketCount'
        maximumResponseTime:
          $ref: '#/components/schemas/DurationSec'
        maximumLatency:
          $ref: '#/components/schemas/DurationSec'
      nullable: true
    EcsAddrConfigInfo:
      type: object
      properties:
        ecsServerAddr:
          $ref: '#/components/schemas/EcsServerAddr'
        spatialValidityCond:
          $ref: '#/components/schemas/SpatialValidityCond'
        dnn:
          $ref: '#/components/schemas/Dnn'
        snssai:
          $ref: '#/components/schemas/Snssai'
      nullable: true
    5MbsAuthorizationInfo:
      type: object
      properties:
        5mbsSessionIds:
          type: array
          items:
            $ref: '#/components/schemas/MbsSessionId'
          minItems: 1
      nullable: true
    MulticastMbsGroupMemb:
      type: object
      required:
      - multicastGroupMemb
      properties:
        multicastGroupMemb:
          type: array
          items:
            $ref: '#/components/schemas/Gpsi'
          minItems: 1
        afInstanceId:
          type: string
        internalGroupIdentifier:
          $ref: '#/components/schemas/GroupId'
    ReferenceId:
      type: integer
    PpDlPacketCount:
      type: integer
      nullable: true
    VarUeId:
      type: string
      pattern: ^(imsi-[0-9]{5,15}|nai-.+|msisdn-[0-9]{5,15}|extid-[^@]+@[^@]+|gci-.+|gli-.+|.+)$
      description: String represents the SUPI or GPSI
    ExtGroupId:
      type: string
      pattern: ^extgroupid-[^@]+@[^@]+$
    SupportedFeatures:
      type: string
      pattern: ^[A-Fa-f0-9]*$
      description: "A string used to indicate the features supported by an API that\
        \ is used as defined in clause  6.6 in 3GPP TS 29.500. The string shall contain\
        \ a bitmask indicating supported features in  hexadecimal representation Each\
        \ character in the string shall take a value of \"0\" to \"9\",  \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent the support of 4 features as\
        \ described in  table\_5.2.2-3. The most significant character representing\
        \ the highest-numbered features shall  appear first in the string, and the\
        \ character representing features 1 to 4 shall appear last  in the string.\
        \ The list of features and their numbering (starting with 1) are defined \
        \ separately for each API. If the string contains a lower number of characters\
        \ than there are  defined features for an API, all features that would be\
        \ represented by characters that are not  present in the string are not supported.\n"
    DurationSec:
      type: integer
      description: indicating a time in seconds.
    DateTime:
      format: date-time
      type: string
      description: string with format 'date-time' as defined in OpenAPI.
    MtcProviderInformation:
      type: string
      description: String uniquely identifying MTC provider information.
    Dnn:
      type: string
      description: 'String representing a Data Network as defined in clause 9A of
        3GPP TS 23.003;  it shall contain either a DNN Network Identifier, or a full
        DNN with both the Network  Identifier and Operator Identifier, as specified
        in 3GPP TS 23.003 clause 9.1.1 and 9.1.2. It shall be coded as string in which
        the labels are separated by dots  (e.g. "Label1.Label2.Label3").

        '
    Snssai:
      type: object
      properties:
        sst:
          type: integer
          minimum: 0
          maximum: 255
          description: "Unsigned integer, within the range 0 to 255, representing\
            \ the Slice/Service Type.  It indicates the expected Network Slice behaviour\
            \ in terms of features and services. Values 0 to 127 correspond to the\
            \ standardized SST range. Values 128 to 255 correspond  to the Operator-specific\
            \ range. See clause 28.4.2 of 3GPP TS 23.003. Standardized values are\
            \ defined in clause 5.15.2.2 of 3GPP TS 23.501. \n"
        sd:
          type: string
          pattern: ^[A-Fa-f0-9]{6}$
          description: '3-octet string, representing the Slice Differentiator, in
            hexadecimal representation. Each character in the string shall take a
            value of "0" to "9", "a" to "f" or "A" to "F" and shall represent 4 bits.
            The most significant character representing the 4 most significant bits
            of the SD shall appear first in the string, and the character representing
            the 4 least significant bit of the SD shall appear last in the string.
            This is an optional parameter that complements the Slice/Service type(s)
            to allow to  differentiate amongst multiple Network Slices of the same
            Slice/Service type. This IE shall be absent if no SD value is associated
            with the SST.

            '
      description: 'When Snssai needs to be converted to string (e.g. when used in
        maps as key), the string shall be composed of one to three digits "sst" optionally
        followed by "-" and 6 hexadecimal digits "sd".

        '
      required:
      - sst
    StationaryIndication:
      anyOf:
      - type: string
        enum:
        - STATIONARY
        - MOBILE
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: 'Possible values are:

        - STATIONARY: Identifies the UE is stationary

        - MOBILE: Identifies the UE is mobile

        '
    NullValue:
      enum:
      - null
      description: JSON's null value.
    StationaryIndicationRm:
      anyOf:
      - $ref: '#/components/schemas/StationaryIndication'
      - $ref: '#/components/schemas/NullValue'
      description: 'This enumeration is defined in the same way as the ''StationaryIndication''
        enumeration, but with the OpenAPI ''nullable: true'' property."

        '
    DurationSecRm:
      type: integer
      nullable: true
      description: 'indicating a time in seconds with OpenAPI defined ''nullable:
        true'' property.'
    ScheduledCommunicationType:
      anyOf:
      - type: string
        enum:
        - DOWNLINK_ONLY
        - UPLINK_ONLY
        - BIDIRECTIONAL
      - type: string
      description: 'Possible values are:

        -DOWNLINK_ONLY: Downlink only

        -UPLINK_ONLY: Uplink only

        -BIDIRECTIONA: Bi-directional

        '
    ScheduledCommunicationTypeRm:
      anyOf:
      - $ref: '#/components/schemas/ScheduledCommunicationType'
      - $ref: '#/components/schemas/NullValue'
      description: "This enumeration is defined in the same way as the 'ScheduledCommunicationTypen'\
        \ enumeration, but with the OpenAPI 'nullable: true' property.\" \n"
    DayOfWeek:
      type: integer
      minimum: 1
      maximum: 7
      description: 'integer between and including 1 and 7 denoting a weekday. 1 shall
        indicate Monday, and the subsequent weekdays  shall be indicated with the
        next higher numbers. 7 shall indicate Sunday.

        '
    TimeOfDay:
      type: string
      description: "String with format partial-time or full-time as defined in clause\
        \ 5.6 of IETF RFC 3339. Examples, 20:15:00, 20:15:00-08:00 (for 8 hours behind\
        \ UTC). \n"
    ScheduledCommunicationTime:
      description: Identifies time and day of the week when the UE is available for
        communication.
      type: object
      properties:
        daysOfWeek:
          type: array
          items:
            $ref: '#/components/schemas/DayOfWeek'
          minItems: 1
          maxItems: 6
          description: 'Identifies the day(s) of the week. If absent, it indicates
            every day of the week.

            '
        timeOfDayStart:
          $ref: '#/components/schemas/TimeOfDay'
        timeOfDayEnd:
          $ref: '#/components/schemas/TimeOfDay'
    ScheduledCommunicationTimeRm:
      anyOf:
      - $ref: '#/components/schemas/ScheduledCommunicationTime'
      - $ref: '#/components/schemas/NullValue'
      description: 'This data type is defined in the same way as the ''ScheduledCommunicationTime''
        data type, but with the OpenAPI ''nullable: true'' property.

        '
    Point:
      description: Ellipsoid Point.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - point
        properties:
          point:
            $ref: '#/components/schemas/GeographicalCoordinates'
    GADShape:
      description: Common base type for GAD shapes.
      type: object
      required:
      - shape
      properties:
        shape:
          $ref: '#/components/schemas/SupportedGADShapes'
      discriminator:
        propertyName: shape
        mapping:
          POINT: '#/components/schemas/Point'
          POINT_UNCERTAINTY_CIRCLE: '#/components/schemas/PointUncertaintyCircle'
          POINT_UNCERTAINTY_ELLIPSE: '#/components/schemas/PointUncertaintyEllipse'
          POLYGON: '#/components/schemas/Polygon'
          POINT_ALTITUDE: '#/components/schemas/PointAltitude'
          POINT_ALTITUDE_UNCERTAINTY: '#/components/schemas/PointAltitudeUncertainty'
          ELLIPSOID_ARC: '#/components/schemas/EllipsoidArc'
          LOCAL_2D_POINT_UNCERTAINTY_ELLIPSE: '#/components/schemas/Local2dPointUncertaintyEllipse'
          LOCAL_3D_POINT_UNCERTAINTY_ELLIPSOID: '#/components/schemas/Local3dPointUncertaintyEllipsoid'
    GeographicalCoordinates:
      description: Geographical coordinates.
      type: object
      required:
      - lon
      - lat
      properties:
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
    Uncertainty:
      description: Indicates value of uncertainty.
      type: number
      format: float
      minimum: 0
    PointUncertaintyCircle:
      description: Ellipsoid point with uncertainty circle.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - point
        - uncertainty
        properties:
          point:
            $ref: '#/components/schemas/GeographicalCoordinates'
          uncertainty:
            $ref: '#/components/schemas/Uncertainty'
    Orientation:
      description: Indicates value of orientation angle.
      type: integer
      minimum: 0
      maximum: 180
    UncertaintyEllipse:
      description: Ellipse with uncertainty.
      type: object
      required:
      - semiMajor
      - semiMinor
      - orientationMajor
      properties:
        semiMajor:
          $ref: '#/components/schemas/Uncertainty'
        semiMinor:
          $ref: '#/components/schemas/Uncertainty'
        orientationMajor:
          $ref: '#/components/schemas/Orientation'
    Confidence:
      description: Indicates value of confidence.
      type: integer
      minimum: 0
      maximum: 100
    PointUncertaintyEllipse:
      description: Ellipsoid point with uncertainty ellipse.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - point
        - uncertaintyEllipse
        - confidence
        properties:
          point:
            $ref: '#/components/schemas/GeographicalCoordinates'
          uncertaintyEllipse:
            $ref: '#/components/schemas/UncertaintyEllipse'
          confidence:
            $ref: '#/components/schemas/Confidence'
    PointList:
      description: List of points.
      type: array
      items:
        $ref: '#/components/schemas/GeographicalCoordinates'
      minItems: 3
      maxItems: 15
    Polygon:
      description: Polygon.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - pointList
        properties:
          pointList:
            $ref: '#/components/schemas/PointList'
    Altitude:
      description: Indicates value of altitude.
      type: number
      format: double
      minimum: -32767
      maximum: 32767
    PointAltitude:
      description: Ellipsoid point with altitude.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - point
        - altitude
        properties:
          point:
            $ref: '#/components/schemas/GeographicalCoordinates'
          altitude:
            $ref: '#/components/schemas/Altitude'
    PointAltitudeUncertainty:
      description: Ellipsoid point with altitude and uncertainty ellipsoid.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - point
        - altitude
        - uncertaintyEllipse
        - uncertaintyAltitude
        - confidence
        properties:
          point:
            $ref: '#/components/schemas/GeographicalCoordinates'
          altitude:
            $ref: '#/components/schemas/Altitude'
          uncertaintyEllipse:
            $ref: '#/components/schemas/UncertaintyEllipse'
          uncertaintyAltitude:
            $ref: '#/components/schemas/Uncertainty'
          confidence:
            $ref: '#/components/schemas/Confidence'
          vConfidence:
            $ref: '#/components/schemas/Confidence'
    InnerRadius:
      description: Indicates value of the inner radius.
      type: integer
      format: int32
      minimum: 0
      maximum: 327675
    Angle:
      description: Indicates value of angle.
      type: integer
      minimum: 0
      maximum: 360
    EllipsoidArc:
      description: Ellipsoid Arc.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - point
        - innerRadius
        - uncertaintyRadius
        - offsetAngle
        - includedAngle
        - confidence
        properties:
          point:
            $ref: '#/components/schemas/GeographicalCoordinates'
          innerRadius:
            $ref: '#/components/schemas/InnerRadius'
          uncertaintyRadius:
            $ref: '#/components/schemas/Uncertainty'
          offsetAngle:
            $ref: '#/components/schemas/Angle'
          includedAngle:
            $ref: '#/components/schemas/Angle'
          confidence:
            $ref: '#/components/schemas/Confidence'
    LocalOrigin:
      description: Indicates a Local origin in a reference system
      type: object
      properties:
        coordinateId:
          type: string
        point:
          $ref: '#/components/schemas/GeographicalCoordinates'
    Float:
      format: float
      type: number
      description: string with format 'float' as defined in OpenAPI.
    RelativeCartesianLocation:
      description: Relative Cartesian Location
      type: object
      required:
      - x
      - y
      properties:
        x:
          $ref: '#/components/schemas/Float'
        y:
          $ref: '#/components/schemas/Float'
        z:
          $ref: '#/components/schemas/Float'
    Local2dPointUncertaintyEllipse:
      description: Local 2D point with uncertainty ellipse
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - localOrigin
        - point
        - uncertaintyEllipse
        - confidence
        properties:
          localOrigin:
            $ref: '#/components/schemas/LocalOrigin'
          point:
            $ref: '#/components/schemas/RelativeCartesianLocation'
          uncertaintyEllipse:
            $ref: '#/components/schemas/UncertaintyEllipse'
          confidence:
            $ref: '#/components/schemas/Confidence'
    UncertaintyEllipsoid:
      description: Ellipsoid with uncertainty
      type: object
      required:
      - semiMajor
      - semiMinor
      - vertical
      - orientationMajor
      properties:
        semiMajor:
          $ref: '#/components/schemas/Uncertainty'
        semiMinor:
          $ref: '#/components/schemas/Uncertainty'
        vertical:
          $ref: '#/components/schemas/Uncertainty'
        orientationMajor:
          $ref: '#/components/schemas/Orientation'
    Local3dPointUncertaintyEllipsoid:
      description: Local 3D point with uncertainty ellipsoid
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - localOrigin
        - point
        - uncertaintyEllipsoid
        - confidence
        properties:
          localOrigin:
            $ref: '#/components/schemas/LocalOrigin'
          point:
            $ref: '#/components/schemas/RelativeCartesianLocation'
          uncertaintyEllipsoid:
            $ref: '#/components/schemas/UncertaintyEllipsoid'
          confidence:
            $ref: '#/components/schemas/Confidence'
    SupportedGADShapes:
      description: Indicates supported GAD shapes.
      anyOf:
      - type: string
        enum:
        - POINT
        - POINT_UNCERTAINTY_CIRCLE
        - POINT_UNCERTAINTY_ELLIPSE
        - POLYGON
        - POINT_ALTITUDE
        - POINT_ALTITUDE_UNCERTAINTY
        - ELLIPSOID_ARC
        - LOCAL_2D_POINT_UNCERTAINTY_ELLIPSE
        - LOCAL_3D_POINT_UNCERTAINTY_ELLIPSOID
      - type: string
    GeographicArea:
      description: Geographic area specified by different shape.
      anyOf:
      - $ref: '#/components/schemas/Point'
      - $ref: '#/components/schemas/PointUncertaintyCircle'
      - $ref: '#/components/schemas/PointUncertaintyEllipse'
      - $ref: '#/components/schemas/Polygon'
      - $ref: '#/components/schemas/PointAltitude'
      - $ref: '#/components/schemas/PointAltitudeUncertainty'
      - $ref: '#/components/schemas/EllipsoidArc'
    CivicAddress:
      description: Indicates a Civic address.
      type: object
      properties:
        country:
          type: string
        A1:
          type: string
        A2:
          type: string
        A3:
          type: string
        A4:
          type: string
        A5:
          type: string
        A6:
          type: string
        PRD:
          type: string
        POD:
          type: string
        STS:
          type: string
        HNO:
          type: string
        HNS:
          type: string
        LMK:
          type: string
        LOC:
          type: string
        NAM:
          type: string
        PC:
          type: string
        BLD:
          type: string
        UNIT:
          type: string
        FLR:
          type: string
        ROOM:
          type: string
        PLC:
          type: string
        PCN:
          type: string
        POBOX:
          type: string
        ADDCODE:
          type: string
        SEAT:
          type: string
        RD:
          type: string
        RDSEC:
          type: string
        RDBR:
          type: string
        RDSUBBR:
          type: string
        PRM:
          type: string
        POM:
          type: string
        usageRules:
          type: string
        method:
          type: string
        providedBy:
          type: string
    Mcc:
      type: string
      pattern: ^\d{3}$
      description: "Mobile Country Code part of the PLMN, comprising 3 digits, as\
        \ defined in clause 9.3.3.5 of 3GPP TS 38.413. \n"
    Mnc:
      type: string
      pattern: ^\d{2,3}$
      description: Mobile Network Code part of the PLMN, comprising 2 or 3 digits,
        as defined in clause 9.3.3.5 of 3GPP TS 38.413.
    PlmnId:
      type: object
      properties:
        mcc:
          $ref: '#/components/schemas/Mcc'
        mnc:
          $ref: '#/components/schemas/Mnc'
      description: 'When PlmnId needs to be converted to string (e.g. when used in
        maps as key), the string  shall be composed of three digits "mcc" followed
        by "-" and two or three digits "mnc".

        '
      required:
      - mcc
      - mnc
    EutraCellId:
      type: string
      pattern: ^[A-Fa-f0-9]{7}$
      description: "28-bit string identifying an E-UTRA Cell Id as specified in clause\
        \ 9.3.1.9 of  3GPP TS 38.413, in hexadecimal representation. Each character\
        \ in the string shall take a  value of \"0\" to \"9\", \"a\" to \"f\" or \"\
        A\" to \"F\" and shall represent 4 bits. The most  significant character representing\
        \ the 4 most significant bits of the Cell Id shall appear  first in the string,\
        \ and the character representing the 4 least significant bit of the  Cell\
        \ Id shall appear last in the string. \n"
    Nid:
      type: string
      pattern: ^[A-Fa-f0-9]{11}$
      description: "This represents the Network Identifier, which together with a\
        \ PLMN ID is used to identify an SNPN (see 3GPP TS 23.003 and 3GPP TS 23.501\
        \ clause 5.30.2.1). \n"
    Ecgi:
      description: Contains the ECGI (E-UTRAN Cell Global Identity), as described
        in 3GPP 23.003
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        eutraCellId:
          $ref: '#/components/schemas/EutraCellId'
        nid:
          $ref: '#/components/schemas/Nid'
      required:
      - plmnId
      - eutraCellId
    NrCellId:
      type: string
      pattern: ^[A-Fa-f0-9]{9}$
      description: "36-bit string identifying an NR Cell Id as specified in clause\
        \ 9.3.1.7 of 3GPP TS 38.413,  in hexadecimal representation. Each character\
        \ in the string shall take a value of \"0\" to \"9\",  \"a\" to \"f\" or \"\
        A\" to \"F\" and shall represent 4 bits. The most significant character  representing\
        \ the 4 most significant bits of the Cell Id shall appear first in the string,\
        \ and  the character representing the 4 least significant bit of the Cell\
        \ Id shall appear last in the  string. \n"
    Ncgi:
      description: Contains the NCGI (NR Cell Global Identity), as described in 3GPP
        23.003
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        nrCellId:
          $ref: '#/components/schemas/NrCellId'
        nid:
          $ref: '#/components/schemas/Nid'
      required:
      - plmnId
      - nrCellId
    N3IwfId:
      type: string
      pattern: ^[A-Fa-f0-9]+$
      description: "This represents the identifier of the N3IWF ID as specified in\
        \ clause 9.3.1.57 of  3GPP TS 38.413 in hexadecimal representation. Each character\
        \ in the string shall take a value  of \"0\" to \"9\", \"a\" to \"f\" or \"\
        A\" to \"F\" and shall represent 4 bits. The most significant  character representing\
        \ the 4 most significant bits of the N3IWF ID shall appear first in the  string,\
        \ and the character representing the 4 least significant bit of the N3IWF\
        \ ID shall  appear last in the string. \n"
    GNbId:
      description: Provides the G-NB identifier.
      type: object
      properties:
        bitLength:
          type: integer
          minimum: 22
          maximum: 32
          description: 'Unsigned integer representing the bit length of the gNB ID
            as defined in clause 9.3.1.6 of 3GPP TS 38.413 [11], within the range
            22 to 32.

            '
        gNBValue:
          type: string
          pattern: ^[A-Fa-f0-9]{6,8}$
          description: 'This represents the identifier of the gNB. The value of the
            gNB ID shall be encoded in hexadecimal representation. Each character
            in the string shall take a value of "0" to "9", "a" to "f" or "A" to "F"
            and shall represent 4 bits. The padding 0 shall be added to make multiple
            nibbles,  the most significant character representing the padding 0 if
            required together with the 4 most significant bits of the gNB ID shall
            appear first in the string, and the character representing the 4 least
            significant bit of the gNB ID shall appear last in the string.

            '
      required:
      - bitLength
      - gNBValue
    NgeNbId:
      type: string
      pattern: ^(MacroNGeNB-[A-Fa-f0-9]{5}|LMacroNGeNB-[A-Fa-f0-9]{6}|SMacroNGeNB-[A-Fa-f0-9]{5})$
      description: "This represents the identifier of the ng-eNB ID as specified in\
        \ clause 9.3.1.8 of  3GPP TS 38.413. The value of the ng-eNB ID shall be encoded\
        \ in hexadecimal representation.  Each character in the string shall take\
        \ a value of \"0\" to \"9\", \"a\" to \"f\" or \"A\" to \"F\" and  shall represent\
        \ 4 bits. The padding 0 shall be added to make multiple nibbles, so the most\
        \  significant character representing the padding 0 if required together with\
        \ the 4 most  significant bits of the ng-eNB ID shall appear first in the\
        \ string, and the character  representing the 4 least significant bit of the\
        \ ng-eNB ID (to form a nibble) shall appear last  in the string. \n"
      example: SMacroNGeNB-34B89
    WAgfId:
      type: string
      pattern: ^[A-Fa-f0-9]+$
      description: "This represents the identifier of the W-AGF ID as specified in\
        \ clause 9.3.1.162 of  3GPP TS 38.413 in hexadecimal representation. Each\
        \ character in the string shall take a value  of \"0\" to \"9\", \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent 4 bits. The most significant\
        \  character representing the 4 most significant bits of the W-AGF ID shall\
        \ appear first in the  string, and the character representing the 4 least\
        \ significant bit of the W-AGF ID shall  appear last in the string. \n"
    TngfId:
      type: string
      pattern: ^[A-Fa-f0-9]+$
      description: "This represents the identifier of the TNGF ID as specified in\
        \ clause 9.3.1.161 of  3GPP TS 38.413  in hexadecimal representation. Each\
        \ character in the string shall take a value of \"0\" to \"9\", \"a\"  to\
        \ \"f\" or \"A\" to \"F\" and shall represent 4 bits. The most significant\
        \ character representing the  4 most significant bits of the TNGF ID shall\
        \ appear first in the string, and the character  representing the 4 least\
        \ significant bit of the TNGF ID shall appear last in the string. \n"
    ENbId:
      type: string
      pattern: ^(MacroeNB-[A-Fa-f0-9]{5}|LMacroeNB-[A-Fa-f0-9]{6}|SMacroeNB-[A-Fa-f0-9]{5}|HomeeNB-[A-Fa-f0-9]{7})$
      description: 'This represents the identifier of the eNB ID as specified in clause
        9.2.1.37 of  3GPP TS 36.413. The string shall be formatted with the following
        pattern  ''^(''MacroeNB-[A-Fa-f0-9]{5}|LMacroeNB-[A-Fa-f0-9]{6}|SMacroeNB-[A-Fa-f0-9]{5}
        |HomeeNB-[A-Fa-f0-9]{7})$''. The value of the eNB ID shall be encoded in hexadecimal
        representation. Each character in the  string shall take a value of "0" to
        "9", "a" to "f" or "A" to "F" and shall represent 4 bits.  The padding 0 shall
        be added to make multiple nibbles, so the most significant character  representing
        the padding 0 if required together with the 4 most significant bits of the
        eNB ID  shall appear first in the string, and the character representing the
        4 least significant bit  of the eNB ID (to form a nibble) shall appear last
        in the string.

        '
    GlobalRanNodeId:
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        n3IwfId:
          $ref: '#/components/schemas/N3IwfId'
        gNbId:
          $ref: '#/components/schemas/GNbId'
        ngeNbId:
          $ref: '#/components/schemas/NgeNbId'
        wagfId:
          $ref: '#/components/schemas/WAgfId'
        tngfId:
          $ref: '#/components/schemas/TngfId'
        nid:
          $ref: '#/components/schemas/Nid'
        eNbId:
          $ref: '#/components/schemas/ENbId'
      oneOf:
      - required:
        - n3IwfId
      - required:
        - gNbId
      - required:
        - ngeNbId
      - required:
        - wagfId
      - required:
        - tngfId
      - required:
        - eNbId
      description: 'One of the six attributes n3IwfId, gNbIdm, ngeNbId, wagfId, tngfId,
        eNbId shall be present.

        '
      required:
      - plmnId
    Tac:
      type: string
      pattern: (^[A-Fa-f0-9]{4}$)|(^[A-Fa-f0-9]{6}$)
      description: "2 or 3-octet string identifying a tracking area code as specified\
        \ in clause 9.3.3.10  of 3GPP TS 38.413, in hexadecimal representation. Each\
        \ character in the string shall  take a value of \"0\" to \"9\", \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent 4 bits. The most significant\
        \ character representing the 4 most significant bits of the TAC shall  appear\
        \ first in the string, and the character representing the 4 least significant\
        \ bit  of the TAC shall appear last in the string. \n"
    Tai:
      description: Contains the tracking area identity as described in 3GPP 23.003
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        tac:
          $ref: '#/components/schemas/Tac'
        nid:
          $ref: '#/components/schemas/Nid'
      required:
      - plmnId
      - tac
    TrafficProfile:
      anyOf:
      - type: string
        enum:
        - SINGLE_TRANS_UL
        - SINGLE_TRANS_DL
        - DUAL_TRANS_UL_FIRST
        - DUAL_TRANS_DL_FIRST
        - MULTI_TRANS
      - type: string
        description: "This string provides forward-compatibility with future extensions\
          \ to the enumeration but is not used to encode content defined in the present\
          \ version of this API. \n"
      description: "Possible values are:\n- SINGLE_TRANS_UL: Uplink single packet\
        \ transmission.\n- SINGLE_TRANS_DL: Downlink single packet transmission.\n\
        - DUAL_TRANS_UL_FIRST: Dual packet transmission, firstly uplink packet transmission\n\
        \  with subsequent downlink packet transmission.\n- DUAL_TRANS_DL_FIRST: Dual\
        \ packet transmission, firstly downlink packet transmission\n  with subsequent\
        \ uplink packet transmission. \n"
    TrafficProfileRm:
      anyOf:
      - $ref: '#/components/schemas/TrafficProfile'
      - $ref: '#/components/schemas/NullValue'
      description: "This enumeration is defined in the same way as the 'TrafficProfile'\
        \ enumeration, but with the OpenAPI 'nullable: true' property. \n"
    BatteryIndication:
      type: object
      properties:
        batteryInd:
          type: boolean
          description: 'This IE shall indicate whether the UE is battery powered or
            not. true: the UE is battery powered; false or absent: the UE is not battery
            powered

            '
        replaceableInd:
          type: boolean
          description: 'This IE shall indicate whether the battery of the UE is replaceable
            or not. true: the battery of the UE is replaceable; false or absent: the
            battery of the UE is not replaceable.

            '
        rechargeableInd:
          type: boolean
          description: 'This IE shall indicate whether the battery of the UE is rechargeable
            or not. true: the battery of UE is rechargeable; false or absent: the
            battery of the UE is not rechargeable.

            '
      description: 'Parameters "replaceableInd" and "rechargeableInd" are only included
        if the value of Parameter "batteryInd" is true.

        '
    BatteryIndicationRm:
      anyOf:
      - $ref: '#/components/schemas/BatteryIndication'
      - $ref: '#/components/schemas/NullValue'
      description: 'This data type is defined in the same way as the ''BatteryIndication''
        data type, but with the OpenAPI ''nullable: true'' property.

        '
    EcRestrictionDataWb:
      type: object
      anyOf:
      - required:
        - ecModeARestricted
      - required:
        - ecModeBRestricted
      properties:
        ecModeARestricted:
          type: boolean
        ecModeBRestricted:
          type: boolean
    Uri:
      type: string
      description: String providing an URI formatted according to RFC 3986.
    Ipv4Addr:
      type: string
      pattern: ^(([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])$
      example: 198.51.100.1
      description: 'String identifying a IPv4 address formatted in the ''dotted decimal''
        notation as defined in RFC 1166.

        '
    Ipv6Addr:
      type: string
      allOf:
      - pattern: ^((:|(0?|([1-9a-f][0-9a-f]{0,3}))):)((0?|([1-9a-f][0-9a-f]{0,3})):){0,6}(:|(0?|([1-9a-f][0-9a-f]{0,3})))$
      - pattern: ^((([^:]+:){7}([^:]+))|((([^:]+:)*[^:]+)?::(([^:]+:)*[^:]+)?))$
      example: 2001:db8:85a3::8a2e:370:7334
      description: 'String identifying an IPv6 address formatted according to clause
        4 of RFC5952. The mixed IPv4 IPv6 notation according to clause 5 of RFC5952
        shall not be used.

        '
    AcsInfo:
      description: "The ACS information for the 5G-RG is defined in BBF\_TR-069\_\
        [42] or in BBF\_TR-369"
      type: object
      properties:
        acsUrl:
          $ref: '#/components/schemas/Uri'
        acsIpv4Addr:
          $ref: '#/components/schemas/Ipv4Addr'
        acsIpv6Addr:
          $ref: '#/components/schemas/Ipv6Addr'
    AcsInfoRm:
      anyOf:
      - $ref: '#/components/schemas/AcsInfo'
      - $ref: '#/components/schemas/NullValue'
      description: 'This data type is defined in the same way as the ''AcsInfo'' data
        type, but with the  OpenAPI ''nullable: true'' property.

        '
    StnSrRm:
      type: string
      nullable: true
      description: "String representing the STN-SR as defined in clause 18.6 of 3GPP\
        \ TS 23.003 with the OpenAPI 'nullable: true' property. \n"
    LocationPrivacyInd:
      anyOf:
      - type: string
        enum:
        - LOCATION_DISALLOWED
        - LOCATION_ALLOWED
      - type: string
    ValidTimePeriod:
      type: object
      properties:
        startTime:
          $ref: '#/components/schemas/DateTime'
        endTime:
          $ref: '#/components/schemas/DateTime'
    Lpi:
      type: object
      required:
      - locationPrivacyInd
      properties:
        locationPrivacyInd:
          $ref: '#/components/schemas/LocationPrivacyInd'
        validTimePeriod:
          $ref: '#/components/schemas/ValidTimePeriod'
    AccessTech:
      description: Represents the access technology
      anyOf:
      - type: string
        enum:
        - NR
        - EUTRAN_IN_WBS1_MODE_AND_NBS1_MODE
        - EUTRAN_IN_NBS1_MODE_ONLY
        - EUTRAN_IN_WBS1_MODE_ONLY
        - UTRAN
        - GSM_AND_ECGSM_IoT
        - GSM_WITHOUT_ECGSM_IoT
        - ECGSM_IoT_ONLY
        - CDMA_1xRTT
        - CDMA_HRPD
        - GSM_COMPACT
      - type: string
    SteeringInfo:
      description: Contains a combination of one PLMN identity and zero or more access
        technologies.
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        accessTechList:
          type: array
          items:
            $ref: '#/components/schemas/AccessTech'
          minItems: 1
      required:
      - plmnId
    SecuredPacket:
      type: string
      format: byte
    SteeringContainer:
      oneOf:
      - type: array
        items:
          $ref: '#/components/schemas/SteeringInfo'
        minItems: 1
      - $ref: '#/components/schemas/SecuredPacket'
    AckInd:
      description: Contains indication whether the acknowledgement from UE is needed.
      type: boolean
    SorMac:
      description: MAC value for protecting SOR procedure (SoR-MAC-IAUSF and SoR-XMAC-IUE).
      type: string
      pattern: ^[A-Fa-f0-9]{32}$
    CounterSor:
      description: CounterSoR.
      type: string
      pattern: ^[A-Fa-f0-9]{4}$
    Bytes:
      format: byte
      type: string
      description: string with format 'bytes' as defined in OpenAPI
    SorInfo:
      type: object
      properties:
        steeringContainer:
          $ref: '#/components/schemas/SteeringContainer'
        ackInd:
          $ref: '#/components/schemas/AckInd'
        sorMacIausf:
          $ref: '#/components/schemas/SorMac'
        countersor:
          $ref: '#/components/schemas/CounterSor'
        provisioningTime:
          $ref: '#/components/schemas/DateTime'
        sorTransparentContainer:
          $ref: '#/components/schemas/Bytes'
        sorCmci:
          $ref: '#/components/schemas/Bytes'
        storeSorCmciInMe:
          type: boolean
        usimSupportOfSorCmci:
          type: boolean
      required:
      - ackInd
      - provisioningTime
    Tmgi:
      description: Temporary Mobile Group Identity
      type: object
      properties:
        mbsServiceId:
          type: string
          pattern: ^[A-Fa-f0-9]{6}$
          description: MBS Service ID
        plmnId:
          $ref: '#/components/schemas/PlmnId'
      required:
      - mbsServiceId
      - plmnId
    Ipv6Prefix:
      type: string
      allOf:
      - pattern: ^((:|(0?|([1-9a-f][0-9a-f]{0,3}))):)((0?|([1-9a-f][0-9a-f]{0,3})):){0,6}(:|(0?|([1-9a-f][0-9a-f]{0,3})))(\/(([0-9])|([0-9]{2})|(1[0-1][0-9])|(12[0-8])))$
      - pattern: ^((([^:]+:){7}([^:]+))|((([^:]+:)*[^:]+)?::(([^:]+:)*[^:]+)?))(\/.+)$
      example: 2001:db8:abcd:12::0/64
      description: 'String identifying an IPv6 address prefix formatted according
        to clause 4 of RFC 5952. IPv6Prefix data type may contain an individual /128
        IPv6 address.

        '
    IpAddr:
      description: Contains an IP adresse.
      type: object
      oneOf:
      - required:
        - ipv4Addr
      - required:
        - ipv6Addr
      - required:
        - ipv6Prefix
      properties:
        ipv4Addr:
          $ref: '#/components/schemas/Ipv4Addr'
        ipv6Addr:
          $ref: '#/components/schemas/Ipv6Addr'
        ipv6Prefix:
          $ref: '#/components/schemas/Ipv6Prefix'
    Ssm:
      description: Source specific IP multicast address
      type: object
      properties:
        sourceIpAddr:
          $ref: '#/components/schemas/IpAddr'
        destIpAddr:
          $ref: '#/components/schemas/IpAddr'
      required:
      - sourceIpAddr
      - destIpAddr
    MbsSessionId:
      description: MBS Session Identifier
      type: object
      properties:
        tmgi:
          $ref: '#/components/schemas/Tmgi'
        ssm:
          $ref: '#/components/schemas/Ssm'
        nid:
          $ref: '#/components/schemas/Nid'
      anyOf:
      - required:
        - tmgi
      - required:
        - ssm
    ReportItem:
      type: object
      required:
      - path
      properties:
        path:
          type: string
          description: 'Contains a JSON pointer value (as defined in IETF RFC 6901)
            that references a  location of a resource to which the modification is
            subject.

            '
        reason:
          type: string
          description: 'A human-readable reason providing details on the reported
            modification failure.  The reason string should identify the operation
            that failed using the operation''s  array index to assist in correlation
            of the invalid parameter with the failed  operation, e.g. "Replacement
            value invalid for attribute (failed operation index= 4)".

            '
      description: indicates performed modivications.
    PatchResult:
      description: The execution report result on failed modification.
      type: object
      required:
      - report
      properties:
        report:
          type: array
          items:
            $ref: '#/components/schemas/ReportItem'
          minItems: 1
          description: 'The execution report contains an array of report items. Each
            report item indicates one  failed modification.

            '
    InvalidParam:
      type: object
      properties:
        param:
          type: string
          description: 'If the invalid parameter is an attribute in a JSON body, this
            IE shall contain the  attribute''s name and shall be encoded as a JSON
            Pointer. If the invalid parameter is  an HTTP header, this IE shall be
            formatted as the concatenation of the string "header "  plus the name
            of such header. If the invalid parameter is a query parameter, this IE  shall
            be formatted as the concatenation of the string "query " plus the name
            of such  query parameter. If the invalid parameter is a variable part
            in the path of a resource  URI, this IE shall contain the name of the
            variable, including the symbols "{" and "}"  used in OpenAPI specification
            as the notation to represent variable path segments.

            '
        reason:
          type: string
          description: 'A human-readable reason, e.g. "must be a positive integer".
            In cases involving failed  operations in a PATCH request, the reason string
            should identify the operation that  failed using the operation''s array
            index to assist in correlation of the invalid  parameter with the failed
            operation, e.g." Replacement value invalid for attribute  (failed operation
            index= 4)"

            '
      required:
      - param
      description: It contains an invalid parameter and a related description.
    AccessTokenErr:
      description: Error returned in the access token response message
      type: object
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - invalid_request
          - invalid_client
          - invalid_grant
          - unauthorized_client
          - unsupported_grant_type
          - invalid_scope
        error_description:
          type: string
        error_uri:
          type: string
    NfInstanceId:
      type: string
      format: uuid
      description: "String uniquely identifying a NF instance. The format of the NF\
        \ Instance ID shall be a  Universally Unique Identifier (UUID) version 4,\
        \ as described in IETF RFC 4122. \n"
    NFType:
      description: NF types known to NRF
      anyOf:
      - type: string
        enum:
        - NRF
        - UDM
        - AMF
        - SMF
        - AUSF
        - NEF
        - PCF
        - SMSF
        - NSSF
        - UDR
        - LMF
        - GMLC
        - 5G_EIR
        - SEPP
        - UPF
        - N3IWF
        - AF
        - UDSF
        - BSF
        - CHF
        - NWDAF
        - PCSCF
        - CBCF
        - HSS
        - UCMF
        - SOR_AF
        - SPAF
        - MME
        - SCSAS
        - SCEF
        - SCP
        - NSSAAF
        - ICSCF
        - SCSCF
        - DRA
        - IMS_AS
        - AANF
        - 5G_DDNMF
        - NSACF
        - MFAF
        - EASDF
        - DCCF
        - MB_SMF
        - TSCTSF
        - ADRF
        - GBA_BSF
        - CEF
        - MB_UPF
        - NSWOF
        - PKMF
        - MNPF
        - SMS_GMSC
        - SMS_IWMSC
        - MBSF
        - MBSTF
        - PANF
        - IP_SM_GW
        - SMS_ROUTER
      - type: string
    Fqdn:
      description: Fully Qualified Domain Name
      type: string
      pattern: ^([0-9A-Za-z]([-0-9A-Za-z]{0,61}[0-9A-Za-z])?\.)+[A-Za-z]{2,63}\.?$
      minLength: 4
      maxLength: 253
    PlmnIdNid:
      description: 'Contains the serving core network operator PLMN ID and, for an
        SNPN, the NID that together with the PLMN ID identifies the SNPN.

        '
      type: object
      required:
      - mcc
      - mnc
      properties:
        mcc:
          $ref: '#/components/schemas/Mcc'
        mnc:
          $ref: '#/components/schemas/Mnc'
        nid:
          $ref: '#/components/schemas/Nid'
    NfSetId:
      type: string
      description: "NF Set Identifier (see clause 28.12 of 3GPP TS 23.003), formatted\
        \ as the following string \"set<Set ID>.<nftype>set.5gc.mnc<MNC>.mcc<MCC>\"\
        , or  \"set<SetID>.<NFType>set.5gc.nid<NID>.mnc<MNC>.mcc<MCC>\" with  <MCC>\
        \ encoded as defined in clause 5.4.2 (\"Mcc\" data type definition)  <MNC>\
        \ encoding the Mobile Network Code part of the PLMN, comprising 3 digits.\
        \ \n  If there are only 2 significant digits in the MNC, one \"0\" digit shall\
        \ be inserted \n  at the left side to fill the 3 digits coding of MNC.  Pattern:\
        \ '^[0-9]{3}$'\n<NFType> encoded as a value defined in Table 6.1.6.3.3-1 of\
        \ 3GPP TS 29.510 but \n  with lower case characters <Set ID> encoded as a\
        \ string of characters consisting of \n  alphabetic characters (A-Z and a-z),\
        \ digits (0-9) and/or the hyphen (-) and that \n  shall end with either an\
        \ alphabetic character or a digit. \n"
    NfServiceSetId:
      type: string
      description: "NF Service Set Identifier (see clause 28.12 of 3GPP TS 23.003)\
        \ formatted as the following  string \"set<Set ID>.sn<Service Name>.nfi<NF\
        \ Instance ID>.5gc.mnc<MNC>.mcc<MCC>\", or  \"set<SetID>.sn<ServiceName>.nfi<NFInstanceID>.5gc.nid<NID>.mnc<MNC>.mcc<MCC>\"\
        \ with  <MCC> encoded as defined in clause 5.4.2 (\"Mcc\" data type definition)\
        \   <MNC> encoding the Mobile Network Code part of the PLMN, comprising 3\
        \ digits. \n  If there are only 2 significant digits in the MNC, one \"0\"\
        \ digit shall be inserted \n  at the left side to fill the 3 digits coding\
        \ of MNC.  Pattern: '^[0-9]{3}$'\n<NID> encoded as defined in clause\_5.4.2\
        \ (\"Nid\" data type definition)  <NFInstanceId> encoded as defined in clause\
        \ 5.3.2  <ServiceName> encoded as defined in 3GPP TS 29.510  <Set ID> encoded\
        \ as a string of characters consisting of alphabetic \n  characters (A-Z and\
        \ a-z), digits (0-9) and/or the hyphen (-) and that shall end \n  with either\
        \ an alphabetic character or a digit.\n"
    AccessTokenReq:
      description: Contains information related to the access token request
      type: object
      required:
      - grant_type
      - nfInstanceId
      - scope
      properties:
        grant_type:
          type: string
          enum:
          - client_credentials
        nfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        nfType:
          $ref: '#/components/schemas/NFType'
        targetNfType:
          $ref: '#/components/schemas/NFType'
        scope:
          type: string
          pattern: ^([a-zA-Z0-9_:-]+)( [a-zA-Z0-9_:-]+)*$
        targetNfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        requesterPlmn:
          $ref: '#/components/schemas/PlmnId'
        requesterPlmnList:
          type: array
          items:
            $ref: '#/components/schemas/PlmnId'
          minItems: 2
        requesterSnssaiList:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        requesterFqdn:
          $ref: '#/components/schemas/Fqdn'
        requesterSnpnList:
          type: array
          items:
            $ref: '#/components/schemas/PlmnIdNid'
          minItems: 1
        targetPlmn:
          $ref: '#/components/schemas/PlmnId'
        targetSnpn:
          $ref: '#/components/schemas/PlmnIdNid'
        targetSnssaiList:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        targetNsiList:
          type: array
          items:
            type: string
          minItems: 1
        targetNfSetId:
          $ref: '#/components/schemas/NfSetId'
        targetNfServiceSetId:
          $ref: '#/components/schemas/NfServiceSetId'
        hnrfAccessTokenUri:
          $ref: '#/components/schemas/Uri'
        sourceNfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
    ProblemDetails:
      description: Provides additional information in an error response.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/Uri'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of
            the problem.
        instance:
          $ref: '#/components/schemas/Uri'
        cause:
          type: string
          description: 'A machine-readable application error cause specific to this
            occurrence of the problem.  This IE should be present and provide application-related
            error information, if available.

            '
        invalidParams:
          type: array
          items:
            $ref: '#/components/schemas/InvalidParam'
          minItems: 1
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        accessTokenError:
          $ref: '#/components/schemas/AccessTokenErr'
        accessTokenRequest:
          $ref: '#/components/schemas/AccessTokenReq'
        nrfId:
          $ref: '#/components/schemas/Fqdn'
    PduSessionType:
      anyOf:
      - type: string
        enum:
        - IPV4
        - IPV6
        - IPV4V6
        - UNSTRUCTURED
        - ETHERNET
      - type: string
      description: "PduSessionType indicates the type of a PDU session. It shall comply\
        \ with the provisions defined in table 5.4.3.3-1. \n"
    OsId:
      description: Represents the Operating System of the served UE.
      type: string
      format: uuid
    AppDescriptor:
      type: object
      properties:
        osId:
          $ref: '#/components/schemas/OsId'
        appId:
          type: string
    IpAddress:
      type: object
      oneOf:
      - required:
        - ipv4Addr
      - required:
        - ipv6Addr
      - required:
        - ipv6Prefix
      properties:
        ipv4Addr:
          $ref: '#/components/schemas/Ipv4Addr'
        ipv6Addr:
          $ref: '#/components/schemas/Ipv6Addr'
        ipv6Prefix:
          $ref: '#/components/schemas/Ipv6Prefix'
    Gpsi:
      type: string
      pattern: ^(msisdn-[0-9]{5,15}|extid-[^@]+@[^@]+|.+)$
      description: "String identifying a Gpsi shall contain either an External Id\
        \ or an MSISDN.  It shall be formatted as follows -External Identifier= \"\
        extid-'extid', where 'extid'  shall be formatted according to clause 19.7.2\
        \ of 3GPP TS 23.003 that describes an  External Identifier. \n"
    GroupId:
      type: string
      pattern: ^[A-Fa-f0-9]{8}-[0-9]{3}-[0-9]{2,3}-([A-Fa-f0-9][A-Fa-f0-9]){1,10}$
      description: "String identifying a group of devices network internal globally\
        \ unique ID which identifies a set of IMSIs, as specified in clause 19.9 of\
        \ 3GPP TS 23.003. \n"
    EcsServerAddr:
      description: 'Contains the Edge Configuration Server Address Configuration Information
        as defined in clause 5.2.3.6.1 of 3GPP TS 23.502.

        '
      type: object
      properties:
        ecsFqdnList:
          type: array
          items:
            $ref: '#/components/schemas/Fqdn'
          minItems: 1
        ecsIpAddressList:
          type: array
          items:
            $ref: '#/components/schemas/IpAddr'
          minItems: 1
        ecsUriList:
          type: array
          items:
            $ref: '#/components/schemas/Uri'
          minItems: 1
        ecsProviderId:
          type: string
    GeoServiceArea:
      description: List of geographic area or list of civic address info
