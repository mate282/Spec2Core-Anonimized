openapi: 3.0.0
info:
  title: Nnef_SMContext
  version: 1.1.0
  description: "Nnef SMContext Service.  \n\xA9 2022, 3GPP Organizational Partners\
    \ (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC).  \nAll rights reserved.\n"
servers:
- url: http://nef:8000/nnef-smcontext/v1
security:
- {}
- oAuth2ClientCredentials:
  - nnef-smcontext
externalDocs:
  description: 3GPP TS 29.541 V17.3.0; 5G System; Session Management Services for
    Non-IP Data Delivery (NIDD).
  url: https://www.3gpp.org/ftp/Specs/archive/29_series/29.541/
paths:
  /sm-contexts:
    post:
      summary: Create SM Context
      operationId: Create
      tags:
      - SM Contexts Collection (Collection)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmContextCreateData'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmContextCreatedData'
          headers:
            Location:
              description: '''Contains the URI of the newly created Individual SM
                Context resource, according to the structure: {apiRoot}/nnef-smcontext/<version>/sm-contexts/{smContextId}''

                '
              required: true
              schema:
                type: string
        '307':
          $ref: '#/components/responses/307'
        '308':
          $ref: '#/components/responses/308'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '411':
          $ref: '#/components/responses/411'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/default'
      callbacks:
        StatusNotify:
          '{$request.body#/notificationUri}':
            post:
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/SmContextStatusNotification'
              responses:
                '204':
                  description: No Content, Notification was succesfull
                '307':
                  $ref: '#/components/responses/307'
                '308':
                  $ref: '#/components/responses/308'
                '400':
                  $ref: '#/components/responses/400'
                '411':
                  $ref: '#/components/responses/411'
                '413':
                  $ref: '#/components/responses/413'
                '415':
                  $ref: '#/components/responses/415'
                '429':
                  $ref: '#/components/responses/429'
                '500':
                  $ref: '#/components/responses/500'
                '503':
                  $ref: '#/components/responses/503'
                default:
                  $ref: '#/components/responses/default'
  /sm-contexts/{smContextId}/release:
    post:
      summary: Delete SM Context
      operationId: Delete
      tags:
      - Individual SM Context (Document)
      parameters:
      - name: smContextId
        in: path
        description: SM Context Resource ID
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmContextReleaseData'
      responses:
        '200':
          description: OK. Resource representation is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmContextReleasedData'
        '204':
          description: No Content.
        '307':
          $ref: '#/components/responses/307'
        '308':
          $ref: '#/components/responses/308'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/default'
  /sm-contexts/{smContextId}/update:
    post:
      summary: Update SM Context
      operationId: Update
      tags:
      - Individual SM Context (Document)
      parameters:
      - name: smContextId
        in: path
        description: SM Context Resource ID
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmContextUpdateData'
      responses:
        '204':
          description: No Content.
        '307':
          $ref: '#/components/responses/307'
        '308':
          $ref: '#/components/responses/308'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/default'
  /sm-contexts/{smContextId}/deliver:
    post:
      summary: Deliver Uplink MO Data
      operationId: Deliver
      tags:
      - Individual SM Context (Document)
      parameters:
      - name: smContextId
        in: path
        description: SM Context Resource ID
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/related:
            schema:
              type: object
              properties:
                jsonData:
                  $ref: '#/components/schemas/DeliverReqData'
                binaryMoData:
                  type: string
                  format: binary
            encoding:
              jsonData:
                contentType: application/json
              binaryMoData:
                contentType: application/octet-stream
                headers:
                  Content-Id:
                    schema:
                      type: string
      responses:
        '204':
          description: No Content.
        '307':
          $ref: '#/components/responses/307'
        '308':
          $ref: '#/components/responses/308'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/default'
components:
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://nrf:8000/oauth2/token
          scopes:
            nnef-smcontext: Access to the Nnef_SMContext API
  schemas:
    SmContextCreateData:
      description: Representation of the Individual SM context to be created.
      type: object
      properties:
        supi:
          $ref: '#/components/schemas/Supi'
        pduSessionId:
          $ref: '#/components/schemas/PduSessionId'
        dnn:
          $ref: '#/components/schemas/Dnn'
        snssai:
          $ref: '#/components/schemas/Snssai'
        nefId:
          type: string
          description: This IE shall contain the NEF ID of the target NEF.
        dlNiddEndPoint:
          $ref: '#/components/schemas/Uri'
        notificationUri:
          $ref: '#/components/schemas/Uri'
        niddInfo:
          $ref: '#/components/schemas/NiddInformation'
        rdsSupport:
          type: boolean
          description: "When present, this IE shall indicate the UE capability to\
            \ support RDS.\nThe value of this IE shall be set as following\n - true\
            \  UE supports RDS\n - false (default)  UE does not support RDS\n"
        smContextConfig:
          $ref: '#/components/schemas/SmContextConfiguration'
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
      required:
      - supi
      - pduSessionId
      - dnn
      - snssai
      - nefId
      - dlNiddEndPoint
      - notificationUri
    SmContextCreatedData:
      description: Representation of an Individual SM context successfully created.
      type: object
      properties:
        supi:
          $ref: '#/components/schemas/Supi'
        pduSessionId:
          $ref: '#/components/schemas/PduSessionId'
        dnn:
          $ref: '#/components/schemas/Dnn'
        snssai:
          $ref: '#/components/schemas/Snssai'
        nefId:
          type: string
          description: This IE shall contain the NEF ID of the target NEF.
        rdsSupport:
          type: boolean
          default: false
          description: "When present, this IE shall indicate the NEF capability to\
            \ support RDS.\nThe value of this IE shall be set as following\n  - true\
            \  NEF supports RDS\n  - false (default)  NEF does not support RDS\n"
        extBufSupport:
          type: boolean
          default: false
          description: "When present, this IE shall indicate whether Extended Buffering\
            \ applies or not.\nThe value of this IE shall be set as following\n  -\
            \ true  Extended Buffering applies\n  - false (default)  Extended Buffering\
            \ does not apply\n"
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        maxPacketSize:
          type: integer
      required:
      - supi
      - pduSessionId
      - dnn
      - snssai
      - nefId
    SmContextReleaseData:
      description: Representation of the information to release the Individual SM
        context.
      type: object
      properties:
        cause:
          $ref: '#/components/schemas/ReleaseCause'
      required:
      - cause
    SmContextReleasedData:
      description: Successful release of an Individual SM context with information
        sent to the NF service consumer.
      type: object
      properties:
        smallDataRateStatus:
          $ref: '#/components/schemas/SmallDataRateStatus'
        apnRateStatus:
          $ref: '#/components/schemas/ApnRateStatus'
    SmContextStatusNotification:
      description: Representation of the SM Context status notification.
      type: object
      properties:
        status:
          $ref: '#/components/schemas/SmContextStatus'
        smContextId:
          $ref: '#/components/schemas/Uri'
        cause:
          $ref: '#/components/schemas/ReleaseCause'
        smallDataRateStatus:
          $ref: '#/components/schemas/SmallDataRateStatus'
        apnRateStatus:
          $ref: '#/components/schemas/ApnRateStatus'
      required:
      - status
      - smContextId
    NiddInformation:
      description: Informaiton related to NIDD used for the SM Context.
      type: object
      properties:
        extGroupId:
          $ref: '#/components/schemas/ExternalGroupId'
        gpsi:
          $ref: '#/components/schemas/Gpsi'
        afId:
          type: string
          description: When present, this IE shall contain the AF Id used for the
            SM Context.
    SmContextConfiguration:
      description: NIDD Configuration for the SM context.
      type: object
      properties:
        smalDataRateControl:
          $ref: '#/components/schemas/SmallDataRateControl'
        smallDataRateStatus:
          $ref: '#/components/schemas/SmallDataRateStatus'
        servPlmnDataRateCtl:
          type: integer
          minimum: 10
          nullable: true
          description: "When present, this IE shall contain the maximum allowed number\
            \ of Downlink NAS Data PDUs per deci hour of the serving PLMN, as specified\
            \ in subclause 5.31.14.2 of 3GPP TS 23.501 [2].\n  Minimum  10\n"
    SmallDataRateControl:
      description: Configuration of Small Data Rate Control for the SM Context.
      type: object
      properties:
        timeUnit:
          $ref: '#/components/schemas/SmallDataRateControlTimeUnit'
        maxPacketRateUl:
          type: integer
        maxPacketRateDl:
          type: integer
        maxAdditionalPacketRateUl:
          type: integer
        maxAdditionalPacketRateDl:
          type: integer
      required:
      - timeUnit
    SmContextUpdateData:
      description: Representation of the updates to apply to the Individual SM context.
      type: object
      properties:
        dlNiddEndPoint:
          $ref: '#/components/schemas/Uri'
        notificationUri:
          $ref: '#/components/schemas/Uri'
        smContextConfig:
          $ref: '#/components/schemas/SmContextConfiguration'
    DeliverReqData:
      description: The data for Deliver service request, including the Mobile Originated
        data to be delivered via NEF.
      type: object
      properties:
        data:
          $ref: '#/components/schemas/RefToBinaryData'
      required:
      - data
    SmContextStatus:
      anyOf:
      - type: string
        enum:
        - RELEASED
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: 'Possible values are

        - RELEASED: Indicates that the Individual SM Context for NIDD is released.

        '
    SmallDataRateControlTimeUnit:
      anyOf:
      - type: string
        enum:
        - MINUTE
        - HOUR
        - DAY
        - WEEK
        - 6MINUTES
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: 'Possible values are

        - MINUTE: Indicates the rate control is applied per minute.

        - HOUR: Indicates the rate control is applied per hour.

        - DAY: Indicates the rate control is applied per day.

        - WEEK: Indicates the rate control is applied per week.

        - 6MINUTES: Indicates the rate control is applied per 6 minutes.

        '
    ReleaseCause:
      anyOf:
      - type: string
        enum:
        - PDU_SESSION_RELEASED
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: 'The cause to release the SM Context. Possible values are

        - PDU_SESSION_RELEASED: Indicates that the Individual SM Context for NIDD
        is released.

        '
    Supi:
      type: string
      pattern: ^(imsi-[0-9]{5,15}|nai-.+|gci-.+|gli-.+|.+)$
      description: "String identifying a Supi that shall contain either an IMSI, a\
        \ network specific identifier,\na Global Cable Identifier (GCI) or a Global\
        \ Line Identifier (GLI) as specified in clause \n2.2A of 3GPP TS 23.003. It\
        \ shall be formatted as follows\n - for an IMSI \"imsi-<imsi>\", where <imsi>\
        \ shall be formatted according to clause 2.2\n   of 3GPP TS 23.003 that describes\
        \ an IMSI.\n - for a network specific identifier \"nai-<nai>, where <nai>\
        \ shall be formatted\n   according to clause 28.7.2 of 3GPP TS 23.003 that\
        \ describes an NAI.\n - for a GCI \"gci-<gci>\", where <gci> shall be formatted\
        \ according to clause 28.15.2\n   of 3GPP TS 23.003.\n - for a GLI \"gli-<gli>\"\
        , where <gli> shall be formatted according to clause 28.16.2 of\n   3GPP TS\
        \ 23.003.To enable that the value is used as part of an URI, the string shall\n\
        \   only contain characters allowed according to the \"lower-with-hyphen\"\
        \ naming convention\n   defined in 3GPP TS 29.501.\n"
    PduSessionId:
      type: integer
      minimum: 0
      maximum: 255
      description: "Unsigned integer identifying a PDU session, within the range 0\
        \ to 255, as specified in  clause 11.2.3.1b, bits 1 to 8, of 3GPP TS 24.007.\
        \ If the PDU Session ID is allocated by the  Core Network for UEs not supporting\
        \ N1 mode, reserved range 64 to 95 is used. PDU Session ID  within the reserved\
        \ range is only visible in the Core Network. \n"
    Dnn:
      type: string
      description: 'String representing a Data Network as defined in clause 9A of
        3GPP TS 23.003;  it shall contain either a DNN Network Identifier, or a full
        DNN with both the Network  Identifier and Operator Identifier, as specified
        in 3GPP TS 23.003 clause 9.1.1 and 9.1.2. It shall be coded as string in which
        the labels are separated by dots  (e.g. "Label1.Label2.Label3").

        '
    Snssai:
      type: object
      properties:
        sst:
          type: integer
          minimum: 0
          maximum: 255
          description: "Unsigned integer, within the range 0 to 255, representing\
            \ the Slice/Service Type.  It indicates the expected Network Slice behaviour\
            \ in terms of features and services. Values 0 to 127 correspond to the\
            \ standardized SST range. Values 128 to 255 correspond  to the Operator-specific\
            \ range. See clause 28.4.2 of 3GPP TS 23.003. Standardized values are\
            \ defined in clause 5.15.2.2 of 3GPP TS 23.501. \n"
        sd:
          type: string
          pattern: ^[A-Fa-f0-9]{6}$
          description: '3-octet string, representing the Slice Differentiator, in
            hexadecimal representation. Each character in the string shall take a
            value of "0" to "9", "a" to "f" or "A" to "F" and shall represent 4 bits.
            The most significant character representing the 4 most significant bits
            of the SD shall appear first in the string, and the character representing
            the 4 least significant bit of the SD shall appear last in the string.
            This is an optional parameter that complements the Slice/Service type(s)
            to allow to  differentiate amongst multiple Network Slices of the same
            Slice/Service type. This IE shall be absent if no SD value is associated
            with the SST.

            '
      description: 'When Snssai needs to be converted to string (e.g. when used in
        maps as key), the string shall be composed of one to three digits "sst" optionally
        followed by "-" and 6 hexadecimal digits "sd".

        '
      required:
      - sst
    Uri:
      type: string
      description: String providing an URI formatted according to RFC 3986.
    ExternalGroupId:
      type: string
      pattern: ^extgroupid-[^@]+@[^@]+$
      description: "String identifying External Group Identifier that identifies a\
        \ group made up of one or more  subscriptions associated to a group of IMSIs,\
        \ as specified in clause 19.7.3 of 3GPP TS 23.003. \n"
    Gpsi:
      type: string
      pattern: ^(msisdn-[0-9]{5,15}|extid-[^@]+@[^@]+|.+)$
      description: "String identifying a Gpsi shall contain either an External Id\
        \ or an MSISDN.  It shall be formatted as follows -External Identifier= \"\
        extid-'extid', where 'extid'  shall be formatted according to clause 19.7.2\
        \ of 3GPP TS 23.003 that describes an  External Identifier. \n"
    DateTime:
      format: date-time
      type: string
      description: string with format 'date-time' as defined in OpenAPI.
    SmallDataRateStatus:
      description: It indicates theSmall Data Rate Control Status
      type: object
      properties:
        remainPacketsUl:
          type: integer
          minimum: 0
          description: 'When present, it shall contain the number of packets the UE
            is allowed to send uplink in the given time unit for the given PDU session
            (see clause 5.31.14.3 of 3GPP TS 23.501.

            '
        remainPacketsDl:
          type: integer
          minimum: 0
          description: 'When present it shall contain the number of packets the AF
            is allowed to send downlink in the given time unit for the given PDU session
            (see clause 5.31.14.3 of 3GPP TS 23.501.

            '
        validityTime:
          $ref: '#/components/schemas/DateTime'
        remainExReportsUl:
          type: integer
          minimum: 0
          description: 'When present, it shall indicate number of additional exception
            reports the UE is allowed to send uplink in the given time  unit for  the
            given PDU session (see clause 5.31.14.3 of 3GPP TS 23.501.

            '
        remainExReportsDl:
          type: integer
          minimum: 0
          description: 'When present, it shall indicate number of additional exception
            reports the AF is allowed to send downlink  in the given time unit for
            the given PDU session (see clause 5.31.14.3 in 3GPP TS 23.501

            '
    SupportedFeatures:
      type: string
      pattern: ^[A-Fa-f0-9]*$
      description: "A string used to indicate the features supported by an API that\
        \ is used as defined in clause  6.6 in 3GPP TS 29.500. The string shall contain\
        \ a bitmask indicating supported features in  hexadecimal representation Each\
        \ character in the string shall take a value of \"0\" to \"9\",  \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent the support of 4 features as\
        \ described in  table\_5.2.2-3. The most significant character representing\
        \ the highest-numbered features shall  appear first in the string, and the\
        \ character representing features 1 to 4 shall appear last  in the string.\
        \ The list of features and their numbering (starting with 1) are defined \
        \ separately for each API. If the string contains a lower number of characters\
        \ than there are  defined features for an API, all features that would be\
        \ represented by characters that are not  present in the string are not supported.\n"
    RedirectResponse:
      description: 'The response shall include a Location header field containing
        a different URI  (pointing to a different URI of an other service instance),
        or the same URI if a request  is redirected to the same target resource via
        a different SCP.

        '
      type: object
      properties:
        cause:
          type: string
        targetScp:
          $ref: '#/components/schemas/Uri'
        targetSepp:
          $ref: '#/components/schemas/Uri'
    InvalidParam:
      type: object
      properties:
        param:
          type: string
          description: 'If the invalid parameter is an attribute in a JSON body, this
            IE shall contain the  attribute''s name and shall be encoded as a JSON
            Pointer. If the invalid parameter is  an HTTP header, this IE shall be
            formatted as the concatenation of the string "header "  plus the name
            of such header. If the invalid parameter is a query parameter, this IE  shall
            be formatted as the concatenation of the string "query " plus the name
            of such  query parameter. If the invalid parameter is a variable part
            in the path of a resource  URI, this IE shall contain the name of the
            variable, including the symbols "{" and "}"  used in OpenAPI specification
            as the notation to represent variable path segments.

            '
        reason:
          type: string
          description: 'A human-readable reason, e.g. "must be a positive integer".
            In cases involving failed  operations in a PATCH request, the reason string
            should identify the operation that  failed using the operation''s array
            index to assist in correlation of the invalid  parameter with the failed
            operation, e.g." Replacement value invalid for attribute  (failed operation
            index= 4)"

            '
      required:
      - param
      description: It contains an invalid parameter and a related description.
    AccessTokenErr:
      description: Error returned in the access token response message
      type: object
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - invalid_request
          - invalid_client
          - invalid_grant
          - unauthorized_client
          - unsupported_grant_type
          - invalid_scope
        error_description:
          type: string
        error_uri:
          type: string
    NfInstanceId:
      type: string
      format: uuid
      description: "String uniquely identifying a NF instance. The format of the NF\
        \ Instance ID shall be a  Universally Unique Identifier (UUID) version 4,\
        \ as described in IETF RFC 4122. \n"
    NFType:
      description: NF types known to NRF
      anyOf:
      - type: string
        enum:
        - NRF
        - UDM
        - AMF
        - SMF
        - AUSF
        - NEF
        - PCF
        - SMSF
        - NSSF
        - UDR
        - LMF
        - GMLC
        - 5G_EIR
        - SEPP
        - UPF
        - N3IWF
        - AF
        - UDSF
        - BSF
        - CHF
        - NWDAF
        - PCSCF
        - CBCF
        - HSS
        - UCMF
        - SOR_AF
        - SPAF
        - MME
        - SCSAS
        - SCEF
        - SCP
        - NSSAAF
        - ICSCF
        - SCSCF
        - DRA
        - IMS_AS
        - AANF
        - 5G_DDNMF
        - NSACF
        - MFAF
        - EASDF
        - DCCF
        - MB_SMF
        - TSCTSF
        - ADRF
        - GBA_BSF
        - CEF
        - MB_UPF
        - NSWOF
        - PKMF
        - MNPF
        - SMS_GMSC
        - SMS_IWMSC
        - MBSF
        - MBSTF
        - PANF
        - IP_SM_GW
        - SMS_ROUTER
      - type: string
    Mcc:
      type: string
      pattern: ^\d{3}$
      description: "Mobile Country Code part of the PLMN, comprising 3 digits, as\
        \ defined in clause 9.3.3.5 of 3GPP TS 38.413. \n"
    Mnc:
      type: string
      pattern: ^\d{2,3}$
      description: Mobile Network Code part of the PLMN, comprising 2 or 3 digits,
        as defined in clause 9.3.3.5 of 3GPP TS 38.413.
    PlmnId:
      type: object
      properties:
        mcc:
          $ref: '#/components/schemas/Mcc'
        mnc:
          $ref: '#/components/schemas/Mnc'
      description: 'When PlmnId needs to be converted to string (e.g. when used in
        maps as key), the string  shall be composed of three digits "mcc" followed
        by "-" and two or three digits "mnc".

        '
      required:
      - mcc
      - mnc
    Fqdn:
      description: Fully Qualified Domain Name
      type: string
      pattern: ^([0-9A-Za-z]([-0-9A-Za-z]{0,61}[0-9A-Za-z])?\.)+[A-Za-z]{2,63}\.?$
      minLength: 4
      maxLength: 253
    Nid:
      type: string
      pattern: ^[A-Fa-f0-9]{11}$
      description: "This represents the Network Identifier, which together with a\
        \ PLMN ID is used to identify an SNPN (see 3GPP TS 23.003 and 3GPP TS 23.501\
        \ clause 5.30.2.1). \n"
    PlmnIdNid:
      description: 'Contains the serving core network operator PLMN ID and, for an
        SNPN, the NID that together with the PLMN ID identifies the SNPN.

        '
      type: object
      required:
      - mcc
      - mnc
      properties:
        mcc:
          $ref: '#/components/schemas/Mcc'
        mnc:
          $ref: '#/components/schemas/Mnc'
        nid:
          $ref: '#/components/schemas/Nid'
    NfSetId:
      type: string
      description: "NF Set Identifier (see clause 28.12 of 3GPP TS 23.003), formatted\
        \ as the following string \"set<Set ID>.<nftype>set.5gc.mnc<MNC>.mcc<MCC>\"\
        , or  \"set<SetID>.<NFType>set.5gc.nid<NID>.mnc<MNC>.mcc<MCC>\" with  <MCC>\
        \ encoded as defined in clause 5.4.2 (\"Mcc\" data type definition)  <MNC>\
        \ encoding the Mobile Network Code part of the PLMN, comprising 3 digits.\
        \ \n  If there are only 2 significant digits in the MNC, one \"0\" digit shall\
        \ be inserted \n  at the left side to fill the 3 digits coding of MNC.  Pattern:\
        \ '^[0-9]{3}$'\n<NFType> encoded as a value defined in Table 6.1.6.3.3-1 of\
        \ 3GPP TS 29.510 but \n  with lower case characters <Set ID> encoded as a\
        \ string of characters consisting of \n  alphabetic characters (A-Z and a-z),\
        \ digits (0-9) and/or the hyphen (-) and that \n  shall end with either an\
        \ alphabetic character or a digit. \n"
    NfServiceSetId:
      type: string
      description: "NF Service Set Identifier (see clause 28.12 of 3GPP TS 23.003)\
        \ formatted as the following  string \"set<Set ID>.sn<Service Name>.nfi<NF\
        \ Instance ID>.5gc.mnc<MNC>.mcc<MCC>\", or  \"set<SetID>.sn<ServiceName>.nfi<NFInstanceID>.5gc.nid<NID>.mnc<MNC>.mcc<MCC>\"\
        \ with  <MCC> encoded as defined in clause 5.4.2 (\"Mcc\" data type definition)\
        \   <MNC> encoding the Mobile Network Code part of the PLMN, comprising 3\
        \ digits. \n  If there are only 2 significant digits in the MNC, one \"0\"\
        \ digit shall be inserted \n  at the left side to fill the 3 digits coding\
        \ of MNC.  Pattern: '^[0-9]{3}$'\n<NID> encoded as defined in clause\_5.4.2\
        \ (\"Nid\" data type definition)  <NFInstanceId> encoded as defined in clause\
        \ 5.3.2  <ServiceName> encoded as defined in 3GPP TS 29.510  <Set ID> encoded\
        \ as a string of characters consisting of alphabetic \n  characters (A-Z and\
        \ a-z), digits (0-9) and/or the hyphen (-) and that shall end \n  with either\
        \ an alphabetic character or a digit.\n"
    AccessTokenReq:
      description: Contains information related to the access token request
      type: object
      required:
      - grant_type
      - nfInstanceId
      - scope
      properties:
        grant_type:
          type: string
          enum:
          - client_credentials
        nfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        nfType:
          $ref: '#/components/schemas/NFType'
        targetNfType:
          $ref: '#/components/schemas/NFType'
        scope:
          type: string
          pattern: ^([a-zA-Z0-9_:-]+)( [a-zA-Z0-9_:-]+)*$
        targetNfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        requesterPlmn:
          $ref: '#/components/schemas/PlmnId'
        requesterPlmnList:
          type: array
          items:
            $ref: '#/components/schemas/PlmnId'
          minItems: 2
        requesterSnssaiList:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        requesterFqdn:
          $ref: '#/components/schemas/Fqdn'
        requesterSnpnList:
          type: array
          items:
            $ref: '#/components/schemas/PlmnIdNid'
          minItems: 1
        targetPlmn:
          $ref: '#/components/schemas/PlmnId'
        targetSnpn:
          $ref: '#/components/schemas/PlmnIdNid'
        targetSnssaiList:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        targetNsiList:
          type: array
          items:
            type: string
          minItems: 1
        targetNfSetId:
          $ref: '#/components/schemas/NfSetId'
        targetNfServiceSetId:
          $ref: '#/components/schemas/NfServiceSetId'
        hnrfAccessTokenUri:
          $ref: '#/components/schemas/Uri'
        sourceNfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
    ProblemDetails:
      description: Provides additional information in an error response.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/Uri'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of
            the problem.
        instance:
          $ref: '#/components/schemas/Uri'
        cause:
          type: string
          description: 'A machine-readable application error cause specific to this
            occurrence of the problem.  This IE should be present and provide application-related
            error information, if available.

            '
        invalidParams:
          type: array
          items:
            $ref: '#/components/schemas/InvalidParam'
          minItems: 1
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        accessTokenError:
          $ref: '#/components/schemas/AccessTokenErr'
        accessTokenRequest:
          $ref: '#/components/schemas/AccessTokenReq'
        nrfId:
          $ref: '#/components/schemas/Fqdn'
    ApnRateStatus:
      description: Contains the APN rate control status e.g. of the AMF.
      type: object
      properties:
        remainPacketsUl:
          type: integer
          minimum: 0
          description: 'When present, it shall contain the number of packets the UE
            is allowed to send uplink in the given time unit for the given APN (all
            PDN connections of the UE to this APN see clause 4.7.7.3 in 3GPP TS 23.401.

            '
        remainPacketsDl:
          type: integer
          minimum: 0
          description: 'When present, it shall contain the number of packets the UE
            is allowed to send uplink in the given time unit for the given APN (all
            PDN connections of the UE to this APN see clause 4.7.7.3 in 3GPP TS 23.401.

            '
        validityTime:
          $ref: '#/components/schemas/DateTime'
        remainExReportsUl:
          type: integer
          minimum: 0
          description: 'When present, it shall indicate the number of additional exception
            reports the UE is allowed to send uplink in the given time unit for the
            given APN (all PDN connections of the UE to this APN, see clause 4.7.7.3
            in 3GPP TS 23.401.

            '
        remainExReportsDl:
          type: integer
          minimum: 0
          description: 'When present, it shall indicate the number of additional exception
            reports the AF is allowed to send downlink in the  given time unit for
            the given APN (all PDN connections of the UE to this APN, see clause 4.7.7.3
            in 3GPP TS 23.401.

            '
    RefToBinaryData:
      description: This parameter provides information about the referenced binary
        body data.
      type: object
      properties:
        contentId:
          type: string
          description: 'This IE shall contain the value of the Content-ID header of
            the referenced binary body part.

            '
      required:
      - contentId
  responses:
    '307':
      description: Temporary Redirect
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RedirectResponse'
      headers:
        Location:
          description: The URI pointing to the resource located on the redirect target
          required: true
          schema:
            type: string
        3gpp-Sbi-Target-Nf-Id:
          description: Identifier of target NF (service) instance towards which the
            request is redirected
          schema:
            type: string
    '308':
      description: Permanent Redirect
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RedirectResponse'
      headers:
        Location:
          description: The URI pointing to the resource located on the redirect target
          required: true
          schema:
            type: string
        3gpp-Sbi-Target-Nf-Id:
          description: '''Identifier of target NF (service) instance towards which
            the request is redirected''

            '
          schema:
            type: string
    '400':
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '403':
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '404':
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '406':
      description: 406 Not Acceptable
    '411':
      description: Length Required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '413':
      description: Payload Too Large
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '415':
      description: Unsupported Media Type
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '429':
      description: Too Many Requests
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '500':
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '503':
      description: Service Unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    default:
      description: Generic Error
