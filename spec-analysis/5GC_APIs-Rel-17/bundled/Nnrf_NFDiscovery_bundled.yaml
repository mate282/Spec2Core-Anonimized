          minimum: 0
          maximum: 65535
    DefSubServiceInfo:
      description: Service Specific information for Default Notification Subscription.
      type: object
      properties:
        versions:
          type: array
          items:
            type: string
          minItems: 1
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
    DefaultNotificationSubscription:
      description: 'Data structure for specifying the notifications the NF service
        subscribes by default, along with callback URI

        '
      type: object
      required:
      - notificationType
      - callbackUri
      properties:
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        callbackUri:
          $ref: '#/components/schemas/Uri'
        interPlmnCallbackUri:
          $ref: '#/components/schemas/Uri'
        n1MessageClass:
          $ref: '#/components/schemas/N1MessageClass'
        n2InformationClass:
          $ref: '#/components/schemas/N2InformationClass'
        versions:
          type: array
          items:
            type: string
          minItems: 1
        binding:
          type: string
        acceptedEncoding:
          type: string
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        serviceInfoList:
          description: 'A map of service specific information. The name of the corresponding
            service (as specified in ServiceName data type) is the key.

            '
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DefSubServiceInfo'
          minProperties: 1
