              $ref: '#/components/schemas/VendorSpecificFeature'
            minItems: 1
          minProperties: 1
        aanfInfoList:
          type: object
          description: 'A map (list of key-value pairs) where a (unique) valid JSON
            string serves as key of AanfInfo

            '
          additionalProperties:
            $ref: '#/components/schemas/AanfInfo'
          minProperties: 1
        mfafInfo:
          $ref: '#/components/schemas/MfafInfo'
        easdfInfoList:
          type: object
          description: 'A map(list of key-value pairs) where a (unique) valid JSON
            string serves as key of EasdfInfo

            '
          additionalProperties:
            $ref: '#/components/schemas/EasdfInfo'
          minProperties: 1
        dccfInfo:
          $ref: '#/components/schemas/DccfInfo'
        nsacfInfoList:
          description: 'A map (list of key-value pairs) where a (unique) valid JSON
            string serves as key of NsacfInfo

            '
          type: object
          additionalProperties:
            $ref: '#/components/schemas/NsacfInfo'
          minProperties: 1
        mbSmfInfoList:
          description: 'A map (list of key-value pairs) where a (unique) valid JSON
            string serves as key of MbSmfInfo

            '
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MbSmfInfo'
          minProperties: 1
        tsctsfInfoList:
          type: object
          description: 'A map (list of key-value pairs) where a (unique) valid JSON
            string serves as key of TsctsfInfo

            '
          additionalProperties:
            $ref: '#/components/schemas/TsctsfInfo'
          minProperties: 1
        mbUpfInfoList:
          description: 'A map (list of key-value pairs) where a (unique) valid JSON
            string serves as key of MbUpfInfo

            '
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MbUpfInfo'
          minProperties: 1
        trustAfInfo:
          $ref: '#/components/schemas/TrustAfInfo'
        nssaafInfo:
          $ref: '#/components/schemas/NssaafInfo'
        hniList:
          type: array
          items:
            $ref: '#/components/schemas/Fqdn'
          minItems: 1
        iwmscInfo:
          $ref: '#/components/schemas/IwmscInfo'
        mnpfInfo:
          $ref: '#/components/schemas/MnpfInfo'
    NFService:
      description: 'Information of a given NF Service Instance; it is part of the
        NFProfile of an NF Instance discovered by the NRF

        '
      type: object
      required:
      - serviceInstanceId
      - serviceName
      - versions
      - scheme
      - nfServiceStatus
      properties:
        serviceInstanceId:
          type: string
        serviceName:
          $ref: '#/components/schemas/ServiceName'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/NFServiceVersion'
          minItems: 1
        scheme:
          $ref: '#/components/schemas/UriScheme'
        nfServiceStatus:
          $ref: '#/components/schemas/NFServiceStatus'
        fqdn:
          $ref: '#/components/schemas/Fqdn'
        interPlmnFqdn:
          $ref: '#/components/schemas/Fqdn'
        ipEndPoints:
          type: array
          items:
            $ref: '#/components/schemas/IpEndPoint'
          minItems: 1
        apiPrefix:
          type: string
        defaultNotificationSubscriptions:
          type: array
          items:
            $ref: '#/components/schemas/DefaultNotificationSubscription'
          minItems: 1
        capacity:
          type: integer
          minimum: 0
          maximum: 65535
        load:
          type: integer
          minimum: 0
          maximum: 100
        loadTimeStamp:
          $ref: '#/components/schemas/DateTime'
        priority:
          type: integer
          minimum: 0
          maximum: 65535
        recoveryTime:
          $ref: '#/components/schemas/DateTime'
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        nfServiceSetIdList:
          type: array
          items:
            $ref: '#/components/schemas/NfServiceSetId'
          minItems: 1
        sNssais:
          type: array
          items:
            $ref: '#/components/schemas/ExtSnssai'
          minItems: 1
        perPlmnSnssaiList:
          type: array
          items:
            $ref: '#/components/schemas/PlmnSnssai'
          minItems: 1
        vendorId:
          $ref: '#/components/schemas/VendorId'
        supportedVendorSpecificFeatures:
          description: 'The key of the map is the IANA-assigned SMI Network Management
            Private Enterprise Codes

            '
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/VendorSpecificFeature'
            minItems: 1
          minProperties: 1
        oauth2Required:
          type: boolean
        allowedOperationsPerNfType:
          description: A map (list of key-value pairs) where NF Type serves as key
          type: object
          additionalProperties:
            type: array
            items:
              type: string
            minItems: 1
          minProperties: 1
        allowedOperationsPerNfInstance:
          description: A map (list of key-value pairs) where NF Instance Id serves
            as key
          type: object
          additionalProperties:
            type: array
            items:
              type: string
            minItems: 1
          minProperties: 1
    PreferredSearch:
      description: 'Contains information on whether the returned NFProfiles match
        the preferred query parameters

        '
      type: object
      properties:
        preferredTaiMatchInd:
          type: boolean
          default: false
        preferredFullPlmnMatchInd:
          type: boolean
          default: false
        preferredApiVersionsMatchInd:
          type: boolean
        otherApiVersionsInd:
          type: boolean
        preferredLocalityMatchInd:
          type: boolean
          default: false
        otherLocalityInd:
          type: boolean
          default: false
        preferredVendorSpecificFeaturesInd:
