openapi: 3.0.0
info:
  title: Npcf_MBSPolicyControl API
  version: 1.0.2
  description: "MBS Policy Control Service  \n\xA9 2023, 3GPP Organizational Partners\
    \ (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC).  \nAll rights reserved.\n"
servers:
- url: http://pcf:8000/npcf-mbspolicycontrol/v1
security:
- {}
- oAuth2ClientCredentials:
  - npcf-mbspolicycontrol
externalDocs:
  description: '3GPP TS 29.537 V17.3.0; 5G System; Multicast/Broadcast Policy Control
    Services.

    '
  url: https://www.3gpp.org/ftp/Specs/archive/29_series/29.537/
paths:
  /mbs-policies:
    post:
      summary: Request the creation of a new MBS Policy Association.
      operationId: CreateMBSPolicy
      tags:
      - MBS Policies (Collection)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MbsPolicyCtxtData'
      responses:
        '201':
          description: 'Created. An Individual MBS Policy resource is successfully
            created.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MbsPolicyData'
          headers:
            Location:
              description: 'Contains the URI of the newly created Individual MBS Policy
                resource.

                '
              required: true
              schema:
                type: string
        '308':
          $ref: '#/components/responses/308'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: Forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MbsExtProblemDetails'
        '404':
          $ref: '#/components/responses/404'
        '411':
          $ref: '#/components/responses/411'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/default'
  /mbs-policies/{mbsPolicyId}:
    parameters:
    - name: mbsPolicyId
      in: path
      description: 'Contains the identifier of the concerned Individual MBS Policy
        resource.

        '
      required: true
      schema:
        type: string
    get:
      summary: Read an Individual MBS Policy resource.
      operationId: GetIndMBSPolicy
      tags:
      - Individual MBS Policy (Document)
      responses:
        '200':
          description: 'OK. The requested Individual MBS Policy resource is successfully
            returned.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MbsPolicyData'
        '307':
          $ref: '#/components/responses/307'
        '308':
          $ref: '#/components/responses/308'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/default'
    delete:
      summary: Deletes an existing Individual MBS Policy resource.
      operationId: DeleteIndMBSPolicy
      tags:
      - Individual MBS Policy  (Document)
      parameters:
      - name: mbsPolicyId
        in: path
        description: 'Contains the identifier of the concerned Individual MBS Policy
          resource.

          '
        required: true
        schema:
          type: string
      responses:
        '204':
          description: 'No Content. The concerned Individual MBS Policy resource is
            successfully deleted.

            '
        '307':
          $ref: '#/components/responses/307'
        '308':
          $ref: '#/components/responses/308'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/default'
  /mbs-policies/{mbsPolicyId}/update:
    post:
      summary: Request the update of an existing MBS Policy Association.
      operationId: UpdateIndMBSPolicy
      tags:
      - Individual MBS Policy  (Document)
      parameters:
      - name: mbsPolicyId
        in: path
        description: 'Contains the identifier of the concerned Individual MBS Policy
          resource.

          '
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MbsPolicyCtxtDataUpdate'
      responses:
        '200':
          description: 'OK. The targeted Individual MBS Policy resource is successfully
            updated.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MbsPolicyData'
        '307':
          $ref: '#/components/responses/307'
        '308':
          $ref: '#/components/responses/308'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: Forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MbsExtProblemDetails'
        '404':
          $ref: '#/components/responses/404'
        '411':
          $ref: '#/components/responses/411'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/default'
components:
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://nrf:8000/oauth2/token
          scopes:
            npcf-mbspolicycontrol: Access to the Npcf_MBSPolicyControl API
  schemas:
    MbsPolicyCtxtData:
      description: 'Contains the parameters used to request the creation of an MBS
        Policy Association.

        '
      type: object
      properties:
        mbsSessionId:
          $ref: '#/components/schemas/MbsSessionId'
        dnn:
          $ref: '#/components/schemas/Dnn'
        snssai:
          $ref: '#/components/schemas/Snssai'
        areaSessPolId:
          $ref: '#/components/schemas/Uint16'
        mbsServInfo:
          $ref: '#/components/schemas/MbsServiceInfo'
        suppFeat:
          $ref: '#/components/schemas/SupportedFeatures'
      required:
      - mbsSessionId
    MbsPolicyDecision:
      description: 'Represents the parameters constituting an MBS Policy Decision.

        '
      type: object
      properties:
        mbsPccRules:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MbsPccRule'
          minProperties: 1
          description: 'A map of MBS PCC rule(s) with each map entry containing the
            MbsPccRule data structure. The key of the map for each entry is the mbsPccRuleId
            attribute of the corresponding MbsPccRule data structure.

            '
          nullable: true
        mbsQosDecs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MbsQosDec'
          minProperties: 1
          description: 'A map of MBS QoS Decision(s) with each map entry containing
            the MbsQosDec data structure. The key of the map for each entry is the
            mbsQosId attribute of the corresponding MbsQosDec data structure.

            '
        mbsQosChars:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MbsQosChar'
          minProperties: 1
          description: 'A map of MBS QoS Characteristics set(s) with each map entry
            containing the MbsQosChar data structure. The key of the map for each
            entry is the 5QI attribute of the corresponding MbsQosDec data structure.

            '
        authMbsSessAmbr:
          $ref: '#/components/schemas/BitRate'
        mbsPcrts:
          type: array
          items:
            $ref: '#/components/schemas/MbsPcrt'
          minItems: 1
          nullable: true
    MbsPolicyData:
      description: 'Contains the MBS policy data provisioned as part of an MBS Policy
        Association.

        '
      type: object
      properties:
        mbsPolicyCtxtData:
          $ref: '#/components/schemas/MbsPolicyCtxtData'
        mbsPolicies:
          $ref: '#/components/schemas/MbsPolicyDecision'
        suppFeat:
          $ref: '#/components/schemas/SupportedFeatures'
      required:
      - mbsPolicyCtxtData
    MbsPccRule:
      description: Represents the parameters constituting an MBS PCC rule.
      type: object
      properties:
        mbsPccRuleId:
          type: string
        mbsDlIpFlowInfo:
          type: array
          items:
            $ref: '#/components/schemas/schemas-FlowDescription'
          minItems: 1
        precedence:
          $ref: '#/components/schemas/Uinteger'
        refMbsQosDec:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 1
      required:
      - mbsPccRuleId
    MbsQosDec:
      description: Represents the parameters constituting an MBS QoS Decision.
      type: object
      properties:
        mbsQosId:
          type: string
        5qi:
          $ref: '#/components/schemas/5Qi'
        priorityLevel:
          $ref: '#/components/schemas/5QiPriorityLevel'
        mbrDl:
          $ref: '#/components/schemas/BitRate'
        gbrDl:
          $ref: '#/components/schemas/BitRate'
        arp:
          $ref: '#/components/schemas/Arp'
        averWindow:
          $ref: '#/components/schemas/AverWindow'
        mbsMaxDataBurstVol:
          $ref: '#/components/schemas/MbsMaxDataBurstVol'
      required:
      - mbsQosId
    MbsQosChar:
      description: 'Represents the parameters constituting a set of explicitly signalled
        QoS characteristics.

        '
      type: object
      properties:
        5qi:
          $ref: '#/components/schemas/5Qi'
        priorityLevel:
          $ref: '#/components/schemas/5QiPriorityLevel'
        resourceType:
          $ref: '#/components/schemas/QosResourceType'
        packetDelayBudget:
          $ref: '#/components/schemas/PacketDelBudget'
        packetErrorRate:
          $ref: '#/components/schemas/PacketErrRate'
        averWindow:
          $ref: '#/components/schemas/AverWindow'
        mbsMaxDataBurstVol:
          $ref: '#/components/schemas/MbsMaxDataBurstVol'
      required:
      - 5qi
      - resourceType
      - priorityLevel
      - packetDelayBudget
      - packetErrorRate
      - mbsMaxDataBurstVol
    MbsPolicyCtxtDataUpdate:
      description: 'Contains the parameters to request the modification of an existing
        MBS Policy Association.

        '
      type: object
      properties:
        mbsServInfo:
          $ref: '#/components/schemas/MbsServiceInfo'
        mbsPcrts:
          type: array
          items:
            $ref: '#/components/schemas/MbsPcrt'
          minItems: 1
        mbsErrorReport:
          $ref: '#/components/schemas/MbsErrorReport'
    MbsErrorReport:
      description: 'Represents the reporting of MBS Policy decision level failure(s)
        and/or MBS PCC rule level failure(s).

        '
      type: object
      properties:
        mbsReports:
          type: array
          items:
            $ref: '#/components/schemas/MbsReport'
          minItems: 1
    MbsReport:
      description: 'Contains information about the MBS Policy Decision level failure(s)
        and/or the MBS PCC rule level failure(s).

        '
      type: object
      properties:
        mbsPccRuleIds:
          type: array
          items:
            type: string
          minItems: 1
        mbsPccRuleStatus:
          $ref: '#/components/schemas/MbsPccRuleStatus'
        failureCode:
          $ref: '#/components/schemas/MbsFailureCode'
    MbsMaxDataBurstVol:
      description: Represents the MBS Maximum Data Burst Volume expressed in Bytes.
      type: integer
      minimum: 1
      maximum: 2000000
    MbsPcrt:
      anyOf:
      - type: string
        enum:
        - MBS_SESSION_UPDATE
      - type: string
        description: 'Represents MBS Policy Control Request Triggers.

          '
      description: 'Possible values are

        - MBS_SESSION_UPDATE: Indicates the MBS Session Update policy control request
        trigger.

        '
    MbsPccRuleStatus:
      anyOf:
      - type: string
        enum:
        - ACTIVE
        - INACTIVE
      - type: string
        description: 'Represents the MBS PCC rule status.

          '
      description: 'Possible values are

        - ACTIVE: Indicates that the MBS PCC rule(s) are successfully installed.

        - INACTIVE: Indicates that the MBS PCC rule(s) are removed.

        '
    MbsFailureCode:
      anyOf:
      - type: string
        enum:
        - NF_MALFUNCTION
        - NF_RESOURCES_UNAVAILABLE
        - RESOURCE_ALLOCATION_FAILURE
        - MBS_QOS_VALIDATION_FAILURE
        - NO_MBS_QOS_FLOW
        - MBS_QOS_DECISION_ERROR
        - MBS_POLICY_PARAM_ERROR
      - type: string
        description: 'Represents the reason for the MBS Policy Decision(s) enforcement
          failure or the MBS PCC rule(s) installation failure.

          '
      description: 'Possible values are:

        - NF_MALFUNCTION: Indicates that the MBS PCC rule could not be successfully
        installed due to MB-SMF/MB-UPF malfunction.

        - NF_RESOURCES_UNAVAILABLE: Indicates that the MBS PCC rule could not be successfully
        installed due to resources unavailable at the MB-SMF/MB-UPF.

        - RESOURCE_ALLOCATION_FAILURE: Indicates that the MBS PCC rule could not be
        successfully installed or maintained since the associated MBS QoS flow establishment/modification
        failed or the associated MBS QoS flow was released.

        - MBS_QOS_VALIDATION_FAILURE: Indicates that MBS QoS validation has failed.

        - NO_MBS_QOS_FLOW: Indicates that there is no MBS QoS flow to which the MB-SMF
        can bind the MBS PCC rule(s).

        - MBS_QOS_DECISION_ERROR: Indicates failure in the provisioning of MBS QoS
        Decision data.

        - MBS_POLICY_PARAM_ERROR: Indicates that the information related to the provisioned
        MBS policy parameter(s) is incorrect, incomplete or inconsistent.

        '
    Mcc:
      type: string
      pattern: ^\d{3}$
      description: "Mobile Country Code part of the PLMN, comprising 3 digits, as\
        \ defined in clause 9.3.3.5 of 3GPP TS 38.413. \n"
    Mnc:
      type: string
      pattern: ^\d{2,3}$
      description: Mobile Network Code part of the PLMN, comprising 2 or 3 digits,
        as defined in clause 9.3.3.5 of 3GPP TS 38.413.
    PlmnId:
      type: object
      properties:
        mcc:
          $ref: '#/components/schemas/Mcc'
        mnc:
          $ref: '#/components/schemas/Mnc'
      description: 'When PlmnId needs to be converted to string (e.g. when used in
        maps as key), the string  shall be composed of three digits "mcc" followed
        by "-" and two or three digits "mnc".

        '
      required:
      - mcc
      - mnc
    Tmgi:
      description: Temporary Mobile Group Identity
      type: object
      properties:
        mbsServiceId:
          type: string
          pattern: ^[A-Fa-f0-9]{6}$
          description: MBS Service ID
        plmnId:
          $ref: '#/components/schemas/PlmnId'
      required:
      - mbsServiceId
      - plmnId
    Ipv4Addr:
      type: string
      pattern: ^(([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])$
      example: 198.51.100.1
      description: 'String identifying a IPv4 address formatted in the ''dotted decimal''
        notation as defined in RFC 1166.

        '
    Ipv6Addr:
      type: string
      allOf:
      - pattern: ^((:|(0?|([1-9a-f][0-9a-f]{0,3}))):)((0?|([1-9a-f][0-9a-f]{0,3})):){0,6}(:|(0?|([1-9a-f][0-9a-f]{0,3})))$
      - pattern: ^((([^:]+:){7}([^:]+))|((([^:]+:)*[^:]+)?::(([^:]+:)*[^:]+)?))$
      example: 2001:db8:85a3::8a2e:370:7334
      description: 'String identifying an IPv6 address formatted according to clause
        4 of RFC5952. The mixed IPv4 IPv6 notation according to clause 5 of RFC5952
        shall not be used.

        '
    Ipv6Prefix:
      type: string
      allOf:
      - pattern: ^((:|(0?|([1-9a-f][0-9a-f]{0,3}))):)((0?|([1-9a-f][0-9a-f]{0,3})):){0,6}(:|(0?|([1-9a-f][0-9a-f]{0,3})))(\/(([0-9])|([0-9]{2})|(1[0-1][0-9])|(12[0-8])))$
      - pattern: ^((([^:]+:){7}([^:]+))|((([^:]+:)*[^:]+)?::(([^:]+:)*[^:]+)?))(\/.+)$
      example: 2001:db8:abcd:12::0/64
      description: 'String identifying an IPv6 address prefix formatted according
        to clause 4 of RFC 5952. IPv6Prefix data type may contain an individual /128
        IPv6 address.

        '
    IpAddr:
      description: Contains an IP adresse.
      type: object
      oneOf:
      - required:
        - ipv4Addr
      - required:
        - ipv6Addr
      - required:
        - ipv6Prefix
      properties:
        ipv4Addr:
          $ref: '#/components/schemas/Ipv4Addr'
        ipv6Addr:
          $ref: '#/components/schemas/Ipv6Addr'
        ipv6Prefix:
          $ref: '#/components/schemas/Ipv6Prefix'
    Ssm:
      description: Source specific IP multicast address
      type: object
      properties:
        sourceIpAddr:
          $ref: '#/components/schemas/IpAddr'
        destIpAddr:
          $ref: '#/components/schemas/IpAddr'
      required:
      - sourceIpAddr
      - destIpAddr
    Nid:
      type: string
      pattern: ^[A-Fa-f0-9]{11}$
      description: "This represents the Network Identifier, which together with a\
        \ PLMN ID is used to identify an SNPN (see 3GPP TS 23.003 and 3GPP TS 23.501\
        \ clause 5.30.2.1). \n"
    MbsSessionId:
      description: MBS Session Identifier
      type: object
      properties:
        tmgi:
          $ref: '#/components/schemas/Tmgi'
        ssm:
          $ref: '#/components/schemas/Ssm'
        nid:
          $ref: '#/components/schemas/Nid'
      anyOf:
      - required:
        - tmgi
      - required:
        - ssm
    Dnn:
      type: string
      description: 'String representing a Data Network as defined in clause 9A of
        3GPP TS 23.003;  it shall contain either a DNN Network Identifier, or a full
        DNN with both the Network  Identifier and Operator Identifier, as specified
        in 3GPP TS 23.003 clause 9.1.1 and 9.1.2. It shall be coded as string in which
        the labels are separated by dots  (e.g. "Label1.Label2.Label3").

        '
    Snssai:
      type: object
      properties:
        sst:
          type: integer
          minimum: 0
          maximum: 255
          description: "Unsigned integer, within the range 0 to 255, representing\
            \ the Slice/Service Type.  It indicates the expected Network Slice behaviour\
            \ in terms of features and services. Values 0 to 127 correspond to the\
            \ standardized SST range. Values 128 to 255 correspond  to the Operator-specific\
            \ range. See clause 28.4.2 of 3GPP TS 23.003. Standardized values are\
            \ defined in clause 5.15.2.2 of 3GPP TS 23.501. \n"
        sd:
          type: string
          pattern: ^[A-Fa-f0-9]{6}$
          description: '3-octet string, representing the Slice Differentiator, in
            hexadecimal representation. Each character in the string shall take a
            value of "0" to "9", "a" to "f" or "A" to "F" and shall represent 4 bits.
            The most significant character representing the 4 most significant bits
            of the SD shall appear first in the string, and the character representing
            the 4 least significant bit of the SD shall appear last in the string.
            This is an optional parameter that complements the Slice/Service type(s)
            to allow to  differentiate amongst multiple Network Slices of the same
            Slice/Service type. This IE shall be absent if no SD value is associated
            with the SST.

            '
      description: 'When Snssai needs to be converted to string (e.g. when used in
        maps as key), the string shall be composed of one to three digits "sst" optionally
        followed by "-" and 6 hexadecimal digits "sd".

        '
      required:
      - sst
    Uint16:
      type: integer
      minimum: 0
      maximum: 65535
      description: Integer where the allowed values correspond to the value range
        of an unsigned 16-bit integer.
    FlowDescription:
      description: Defines a packet filter of an IP flow.
      type: string
    ReservPriority:
      description: Indicates the reservation priority.
      anyOf:
      - type: string
        enum:
        - PRIO_1
        - PRIO_2
        - PRIO_3
        - PRIO_4
        - PRIO_5
        - PRIO_6
        - PRIO_7
        - PRIO_8
        - PRIO_9
        - PRIO_10
        - PRIO_11
        - PRIO_12
        - PRIO_13
        - PRIO_14
        - PRIO_15
        - PRIO_16
      - type: string
    MediaType:
      description: Indicates the media type of a media component.
      anyOf:
      - type: string
        enum:
        - AUDIO
        - VIDEO
        - DATA
        - APPLICATION
        - CONTROL
        - TEXT
        - MESSAGE
        - OTHER
      - type: string
    BitRate:
      type: string
      pattern: ^\d+(\.\d+)? (bps|Kbps|Mbps|Gbps|Tbps)$
      description: 'String representing a bit rate; the prefixes follow the standard
        symbols from The International System of Units, and represent x1000 multipliers,
        with the exception that prefix "K" is used to represent the standard symbol
        "k".

        '
    CodecData:
      description: Contains codec related information.
      type: string
    MbsMediaInfo:
      description: Represent MBS Media Information.
      type: object
      properties:
        mbsMedType:
          $ref: '#/components/schemas/MediaType'
        maxReqMbsBwDl:
          $ref: '#/components/schemas/BitRate'
        minReqMbsBwDl:
          $ref: '#/components/schemas/BitRate'
        codecs:
          type: array
          items:
            $ref: '#/components/schemas/CodecData'
          minItems: 1
          maxItems: 2
    5Qi:
      type: integer
      minimum: 0
      maximum: 255
      description: 'Unsigned integer representing a 5G QoS Identifier (see clause
        5.7.2.1 of 3GPP TS 23.501, within the range 0 to 255.

        '
    AverWindow:
      type: integer
      minimum: 1
      maximum: 4095
      default: 2000
      description: Unsigned integer indicating Averaging Window (see clause 5.7.3.6
        and 5.7.4 of 3GPP TS 23.501), expressed in milliseconds.
    ArpPriorityLevel:
      type: integer
      minimum: 1
      maximum: 15
      nullable: true
      description: "nullable true shall not be used for this attribute. Unsigned integer\
        \ indicating the ARP Priority Level (see clause 5.7.2.2 of 3GPP TS 23.501,\
        \ within the range 1 to 15.Values are ordered in decreasing order of priority,\
        \ i.e. with 1 as the highest priority and 15 as the lowest priority. \n"
    PreemptionCapability:
      anyOf:
      - type: string
        enum:
        - NOT_PREEMPT
        - MAY_PREEMPT
      - type: string
      description: 'The enumeration PreemptionCapability indicates the pre-emption
        capability of a request on other QoS flows. See clause 5.7.2.2 of 3GPP TS
        23.501. It shall comply with the provisions defined in table 5.5.3.1-1.

        '
    PreemptionVulnerability:
      anyOf:
      - type: string
        enum:
        - NOT_PREEMPTABLE
        - PREEMPTABLE
      - type: string
      description: 'The enumeration PreemptionVulnerability indicates the pre-emption
        vulnerability of the QoS flow to pre-emption from other QoS flows. See clause
        5.7.2.2 of 3GPP TS 23.501. It shall comply with the provisions defined in
        table 5.5.3.2-1

        '
    Arp:
      description: Contains Allocation and Retention Priority information.
      type: object
      properties:
        priorityLevel:
          $ref: '#/components/schemas/ArpPriorityLevel'
        preemptCap:
          $ref: '#/components/schemas/PreemptionCapability'
        preemptVuln:
          $ref: '#/components/schemas/PreemptionVulnerability'
      required:
      - priorityLevel
      - preemptCap
      - preemptVuln
    MbsQoSReq:
      description: Represent MBS QoS requirements.
      type: object
      properties:
        5qi:
          $ref: '#/components/schemas/5Qi'
        guarBitRate:
          $ref: '#/components/schemas/BitRate'
        maxBitRate:
          $ref: '#/components/schemas/BitRate'
        averWindow:
          $ref: '#/components/schemas/AverWindow'
        reqMbsArp:
          $ref: '#/components/schemas/Arp'
      required:
      - 5qi
    MbsMediaComp:
      description: Represents an MBS Media Component.
      type: object
      properties:
        mbsMedCompNum:
          type: integer
        mbsFlowDescs:
          type: array
          items:
            $ref: '#/components/schemas/FlowDescription'
          minItems: 1
        mbsSdfResPrio:
          $ref: '#/components/schemas/ReservPriority'
        mbsMediaInfo:
          $ref: '#/components/schemas/MbsMediaInfo'
        qosRef:
          type: string
        mbsQoSReq:
          $ref: '#/components/schemas/MbsQoSReq'
      required:
      - mbsMedCompNum
    NullValue:
      enum:
      - null
      description: JSON's null value.
    MbsMediaCompRm:
      description: 'This data type is defined in the same way as the MbsMediaComp
        data type, but with the OpenAPI nullable property set to true.

        '
      anyOf:
      - $ref: '#/components/schemas/MbsMediaComp'
      - $ref: '#/components/schemas/NullValue'
    AfAppId:
      description: Contains an AF application identifier.
      type: string
    MbsServiceInfo:
      description: Represent MBS Service Information.
      type: object
      properties:
        mbsMediaComps:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MbsMediaCompRm'
          minProperties: 1
        mbsSdfResPrio:
          $ref: '#/components/schemas/ReservPriority'
        afAppId:
          $ref: '#/components/schemas/AfAppId'
        mbsSessionAmbr:
          $ref: '#/components/schemas/BitRate'
      required:
      - mbsMediaComps
    SupportedFeatures:
      type: string
      pattern: ^[A-Fa-f0-9]*$
      description: "A string used to indicate the features supported by an API that\
        \ is used as defined in clause  6.6 in 3GPP TS 29.500. The string shall contain\
        \ a bitmask indicating supported features in  hexadecimal representation Each\
        \ character in the string shall take a value of \"0\" to \"9\",  \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent the support of 4 features as\
        \ described in  table\_5.2.2-3. The most significant character representing\
        \ the highest-numbered features shall  appear first in the string, and the\
        \ character representing features 1 to 4 shall appear last  in the string.\
        \ The list of features and their numbering (starting with 1) are defined \
        \ separately for each API. If the string contains a lower number of characters\
        \ than there are  defined features for an API, all features that would be\
        \ represented by characters that are not  present in the string are not supported.\n"
    schemas-FlowDescription:
      type: string
      description: Defines a packet filter for an IP flow.
    Uinteger:
      type: integer
      minimum: 0
      description: Unsigned Integer, i.e. only value 0 and integers above 0 are permissible.
    5QiPriorityLevel:
      type: integer
      minimum: 1
      maximum: 127
      description: "Unsigned integer indicating the 5QI Priority Level (see clauses\
        \ 5.7.3.3 and 5.7.4 of 3GPP TS 23.501, within the range 1 to 127.Values are\
        \ ordered in decreasing order of priority,  i.e. with 1 as the highest priority\
        \ and 127 as the lowest priority. \n"
    QosResourceType:
      anyOf:
      - type: string
        enum:
        - NON_GBR
        - NON_CRITICAL_GBR
        - CRITICAL_GBR
      - type: string
      description: "The enumeration QosResourceType indicates whether a QoS Flow is\
        \ non-GBR, delay critical GBR, or non-delay critical GBR (see clauses 5.7.3.4\
        \ and 5.7.3.5 of 3GPP TS 23.501). It shall comply with the provisions defined\
        \ in table 5.5.3.6-1. \n"
    PacketDelBudget:
      type: integer
      minimum: 1
      description: 'Unsigned integer indicating Packet Delay Budget (see clauses 5.7.3.4
        and 5.7.4 of 3GPP TS 23.501), expressed in milliseconds.

        '
    PacketErrRate:
      type: string
      pattern: ^([0-9]E-[0-9])$
      description: 'String representing Packet Error Rate (see clause 5.7.3.5 and
        5.7.4 of 3GPP TS 23.501, expressed as a "scalar x 10-k" where the scalar and
        the exponent k are each encoded as one decimal digit.

        '
    Uri:
      type: string
      description: String providing an URI formatted according to RFC 3986.
    RedirectResponse:
      description: 'The response shall include a Location header field containing
        a different URI  (pointing to a different URI of an other service instance),
        or the same URI if a request  is redirected to the same target resource via
        a different SCP.

        '
      type: object
      properties:
        cause:
          type: string
        targetScp:
          $ref: '#/components/schemas/Uri'
        targetSepp:
          $ref: '#/components/schemas/Uri'
    InvalidParam:
      type: object
      properties:
        param:
          type: string
          description: 'If the invalid parameter is an attribute in a JSON body, this
            IE shall contain the  attribute''s name and shall be encoded as a JSON
            Pointer. If the invalid parameter is  an HTTP header, this IE shall be
            formatted as the concatenation of the string "header "  plus the name
            of such header. If the invalid parameter is a query parameter, this IE  shall
            be formatted as the concatenation of the string "query " plus the name
            of such  query parameter. If the invalid parameter is a variable part
            in the path of a resource  URI, this IE shall contain the name of the
            variable, including the symbols "{" and "}"  used in OpenAPI specification
            as the notation to represent variable path segments.

            '
        reason:
          type: string
          description: 'A human-readable reason, e.g. "must be a positive integer".
            In cases involving failed  operations in a PATCH request, the reason string
            should identify the operation that  failed using the operation''s array
            index to assist in correlation of the invalid  parameter with the failed
            operation, e.g." Replacement value invalid for attribute  (failed operation
            index= 4)"

            '
      required:
      - param
      description: It contains an invalid parameter and a related description.
    AccessTokenErr:
      description: Error returned in the access token response message
      type: object
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - invalid_request
          - invalid_client
          - invalid_grant
          - unauthorized_client
          - unsupported_grant_type
          - invalid_scope
        error_description:
          type: string
        error_uri:
          type: string
    NfInstanceId:
      type: string
      format: uuid
      description: "String uniquely identifying a NF instance. The format of the NF\
        \ Instance ID shall be a  Universally Unique Identifier (UUID) version 4,\
        \ as described in IETF RFC 4122. \n"
    NFType:
      description: NF types known to NRF
      anyOf:
      - type: string
        enum:
        - NRF
        - UDM
        - AMF
        - SMF
        - AUSF
        - NEF
        - PCF
        - SMSF
        - NSSF
        - UDR
        - LMF
        - GMLC
        - 5G_EIR
        - SEPP
        - UPF
        - N3IWF
        - AF
        - UDSF
        - BSF
        - CHF
        - NWDAF
        - PCSCF
        - CBCF
        - HSS
        - UCMF
        - SOR_AF
        - SPAF
        - MME
        - SCSAS
        - SCEF
        - SCP
        - NSSAAF
        - ICSCF
        - SCSCF
        - DRA
        - IMS_AS
        - AANF
        - 5G_DDNMF
        - NSACF
        - MFAF
        - EASDF
        - DCCF
        - MB_SMF
        - TSCTSF
        - ADRF
        - GBA_BSF
        - CEF
        - MB_UPF
        - NSWOF
        - PKMF
        - MNPF
        - SMS_GMSC
        - SMS_IWMSC
        - MBSF
        - MBSTF
        - PANF
        - IP_SM_GW
        - SMS_ROUTER
      - type: string
    Fqdn:
      description: Fully Qualified Domain Name
      type: string
      pattern: ^([0-9A-Za-z]([-0-9A-Za-z]{0,61}[0-9A-Za-z])?\.)+[A-Za-z]{2,63}\.?$
      minLength: 4
      maxLength: 253
    PlmnIdNid:
      description: 'Contains the serving core network operator PLMN ID and, for an
        SNPN, the NID that together with the PLMN ID identifies the SNPN.

        '
      type: object
      required:
      - mcc
      - mnc
      properties:
        mcc:
          $ref: '#/components/schemas/Mcc'
        mnc:
          $ref: '#/components/schemas/Mnc'
        nid:
          $ref: '#/components/schemas/Nid'
    NfSetId:
      type: string
      description: "NF Set Identifier (see clause 28.12 of 3GPP TS 23.003), formatted\
        \ as the following string \"set<Set ID>.<nftype>set.5gc.mnc<MNC>.mcc<MCC>\"\
        , or  \"set<SetID>.<NFType>set.5gc.nid<NID>.mnc<MNC>.mcc<MCC>\" with  <MCC>\
        \ encoded as defined in clause 5.4.2 (\"Mcc\" data type definition)  <MNC>\
        \ encoding the Mobile Network Code part of the PLMN, comprising 3 digits.\
        \ \n  If there are only 2 significant digits in the MNC, one \"0\" digit shall\
        \ be inserted \n  at the left side to fill the 3 digits coding of MNC.  Pattern:\
        \ '^[0-9]{3}$'\n<NFType> encoded as a value defined in Table 6.1.6.3.3-1 of\
        \ 3GPP TS 29.510 but \n  with lower case characters <Set ID> encoded as a\
        \ string of characters consisting of \n  alphabetic characters (A-Z and a-z),\
        \ digits (0-9) and/or the hyphen (-) and that \n  shall end with either an\
        \ alphabetic character or a digit. \n"
    NfServiceSetId:
      type: string
      description: "NF Service Set Identifier (see clause 28.12 of 3GPP TS 23.003)\
        \ formatted as the following  string \"set<Set ID>.sn<Service Name>.nfi<NF\
        \ Instance ID>.5gc.mnc<MNC>.mcc<MCC>\", or  \"set<SetID>.sn<ServiceName>.nfi<NFInstanceID>.5gc.nid<NID>.mnc<MNC>.mcc<MCC>\"\
        \ with  <MCC> encoded as defined in clause 5.4.2 (\"Mcc\" data type definition)\
        \   <MNC> encoding the Mobile Network Code part of the PLMN, comprising 3\
        \ digits. \n  If there are only 2 significant digits in the MNC, one \"0\"\
        \ digit shall be inserted \n  at the left side to fill the 3 digits coding\
        \ of MNC.  Pattern: '^[0-9]{3}$'\n<NID> encoded as defined in clause\_5.4.2\
        \ (\"Nid\" data type definition)  <NFInstanceId> encoded as defined in clause\
        \ 5.3.2  <ServiceName> encoded as defined in 3GPP TS 29.510  <Set ID> encoded\
        \ as a string of characters consisting of alphabetic \n  characters (A-Z and\
        \ a-z), digits (0-9) and/or the hyphen (-) and that shall end \n  with either\
        \ an alphabetic character or a digit.\n"
    AccessTokenReq:
      description: Contains information related to the access token request
      type: object
      required:
      - grant_type
      - nfInstanceId
      - scope
      properties:
        grant_type:
          type: string
          enum:
          - client_credentials
        nfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        nfType:
          $ref: '#/components/schemas/NFType'
        targetNfType:
          $ref: '#/components/schemas/NFType'
        scope:
          type: string
          pattern: ^([a-zA-Z0-9_:-]+)( [a-zA-Z0-9_:-]+)*$
        targetNfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        requesterPlmn:
          $ref: '#/components/schemas/PlmnId'
        requesterPlmnList:
          type: array
          items:
            $ref: '#/components/schemas/PlmnId'
          minItems: 2
        requesterSnssaiList:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        requesterFqdn:
          $ref: '#/components/schemas/Fqdn'
        requesterSnpnList:
          type: array
          items:
            $ref: '#/components/schemas/PlmnIdNid'
          minItems: 1
        targetPlmn:
          $ref: '#/components/schemas/PlmnId'
        targetSnpn:
          $ref: '#/components/schemas/PlmnIdNid'
        targetSnssaiList:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        targetNsiList:
          type: array
          items:
            type: string
          minItems: 1
        targetNfSetId:
          $ref: '#/components/schemas/NfSetId'
        targetNfServiceSetId:
          $ref: '#/components/schemas/NfServiceSetId'
        hnrfAccessTokenUri:
          $ref: '#/components/schemas/Uri'
        sourceNfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
    ProblemDetails:
      description: Provides additional information in an error response.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/Uri'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of
            the problem.
        instance:
          $ref: '#/components/schemas/Uri'
        cause:
          type: string
          description: 'A machine-readable application error cause specific to this
            occurrence of the problem.  This IE should be present and provide application-related
            error information, if available.

            '
        invalidParams:
          type: array
          items:
            $ref: '#/components/schemas/InvalidParam'
          minItems: 1
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        accessTokenError:
          $ref: '#/components/schemas/AccessTokenErr'
        accessTokenRequest:
          $ref: '#/components/schemas/AccessTokenReq'
        nrfId:
          $ref: '#/components/schemas/Fqdn'
    AcceptableMbsServInfo:
      description: 'Contains the MBS Service Information that can be accepted by the
        PCF.

        '
      type: object
      properties:
        accMbsServInfo:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MbsMediaComp'
          minProperties: 1
        accMaxMbsBw:
          $ref: '#/components/schemas/BitRate'
      oneOf:
      - required:
        - accMbsServInfo
      - required:
        - accMaxMbsBw
    MbsExtProblemDetails:
      description: Identifies the MBS related extensions to the ProblemDetails data
        structure.
      allOf:
      - $ref: '#/components/schemas/ProblemDetails'
      - $ref: '#/components/schemas/AcceptableMbsServInfo'
  responses:
    '307':
      description: Temporary Redirect
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RedirectResponse'
      headers:
        Location:
          description: The URI pointing to the resource located on the redirect target
          required: true
          schema:
            type: string
        3gpp-Sbi-Target-Nf-Id:
          description: Identifier of target NF (service) instance towards which the
            request is redirected
          schema:
            type: string
    '308':
      description: Permanent Redirect
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RedirectResponse'
      headers:
        Location:
          description: The URI pointing to the resource located on the redirect target
          required: true
          schema:
            type: string
        3gpp-Sbi-Target-Nf-Id:
          description: '''Identifier of target NF (service) instance towards which
            the request is redirected''

            '
          schema:
            type: string
    '400':
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '401':
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '403':
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '404':
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '406':
      description: 406 Not Acceptable
    '411':
      description: Length Required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '413':
      description: Payload Too Large
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '415':
      description: Unsupported Media Type
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '429':
      description: Too Many Requests
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '500':
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '503':
      description: Service Unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    default:
      description: Generic Error
