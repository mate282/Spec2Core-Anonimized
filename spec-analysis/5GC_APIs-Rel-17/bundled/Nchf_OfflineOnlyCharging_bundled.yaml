openapi: 3.0.0
info:
  title: Nchf_OfflineOnlyCharging
  version: 1.0.2
  description: "OfflineOnlyCharging Service\n\xA9 2022, 3GPP Organizational Partners\
    \ (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC).\nAll rights reserved.\n"
servers:
- url: http://chf:8000/nchf-offlineonlycharging/v1
security:
- {}
- oAuth2ClientCredentials:
  - nchf-offlineonlycharging
externalDocs:
  description: '3GPP TS 32.291 V16.14.0: Telecommunication management; Charging management;  5G
    system, charging service; Stage 3.

    '
  url: http://www.3gpp.org/ftp/Specs/archive/32_series/32.291/
paths:
  /offlinechargingdata:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargingDataRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargingDataResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '410':
          $ref: '#/components/responses/410'
        '411':
          $ref: '#/components/responses/411'
        '413':
          $ref: '#/components/responses/413'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/default'
  /offlinechargingdata/{OfflineChargingDataRef}/update:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargingDataRequest'
      parameters:
      - name: OfflineChargingDataRef
        in: path
        description: a unique identifier for a charging data resource in a PLMN
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK. Updated Charging Data resource is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargingDataResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '410':
          $ref: '#/components/responses/410'
        '411':
          $ref: '#/components/responses/411'
        '413':
          $ref: '#/components/responses/413'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/default'
  /offlinechargingdata/{OfflineChargingDataRef}/release:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargingDataRequest'
      parameters:
      - name: OfflineChargingDataRef
        in: path
        description: a unique identifier for a charging data resource in a PLMN
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content.
        '401':
          $ref: '#/components/responses/401'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '410':
          $ref: '#/components/responses/410'
        '411':
          $ref: '#/components/responses/411'
        '413':
          $ref: '#/components/responses/413'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/default'
components:
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://nrf:8000/oauth2/token
          scopes:
            nchf-offlineonlycharging: Access to the Nchf_OfflineOnlyCharging API
  schemas:
    ChargingDataRequest:
      type: object
      properties:
        subscriberIdentifier:
          $ref: '#/components/schemas/Supi'
        nfConsumerIdentification:
          $ref: '#/components/schemas/NFIdentification'
        invocationTimeStamp:
          $ref: '#/components/schemas/DateTime'
        invocationSequenceNumber:
          $ref: '#/components/schemas/Uint32'
        retransmissionIndicator:
          type: boolean
        serviceSpecificationInfo:
          type: string
        multipleUnitUsage:
          type: array
          items:
            $ref: '#/components/schemas/MultipleUnitUsage'
          minItems: 0
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/Trigger'
          minItems: 0
        pDUSessionChargingInformation:
          $ref: '#/components/schemas/PDUSessionChargingInformation'
        roamingQBCInformation:
          $ref: '#/components/schemas/RoamingQBCInformation'
      required:
      - nfConsumerIdentification
      - invocationTimeStamp
      - invocationSequenceNumber
    ChargingDataResponse:
      type: object
      properties:
        invocationTimeStamp:
          $ref: '#/components/schemas/DateTime'
        invocationSequenceNumber:
          $ref: '#/components/schemas/Uint32'
        invocationResult:
          $ref: '#/components/schemas/InvocationResult'
        sessionFailover:
          $ref: '#/components/schemas/SessionFailover'
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/Trigger'
          minItems: 0
        pDUSessionChargingInformation:
          $ref: '#/components/schemas/PDUSessionChargingInformation'
        roamingQBCInformation:
          $ref: '#/components/schemas/RoamingQBCInformation'
      required:
      - invocationTimeStamp
      - invocationSequenceNumber
    NFIdentification:
      type: object
      properties:
        nFName:
          $ref: '#/components/schemas/NfInstanceId'
        nFIPv4Address:
          $ref: '#/components/schemas/Ipv4Addr'
        nFIPv6Address:
          $ref: '#/components/schemas/Ipv6Addr'
        nFPLMNID:
          $ref: '#/components/schemas/PlmnId'
        nodeFunctionality:
          $ref: '#/components/schemas/NodeFunctionality'
        nFFqdn:
          type: string
      required:
      - nodeFunctionality
    MultipleUnitUsage:
      type: object
      properties:
        ratingGroup:
          $ref: '#/components/schemas/Uint32'
        usedUnitContainer:
          type: array
          items:
            $ref: '#/components/schemas/UsedUnitContainer'
          minItems: 0
        uPFID:
          $ref: '#/components/schemas/NfInstanceId'
        multihomedPDUAddress:
          $ref: '#/components/schemas/PDUAddress'
      required:
      - ratingGroup
    InvocationResult:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ProblemDetails'
        failureHandling:
          $ref: '#/components/schemas/FailureHandling'
    Trigger:
      type: object
      properties:
        triggerType:
          $ref: '#/components/schemas/TriggerType'
        triggerCategory:
          $ref: '#/components/schemas/TriggerCategory'
        timeLimit:
          $ref: '#/components/schemas/DurationSec'
        volumeLimit:
          $ref: '#/components/schemas/Uint32'
        volumeLimit64:
          $ref: '#/components/schemas/Uint64'
        eventLimit:
          $ref: '#/components/schemas/Uint32'
        maxNumberOfccc:
          $ref: '#/components/schemas/Uint32'
      required:
      - triggerType
      - triggerCategory
    UsedUnitContainer:
      type: object
      properties:
        serviceId:
          $ref: '#/components/schemas/Uint32'
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/Trigger'
          minItems: 0
        triggerTimestamp:
          $ref: '#/components/schemas/DateTime'
        time:
          $ref: '#/components/schemas/Uint32'
        totalVolume:
          $ref: '#/components/schemas/Uint64'
        uplinkVolume:
          $ref: '#/components/schemas/Uint64'
        downlinkVolume:
          $ref: '#/components/schemas/Uint64'
        serviceSpecificUnits:
          $ref: '#/components/schemas/Uint64'
        eventTimeStamps:
          type: array
          items:
            $ref: '#/components/schemas/DateTime'
          minItems: 0
        localSequenceNumber:
          type: integer
        pDUContainerInformation:
          $ref: '#/components/schemas/PDUContainerInformation'
      required:
      - localSequenceNumber
    PDUSessionChargingInformation:
      type: object
      properties:
        chargingId:
          $ref: '#/components/schemas/ChargingId'
        sMFChargingId:
          type: string
        userInformation:
          $ref: '#/components/schemas/UserInformation'
        userLocationinfo:
          $ref: '#/components/schemas/UserLocation'
        mAPDUNon3GPPUserLocationInfo:
          $ref: '#/components/schemas/UserLocation'
        userLocationTime:
          $ref: '#/components/schemas/DateTime'
        presenceReportingAreaInformation:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PresenceInfo'
          minProperties: 0
        uetimeZone:
          $ref: '#/components/schemas/TimeZone'
        pduSessionInformation:
          $ref: '#/components/schemas/PDUSessionInformation'
        unitCountInactivityTimer:
          $ref: '#/components/schemas/DurationSec'
        rANSecondaryRATUsageReport:
          $ref: '#/components/schemas/RANSecondaryRATUsageReport'
      required:
      - pduSessionInformation
    UserInformation:
      type: object
      properties:
        servedGPSI:
          $ref: '#/components/schemas/Gpsi'
        servedPEI:
          $ref: '#/components/schemas/Pei'
        unauthenticatedFlag:
          type: boolean
        roamerInOut:
          $ref: '#/components/schemas/RoamerInOut'
    PDUSessionInformation:
      type: object
      properties:
        networkSlicingInfo:
          $ref: '#/components/schemas/NetworkSlicingInfo'
        pduSessionID:
          $ref: '#/components/schemas/PduSessionId'
        pduType:
          $ref: '#/components/schemas/PduSessionType'
        sscMode:
          $ref: '#/components/schemas/SscMode'
        hPlmnId:
          $ref: '#/components/schemas/PlmnId'
        servingNetworkFunctionID:
          $ref: '#/components/schemas/ServingNetworkFunctionID'
        ratType:
          $ref: '#/components/schemas/RatType'
        mAPDUNon3GPPRATType:
          $ref: '#/components/schemas/RatType'
        dnnId:
          $ref: '#/components/schemas/Dnn'
        chargingCharacteristics:
          type: string
        chargingCharacteristicsSelectionMode:
          $ref: '#/components/schemas/ChargingCharacteristicsSelectionMode'
        startTime:
          $ref: '#/components/schemas/DateTime'
        stopTime:
          $ref: '#/components/schemas/DateTime'
        3gppPSDataOffStatus:
          $ref: '#/components/schemas/3GPPPSDataOffStatus'
        sessionStopIndicator:
          type: boolean
        pduAddress:
          $ref: '#/components/schemas/PDUAddress'
        diagnostics:
          $ref: '#/components/schemas/Diagnostics'
        authorizedQoSInformation:
          $ref: '#/components/schemas/AuthorizedDefaultQos'
        subscribedQoSInformation:
          $ref: '#/components/schemas/SubscribedDefaultQos'
        authorizedSessionAMBR:
          $ref: '#/components/schemas/Ambr'
        subscribedSessionAMBR:
          $ref: '#/components/schemas/Ambr'
        servingCNPlmnId:
          $ref: '#/components/schemas/PlmnId'
        mAPDUSessionInformation:
          $ref: '#/components/schemas/MAPDUSessionInformation'
        enhancedDiagnostics:
          $ref: '#/components/schemas/EnhancedDiagnostics5G'
      required:
      - pduSessionID
      - dnnId
    PDUContainerInformation:
      type: object
      properties:
        timeofFirstUsage:
          $ref: '#/components/schemas/DateTime'
        timeofLastUsage:
          $ref: '#/components/schemas/DateTime'
        qoSInformation:
          $ref: '#/components/schemas/QosData'
        qoSCharacteristics:
          $ref: '#/components/schemas/QosCharacteristics'
        aFCorrelationInformation:
          type: string
        userLocationInformation:
          $ref: '#/components/schemas/UserLocation'
        uetimeZone:
          $ref: '#/components/schemas/TimeZone'
        rATType:
          $ref: '#/components/schemas/RatType'
        servingNodeID:
          type: array
          items:
            $ref: '#/components/schemas/ServingNetworkFunctionID'
          minItems: 0
        presenceReportingAreaInformation:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PresenceInfo'
          minProperties: 0
        3gppPSDataOffStatus:
          $ref: '#/components/schemas/3GPPPSDataOffStatus'
        sponsorIdentity:
          type: string
        applicationserviceProviderIdentity:
          type: string
        chargingRuleBaseName:
          type: string
        mAPDUSteeringFunctionality:
          $ref: '#/components/schemas/SteeringFunctionality'
        mAPDUSteeringMode:
          $ref: '#/components/schemas/SteeringMode'
    NetworkSlicingInfo:
      type: object
      properties:
        sNSSAI:
          $ref: '#/components/schemas/Snssai'
      required:
      - sNSSAI
    PDUAddress:
      type: object
      properties:
        pduIPv4Address:
          $ref: '#/components/schemas/Ipv4Addr'
        pduIPv6AddresswithPrefix:
          $ref: '#/components/schemas/Ipv6Addr'
        pduAddressprefixlength:
          type: integer
        iPv4dynamicAddressFlag:
          type: boolean
        iPv6dynamicPrefixFlag:
          type: boolean
    ServingNetworkFunctionID:
      type: object
      properties:
        servingNetworkFunctionInformation:
          $ref: '#/components/schemas/NFIdentification'
        aMFId:
          $ref: '#/components/schemas/AmfId'
      required:
      - servingNetworkFunctionInformation
    RoamingQBCInformation:
      type: object
      properties:
        multipleQFIcontainer:
          type: array
          items:
            $ref: '#/components/schemas/MultipleQFIcontainer'
          minItems: 0
        uPFID:
          $ref: '#/components/schemas/NfInstanceId'
        roamingChargingProfile:
          $ref: '#/components/schemas/RoamingChargingProfile'
    MultipleQFIcontainer:
      type: object
      properties:
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/Trigger'
          minItems: 0
        triggerTimestamp:
          $ref: '#/components/schemas/DateTime'
        time:
          $ref: '#/components/schemas/Uint32'
        totalVolume:
          $ref: '#/components/schemas/Uint64'
        uplinkVolume:
          $ref: '#/components/schemas/Uint64'
        localSequenceNumber:
          type: integer
        qFIContainerInformation:
          $ref: '#/components/schemas/QFIContainerInformation'
      required:
      - localSequenceNumber
    QFIContainerInformation:
      type: object
      properties:
        qFI:
          $ref: '#/components/schemas/Qfi'
        timeofFirstUsage:
          $ref: '#/components/schemas/DateTime'
        timeofLastUsage:
          $ref: '#/components/schemas/DateTime'
        qoSInformation:
          $ref: '#/components/schemas/QosData'
        qoSCharacteristics:
          $ref: '#/components/schemas/QosCharacteristics'
        userLocationInformation:
          $ref: '#/components/schemas/UserLocation'
        uetimeZone:
          $ref: '#/components/schemas/TimeZone'
        presenceReportingAreaInformation:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PresenceInfo'
          minProperties: 0
        rATType:
          $ref: '#/components/schemas/RatType'
        servingNetworkFunctionID:
          type: array
          items:
            $ref: '#/components/schemas/ServingNetworkFunctionID'
          minItems: 0
        3gppPSDataOffStatus:
          $ref: '#/components/schemas/3GPPPSDataOffStatus'
    RoamingChargingProfile:
      type: object
      properties:
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/Trigger'
          minItems: 0
        partialRecordMethod:
          $ref: '#/components/schemas/PartialRecordMethod'
    RANSecondaryRATUsageReport:
      type: object
      properties:
        rANSecondaryRATType:
          $ref: '#/components/schemas/RatType'
        qosFlowsUsageReports:
          type: array
          items:
            $ref: '#/components/schemas/QosFlowsUsageReport'
    Diagnostics:
      type: integer
    IPFilterRule:
      type: string
    QosFlowsUsageReport:
      type: object
      properties:
        qFI:
          $ref: '#/components/schemas/Qfi'
        startTimestamp:
          $ref: '#/components/schemas/DateTime'
        endTimestamp:
          $ref: '#/components/schemas/DateTime'
        uplinkVolume:
          $ref: '#/components/schemas/Uint64'
        downlinkVolume:
          $ref: '#/components/schemas/Uint64'
    MAPDUSessionInformation:
      type: object
      properties:
        mAPDUSessionIndicator:
          $ref: '#/components/schemas/MaPduIndication'
        aTSSSCapability:
          $ref: '#/components/schemas/AtsssCapability'
    EnhancedDiagnostics5G:
      $ref: '#/components/schemas/RanNasCauseList'
    RanNasCauseList:
      type: array
      items:
        $ref: '#/components/schemas/RanNasRelCause'
    NodeFunctionality:
      anyOf:
      - type: string
        enum:
        - SMF
        - SMSF
        - I-SMF
      - type: string
    ChargingCharacteristicsSelectionMode:
      anyOf:
      - type: string
        enum:
        - HOME_DEFAULT
        - ROAMING_DEFAULT
        - VISITING_DEFAULT
      - type: string
    TriggerType:
      anyOf:
      - type: string
        enum:
        - FINAL
        - ABNORMAL_RELEASE
        - QOS_CHANGE
        - VOLUME_LIMIT
        - TIME_LIMIT
        - EVENT_LIMIT
        - PLMN_CHANGE
        - USER_LOCATION_CHANGE
        - RAT_CHANGE
        - SESSION_AMBR_CHANGE
        - UE_TIMEZONE_CHANGE
        - TARIFF_TIME_CHANGE
        - MAX_NUMBER_OF_CHANGES_IN_CHARGING_CONDITIONS
        - MANAGEMENT_INTERVENTION
        - CHANGE_OF_UE_PRESENCE_IN_PRESENCE_REPORTING_AREA
        - CHANGE_OF_3GPP_PS_DATA_OFF_STATUS
        - SERVING_NODE_CHANGE
        - REMOVAL_OF_UPF
        - ADDITION_OF_UPF
        - INSERTION_OF_ISMF
        - REMOVAL_OF_ISMF
        - CHANGE_OF_ISMF
        - START_OF_SERVICE_DATA_FLOW
        - GFBR_GUARANTEED_STATUS_CHANGE
        - HANDOVER_CANCEL
        - HANDOVER_START
        - HANDOVER_COMPLETE
        - ADDITION_OF_ACCESS
        - REMOVAL_OF_ACCESS
        - START_OF_SDF_ADDITIONAL_ACCESS
      - type: string
    TriggerCategory:
      anyOf:
      - type: string
        enum:
        - IMMEDIATE_REPORT
        - DEFERRED_REPORT
      - type: string
    FailureHandling:
      anyOf:
      - type: string
        enum:
        - TERMINATE
        - CONTINUE
        - RETRY_AND_TERMINATE
      - type: string
    SessionFailover:
      anyOf:
      - type: string
        enum:
        - FAILOVER_NOT_SUPPORTED
        - FAILOVER_SUPPORTED
      - type: string
    3GPPPSDataOffStatus:
      anyOf:
      - type: string
        enum:
        - ACTIVE
        - INACTIVE
      - type: string
    ResultCode:
      anyOf:
      - type: string
        enum:
        - SUCCESS
        - END_USER_SERVICE_DENIED
      - type: string
    PartialRecordMethod:
      anyOf:
      - type: string
        enum:
        - DEFAULT
        - INDIVIDUAL
      - type: string
    RoamerInOut:
      anyOf:
      - type: string
        enum:
        - IN_BOUND
        - OUT_BOUND
      - type: string
    Supi:
      type: string
      pattern: ^(imsi-[0-9]{5,15}|nai-.+|gci-.+|gli-.+|.+)$
      description: "String identifying a Supi that shall contain either an IMSI, a\
        \ network specific identifier,\na Global Cable Identifier (GCI) or a Global\
        \ Line Identifier (GLI) as specified in clause \n2.2A of 3GPP TS 23.003. It\
        \ shall be formatted as follows\n - for an IMSI \"imsi-<imsi>\", where <imsi>\
        \ shall be formatted according to clause 2.2\n   of 3GPP TS 23.003 that describes\
        \ an IMSI.\n - for a network specific identifier \"nai-<nai>, where <nai>\
        \ shall be formatted\n   according to clause 28.7.2 of 3GPP TS 23.003 that\
        \ describes an NAI.\n - for a GCI \"gci-<gci>\", where <gci> shall be formatted\
        \ according to clause 28.15.2\n   of 3GPP TS 23.003.\n - for a GLI \"gli-<gli>\"\
        , where <gli> shall be formatted according to clause 28.16.2 of\n   3GPP TS\
        \ 23.003.To enable that the value is used as part of an URI, the string shall\n\
        \   only contain characters allowed according to the \"lower-with-hyphen\"\
        \ naming convention\n   defined in 3GPP TS 29.501.\n"
    NfInstanceId:
      type: string
      format: uuid
      description: "String uniquely identifying a NF instance. The format of the NF\
        \ Instance ID shall be a  Universally Unique Identifier (UUID) version 4,\
        \ as described in IETF RFC 4122. \n"
    Ipv4Addr:
      type: string
      pattern: ^(([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])$
      example: 198.51.100.1
      description: 'String identifying a IPv4 address formatted in the ''dotted decimal''
        notation as defined in RFC 1166.

        '
    Ipv6Addr:
      type: string
      allOf:
      - pattern: ^((:|(0?|([1-9a-f][0-9a-f]{0,3}))):)((0?|([1-9a-f][0-9a-f]{0,3})):){0,6}(:|(0?|([1-9a-f][0-9a-f]{0,3})))$
      - pattern: ^((([^:]+:){7}([^:]+))|((([^:]+:)*[^:]+)?::(([^:]+:)*[^:]+)?))$
      example: 2001:db8:85a3::8a2e:370:7334
      description: 'String identifying an IPv6 address formatted according to clause
        4 of RFC5952. The mixed IPv4 IPv6 notation according to clause 5 of RFC5952
        shall not be used.

        '
    Mcc:
      type: string
      pattern: ^\d{3}$
      description: "Mobile Country Code part of the PLMN, comprising 3 digits, as\
        \ defined in clause 9.3.3.5 of 3GPP TS 38.413. \n"
    Mnc:
      type: string
      pattern: ^\d{2,3}$
      description: Mobile Network Code part of the PLMN, comprising 2 or 3 digits,
        as defined in clause 9.3.3.5 of 3GPP TS 38.413.
    PlmnId:
      type: object
      properties:
        mcc:
          $ref: '#/components/schemas/Mcc'
        mnc:
          $ref: '#/components/schemas/Mnc'
      description: 'When PlmnId needs to be converted to string (e.g. when used in
        maps as key), the string  shall be composed of three digits "mcc" followed
        by "-" and two or three digits "mnc".

        '
      required:
      - mcc
      - mnc
    DateTime:
      format: date-time
      type: string
      description: string with format 'date-time' as defined in OpenAPI.
    Uint32:
      type: integer
      minimum: 0
      maximum: 4294967295
      description: 'Integer where the allowed values correspond to the value range
        of an unsigned 32-bit integer.

        '
    DurationSec:
      type: integer
      description: indicating a time in seconds.
    Uint64:
      type: integer
      minimum: 0
      maximum: 18446744073709552000
      description: 'Integer where the allowed values correspond to the value range
        of an unsigned 64-bit integer.

        '
    5Qi:
      type: integer
      minimum: 0
      maximum: 255
      description: 'Unsigned integer representing a 5G QoS Identifier (see clause
        5.7.2.1 of 3GPP TS 23.501, within the range 0 to 255.

        '
    BitRateRm:
      type: string
      pattern: ^\d+(\.\d+)? (bps|Kbps|Mbps|Gbps|Tbps)$
      nullable: true
      description: 'This data type is defined in the same way as the ''BitRate'' data
        type, but with the OpenAPI ''nullable: true'' property.

        '
    ArpPriorityLevel:
      type: integer
      minimum: 1
      maximum: 15
      nullable: true
      description: "nullable true shall not be used for this attribute. Unsigned integer\
        \ indicating the ARP Priority Level (see clause 5.7.2.2 of 3GPP TS 23.501,\
        \ within the range 1 to 15.Values are ordered in decreasing order of priority,\
        \ i.e. with 1 as the highest priority and 15 as the lowest priority. \n"
    PreemptionCapability:
      anyOf:
      - type: string
        enum:
        - NOT_PREEMPT
        - MAY_PREEMPT
      - type: string
      description: 'The enumeration PreemptionCapability indicates the pre-emption
        capability of a request on other QoS flows. See clause 5.7.2.2 of 3GPP TS
        23.501. It shall comply with the provisions defined in table 5.5.3.1-1.

        '
    PreemptionVulnerability:
      anyOf:
      - type: string
        enum:
        - NOT_PREEMPTABLE
        - PREEMPTABLE
      - type: string
      description: 'The enumeration PreemptionVulnerability indicates the pre-emption
        vulnerability of the QoS flow to pre-emption from other QoS flows. See clause
        5.7.2.2 of 3GPP TS 23.501. It shall comply with the provisions defined in
        table 5.5.3.2-1

        '
    Arp:
      description: Contains Allocation and Retention Priority information.
      type: object
      properties:
        priorityLevel:
          $ref: '#/components/schemas/ArpPriorityLevel'
        preemptCap:
          $ref: '#/components/schemas/PreemptionCapability'
        preemptVuln:
          $ref: '#/components/schemas/PreemptionVulnerability'
      required:
      - priorityLevel
      - preemptCap
      - preemptVuln
    5QiPriorityLevelRm:
      type: integer
      minimum: 1
      maximum: 127
      nullable: true
      description: 'This data type is defined in the same way as the ''5QiPriorityLevel''
        data type, but with the OpenAPI ''nullable: true'' property.

        '
    AverWindowRm:
      type: integer
      maximum: 4095
      default: 2000
      minimum: 1
      nullable: true
      description: 'This data type is defined in the same way as the ''AverWindow''
        data type, but with the OpenAPI ''nullable: true'' property.

        '
    MaxDataBurstVolRm:
      type: integer
      minimum: 1
      maximum: 4095
      nullable: true
      description: 'This data type is defined in the same way as the ''MaxDataBurstVol''
        data type, but with the OpenAPI ''nullable: true'' property.

        '
    PacketLossRateRm:
      type: integer
      minimum: 0
      maximum: 1000
      nullable: true
      description: 'This data type is defined in the same way as the ''PacketLossRate''
        data type, but with the OpenAPI ''nullable: true'' property.

        '
    ExtMaxDataBurstVolRm:
      type: integer
      minimum: 4096
      maximum: 2000000
      nullable: true
      description: 'This data type is defined in the same way as the ''ExtMaxDataBurstVol''
        data type, but with the OpenAPI ''nullable: true'' property.

        '
    PacketDelBudget:
      type: integer
      minimum: 1
      description: 'Unsigned integer indicating Packet Delay Budget (see clauses 5.7.3.4
        and 5.7.4 of 3GPP TS 23.501), expressed in milliseconds.

        '
    PacketErrRate:
      type: string
      pattern: ^([0-9]E-[0-9])$
      description: 'String representing Packet Error Rate (see clause 5.7.3.5 and
        5.7.4 of 3GPP TS 23.501, expressed as a "scalar x 10-k" where the scalar and
        the exponent k are each encoded as one decimal digit.

        '
    QosData:
      description: Contains the QoS parameters.
      type: object
      properties:
        qosId:
          type: string
          description: Univocally identifies the QoS control policy data within a
            PDU session.
        5qi:
          $ref: '#/components/schemas/5Qi'
        maxbrUl:
          $ref: '#/components/schemas/BitRateRm'
        maxbrDl:
          $ref: '#/components/schemas/BitRateRm'
        gbrUl:
          $ref: '#/components/schemas/BitRateRm'
        gbrDl:
          $ref: '#/components/schemas/BitRateRm'
        arp:
          $ref: '#/components/schemas/Arp'
        qnc:
          type: boolean
          description: 'Indicates whether notifications are requested from 3GPP NG-RAN
            when the GFBR can no longer (or again) be guaranteed for a QoS Flow during
            the lifetime of the QoS Flow.

            '
        priorityLevel:
          $ref: '#/components/schemas/5QiPriorityLevelRm'
        averWindow:
          $ref: '#/components/schemas/AverWindowRm'
        maxDataBurstVol:
          $ref: '#/components/schemas/MaxDataBurstVolRm'
        reflectiveQos:
          type: boolean
          description: Indicates whether the QoS information is reflective for the
            corresponding service data flow.
        sharingKeyDl:
          type: string
          description: Indicates, by containing the same value, what PCC rules may
            share resource in downlink direction.
        sharingKeyUl:
          type: string
          description: Indicates, by containing the same value, what PCC rules may
            share resource in uplink direction.
        maxPacketLossRateDl:
          $ref: '#/components/schemas/PacketLossRateRm'
        maxPacketLossRateUl:
          $ref: '#/components/schemas/PacketLossRateRm'
        defQosFlowIndication:
          type: boolean
          description: Indicates that the dynamic PCC rule shall always have its binding
            with the QoS Flow associated with the default QoS rule
        extMaxDataBurstVol:
          $ref: '#/components/schemas/ExtMaxDataBurstVolRm'
        packetDelayBudget:
          $ref: '#/components/schemas/PacketDelBudget'
        packetErrorRate:
          $ref: '#/components/schemas/PacketErrRate'
      required:
      - qosId
      nullable: true
    QosResourceType:
      anyOf:
      - type: string
        enum:
        - NON_GBR
        - NON_CRITICAL_GBR
        - CRITICAL_GBR
      - type: string
      description: "The enumeration QosResourceType indicates whether a QoS Flow is\
        \ non-GBR, delay critical GBR, or non-delay critical GBR (see clauses 5.7.3.4\
        \ and 5.7.3.5 of 3GPP TS 23.501). It shall comply with the provisions defined\
        \ in table 5.5.3.6-1. \n"
    5QiPriorityLevel:
      type: integer
      minimum: 1
      maximum: 127
      description: "Unsigned integer indicating the 5QI Priority Level (see clauses\
        \ 5.7.3.3 and 5.7.4 of 3GPP TS 23.501, within the range 1 to 127.Values are\
        \ ordered in decreasing order of priority,  i.e. with 1 as the highest priority\
        \ and 127 as the lowest priority. \n"
    AverWindow:
      type: integer
      minimum: 1
      maximum: 4095
      default: 2000
      description: Unsigned integer indicating Averaging Window (see clause 5.7.3.6
        and 5.7.4 of 3GPP TS 23.501), expressed in milliseconds.
    MaxDataBurstVol:
      type: integer
      minimum: 1
      maximum: 4095
      description: "Unsigned integer indicating Maximum Data Burst Volume (see clauses\
        \ 5.7.3.7 and 5.7.4 of 3GPP TS 23.501), expressed in Bytes. \n"
    ExtMaxDataBurstVol:
      type: integer
      minimum: 4096
      maximum: 2000000
      description: "Unsigned integer indicating Maximum Data Burst Volume (see clauses\
        \ 5.7.3.7 and 5.7.4 of 3GPP TS 23.501), expressed in Bytes. \n"
    QosCharacteristics:
      description: Contains QoS characteristics for a non-standardized or a non-configured
        5QI.
      type: object
      properties:
        5qi:
          $ref: '#/components/schemas/5Qi'
        resourceType:
          $ref: '#/components/schemas/QosResourceType'
        priorityLevel:
          $ref: '#/components/schemas/5QiPriorityLevel'
        packetDelayBudget:
          $ref: '#/components/schemas/PacketDelBudget'
        packetErrorRate:
          $ref: '#/components/schemas/PacketErrRate'
        averagingWindow:
          $ref: '#/components/schemas/AverWindow'
        maxDataBurstVol:
          $ref: '#/components/schemas/MaxDataBurstVol'
        extMaxDataBurstVol:
          $ref: '#/components/schemas/ExtMaxDataBurstVol'
      required:
      - 5qi
      - resourceType
      - priorityLevel
      - packetDelayBudget
      - packetErrorRate
    Tac:
      type: string
      pattern: (^[A-Fa-f0-9]{4}$)|(^[A-Fa-f0-9]{6}$)
      description: "2 or 3-octet string identifying a tracking area code as specified\
        \ in clause 9.3.3.10  of 3GPP TS 38.413, in hexadecimal representation. Each\
        \ character in the string shall  take a value of \"0\" to \"9\", \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent 4 bits. The most significant\
        \ character representing the 4 most significant bits of the TAC shall  appear\
        \ first in the string, and the character representing the 4 least significant\
        \ bit  of the TAC shall appear last in the string. \n"
    Nid:
      type: string
      pattern: ^[A-Fa-f0-9]{11}$
      description: "This represents the Network Identifier, which together with a\
        \ PLMN ID is used to identify an SNPN (see 3GPP TS 23.003 and 3GPP TS 23.501\
        \ clause 5.30.2.1). \n"
    Tai:
      description: Contains the tracking area identity as described in 3GPP 23.003
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        tac:
          $ref: '#/components/schemas/Tac'
        nid:
          $ref: '#/components/schemas/Nid'
      required:
      - plmnId
      - tac
    EutraCellId:
      type: string
      pattern: ^[A-Fa-f0-9]{7}$
      description: "28-bit string identifying an E-UTRA Cell Id as specified in clause\
        \ 9.3.1.9 of  3GPP TS 38.413, in hexadecimal representation. Each character\
        \ in the string shall take a  value of \"0\" to \"9\", \"a\" to \"f\" or \"\
        A\" to \"F\" and shall represent 4 bits. The most  significant character representing\
        \ the 4 most significant bits of the Cell Id shall appear  first in the string,\
        \ and the character representing the 4 least significant bit of the  Cell\
        \ Id shall appear last in the string. \n"
    Ecgi:
      description: Contains the ECGI (E-UTRAN Cell Global Identity), as described
        in 3GPP 23.003
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        eutraCellId:
          $ref: '#/components/schemas/EutraCellId'
        nid:
          $ref: '#/components/schemas/Nid'
      required:
      - plmnId
      - eutraCellId
    N3IwfId:
      type: string
      pattern: ^[A-Fa-f0-9]+$
      description: "This represents the identifier of the N3IWF ID as specified in\
        \ clause 9.3.1.57 of  3GPP TS 38.413 in hexadecimal representation. Each character\
        \ in the string shall take a value  of \"0\" to \"9\", \"a\" to \"f\" or \"\
        A\" to \"F\" and shall represent 4 bits. The most significant  character representing\
        \ the 4 most significant bits of the N3IWF ID shall appear first in the  string,\
        \ and the character representing the 4 least significant bit of the N3IWF\
        \ ID shall  appear last in the string. \n"
    GNbId:
      description: Provides the G-NB identifier.
      type: object
      properties:
        bitLength:
          type: integer
          minimum: 22
          maximum: 32
          description: 'Unsigned integer representing the bit length of the gNB ID
            as defined in clause 9.3.1.6 of 3GPP TS 38.413 [11], within the range
            22 to 32.

            '
        gNBValue:
          type: string
          pattern: ^[A-Fa-f0-9]{6,8}$
          description: 'This represents the identifier of the gNB. The value of the
            gNB ID shall be encoded in hexadecimal representation. Each character
            in the string shall take a value of "0" to "9", "a" to "f" or "A" to "F"
            and shall represent 4 bits. The padding 0 shall be added to make multiple
            nibbles,  the most significant character representing the padding 0 if
            required together with the 4 most significant bits of the gNB ID shall
            appear first in the string, and the character representing the 4 least
            significant bit of the gNB ID shall appear last in the string.

            '
      required:
      - bitLength
      - gNBValue
    NgeNbId:
      type: string
      pattern: ^(MacroNGeNB-[A-Fa-f0-9]{5}|LMacroNGeNB-[A-Fa-f0-9]{6}|SMacroNGeNB-[A-Fa-f0-9]{5})$
      description: "This represents the identifier of the ng-eNB ID as specified in\
        \ clause 9.3.1.8 of  3GPP TS 38.413. The value of the ng-eNB ID shall be encoded\
        \ in hexadecimal representation.  Each character in the string shall take\
        \ a value of \"0\" to \"9\", \"a\" to \"f\" or \"A\" to \"F\" and  shall represent\
        \ 4 bits. The padding 0 shall be added to make multiple nibbles, so the most\
        \  significant character representing the padding 0 if required together with\
        \ the 4 most  significant bits of the ng-eNB ID shall appear first in the\
        \ string, and the character  representing the 4 least significant bit of the\
        \ ng-eNB ID (to form a nibble) shall appear last  in the string. \n"
      example: SMacroNGeNB-34B89
    WAgfId:
      type: string
      pattern: ^[A-Fa-f0-9]+$
      description: "This represents the identifier of the W-AGF ID as specified in\
        \ clause 9.3.1.162 of  3GPP TS 38.413 in hexadecimal representation. Each\
        \ character in the string shall take a value  of \"0\" to \"9\", \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent 4 bits. The most significant\
        \  character representing the 4 most significant bits of the W-AGF ID shall\
        \ appear first in the  string, and the character representing the 4 least\
        \ significant bit of the W-AGF ID shall  appear last in the string. \n"
    TngfId:
      type: string
      pattern: ^[A-Fa-f0-9]+$
      description: "This represents the identifier of the TNGF ID as specified in\
        \ clause 9.3.1.161 of  3GPP TS 38.413  in hexadecimal representation. Each\
        \ character in the string shall take a value of \"0\" to \"9\", \"a\"  to\
        \ \"f\" or \"A\" to \"F\" and shall represent 4 bits. The most significant\
        \ character representing the  4 most significant bits of the TNGF ID shall\
        \ appear first in the string, and the character  representing the 4 least\
        \ significant bit of the TNGF ID shall appear last in the string. \n"
    ENbId:
      type: string
      pattern: ^(MacroeNB-[A-Fa-f0-9]{5}|LMacroeNB-[A-Fa-f0-9]{6}|SMacroeNB-[A-Fa-f0-9]{5}|HomeeNB-[A-Fa-f0-9]{7})$
      description: 'This represents the identifier of the eNB ID as specified in clause
        9.2.1.37 of  3GPP TS 36.413. The string shall be formatted with the following
        pattern  ''^(''MacroeNB-[A-Fa-f0-9]{5}|LMacroeNB-[A-Fa-f0-9]{6}|SMacroeNB-[A-Fa-f0-9]{5}
        |HomeeNB-[A-Fa-f0-9]{7})$''. The value of the eNB ID shall be encoded in hexadecimal
        representation. Each character in the  string shall take a value of "0" to
        "9", "a" to "f" or "A" to "F" and shall represent 4 bits.  The padding 0 shall
        be added to make multiple nibbles, so the most significant character  representing
        the padding 0 if required together with the 4 most significant bits of the
        eNB ID  shall appear first in the string, and the character representing the
        4 least significant bit  of the eNB ID (to form a nibble) shall appear last
        in the string.

        '
    GlobalRanNodeId:
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        n3IwfId:
          $ref: '#/components/schemas/N3IwfId'
        gNbId:
          $ref: '#/components/schemas/GNbId'
        ngeNbId:
          $ref: '#/components/schemas/NgeNbId'
        wagfId:
          $ref: '#/components/schemas/WAgfId'
        tngfId:
          $ref: '#/components/schemas/TngfId'
        nid:
          $ref: '#/components/schemas/Nid'
        eNbId:
          $ref: '#/components/schemas/ENbId'
      oneOf:
      - required:
        - n3IwfId
      - required:
        - gNbId
      - required:
        - ngeNbId
      - required:
        - wagfId
      - required:
        - tngfId
      - required:
        - eNbId
      description: 'One of the six attributes n3IwfId, gNbIdm, ngeNbId, wagfId, tngfId,
        eNbId shall be present.

        '
      required:
      - plmnId
    EutraLocation:
      description: Contains the E-UTRA user location.
      type: object
      properties:
        tai:
          $ref: '#/components/schemas/Tai'
        ignoreTai:
          type: boolean
          default: false
        ecgi:
          $ref: '#/components/schemas/Ecgi'
        ignoreEcgi:
          type: boolean
          default: false
          description: 'This flag when present shall indicate that the Ecgi shall
            be ignored When present, it shall be set as follows: - true: ecgi shall
            be ignored. - false (default): ecgi shall not be ignored.

            '
        ageOfLocationInformation:
          type: integer
          minimum: 0
          maximum: 32767
          description: 'The value represents the elapsed time in minutes since the
            last network contact of the mobile station.  Value "0" indicates that
            the location information was obtained after a successful paging procedure
            for Active Location Retrieval when the UE is in idle mode or after a successful
            NG-RAN location reporting procedure with the eNB when the UE is in connected
            mode.  Any other value than "0" indicates that the location information
            is the last known one.  See 3GPP TS 29.002 clause 17.7.8.

            '
        ueLocationTimestamp:
          $ref: '#/components/schemas/DateTime'
        geographicalInformation:
          type: string
          pattern: ^[0-9A-F]{16}$
          description: 'Refer to geographical Information. See 3GPP TS 23.032 clause
            7.3.2. Only the description of an ellipsoid point with uncertainty circle
            is allowed to be used.

            '
        geodeticInformation:
          type: string
          pattern: ^[0-9A-F]{20}$
          description: 'Refers to Calling Geodetic Location. See ITU-T Recommendation
            Q.763 (1999) [24] clause 3.88.2. Only the description of an ellipsoid
            point with uncertainty circle is allowed to be used.

            '
        globalNgenbId:
          $ref: '#/components/schemas/GlobalRanNodeId'
        globalENbId:
          $ref: '#/components/schemas/GlobalRanNodeId'
      required:
      - tai
      - ecgi
    NrCellId:
      type: string
      pattern: ^[A-Fa-f0-9]{9}$
      description: "36-bit string identifying an NR Cell Id as specified in clause\
        \ 9.3.1.7 of 3GPP TS 38.413,  in hexadecimal representation. Each character\
        \ in the string shall take a value of \"0\" to \"9\",  \"a\" to \"f\" or \"\
        A\" to \"F\" and shall represent 4 bits. The most significant character  representing\
        \ the 4 most significant bits of the Cell Id shall appear first in the string,\
        \ and  the character representing the 4 least significant bit of the Cell\
        \ Id shall appear last in the  string. \n"
    Ncgi:
      description: Contains the NCGI (NR Cell Global Identity), as described in 3GPP
        23.003
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        nrCellId:
          $ref: '#/components/schemas/NrCellId'
        nid:
          $ref: '#/components/schemas/Nid'
      required:
      - plmnId
      - nrCellId
    NrLocation:
      description: Contains the NR user location.
      type: object
      properties:
        tai:
          $ref: '#/components/schemas/Tai'
        ncgi:
          $ref: '#/components/schemas/Ncgi'
        ignoreNcgi:
          type: boolean
          default: false
        ageOfLocationInformation:
          type: integer
          minimum: 0
          maximum: 32767
          description: 'The value represents the elapsed time in minutes since the
            last network contact of the mobile station. Value "0" indicates that the
            location information was obtained after a successful paging procedure
            for Active Location Retrieval when the UE is in idle mode or after a successful  NG-RAN
            location reporting procedure with the eNB when the UE is in connected
            mode. Any other value than "0" indicates that the location information
            is the last known one. See 3GPP TS 29.002 clause 17.7.8.

            '
        ueLocationTimestamp:
          $ref: '#/components/schemas/DateTime'
        geographicalInformation:
          type: string
          pattern: ^[0-9A-F]{16}$
          description: 'Refer to geographical Information. See 3GPP TS 23.032 clause
            7.3.2. Only the description of an ellipsoid point with uncertainty circle
            is allowed to be used.

            '
        geodeticInformation:
          type: string
          pattern: ^[0-9A-F]{20}$
          description: 'Refers to Calling Geodetic Location. See ITU-T Recommendation
            Q.763 (1999) [24] clause 3.88.2. Only the description of an ellipsoid
            point with uncertainty circle is allowed to be used.

            '
        globalGnbId:
          $ref: '#/components/schemas/GlobalRanNodeId'
      required:
      - tai
      - ncgi
    Uinteger:
      type: integer
      minimum: 0
      description: Unsigned Integer, i.e. only value 0 and integers above 0 are permissible.
    TransportProtocol:
      anyOf:
      - type: string
        enum:
        - UDP
        - TCP
      - type: string
        description: "This string provides forward-compatibility with future extensions\
          \ to the enumeration but is not used to encode content defined in the present\
          \ version of this API. \n"
      description: "Possible values are:\n- UDP: User Datagram Protocol.\n- TCP: Transmission\
        \ Control Protocol. \n"
    Bytes:
      format: byte
      type: string
      description: string with format 'bytes' as defined in OpenAPI
    TnapId:
      description: Contain the TNAP Identifier see clause5.6.2 of 3GPP TS 23.501.
      type: object
      properties:
        ssId:
          type: string
          description: "This IE shall be present if the UE is accessing the 5GC via\
            \ a trusted WLAN access network.When present, it shall contain the SSID\
            \ of the access point to which the UE is attached, that is received over\
            \ NGAP,  see IEEE Std 802.11-2012. \n"
        bssId:
          type: string
          description: "When present, it shall contain the BSSID of the access point\
            \ to which the UE is attached, that is received over NGAP, see IEEE Std\
            \ 802.11-2012. \n"
        civicAddress:
          $ref: '#/components/schemas/Bytes'
    TwapId:
      description: 'Contain the TWAP Identifier as defined in clause 4.2.8.5.3 of
        3GPP TS 23.501 or the WLAN location information as defined in clause 4.5.7.2.8
        of 3GPP TS 23.402.

        '
      type: object
      required:
      - ssId
      properties:
        ssId:
          type: string
          description: "This IE shall contain the SSID of the access point to which\
            \ the UE is attached, that is received over NGAP, see IEEE Std 802.11-2012.\
            \ \n"
        bssId:
          type: string
          description: "When present, it shall contain the BSSID of the access point\
            \ to which the UE is attached, for trusted WLAN access, see IEEE Std 802.11-2012.\
            \ \n"
        civicAddress:
          $ref: '#/components/schemas/Bytes'
    HfcNId:
      type: string
      maxLength: 6
      description: 'This IE represents the identifier of the HFC node Id as specified
        in CableLabs WR-TR-5WWC-ARCH. It is provisioned by the wireline operator as
        part of wireline operations and may contain up to six characters.

        '
    HfcNodeId:
      description: REpresents the HFC Node Identifer received over NGAP.
      type: object
      required:
      - hfcNId
      properties:
        hfcNId:
          $ref: '#/components/schemas/HfcNId'
    LineType:
      anyOf:
      - type: string
        enum:
        - DSL
        - PON
      - type: string
        description: "This string provides forward-compatibility with future extensions\
          \ to the enumeration but is not used to encode content defined in the present\
          \ version of this API. \n"
      description: 'Possible values are:

        - DSL: Identifies a DSL line

        - PON: Identifies a PON line

        '
    Gci:
      type: string
      description: 'Global Cable Identifier uniquely identifying the connection between
        the 5G-CRG or FN-CRG to the 5GS. See clause 28.15.4 of 3GPP TS 23.003. This
        shall be encoded as a string per clause 28.15.4 of 3GPP TS 23.003, and compliant
        with the syntax specified  in clause 2.2  of IETF RFC 7542 for the username
        part of a NAI. The GCI value is specified in CableLabs WR-TR-5WWC-ARCH.

        '
    N3gaLocation:
      description: Contains the Non-3GPP access user location.
      type: object
      properties:
        n3gppTai:
          $ref: '#/components/schemas/Tai'
        n3IwfId:
          type: string
          pattern: ^[A-Fa-f0-9]+$
          description: "This IE shall contain the N3IWF identifier received over NGAP\
            \ and shall be encoded as a  string of hexadecimal characters. Each character\
            \ in the string shall take a value of \"0\"  to \"9\", \"a\" to \"f\"\
            \ or \"A\" to \"F\" and shall represent 4 bits. The most significant \
            \ character representing the 4 most significant bits of the N3IWF ID shall\
            \ appear first in  the string, and the character representing the 4 least\
            \ significant bit of the N3IWF ID  shall appear last in the string. \n"
        ueIpv4Addr:
          $ref: '#/components/schemas/Ipv4Addr'
        ueIpv6Addr:
          $ref: '#/components/schemas/Ipv6Addr'
        portNumber:
          $ref: '#/components/schemas/Uinteger'
        protocol:
          $ref: '#/components/schemas/TransportProtocol'
        tnapId:
          $ref: '#/components/schemas/TnapId'
        twapId:
          $ref: '#/components/schemas/TwapId'
        hfcNodeId:
          $ref: '#/components/schemas/HfcNodeId'
        gli:
          $ref: '#/components/schemas/Bytes'
        w5gbanLineType:
          $ref: '#/components/schemas/LineType'
        gci:
          $ref: '#/components/schemas/Gci'
    CellGlobalId:
      description: Contains a Cell Global Identification as defined in 3GPP TS 23.003,
        clause 4.3.1.
      type: object
      required:
      - plmnId
      - lac
      - cellId
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        lac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
        cellId:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
    ServiceAreaId:
      description: Contains a Service Area Identifier as defined in 3GPP TS 23.003,
        clause 12.5.
      type: object
      required:
      - plmnId
      - lac
      - sac
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        lac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
          description: Location Area Code.
        sac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
          description: Service Area Code.
    LocationAreaId:
      description: Contains a Location area identification as defined in 3GPP TS 23.003,
        clause 4.1.
      type: object
      required:
      - plmnId
      - lac
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        lac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
          description: Location Area Code.
    RoutingAreaId:
      description: Contains a Routing Area Identification as defined in 3GPP TS 23.003,
        clause 4.2.
      type: object
      required:
      - plmnId
      - lac
      - rac
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        lac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
          description: Location Area Code
        rac:
          type: string
          pattern: ^[A-Fa-f0-9]{2}$
          description: Routing Area Code
    UtraLocation:
      type: object
      oneOf:
      - required:
        - cgi
      - required:
        - sai
      - required:
        - lai
      description: Exactly one of cgi, sai or lai shall be present.
      properties:
        cgi:
          $ref: '#/components/schemas/CellGlobalId'
        sai:
          $ref: '#/components/schemas/ServiceAreaId'
        lai:
          $ref: '#/components/schemas/LocationAreaId'
        rai:
          $ref: '#/components/schemas/RoutingAreaId'
        ageOfLocationInformation:
          type: integer
          minimum: 0
          maximum: 32767
          description: "The value represents the elapsed time in minutes since the\
            \ last network contact of the mobile station.  Value \"0\" indicates that\
            \ the location information was obtained after a successful paging procedure\
            \ for  Active Location Retrieval when the UE is in idle mode\n or after\
            \ a successful location reporting procedure  the UE is in connected mode.\
            \ Any\nother value than \"0\" indicates that the location information\
            \ is the last known one.  See 3GPP TS 29.002 clause 17.7.8.\n"
        ueLocationTimestamp:
          $ref: '#/components/schemas/DateTime'
        geographicalInformation:
          type: string
          pattern: ^[0-9A-F]{16}$
          description: 'Refer to geographical Information.See 3GPP TS 23.032 clause
            7.3.2. Only the description of an ellipsoid point with uncertainty circle
            is allowed to be used.

            '
        geodeticInformation:
          type: string
          pattern: ^[0-9A-F]{20}$
          description: "Refers to Calling Geodetic Location. See ITU-T\_Recommendation\
            \ Q.763 (1999) clause 3.88.2. Only the description of an ellipsoid point\
            \ with uncertainty circle is allowed to be used.\n"
    GeraLocation:
      type: object
      oneOf:
      - required:
        - cgi
      - required:
        - sai
      - required:
        - lai
      description: Exactly one of cgi, sai or lai shall be present.
      properties:
        locationNumber:
          type: string
          description: Location number within the PLMN. See 3GPP TS 23.003, clause
            4.5.
        cgi:
          $ref: '#/components/schemas/CellGlobalId'
        sai:
          $ref: '#/components/schemas/ServiceAreaId'
        lai:
          $ref: '#/components/schemas/LocationAreaId'
        rai:
          $ref: '#/components/schemas/RoutingAreaId'
        vlrNumber:
          type: string
          description: VLR number. See 3GPP TS 23.003 clause 5.1.
        mscNumber:
          type: string
          description: MSC number. See 3GPP TS 23.003 clause 5.1.
        ageOfLocationInformation:
          type: integer
          minimum: 0
          maximum: 32767
          description: 'The value represents the elapsed time in minutes since the
            last network contact of the mobile station. Value "0" indicates that the
            location information was obtained after a successful paging procedure
            for  Active Location Retrieval when the UE is in idle mode or after a
            successful location reporting procedure the UE is in connected mode. Any
            other value than "0" indicates that the location information is the last
            known one. See 3GPP TS 29.002 clause 17.7.8.

            '
        ueLocationTimestamp:
          $ref: '#/components/schemas/DateTime'
        geographicalInformation:
          type: string
          pattern: ^[0-9A-F]{16}$
          description: 'Refer to geographical Information.See 3GPP TS 23.032 clause
            7.3.2. Only the description of an ellipsoid point with uncertainty circle
            is allowed to be used.

            '
        geodeticInformation:
          type: string
          pattern: ^[0-9A-F]{20}$
          description: 'Refers to Calling Geodetic Location.See ITU-T Recommendation
            Q.763 (1999) clause 3.88.2.  Only the description of an ellipsoid point
            with uncertainty circle is allowed to be used.

            '
    UserLocation:
      type: object
      properties:
        eutraLocation:
          $ref: '#/components/schemas/EutraLocation'
        nrLocation:
          $ref: '#/components/schemas/NrLocation'
        n3gaLocation:
          $ref: '#/components/schemas/N3gaLocation'
        utraLocation:
          $ref: '#/components/schemas/UtraLocation'
        geraLocation:
          $ref: '#/components/schemas/GeraLocation'
      description: 'At least one of eutraLocation, nrLocation and n3gaLocation shall
        be present. Several of them may be present.

        '
    TimeZone:
      type: string
      example: -08:00+1
      description: "String with format \"time-numoffset\" optionally appended by \"\
        daylightSavingTime\", where \n- \"time-numoffset\" shall represent the time\
        \ zone adjusted for daylight saving time and be\n   encoded as time-numoffset\
        \ as defined in clause\_5.6 of IETF RFC 3339; \n- \"daylightSavingTime\" shall\
        \ represent the adjustment that has been made and shall be\n   encoded as\
        \ \"+1\" or \"+2\" for a +1 or +2 hours adjustment. \n\nThe example is for\
        \ 8 hours behind UTC, +1 hour adjustment for Daylight Saving Time.\n"
    RatType:
      anyOf:
      - type: string
        enum:
        - NR
        - EUTRA
        - WLAN
        - VIRTUAL
        - NBIOT
        - WIRELINE
        - WIRELINE_CABLE
        - WIRELINE_BBF
        - LTE-M
        - NR_U
        - EUTRA_U
        - TRUSTED_N3GA
        - TRUSTED_WLAN
        - UTRA
        - GERA
        - NR_LEO
        - NR_MEO
        - NR_GEO
        - NR_OTHER_SAT
        - NR_REDCAP
        - WB_E_UTRAN_LEO
        - WB_E_UTRAN_MEO
        - WB_E_UTRAN_GEO
        - WB_E_UTRAN_OTHERSAT
        - NB_IOT_LEO
        - NB_IOT_MEO
        - NB_IOT_GEO
        - NB_IOT_OTHERSAT
        - LTE_M_LEO
        - LTE_M_MEO
        - LTE_M_GEO
        - LTE_M_OTHERSAT
      - type: string
      description: Indicates the radio access used.
    AmfId:
      type: string
      pattern: ^[A-Fa-f0-9]{6}$
      description: "String identifying the AMF ID composed of AMF Region ID (8 bits),\
        \ AMF Set ID (10 bits) and AMF  Pointer (6 bits) as specified in clause 2.10.1\
        \ of 3GPP TS 23.003. It is encoded as a string of  6 hexadecimal characters\
        \ (i.e., 24 bits). \n"
    PresenceState:
      anyOf:
      - type: string
        enum:
        - IN_AREA
        - OUT_OF_AREA
        - UNKNOWN
        - INACTIVE
      - type: string
      description: "Possible values are:\n-IN_AREA: Indicates that the UE is inside\
        \ or enters the presence reporting area.\n-OUT_OF_AREA: Indicates that the\
        \ UE is outside or leaves the presence reporting area\n-UNKNOW: Indicates\
        \ it is unknown whether the UE is in the presence reporting area or not\n\
        -INACTIVE: Indicates that the presence reporting area is inactive in the serving\
        \ node. \n"
    PresenceInfo:
      type: object
      properties:
        praId:
          type: string
          description: 'Represents an identifier of the Presence Reporting Area (see
            clause 28.10 of 3GPP  TS 23.003.  This IE shall be present  if the Area
            of Interest subscribed or reported is a Presence Reporting Area or a Set
            of Core Network predefined Presence Reporting Areas. When present, it
            shall be encoded as a string representing an integer in the following
            ranges: 0 to 8 388 607 for UE-dedicated PRA 8 388 608 to 16 777 215 for
            Core Network predefined PRA Examples: PRA ID 123 is encoded as "123" PRA
            ID 11 238 660 is encoded as "11238660"

            '
        additionalPraId:
          type: string
          description: "This IE may be present if the praId IE is present and if it\
            \ contains a PRA identifier referring to a set of Core Network predefined\
            \ Presence Reporting Areas. When present, this IE shall contain a PRA\
            \ Identifier of an individual PRA within the Set of Core Network predefined\
            \ Presence Reporting Areas indicated by the praId IE. \n"
        presenceState:
          $ref: '#/components/schemas/PresenceState'
        trackingAreaList:
          type: array
          items:
            $ref: '#/components/schemas/Tai'
          minItems: 1
          description: "Represents the list of tracking areas that constitutes the\
            \ area. This IE shall be present if the subscription or  the event report\
            \ is for tracking UE presence in the tracking areas. For non 3GPP access\
            \ the TAI shall be the N3GPP TAI. \n"
        ecgiList:
          type: array
          items:
            $ref: '#/components/schemas/Ecgi'
          minItems: 1
          description: "Represents the list of EUTRAN cell Ids that constitutes the\
            \ area. This IE shall be present if the Area of Interest subscribed is\
            \ a list of EUTRAN cell Ids. \n"
        ncgiList:
          type: array
          items:
            $ref: '#/components/schemas/Ncgi'
          minItems: 1
          description: "Represents the list of NR cell Ids that constitutes the area.\
            \ This IE shall be present if the Area of Interest subscribed is a list\
            \ of NR cell Ids. \n"
        globalRanNodeIdList:
          type: array
          items:
            $ref: '#/components/schemas/GlobalRanNodeId'
          minItems: 1
          description: "Represents the list of NG RAN node identifiers that constitutes\
            \ the area. This IE shall be present if the Area of Interest subscribed\
            \ is a list of NG RAN node identifiers. \n"
        globaleNbIdList:
          type: array
          items:
            $ref: '#/components/schemas/GlobalRanNodeId'
          minItems: 1
          description: 'Represents the list of eNodeB identifiers that constitutes
            the area. This IE shall be  present if the Area of Interest subscribed
            is a list of eNodeB identifiers.

            '
      description: 'If the additionalPraId IE is present, this IE shall state the
        presence information of the UE for the individual PRA identified by the additionalPraId
        IE;  If the additionalPraId IE is not present, this IE shall state the presence
        information of the UE for the PRA identified by the praId IE.

        '
    SteeringFunctionality:
      anyOf:
      - type: string
        enum:
        - MPTCP
        - ATSSS_LL
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: "Possible values are\n  - MPTCP: Indicates that PCF authorizes\
        \ the MPTCP functionality to support traffic steering, switching and splitting.\n\
        \  - ATSSS_LL: Indicates that PCF authorizes the ATSSS-LL functionality to\
        \ support traffic steering, switching and splitting.\n"
    SteerModeValue:
      description: Indicates the steering mode value determined by the PCF.
      anyOf:
      - type: string
        enum:
        - ACTIVE_STANDBY
        - LOAD_BALANCING
        - SMALLEST_DELAY
        - PRIORITY_BASED
      - type: string
    AccessType:
      type: string
      enum:
      - 3GPP_ACCESS
      - NON_3GPP_ACCESS
      description: Indicates whether the access is  via 3GPP or via non-3GPP.
    NullValue:
      enum:
      - null
      description: JSON's null value.
    AccessTypeRm:
      anyOf:
      - $ref: '#/components/schemas/AccessType'
      - $ref: '#/components/schemas/NullValue'
      description: 'Indicates wether the access is via 3GPP or via non-3GPP but with
        the OpenAPI  ''nullable: true'' property."

        '
    UintegerRm:
      type: integer
      minimum: 0
      description: 'Unsigned Integer, i.e. only value 0 and integers above 0 are permissible
        with the OpenAPI ''nullable: true'' property.

        '
      nullable: true
    ThresholdValue:
      description: Indicates the threshold value(s) for RTT and/or Packet Loss Rate.
      type: object
      properties:
        rttThres:
          $ref: '#/components/schemas/UintegerRm'
        plrThres:
          $ref: '#/components/schemas/PacketLossRateRm'
      nullable: true
    SteerModeIndicator:
      description: Contains Autonomous load-balance indicator or UE-assistance indicator.
      anyOf:
      - type: string
        enum:
        - AUTO_LOAD_BALANCE
        - UE_ASSISTANCE
      - type: string
    SteeringMode:
      description: Contains the steering mode value and parameters determined by the
        PCF.
      type: object
      properties:
        steerModeValue:
          $ref: '#/components/schemas/SteerModeValue'
        active:
          $ref: '#/components/schemas/AccessType'
        standby:
          $ref: '#/components/schemas/AccessTypeRm'
        3gLoad:
          $ref: '#/components/schemas/Uinteger'
        prioAcc:
          $ref: '#/components/schemas/AccessType'
        thresValue:
          $ref: '#/components/schemas/ThresholdValue'
        steerModeInd:
          $ref: '#/components/schemas/SteerModeIndicator'
      required:
      - steerModeValue
    ChargingId:
      deprecated: true
      type: integer
      minimum: 0
      maximum: 4294967295
      description: 'Integer where the allowed values correspond to the value range
        of an unsigned 32-bit integer.

        '
    Gpsi:
      type: string
      pattern: ^(msisdn-[0-9]{5,15}|extid-[^@]+@[^@]+|.+)$
      description: "String identifying a Gpsi shall contain either an External Id\
        \ or an MSISDN.  It shall be formatted as follows -External Identifier= \"\
        extid-'extid', where 'extid'  shall be formatted according to clause 19.7.2\
        \ of 3GPP TS 23.003 that describes an  External Identifier. \n"
    Pei:
      type: string
      pattern: ^(imei-[0-9]{15}|imeisv-[0-9]{16}|mac((-[0-9a-fA-F]{2}){6})(-untrusted)?|eui((-[0-9a-fA-F]{2}){8})|.+)$
      description: "String representing a Permanent Equipment Identifier that may\
        \ contain - an IMEI or IMEISV, as  specified in clause 6.2 of 3GPP TS 23.003;\
        \ a MAC address for a 5G-RG or FN-RG via  wireline  access, with an indication\
        \ that this address cannot be trusted for regulatory purpose if this  address\
        \ cannot be used as an Equipment Identifier of the FN-RG, as specified in\
        \ clause 4.7.7  of 3GPP TS23.316. Examples are imei-012345678901234 or imeisv-0123456789012345.\
        \ \n"
    Snssai:
      type: object
      properties:
        sst:
          type: integer
          minimum: 0
          maximum: 255
          description: "Unsigned integer, within the range 0 to 255, representing\
            \ the Slice/Service Type.  It indicates the expected Network Slice behaviour\
            \ in terms of features and services. Values 0 to 127 correspond to the\
            \ standardized SST range. Values 128 to 255 correspond  to the Operator-specific\
            \ range. See clause 28.4.2 of 3GPP TS 23.003. Standardized values are\
            \ defined in clause 5.15.2.2 of 3GPP TS 23.501. \n"
        sd:
          type: string
          pattern: ^[A-Fa-f0-9]{6}$
          description: '3-octet string, representing the Slice Differentiator, in
            hexadecimal representation. Each character in the string shall take a
            value of "0" to "9", "a" to "f" or "A" to "F" and shall represent 4 bits.
            The most significant character representing the 4 most significant bits
            of the SD shall appear first in the string, and the character representing
            the 4 least significant bit of the SD shall appear last in the string.
            This is an optional parameter that complements the Slice/Service type(s)
            to allow to  differentiate amongst multiple Network Slices of the same
            Slice/Service type. This IE shall be absent if no SD value is associated
            with the SST.

            '
      description: 'When Snssai needs to be converted to string (e.g. when used in
        maps as key), the string shall be composed of one to three digits "sst" optionally
        followed by "-" and 6 hexadecimal digits "sd".

        '
      required:
      - sst
    PduSessionId:
      type: integer
      minimum: 0
      maximum: 255
      description: "Unsigned integer identifying a PDU session, within the range 0\
        \ to 255, as specified in  clause 11.2.3.1b, bits 1 to 8, of 3GPP TS 24.007.\
        \ If the PDU Session ID is allocated by the  Core Network for UEs not supporting\
        \ N1 mode, reserved range 64 to 95 is used. PDU Session ID  within the reserved\
        \ range is only visible in the Core Network. \n"
    PduSessionType:
      anyOf:
      - type: string
        enum:
        - IPV4
        - IPV6
        - IPV4V6
        - UNSTRUCTURED
        - ETHERNET
      - type: string
      description: "PduSessionType indicates the type of a PDU session. It shall comply\
        \ with the provisions defined in table 5.4.3.3-1. \n"
    SscMode:
      anyOf:
      - type: string
        enum:
        - SSC_MODE_1
        - SSC_MODE_2
        - SSC_MODE_3
      - type: string
      description: "represents the service and session continuity mode It shall comply\
        \ with the provisions defined in table 5.4.3.6-1. \n"
    Dnn:
      type: string
      description: 'String representing a Data Network as defined in clause 9A of
        3GPP TS 23.003;  it shall contain either a DNN Network Identifier, or a full
        DNN with both the Network  Identifier and Operator Identifier, as specified
        in 3GPP TS 23.003 clause 9.1.1 and 9.1.2. It shall be coded as string in which
        the labels are separated by dots  (e.g. "Label1.Label2.Label3").

        '
    AuthorizedDefaultQos:
      description: Represents the Authorized Default QoS.
      type: object
      properties:
        5qi:
          $ref: '#/components/schemas/5Qi'
        arp:
          $ref: '#/components/schemas/Arp'
        priorityLevel:
          $ref: '#/components/schemas/5QiPriorityLevelRm'
        averWindow:
          $ref: '#/components/schemas/AverWindowRm'
        maxDataBurstVol:
          $ref: '#/components/schemas/MaxDataBurstVolRm'
        maxbrUl:
          $ref: '#/components/schemas/BitRateRm'
        maxbrDl:
          $ref: '#/components/schemas/BitRateRm'
        gbrUl:
          $ref: '#/components/schemas/BitRateRm'
        gbrDl:
          $ref: '#/components/schemas/BitRateRm'
        extMaxDataBurstVol:
          $ref: '#/components/schemas/ExtMaxDataBurstVolRm'
    SubscribedDefaultQos:
      type: object
      required:
      - 5qi
      - arp
      properties:
        5qi:
          $ref: '#/components/schemas/5Qi'
        arp:
          $ref: '#/components/schemas/Arp'
        priorityLevel:
          $ref: '#/components/schemas/5QiPriorityLevel'
      description: Provides the subsribed 5QI and the ARP, it may contain the priority
        level.
    BitRate:
      type: string
      pattern: ^\d+(\.\d+)? (bps|Kbps|Mbps|Gbps|Tbps)$
      description: 'String representing a bit rate; the prefixes follow the standard
        symbols from The International System of Units, and represent x1000 multipliers,
        with the exception that prefix "K" is used to represent the standard symbol
        "k".

        '
    Ambr:
      description: Contains the maximum aggregated uplink and downlink bit rates.
      type: object
      properties:
        uplink:
          $ref: '#/components/schemas/BitRate'
        downlink:
          $ref: '#/components/schemas/BitRate'
      required:
      - uplink
      - downlink
    MaPduIndication:
      description: Contains the MA PDU session indication, i.e., MA PDU Request or
        MA PDU Network-Upgrade Allowed.
      anyOf:
      - type: string
        enum:
        - MA_PDU_REQUEST
        - MA_PDU_NETWORK_UPGRADE_ALLOWED
      - type: string
    AtsssCapability:
      description: 'Containes Capability to support procedures related to Access Traffic
        Steering, Switching, Splitting.

        '
      type: object
      properties:
        atsssLL:
          type: boolean
          default: false
          description: 'Indicates the ATSSS-LL capability to support procedures related
            to Access Traffic Steering, Switching, Splitting (see clauses 4.2.10,
            5.32 of 3GPP TS 23.501). true: Supported false (default): Not Supported

            '
        mptcp:
          type: boolean
          default: false
          description: "Indicates the MPTCP capability to support procedures related\
            \ to Access Traffic Steering, Switching, Splitting (see clauses 4.2.10,\
            \ 5.32 of 3GPP\_TS\_23.501 true: Supported false (default): Not Supported\n"
        rttWithoutPmf:
          type: boolean
          default: false
          description: "This IE is only used by the UPF to indicate whether the UPF\
            \ supports RTT measurement without PMF (see clauses\_5.32.2, 6.3.3.3 of\
            \ 3GPP\_TS\_23.501 true: Supported false (default): Not Supported\n"
    NgApCause:
      description: Represents the NGAP cause.
      type: object
      properties:
        group:
          $ref: '#/components/schemas/Uinteger'
        value:
          $ref: '#/components/schemas/Uinteger'
      required:
      - group
      - value
    EpsRanNasRelCause:
      type: string
      description: Defines the EPS RAN/NAS release cause.
    RanNasRelCause:
      description: Contains the RAN/NAS release cause.
      type: object
      properties:
        ngApCause:
          $ref: '#/components/schemas/NgApCause'
        5gMmCause:
          $ref: '#/components/schemas/Uinteger'
        5gSmCause:
          $ref: '#/components/schemas/Uinteger'
        epsCause:
          $ref: '#/components/schemas/EpsRanNasRelCause'
    Qfi:
      type: integer
      minimum: 0
      maximum: 63
      description: Unsigned integer identifying a QoS flow, within the range 0 to
        63.
    Uri:
      type: string
      description: String providing an URI formatted according to RFC 3986.
    InvalidParam:
      type: object
      properties:
        param:
          type: string
          description: 'If the invalid parameter is an attribute in a JSON body, this
            IE shall contain the  attribute''s name and shall be encoded as a JSON
            Pointer. If the invalid parameter is  an HTTP header, this IE shall be
            formatted as the concatenation of the string "header "  plus the name
            of such header. If the invalid parameter is a query parameter, this IE  shall
            be formatted as the concatenation of the string "query " plus the name
            of such  query parameter. If the invalid parameter is a variable part
            in the path of a resource  URI, this IE shall contain the name of the
            variable, including the symbols "{" and "}"  used in OpenAPI specification
            as the notation to represent variable path segments.

            '
        reason:
          type: string
          description: 'A human-readable reason, e.g. "must be a positive integer".
            In cases involving failed  operations in a PATCH request, the reason string
            should identify the operation that  failed using the operation''s array
            index to assist in correlation of the invalid  parameter with the failed
            operation, e.g." Replacement value invalid for attribute  (failed operation
            index= 4)"

            '
      required:
      - param
      description: It contains an invalid parameter and a related description.
    SupportedFeatures:
      type: string
      pattern: ^[A-Fa-f0-9]*$
      description: "A string used to indicate the features supported by an API that\
        \ is used as defined in clause  6.6 in 3GPP TS 29.500. The string shall contain\
        \ a bitmask indicating supported features in  hexadecimal representation Each\
        \ character in the string shall take a value of \"0\" to \"9\",  \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent the support of 4 features as\
        \ described in  table\_5.2.2-3. The most significant character representing\
        \ the highest-numbered features shall  appear first in the string, and the\
        \ character representing features 1 to 4 shall appear last  in the string.\
        \ The list of features and their numbering (starting with 1) are defined \
        \ separately for each API. If the string contains a lower number of characters\
        \ than there are  defined features for an API, all features that would be\
        \ represented by characters that are not  present in the string are not supported.\n"
    AccessTokenErr:
      description: Error returned in the access token response message
      type: object
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - invalid_request
          - invalid_client
          - invalid_grant
          - unauthorized_client
          - unsupported_grant_type
          - invalid_scope
        error_description:
          type: string
        error_uri:
          type: string
    NFType:
      description: NF types known to NRF
      anyOf:
      - type: string
        enum:
        - NRF
        - UDM
        - AMF
        - SMF
        - AUSF
        - NEF
        - PCF
        - SMSF
        - NSSF
        - UDR
        - LMF
        - GMLC
        - 5G_EIR
        - SEPP
        - UPF
        - N3IWF
        - AF
        - UDSF
        - BSF
        - CHF
        - NWDAF
        - PCSCF
        - CBCF
        - HSS
        - UCMF
        - SOR_AF
        - SPAF
        - MME
        - SCSAS
        - SCEF
        - SCP
        - NSSAAF
        - ICSCF
        - SCSCF
        - DRA
        - IMS_AS
        - AANF
        - 5G_DDNMF
        - NSACF
        - MFAF
        - EASDF
        - DCCF
        - MB_SMF
        - TSCTSF
        - ADRF
        - GBA_BSF
        - CEF
        - MB_UPF
        - NSWOF
        - PKMF
        - MNPF
        - SMS_GMSC
        - SMS_IWMSC
        - MBSF
        - MBSTF
        - PANF
        - IP_SM_GW
        - SMS_ROUTER
      - type: string
    Fqdn:
      description: Fully Qualified Domain Name
      type: string
      pattern: ^([0-9A-Za-z]([-0-9A-Za-z]{0,61}[0-9A-Za-z])?\.)+[A-Za-z]{2,63}\.?$
      minLength: 4
      maxLength: 253
    PlmnIdNid:
      description: 'Contains the serving core network operator PLMN ID and, for an
        SNPN, the NID that together with the PLMN ID identifies the SNPN.

        '
      type: object
      required:
      - mcc
      - mnc
      properties:
        mcc:
          $ref: '#/components/schemas/Mcc'
        mnc:
          $ref: '#/components/schemas/Mnc'
        nid:
          $ref: '#/components/schemas/Nid'
    NfSetId:
      type: string
      description: "NF Set Identifier (see clause 28.12 of 3GPP TS 23.003), formatted\
        \ as the following string \"set<Set ID>.<nftype>set.5gc.mnc<MNC>.mcc<MCC>\"\
        , or  \"set<SetID>.<NFType>set.5gc.nid<NID>.mnc<MNC>.mcc<MCC>\" with  <MCC>\
        \ encoded as defined in clause 5.4.2 (\"Mcc\" data type definition)  <MNC>\
        \ encoding the Mobile Network Code part of the PLMN, comprising 3 digits.\
        \ \n  If there are only 2 significant digits in the MNC, one \"0\" digit shall\
        \ be inserted \n  at the left side to fill the 3 digits coding of MNC.  Pattern:\
        \ '^[0-9]{3}$'\n<NFType> encoded as a value defined in Table 6.1.6.3.3-1 of\
        \ 3GPP TS 29.510 but \n  with lower case characters <Set ID> encoded as a\
        \ string of characters consisting of \n  alphabetic characters (A-Z and a-z),\
        \ digits (0-9) and/or the hyphen (-) and that \n  shall end with either an\
        \ alphabetic character or a digit. \n"
    NfServiceSetId:
      type: string
      description: "NF Service Set Identifier (see clause 28.12 of 3GPP TS 23.003)\
        \ formatted as the following  string \"set<Set ID>.sn<Service Name>.nfi<NF\
        \ Instance ID>.5gc.mnc<MNC>.mcc<MCC>\", or  \"set<SetID>.sn<ServiceName>.nfi<NFInstanceID>.5gc.nid<NID>.mnc<MNC>.mcc<MCC>\"\
        \ with  <MCC> encoded as defined in clause 5.4.2 (\"Mcc\" data type definition)\
        \   <MNC> encoding the Mobile Network Code part of the PLMN, comprising 3\
        \ digits. \n  If there are only 2 significant digits in the MNC, one \"0\"\
        \ digit shall be inserted \n  at the left side to fill the 3 digits coding\
        \ of MNC.  Pattern: '^[0-9]{3}$'\n<NID> encoded as defined in clause\_5.4.2\
        \ (\"Nid\" data type definition)  <NFInstanceId> encoded as defined in clause\
        \ 5.3.2  <ServiceName> encoded as defined in 3GPP TS 29.510  <Set ID> encoded\
        \ as a string of characters consisting of alphabetic \n  characters (A-Z and\
        \ a-z), digits (0-9) and/or the hyphen (-) and that shall end \n  with either\
        \ an alphabetic character or a digit.\n"
    AccessTokenReq:
      description: Contains information related to the access token request
      type: object
      required:
      - grant_type
      - nfInstanceId
      - scope
      properties:
        grant_type:
          type: string
          enum:
          - client_credentials
        nfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        nfType:
          $ref: '#/components/schemas/NFType'
        targetNfType:
          $ref: '#/components/schemas/NFType'
        scope:
          type: string
          pattern: ^([a-zA-Z0-9_:-]+)( [a-zA-Z0-9_:-]+)*$
        targetNfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        requesterPlmn:
          $ref: '#/components/schemas/PlmnId'
        requesterPlmnList:
          type: array
          items:
            $ref: '#/components/schemas/PlmnId'
          minItems: 2
        requesterSnssaiList:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        requesterFqdn:
          $ref: '#/components/schemas/Fqdn'
        requesterSnpnList:
          type: array
          items:
            $ref: '#/components/schemas/PlmnIdNid'
          minItems: 1
        targetPlmn:
          $ref: '#/components/schemas/PlmnId'
        targetSnpn:
          $ref: '#/components/schemas/PlmnIdNid'
        targetSnssaiList:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        targetNsiList:
          type: array
          items:
            type: string
          minItems: 1
        targetNfSetId:
          $ref: '#/components/schemas/NfSetId'
        targetNfServiceSetId:
          $ref: '#/components/schemas/NfServiceSetId'
        hnrfAccessTokenUri:
          $ref: '#/components/schemas/Uri'
        sourceNfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
    ProblemDetails:
      description: Provides additional information in an error response.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/Uri'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of
            the problem.
        instance:
          $ref: '#/components/schemas/Uri'
        cause:
          type: string
          description: 'A machine-readable application error cause specific to this
            occurrence of the problem.  This IE should be present and provide application-related
            error information, if available.

            '
        invalidParams:
          type: array
          items:
            $ref: '#/components/schemas/InvalidParam'
          minItems: 1
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        accessTokenError:
          $ref: '#/components/schemas/AccessTokenErr'
        accessTokenRequest:
          $ref: '#/components/schemas/AccessTokenReq'
        nrfId:
          $ref: '#/components/schemas/Fqdn'
  responses:
    '401':
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '410':
      description: Gone
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '411':
      description: Length Required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '413':
      description: Payload Too Large
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '500':
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '503':
      description: Service Unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    default:
      description: Generic Error
