    TraceDepth:
      anyOf:
      - type: string
        enum:
        - MINIMUM
        - MEDIUM
        - MAXIMUM
        - MINIMUM_WO_VENDOR_EXTENSION
        - MEDIUM_WO_VENDOR_EXTENSION
        - MAXIMUM_WO_VENDOR_EXTENSION
      - type: string
      description: 'The enumeration TraceDepth defines how detailed information should
        be recorded in the trace. See 3GPP TS 32.422 for further description of the
        values. It shall comply with the provisions defined in table 5.6.3.1-1

        '
    TraceData:
      description: contains Trace control and configuration parameters.
      type: object
      nullable: true
      properties:
        traceRef:
          type: string
          pattern: ^[0-9]{3}[0-9]{2,3}-[A-Fa-f0-9]{6}$
          description: 'Trace Reference (see 3GPP TS 32.422).It shall be encoded as
            the concatenation of MCC, MNC and Trace ID as follows: <MCC><MNC>-<Trace
            ID> The Trace ID shall be encoded as a 3 octet string in hexadecimal representation.
            Each character in the Trace ID string shall take a value of "0" to "9",
            "a" to "f" or "A" to "F" and shall represent 4 bits. The most significant
            character representing the 4 most significant bits of the Trace ID shall
            appear first  in the string, and the character representing the 4 least
            significant bit of the Trace ID shall appear last in the string.

            '
        traceDepth:
          $ref: '#/components/schemas/TraceDepth'
        neTypeList:
          type: string
          pattern: ^[A-Fa-f0-9]+$
          description: 'List of NE Types (see 3GPP TS 32.422).It shall be encoded
            as an octet string in hexadecimal representation. Each character in the
            string shall take a value of "0" to "9", "a" to "f" or "A" to "F" and
            shall represent 4 bits. The most significant character representing the
            4 most significant bits shall Appear first in the string, and the character
            representing the 4 least significant bit shall appear last in the string.Octets
            shall be coded according to 3GPP TS 32.422.

            '
        eventList:
          type: string
          pattern: ^[A-Fa-f0-9]+$
          description: 'Triggering events (see 3GPP TS 32.422).It shall be encoded
            as an octet string in hexadecimal representation. Each character in the
            string shall take a value of "0" to "9", "a" to "f" or "A" to "F" and
            shall represent 4 bits. The most significant character representing the
            4 most significant bits shall appear first in the string, and the character
            representing the 4 least significant bit shall appear last in the string.
            Octets shall be coded according to 3GPP TS 32.422.

            '
        collectionEntityIpv4Addr:
          $ref: '#/components/schemas/Ipv4Addr'
        collectionEntityIpv6Addr:
          $ref: '#/components/schemas/Ipv6Addr'
        traceReportingConsumerUri:
          $ref: '#/components/schemas/Uri'
        interfaceList:
          type: string
          pattern: ^[A-Fa-f0-9]+$
          description: 'List of Interfaces (see 3GPP TS 32.422).It shall be encoded
            as an octet string in hexadecimal representation. Each character in the
            string shall take a value of "0" to "9", "a" to "f" or "A" to "F" and
            shall represent 4 bits. The most significant character representing the
            4 most significant bits shall appear first in the string, and the character
            representing the  4 least significant bit shall appear last in the string.
            Octets shall be coded according to 3GPP TS 32.422. If this attribute is
            not present, all the interfaces applicable to the list of NE types indicated
            in the neTypeList attribute should be traced.

            '
      required:
      - traceRef
      - traceDepth
      - neTypeList
      - eventList
    NfInstanceId:
      type: string
      format: uuid
      description: "String uniquely identifying a NF instance. The format of the NF\
        \ Instance ID shall be a  Universally Unique Identifier (UUID) version 4,\
        \ as described in IETF RFC 4122. \n"
    NwdafEvent:
      anyOf:
      - type: string
        enum:
        - SLICE_LOAD_LEVEL
        - NETWORK_PERFORMANCE
        - NF_LOAD
        - SERVICE_EXPERIENCE
        - UE_MOBILITY
        - UE_COMMUNICATION
        - QOS_SUSTAINABILITY
        - ABNORMAL_BEHAVIOUR
        - USER_DATA_CONGESTION
        - NSI_LOAD_LEVEL
        - DN_PERFORMANCE
        - DISPERSION
        - RED_TRANS_EXP
        - WLAN_PERFORMANCE
        - SM_CONGESTION
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: "Possible values are:\n- SLICE_LOAD_LEVEL: Indicates that the event\
        \ subscribed is load level information of Network Slice  \n- NETWORK_PERFORMANCE:\
        \ Indicates that the event subscribed is network performance information.\
        \  \n- NF_LOAD: Indicates that the event subscribed is load level and status\
        \ of one or several Network Functions.  \n- SERVICE_EXPERIENCE: Indicates\
        \ that the event subscribed is service experience.  \n- UE_MOBILITY: Indicates\
        \ that the event subscribed is UE mobility information.  \n- UE_COMMUNICATION:\
        \ Indicates that the event subscribed is UE communication information.  \n\
        - QOS_SUSTAINABILITY: Indicates that the event subscribed is QoS sustainability.\
        \  \n- ABNORMAL_BEHAVIOUR: Indicates that the event subscribed is abnormal\
        \ behaviour.  \n- USER_DATA_CONGESTION: Indicates that the event subscribed\
        \ is user data congestion information.  \n- NSI_LOAD_LEVEL: Indicates that\
        \ the event subscribed is load level information of Network Slice and the\
        \ optionally associated Network Slice Instance  \n- DN_PERFORMANCE: Indicates\
        \ that the event subscribed is DN performance information.  \n- DISPERSION:\
        \ Indicates that the event subscribed is dispersion information.  \n- RED_TRANS_EXP:\
        \ Indicates that the event subscribed is redundant transmission experience.\
        \  \n- WLAN_PERFORMANCE: Indicates that the event subscribed is WLAN performance.\
        \  \n- SM_CONGESTION: Indicates the Session Management Congestion Control\
        \ Experience information for specific DNN and/or S-NSSAI.\n"
    NwdafData:
      description: Indicates the list of Analytic ID(s) per NWDAF instance ID used
        for the PDU Session consumed by the SMF.
      type: object
      properties:
        nwdafInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        nwdafEvents:
          type: array
          items:
            $ref: '#/components/schemas/NwdafEvent'
          minItems: 1
      required:
      - nwdafInstanceId
    SupportedFeatures:
      type: string
      pattern: ^[A-Fa-f0-9]*$
      description: "A string used to indicate the features supported by an API that\
        \ is used as defined in clause  6.6 in 3GPP TS 29.500. The string shall contain\
        \ a bitmask indicating supported features in  hexadecimal representation Each\
        \ character in the string shall take a value of \"0\" to \"9\",  \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent the support of 4 features as\
        \ described in  table\_5.2.2-3. The most significant character representing\
        \ the highest-numbered features shall  appear first in the string, and the\
        \ character representing features 1 to 4 shall appear last  in the string.\
        \ The list of features and their numbering (starting with 1) are defined \
        \ separately for each API. If the string contains a lower number of characters\
        \ than there are  defined features for an API, all features that would be\
        \ represented by characters that are not  present in the string are not supported.\n"
    Dnn:
      type: string
      description: 'String representing a Data Network as defined in clause 9A of
        3GPP TS 23.003;  it shall contain either a DNN Network Identifier, or a full
        DNN with both the Network  Identifier and Operator Identifier, as specified
        in 3GPP TS 23.003 clause 9.1.1 and 9.1.2. It shall be coded as string in which
        the labels are separated by dots  (e.g. "Label1.Label2.Label3").

        '
    PresenceState:
      anyOf:
      - type: string
        enum:
        - IN_AREA
        - OUT_OF_AREA
        - UNKNOWN
        - INACTIVE
      - type: string
      description: "Possible values are:\n-IN_AREA: Indicates that the UE is inside\
        \ or enters the presence reporting area.\n-OUT_OF_AREA: Indicates that the\
        \ UE is outside or leaves the presence reporting area\n-UNKNOW: Indicates\
        \ it is unknown whether the UE is in the presence reporting area or not\n\
        -INACTIVE: Indicates that the presence reporting area is inactive in the serving\
        \ node. \n"
    PresenceInfo:
      type: object
      properties:
        praId:
          type: string
          description: 'Represents an identifier of the Presence Reporting Area (see
            clause 28.10 of 3GPP  TS 23.003.  This IE shall be present  if the Area
            of Interest subscribed or reported is a Presence Reporting Area or a Set
            of Core Network predefined Presence Reporting Areas. When present, it
            shall be encoded as a string representing an integer in the following
            ranges: 0 to 8 388 607 for UE-dedicated PRA 8 388 608 to 16 777 215 for
            Core Network predefined PRA Examples: PRA ID 123 is encoded as "123" PRA
            ID 11 238 660 is encoded as "11238660"

            '
        additionalPraId:
          type: string
          description: "This IE may be present if the praId IE is present and if it\
            \ contains a PRA identifier referring to a set of Core Network predefined\
            \ Presence Reporting Areas. When present, this IE shall contain a PRA\
            \ Identifier of an individual PRA within the Set of Core Network predefined\
            \ Presence Reporting Areas indicated by the praId IE. \n"
        presenceState:
          $ref: '#/components/schemas/PresenceState'
        trackingAreaList:
          type: array
          items:
            $ref: '#/components/schemas/Tai'
          minItems: 1
          description: "Represents the list of tracking areas that constitutes the\
            \ area. This IE shall be present if the subscription or  the event report\
            \ is for tracking UE presence in the tracking areas. For non 3GPP access\
            \ the TAI shall be the N3GPP TAI. \n"
        ecgiList:
          type: array
          items:
            $ref: '#/components/schemas/Ecgi'
          minItems: 1
          description: "Represents the list of EUTRAN cell Ids that constitutes the\
            \ area. This IE shall be present if the Area of Interest subscribed is\
            \ a list of EUTRAN cell Ids. \n"
        ncgiList:
          type: array
          items:
            $ref: '#/components/schemas/Ncgi'
          minItems: 1
          description: "Represents the list of NR cell Ids that constitutes the area.\
            \ This IE shall be present if the Area of Interest subscribed is a list\
            \ of NR cell Ids. \n"
        globalRanNodeIdList:
          type: array
          items:
            $ref: '#/components/schemas/GlobalRanNodeId'
          minItems: 1
          description: "Represents the list of NG RAN node identifiers that constitutes\
            \ the area. This IE shall be present if the Area of Interest subscribed\
            \ is a list of NG RAN node identifiers. \n"
        globaleNbIdList:
          type: array
          items:
            $ref: '#/components/schemas/GlobalRanNodeId'
          minItems: 1
          description: 'Represents the list of eNodeB identifiers that constitutes
            the area. This IE shall be  present if the Area of Interest subscribed
            is a list of eNodeB identifiers.

            '
      description: 'If the additionalPraId IE is present, this IE shall state the
        presence information of the UE for the individual PRA identified by the additionalPraId
        IE;  If the additionalPraId IE is not present, this IE shall state the presence
        information of the UE for the PRA identified by the praId IE.

        '
    PcfUeCallbackInfo:
      description: 'Contains the PCF for the UE information necessary for the PCF
        for the PDU session to send  SM Policy Association Establishment and Termination
        events.

        '
      type: object
      properties:
        callbackUri:
          $ref: '#/components/schemas/Uri'
        bindingInfo:
          type: string
      nullable: true
      required:
      - callbackUri
    PduSessionInfo:
      description: indicates the DNN and S-NSSAI combination of a PDU session.
      type: object
      properties:
        snssai:
          $ref: '#/components/schemas/Snssai'
        dnn:
          $ref: '#/components/schemas/Dnn'
      required:
      - dnn
      - snssai
    UintegerRm:
      type: integer
      minimum: 0
      description: 'Unsigned Integer, i.e. only value 0 and integers above 0 are permissible
        with the OpenAPI ''nullable: true'' property.

        '
      nullable: true
    InvalidParam:
      type: object
      properties:
        param:
          type: string
          description: 'If the invalid parameter is an attribute in a JSON body, this
            IE shall contain the  attribute''s name and shall be encoded as a JSON
            Pointer. If the invalid parameter is  an HTTP header, this IE shall be
            formatted as the concatenation of the string "header "  plus the name
            of such header. If the invalid parameter is a query parameter, this IE  shall
            be formatted as the concatenation of the string "query " plus the name
            of such  query parameter. If the invalid parameter is a variable part
            in the path of a resource  URI, this IE shall contain the name of the
            variable, including the symbols "{" and "}"  used in OpenAPI specification
            as the notation to represent variable path segments.

            '
        reason:
          type: string
          description: 'A human-readable reason, e.g. "must be a positive integer".
            In cases involving failed  operations in a PATCH request, the reason string
            should identify the operation that  failed using the operation''s array
            index to assist in correlation of the invalid  parameter with the failed
            operation, e.g." Replacement value invalid for attribute  (failed operation
            index= 4)"

            '
      required:
      - param
      description: It contains an invalid parameter and a related description.
    AccessTokenErr:
      description: Error returned in the access token response message
      type: object
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - invalid_request
          - invalid_client
          - invalid_grant
          - unauthorized_client
          - unsupported_grant_type
          - invalid_scope
        error_description:
          type: string
        error_uri:
          type: string
    NFType:
      description: NF types known to NRF
      anyOf:
      - type: string
        enum:
        - NRF
        - UDM
        - AMF
        - SMF
        - AUSF
        - NEF
        - PCF
        - SMSF
        - NSSF
        - UDR
        - LMF
        - GMLC
        - 5G_EIR
        - SEPP
        - UPF
        - N3IWF
        - AF
        - UDSF
        - BSF
        - CHF
        - NWDAF
        - PCSCF
        - CBCF
        - HSS
        - UCMF
        - SOR_AF
        - SPAF
        - MME
        - SCSAS
        - SCEF
        - SCP
        - NSSAAF
        - ICSCF
        - SCSCF
        - DRA
        - IMS_AS
        - AANF
        - 5G_DDNMF
        - NSACF
        - MFAF
        - EASDF
        - DCCF
        - MB_SMF
        - TSCTSF
        - ADRF
        - GBA_BSF
        - CEF
        - MB_UPF
        - NSWOF
        - PKMF
        - MNPF
        - SMS_GMSC
        - SMS_IWMSC
        - MBSF
        - MBSTF
        - PANF
        - IP_SM_GW
        - SMS_ROUTER
      - type: string
    NfSetId:
      type: string
      description: "NF Set Identifier (see clause 28.12 of 3GPP TS 23.003), formatted\
        \ as the following string \"set<Set ID>.<nftype>set.5gc.mnc<MNC>.mcc<MCC>\"\
        , or  \"set<SetID>.<NFType>set.5gc.nid<NID>.mnc<MNC>.mcc<MCC>\" with  <MCC>\
        \ encoded as defined in clause 5.4.2 (\"Mcc\" data type definition)  <MNC>\
        \ encoding the Mobile Network Code part of the PLMN, comprising 3 digits.\
        \ \n  If there are only 2 significant digits in the MNC, one \"0\" digit shall\
        \ be inserted \n  at the left side to fill the 3 digits coding of MNC.  Pattern:\
        \ '^[0-9]{3}$'\n<NFType> encoded as a value defined in Table 6.1.6.3.3-1 of\
        \ 3GPP TS 29.510 but \n  with lower case characters <Set ID> encoded as a\
        \ string of characters consisting of \n  alphabetic characters (A-Z and a-z),\
        \ digits (0-9) and/or the hyphen (-) and that \n  shall end with either an\
        \ alphabetic character or a digit. \n"
    NfServiceSetId:
      type: string
      description: "NF Service Set Identifier (see clause 28.12 of 3GPP TS 23.003)\
        \ formatted as the following  string \"set<Set ID>.sn<Service Name>.nfi<NF\
        \ Instance ID>.5gc.mnc<MNC>.mcc<MCC>\", or  \"set<SetID>.sn<ServiceName>.nfi<NFInstanceID>.5gc.nid<NID>.mnc<MNC>.mcc<MCC>\"\
        \ with  <MCC> encoded as defined in clause 5.4.2 (\"Mcc\" data type definition)\
        \   <MNC> encoding the Mobile Network Code part of the PLMN, comprising 3\
        \ digits. \n  If there are only 2 significant digits in the MNC, one \"0\"\
        \ digit shall be inserted \n  at the left side to fill the 3 digits coding\
        \ of MNC.  Pattern: '^[0-9]{3}$'\n<NID> encoded as defined in clause\_5.4.2\
        \ (\"Nid\" data type definition)  <NFInstanceId> encoded as defined in clause\
        \ 5.3.2  <ServiceName> encoded as defined in 3GPP TS 29.510  <Set ID> encoded\
        \ as a string of characters consisting of alphabetic \n  characters (A-Z and\
        \ a-z), digits (0-9) and/or the hyphen (-) and that shall end \n  with either\
        \ an alphabetic character or a digit.\n"
    AccessTokenReq:
      description: Contains information related to the access token request
      type: object
      required:
      - grant_type
      - nfInstanceId
      - scope
      properties:
        grant_type:
          type: string
          enum:
          - client_credentials
        nfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        nfType:
          $ref: '#/components/schemas/NFType'
        targetNfType:
          $ref: '#/components/schemas/NFType'
        scope:
          type: string
          pattern: ^([a-zA-Z0-9_:-]+)( [a-zA-Z0-9_:-]+)*$
        targetNfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        requesterPlmn:
          $ref: '#/components/schemas/PlmnId'
        requesterPlmnList:
          type: array
          items:
            $ref: '#/components/schemas/PlmnId'
          minItems: 2
        requesterSnssaiList:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        requesterFqdn:
          $ref: '#/components/schemas/Fqdn'
        requesterSnpnList:
          type: array
          items:
            $ref: '#/components/schemas/PlmnIdNid'
          minItems: 1
        targetPlmn:
          $ref: '#/components/schemas/PlmnId'
        targetSnpn:
          $ref: '#/components/schemas/PlmnIdNid'
        targetSnssaiList:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        targetNsiList:
          type: array
          items:
            type: string
          minItems: 1
        targetNfSetId:
          $ref: '#/components/schemas/NfSetId'
        targetNfServiceSetId:
          $ref: '#/components/schemas/NfServiceSetId'
        hnrfAccessTokenUri:
          $ref: '#/components/schemas/Uri'
        sourceNfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
    ProblemDetails:
      description: Provides additional information in an error response.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/Uri'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of
            the problem.
        instance:
          $ref: '#/components/schemas/Uri'
        cause:
          type: string
          description: 'A machine-readable application error cause specific to this
            occurrence of the problem.  This IE should be present and provide application-related
            error information, if available.

            '
        invalidParams:
          type: array
          items:
            $ref: '#/components/schemas/InvalidParam'
          minItems: 1
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        accessTokenError:
          $ref: '#/components/schemas/AccessTokenErr'
        accessTokenRequest:
          $ref: '#/components/schemas/AccessTokenReq'
        nrfId:
          $ref: '#/components/schemas/Fqdn'
    PresenceInfoRm:
      type: object
      properties:
        praId:
          type: string
          description: "Represents an identifier of the Presence Reporting Area (see\
            \ clause 28.10 of \n3GPP TS 23.003. This IE shall be present  if the Area\
            \ of Interest subscribed or\nreported is a Presence Reporting Area or\
            \ a Set of Core Network predefined Presence\nReporting Areas. When present,\
            \ it shall be encoded as a string representing an integer\nin the following\
            \ ranges:\n- 0 to 8 388 607 for UE-dedicated PRA\n- 8 388 608 to 16 777\
            \ 215 for Core Network predefined PRA\nExamples:\nPRA ID 123 is encoded\
            \ as \"123\"\nPRA ID 11 238 660 is encoded as \"11238660\"\n"
        additionalPraId:
          type: string
          description: 'This IE may be present if the praId IE is present and if it
            contains a PRA identifier referring to a set of Core Network predefined
            Presence Reporting Areas. When present, this IE shall contain a PRA Identifier
            of an individual PRA within the Set of Core Network predefined Presence
            Reporting Areas indicated by the praId IE.

            '
        presenceState:
          $ref: '#/components/schemas/PresenceState'
        trackingAreaList:
          type: array
          items:
            $ref: '#/components/schemas/Tai'
          minItems: 0
          description: 'Represents the list of tracking areas that constitutes the
            area. This IE shall be present if the subscription or the event report  is
            for tracking UE presence in the tracking areas. For non 3GPP access the
            TAI shall be the N3GPP TAI.

            '
        ecgiList:
          type: array
          items:
            $ref: '#/components/schemas/Ecgi'
          minItems: 0
          description: 'Represents the list of EUTRAN cell Ids that constitutes the
            area. This IE shall be present if the Area of Interest subscribed is a
            list of EUTRAN cell Ids.

            '
        ncgiList:
          type: array
          items:
            $ref: '#/components/schemas/Ncgi'
          minItems: 0
          description: 'Represents the list of NR cell Ids that constitutes the area.
            This IE shall be present if the Area of Interest subscribed is a list
            of NR cell Ids.

            '
        globalRanNodeIdList:
          type: array
          items:
            $ref: '#/components/schemas/GlobalRanNodeId'
          description: 'Represents the list of NG RAN node identifiers that constitutes
            the area. This IE shall be present if the Area of Interest subscribed
            is a list of NG RAN node identifiers.

            '
        globaleNbIdList:
          type: array
          items:
            $ref: '#/components/schemas/GlobalRanNodeId'
          minItems: 1
          description: 'Represents the list of eNodeB identifiers that constitutes
            the area. This IE shall be present if the Area of Interest subscribed
            is a list of eNodeB identifiers.

            '
      nullable: true
      description: "This data type is defined in the same way as the 'PresenceInfo'\
        \ data type, but with the OpenAPI 'nullable: true' property.  If the additionalPraId\
        \ IE is present, this IE shall state the presence information of the UE for\
        \ the individual PRA identified by the additionalPraId IE;  If the additionalPraId\
        \ IE is not present, this IE shall state the presence information of the UE\
        \ for the PRA identified by the praId IE. \n"
    RedirectResponse:
      description: 'The response shall include a Location header field containing
        a different URI  (pointing to a different URI of an other service instance),
        or the same URI if a request  is redirected to the same target resource via
        a different SCP.

        '
      type: object
      properties:
        cause:
          type: string
        targetScp:
          $ref: '#/components/schemas/Uri'
        targetSepp:
          $ref: '#/components/schemas/Uri'
  responses:
    '307':
      description: Temporary Redirect
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RedirectResponse'
      headers:
        Location:
          description: The URI pointing to the resource located on the redirect target
          required: true
          schema:
            type: string
        3gpp-Sbi-Target-Nf-Id:
          description: Identifier of target NF (service) instance towards which the
            request is redirected
          schema:
            type: string
    '308':
      description: Permanent Redirect
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RedirectResponse'
      headers:
        Location:
          description: The URI pointing to the resource located on the redirect target
          required: true
          schema:
            type: string
        3gpp-Sbi-Target-Nf-Id:
          description: '''Identifier of target NF (service) instance towards which
            the request is redirected''

            '
          schema:
            type: string
    '400':
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '401':
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '403':
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '404':
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '406':
      description: 406 Not Acceptable
    '411':
      description: Length Required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '413':
      description: Payload Too Large
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '415':
      description: Unsupported Media Type
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '429':
      description: Too Many Requests
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '500':
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '503':
      description: Service Unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    default:
      description: Generic Error
