openapi: 3.0.0
info:
  version: 1.2.1
  title: Npcf_AMPolicyControl
  description: "Access and Mobility Policy Control Service.  \n\xA9 2023, 3GPP Organizational\
    \ Partners (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC).  \nAll rights reserved.\n"
servers:
- url: http://pcf:8000/npcf-am-policy-control/v1
security:
- {}
- oAuth2ClientCredentials:
  - npcf-am-policy-control
externalDocs:
  description: 3GPP TS 29.507 V17.9.0; 5G System; Access and Mobility Policy Control
    Service.
  url: https://www.3gpp.org/ftp/Specs/archive/29_series/29.507/
paths:
  /policies:
    post:
      operationId: CreateIndividualAMPolicyAssociation
      summary: Create individual AM policy association.
      tags:
      - AM Policy Associations (Collection)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyAssociationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyAssociation'
          headers:
            Location:
              description: 'Contains the URI of the newly created resource, according
                to the structure {apiRoot}/npcf-am-policy-control/v1/policies/{polAssoId}

                '
              required: true
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '411':
          $ref: '#/components/responses/411'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/default'
      callbacks:
        policyUpdateNotification:
          '{$request.body#/notificationUri}/update':
            post:
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/PolicyUpdate'
              responses:
                '200':
                  description: 'OK. The current applicable values corresponding to
                    the policy control request trigger is reported

                    '
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/AmRequestedValueRep'
                '204':
                  description: No Content, Notification was successful.
                '307':
                  $ref: '#/components/responses/307'
                '308':
                  $ref: '#/components/responses/308'
                '400':
                  $ref: '#/components/responses/400'
                '401':
                  $ref: '#/components/responses/401'
                '403':
                  $ref: '#/components/responses/403'
                '404':
                  $ref: '#/components/responses/404'
                '411':
                  $ref: '#/components/responses/411'
                '413':
                  $ref: '#/components/responses/413'
                '415':
                  $ref: '#/components/responses/415'
                '429':
                  $ref: '#/components/responses/429'
                '500':
                  $ref: '#/components/responses/500'
                '503':
                  $ref: '#/components/responses/503'
                default:
                  $ref: '#/components/responses/default'
        policyAssocitionTerminationRequestNotification:
          '{$request.body#/notificationUri}/terminate':
            post:
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/TerminationNotification'
              responses:
                '204':
                  description: No Content, Notification was successful.
                '307':
                  $ref: '#/components/responses/307'
                '308':
                  $ref: '#/components/responses/308'
                '400':
                  $ref: '#/components/responses/400'
                '401':
                  $ref: '#/components/responses/401'
                '403':
                  $ref: '#/components/responses/403'
                '404':
                  $ref: '#/components/responses/404'
                '411':
                  $ref: '#/components/responses/411'
                '413':
                  $ref: '#/components/responses/413'
                '415':
                  $ref: '#/components/responses/415'
                '429':
                  $ref: '#/components/responses/429'
                '500':
                  $ref: '#/components/responses/500'
                '503':
                  $ref: '#/components/responses/503'
                default:
                  $ref: '#/components/responses/default'
  /policies/{polAssoId}:
    get:
      operationId: ReadIndividualAMPolicyAssociation
      summary: Read individual AM policy association.
      tags:
      - Individual AM Policy Association (Document)
      parameters:
      - name: polAssoId
        in: path
        description: Identifier of a policy association
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK. Resource representation is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyAssociation'
        '307':
          $ref: '#/components/responses/307'
        '308':
          $ref: '#/components/responses/308'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/default'
    delete:
      operationId: DeleteIndividualAMPolicyAssociation
      summary: Delete individual AM policy association.
      tags:
      - Individual AM Policy Association (Document)
      parameters:
      - name: polAssoId
        in: path
        description: Identifier of a policy association
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content. Resource was successfully deleted.
        '307':
          $ref: '#/components/responses/307'
        '308':
          $ref: '#/components/responses/308'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/default'
  /policies/{polAssoId}/update:
    post:
      operationId: ReportObservedEventTriggersForIndividualAMPolicyAssociation
      summary: 'Report observed event triggers and obtain updated policies for an
        individual AM policy association.

        '
      tags:
      - Individual AM Policy Association (Document)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyAssociationUpdateRequest'
      parameters:
      - name: polAssoId
        in: path
        description: Identifier of a policy association
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK. Updated policies are returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyUpdate'
        '307':
          $ref: '#/components/responses/307'
        '308':
          $ref: '#/components/responses/308'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '411':
          $ref: '#/components/responses/411'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/default'
components:
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://nrf:8000/oauth2/token
          scopes:
            npcf-am-policy-control: Access to the Npcf_AMPolicyControl API
  schemas:
    PolicyAssociation:
      description: Represents an individual AM Policy Association resource.
      type: object
      properties:
        request:
          $ref: '#/components/schemas/PolicyAssociationRequest'
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/RequestTrigger'
          minItems: 1
          description: Request Triggers that the PCF subscribes.
        servAreaRes:
          $ref: '#/components/schemas/ServiceAreaRestriction'
        wlServAreaRes:
          $ref: '#/components/schemas/WirelineServiceAreaRestriction'
        rfsp:
          $ref: '#/components/schemas/RfspIndex'
        targetRfsp:
          $ref: '#/components/schemas/RfspIndex'
        smfSelInfo:
          $ref: '#/components/schemas/SmfSelectionData'
        ueAmbr:
          $ref: '#/components/schemas/Ambr'
        ueSliceMbrs:
          type: array
          items:
            $ref: '#/components/schemas/UeSliceMbr'
          minItems: 1
          description: 'One or more UE-Slice-MBR(s) for S-NSSAI(s) of serving PLMN
            as part of the AMF Access and Mobility Policy as determined by the PCF.

            '
        pras:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PresenceInfo'
          minProperties: 1
          description: 'Contains the presence reporting area(s) for which reporting
            was requested. The praId attribute within the PresenceInfo data type is
            the key of the map.

            '
        suppFeat:
          $ref: '#/components/schemas/SupportedFeatures'
        pcfUeInfo:
          $ref: '#/components/schemas/PcfUeCallbackInfo'
        matchPdus:
          type: array
          items:
            $ref: '#/components/schemas/PduSessionInfo'
          nullable: true
        asTimeDisParam:
          $ref: '#/components/schemas/AsTimeDistributionParam'
      required:
      - suppFeat
    PolicyAssociationRequest:
      description: 'Information which the NF service consumer provides when requesting
        the creation of a policy association. The serviveName property corresponds
        to the serviceName in the main body of the specification.

        '
      type: object
      properties:
        notificationUri:
          $ref: '#/components/schemas/Uri'
        altNotifIpv4Addrs:
          type: array
          items:
            $ref: '#/components/schemas/Ipv4Addr'
          minItems: 1
          description: Alternate or backup IPv4 Address(es) where to send Notifications.
        altNotifIpv6Addrs:
          type: array
          items:
            $ref: '#/components/schemas/Ipv6Addr'
          minItems: 1
          description: Alternate or backup IPv6 Address(es) where to send Notifications.
        altNotifFqdns:
          type: array
          items:
            $ref: '#/components/schemas/Fqdn'
          minItems: 1
          description: Alternate or backup FQDN(s) where to send Notifications.
        supi:
          $ref: '#/components/schemas/Supi'
        gpsi:
          $ref: '#/components/schemas/Gpsi'
        accessType:
          $ref: '#/components/schemas/AccessType'
        accessTypes:
          type: array
          items:
            $ref: '#/components/schemas/AccessType'
          minItems: 1
        pei:
          $ref: '#/components/schemas/Pei'
        userLoc:
          $ref: '#/components/schemas/UserLocation'
        timeZone:
          $ref: '#/components/schemas/TimeZone'
        servingPlmn:
          $ref: '#/components/schemas/PlmnIdNid'
        ratType:
          $ref: '#/components/schemas/RatType'
        ratTypes:
          type: array
          items:
            $ref: '#/components/schemas/RatType'
          minItems: 1
        groupIds:
          type: array
          items:
            $ref: '#/components/schemas/GroupId'
          minItems: 1
        servAreaRes:
          $ref: '#/components/schemas/ServiceAreaRestriction'
        wlServAreaRes:
          $ref: '#/components/schemas/WirelineServiceAreaRestriction'
        rfsp:
          $ref: '#/components/schemas/RfspIndex'
        ueAmbr:
          $ref: '#/components/schemas/Ambr'
        ueSliceMbrs:
          type: array
          items:
            $ref: '#/components/schemas/UeSliceMbr'
          minItems: 1
          description: 'The subscribed UE Slice-MBR for each subscribed S-NSSAI of
            the home PLMN mapping  to a S-NSSAI of the serving PLMN Shall be provided
            when available.

            '
        allowedSnssais:
          description: array of allowed S-NSSAIs for the 3GPP access.
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        targetSnssais:
          description: array of target S-NSSAIs.
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        mappingSnssais:
          description: "mapping of each S-NSSAI of the Allowed NSSAI to the corresponding\
            \ S-NSSAI of the HPLMN. \n"
          type: array
          items:
            $ref: '#/components/schemas/MappingOfSnssai'
          minItems: 1
        n3gAllowedSnssais:
          description: array of allowed S-NSSAIs for the Non-3GPP access.
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        guami:
          $ref: '#/components/schemas/Guami'
        serviveName:
          $ref: '#/components/schemas/ServiceName'
        traceReq:
          $ref: '#/components/schemas/TraceData'
        nwdafDatas:
          type: array
          items:
            $ref: '#/components/schemas/NwdafData'
          minItems: 1
        suppFeat:
          $ref: '#/components/schemas/SupportedFeatures'
      required:
      - notificationUri
      - suppFeat
      - supi
    PolicyAssociationUpdateRequest:
      description: 'Represents information that the NF service consumer provides when
        requesting the update of a policy association.

        '
      type: object
      properties:
        notificationUri:
          $ref: '#/components/schemas/Uri'
        altNotifIpv4Addrs:
          type: array
          items:
            $ref: '#/components/schemas/Ipv4Addr'
          minItems: 1
          description: Alternate or backup IPv4 Address(es) where to send Notifications.
        altNotifIpv6Addrs:
          type: array
          items:
            $ref: '#/components/schemas/Ipv6Addr'
          minItems: 1
          description: Alternate or backup IPv6 Address(es) where to send Notifications.
        altNotifFqdns:
          type: array
          items:
            $ref: '#/components/schemas/Fqdn'
          minItems: 1
          description: Alternate or backup FQDN(s) where to send Notifications.
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/RequestTrigger'
          minItems: 1
          description: Request Triggers that the NF service consumer observes.
        servAreaRes:
          $ref: '#/components/schemas/ServiceAreaRestriction'
        wlServAreaRes:
          $ref: '#/components/schemas/WirelineServiceAreaRestriction'
        rfsp:
          $ref: '#/components/schemas/RfspIndex'
        smfSelInfo:
          $ref: '#/components/schemas/SmfSelectionData'
        ueAmbr:
          $ref: '#/components/schemas/Ambr'
        ueSliceMbrs:
          type: array
          items:
            $ref: '#/components/schemas/UeSliceMbr'
          minItems: 1
          description: 'The subscribed UE-Slice-MBR for each subscribed S-NSSAI of
            the home PLMN mapping to a S-NSSAI of the serving PLMN Shall be provided
            for the "UE_SLICE_MBR_CH" policy control request trigger.

            '
        praStatuses:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PresenceInfo'
          minProperties: 1
          description: 'Contains the UE presence status for tracking area for which
            changes of the UE presence occurred. The praId attribute within the PresenceInfo
            data type is the key of the map.

            '
        userLoc:
          $ref: '#/components/schemas/UserLocation'
        allowedSnssais:
          description: array of allowed S-NSSAIs for the 3GPP access.
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        targetSnssais:
          description: array of target S-NSSAIs.
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        mappingSnssais:
          description: "mapping of each S-NSSAI of the Allowed NSSAI to the corresponding\
            \ S-NSSAI of the HPLMN. \n"
          type: array
          items:
            $ref: '#/components/schemas/MappingOfSnssai'
          minItems: 1
        accessTypes:
          type: array
          items:
            $ref: '#/components/schemas/AccessType'
          minItems: 1
        ratTypes:
          type: array
          items:
            $ref: '#/components/schemas/RatType'
          minItems: 1
        n3gAllowedSnssais:
          description: array of allowed S-NSSAIs for the Non-3GPP access.
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        traceReq:
          $ref: '#/components/schemas/TraceData'
        guami:
          $ref: '#/components/schemas/Guami'
        nwdafDatas:
          type: array
          items:
            $ref: '#/components/schemas/NwdafData'
          minItems: 1
          nullable: true
    PolicyUpdate:
      description: 'Represents updated policies that the PCF provides in a notification
        or in a reply to an Update Request.

        '
      type: object
      properties:
        resourceUri:
          $ref: '#/components/schemas/Uri'
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/RequestTrigger'
          minItems: 1
          nullable: true
          description: Request Triggers that the PCF subscribes.
        servAreaRes:
          $ref: '#/components/schemas/ServiceAreaRestriction'
        wlServAreaRes:
          $ref: '#/components/schemas/WirelineServiceAreaRestriction'
        rfsp:
          $ref: '#/components/schemas/RfspIndex'
        targetRfsp:
          $ref: '#/components/schemas/RfspIndex'
        smfSelInfo:
          $ref: '#/components/schemas/SmfSelectionData'
        ueAmbr:
          $ref: '#/components/schemas/Ambr'
        ueSliceMbrs:
          type: array
          items:
            $ref: '#/components/schemas/UeSliceMbr'
          minItems: 1
          description: 'One or more UE-Slice-MBR(s) for S-NSSAI(s) of serving PLMN
            the allowed NSSAI as part of the AMF Access and Mobility Policy as determined
            by the PCF.

            '
        pras:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PresenceInfoRm'
          description: 'Contains the presence reporting area(s) for which reporting
            was requested. The praId attribute within the PresenceInfo data type is
            the key of the map.

            '
          minProperties: 1
          nullable: true
        pcfUeInfo:
          $ref: '#/components/schemas/PcfUeCallbackInfo'
        matchPdus:
          type: array
          items:
            $ref: '#/components/schemas/PduSessionInfo'
          nullable: true
        asTimeDisParam:
          $ref: '#/components/schemas/AsTimeDistributionParam'
      required:
      - resourceUri
    TerminationNotification:
      description: 'Represents a request to terminate a policy Association that the
        PCF provides in a notification.

        '
      type: object
      properties:
        resourceUri:
          $ref: '#/components/schemas/Uri'
        cause:
          $ref: '#/components/schemas/PolicyAssociationReleaseCause'
      required:
      - resourceUri
      - cause
    SmfSelectionData:
      description: Represents the SMF Selection information that may be replaced by
        the PCF.
      type: object
      properties:
        unsuppDnn:
          type: boolean
        candidates:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CandidateForReplacement'
          minProperties: 1
          description: 'Contains the list of DNNs per S-NSSAI that are candidates
            for replacement. The snssai attribute within the CandidateForReplacement
            data type is the key of the map.

            '
          nullable: true
        snssai:
          $ref: '#/components/schemas/Snssai'
        mappingSnssai:
          $ref: '#/components/schemas/Snssai'
        dnn:
          $ref: '#/components/schemas/Dnn'
      nullable: true
    CandidateForReplacement:
      description: Represents a list of candidate DNNs for replacement for an S-NSSAI.
      type: object
      properties:
        snssai:
          $ref: '#/components/schemas/Snssai'
        dnns:
          type: array
          items:
            $ref: '#/components/schemas/Dnn'
          minItems: 1
          nullable: true
      required:
      - snssai
      nullable: true
    AmRequestedValueRep:
      description: 'Represents the current applicable values corresponding to the
        policy control request triggers.

        '
      type: object
      properties:
        userLoc:
          $ref: '#/components/schemas/UserLocation'
        praStatuses:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PresenceInfo'
          minProperties: 1
          description: 'Contains the UE presence statuses for tracking areas. The
            praId attribute within the PresenceInfo data type is the key of the map.

            '
        accessTypes:
          type: array
          items:
            $ref: '#/components/schemas/AccessType'
          minItems: 1
        ratTypes:
          type: array
          items:
            $ref: '#/components/schemas/RatType'
        allowedSnssais:
          description: array of allowed S-NSSAIs for the 3GPP access.
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
        n3gAllowedSnssais:
          description: array of allowed S-NSSAIs for the Non-3GPP access.
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
    AsTimeDistributionParam:
      description: Contains the 5G acess stratum time distribution parameters.
      type: object
      properties:
        asTimeDistInd:
          type: boolean
        uuErrorBudget:
          $ref: '#/components/schemas/UintegerRm'
      nullable: true
    UeSliceMbr:
      description: Contains a UE-Slice-MBR and the related information.
      type: object
      properties:
        sliceMbr:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SliceMbr'
          minProperties: 1
          description: Contains the MBR for uplink and the MBR for downlink.
        servingSnssai:
          $ref: '#/components/schemas/Snssai'
        mappedHomeSnssai:
          $ref: '#/components/schemas/Snssai'
      required:
      - sliceMbr
      - servingSnssai
      nullable: true
    RequestTrigger:
      anyOf:
      - type: string
        enum:
        - LOC_CH
        - PRA_CH
        - SERV_AREA_CH
        - RFSP_CH
        - ALLOWED_NSSAI_CH
        - UE_AMBR_CH
        - UE_SLICE_MBR_CH
        - SMF_SELECT_CH
        - ACCESS_TYPE_CH
        - NWDAF_DATA_CH
        - TARGET_NSSAI
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: "Possible values are:\n- LOC_CH: Location change (tracking area).\
        \ The tracking area of the UE has changed.\n- PRA_CH: Change of UE presence\
        \ in PRA. The AMF reports the current presence status\n  of the UE in a Presence\
        \ Reporting Area, and notifies that the UE enters/leaves the\n  Presence Reporting\
        \ Area.\n- SERV_AREA_CH: Service Area Restriction change. The UDM notifies\
        \ the AMF that the\n  subscribed service area restriction information has\
        \ changed.\n- RFSP_CH: RFSP index change. The UDM notifies the AMF that the\
        \ subscribed RFSP index has\n  changed.\n- ALLOWED_NSSAI_CH: Allowed NSSAI\
        \ change. The AMF notifies that the set of UE allowed\n  S-NSSAIs has changed.\n\
        - UE_AMBR_CH: UE-AMBR change. The UDM notifies the AMF that the subscribed\
        \ UE-AMBR has\n  changed.\n- SMF_SELECT_CH: SMF selection information change.\
        \ The UE requested for an unsupported\n  DNN or UE requested for a DNN within\
        \ the list of DNN candidates for replacement per\n  S-NSSAI.\n- ACCESS_TYPE_CH:\
        \ Access Type change. The AMF notifies that the access type and the RAT\n\
        \  type combinations available in the AMF for a UE with simultaneous 3GPP\
        \ and non-3GPP\n  connectivity has changed. \n- UE_SLICE_MBR_CH: UE-Slice-MBR\
        \ change. The NF service consumer notifies any changes \n  in the subscribed\
        \ UE-Slice-MBR for each subscribed S-NSSAI of the home PLMN mapping \n  to\
        \ a S-NSSAI of the serving PLMN.\n- NWDAF_DATA_CH: NDWAF DATA CHANGE. The\
        \ AMF notifies that the NWDAF instance IDs used\n  for the UE and/or associated\
        \ Analytics IDs used for the UE and available in the AMF\n  have changed.\n\
        - TARGET_NSSAI: Generation of Target NSSAI. The NF service consumer notifies\
        \ that the\n  Target NSSAI was generated.\n"
    PolicyAssociationReleaseCause:
      anyOf:
      - type: string
        enum:
        - UNSPECIFIED
        - UE_SUBSCRIPTION
        - INSUFFICIENT_RES
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: "Possible values are:\n- UNSPECIFIED: This value is used for unspecified\
        \ reasons.\n- UE_SUBSCRIPTION: This value is used to indicate that the session\
        \ needs to be\n  terminated because the subscription of UE has changed (e.g.\
        \ was removed).\n- INSUFFICIENT_RES: This value is used to indicate that the\
        \ server is overloaded and\n  needs to abort the session.\n"
    Uri:
      type: string
      description: String providing an URI formatted according to RFC 3986.
    Ipv4Addr:
      type: string
      pattern: ^(([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])$
      example: 198.51.100.1
      description: 'String identifying a IPv4 address formatted in the ''dotted decimal''
        notation as defined in RFC 1166.

        '
    Ipv6Addr:
      type: string
      allOf:
      - pattern: ^((:|(0?|([1-9a-f][0-9a-f]{0,3}))):)((0?|([1-9a-f][0-9a-f]{0,3})):){0,6}(:|(0?|([1-9a-f][0-9a-f]{0,3})))$
      - pattern: ^((([^:]+:){7}([^:]+))|((([^:]+:)*[^:]+)?::(([^:]+:)*[^:]+)?))$
      example: 2001:db8:85a3::8a2e:370:7334
      description: 'String identifying an IPv6 address formatted according to clause
        4 of RFC5952. The mixed IPv4 IPv6 notation according to clause 5 of RFC5952
        shall not be used.

        '
    Fqdn:
      description: Fully Qualified Domain Name
      type: string
      pattern: ^([0-9A-Za-z]([-0-9A-Za-z]{0,61}[0-9A-Za-z])?\.)+[A-Za-z]{2,63}\.?$
      minLength: 4
      maxLength: 253
    Supi:
      type: string
      pattern: ^(imsi-[0-9]{5,15}|nai-.+|gci-.+|gli-.+|.+)$
      description: "String identifying a Supi that shall contain either an IMSI, a\
        \ network specific identifier,\na Global Cable Identifier (GCI) or a Global\
        \ Line Identifier (GLI) as specified in clause \n2.2A of 3GPP TS 23.003. It\
        \ shall be formatted as follows\n - for an IMSI \"imsi-<imsi>\", where <imsi>\
        \ shall be formatted according to clause 2.2\n   of 3GPP TS 23.003 that describes\
        \ an IMSI.\n - for a network specific identifier \"nai-<nai>, where <nai>\
        \ shall be formatted\n   according to clause 28.7.2 of 3GPP TS 23.003 that\
        \ describes an NAI.\n - for a GCI \"gci-<gci>\", where <gci> shall be formatted\
        \ according to clause 28.15.2\n   of 3GPP TS 23.003.\n - for a GLI \"gli-<gli>\"\
        , where <gli> shall be formatted according to clause 28.16.2 of\n   3GPP TS\
        \ 23.003.To enable that the value is used as part of an URI, the string shall\n\
        \   only contain characters allowed according to the \"lower-with-hyphen\"\
        \ naming convention\n   defined in 3GPP TS 29.501.\n"
    Gpsi:
      type: string
      pattern: ^(msisdn-[0-9]{5,15}|extid-[^@]+@[^@]+|.+)$
      description: "String identifying a Gpsi shall contain either an External Id\
        \ or an MSISDN.  It shall be formatted as follows -External Identifier= \"\
        extid-'extid', where 'extid'  shall be formatted according to clause 19.7.2\
        \ of 3GPP TS 23.003 that describes an  External Identifier. \n"
    AccessType:
      type: string
      enum:
      - 3GPP_ACCESS
      - NON_3GPP_ACCESS
      description: Indicates whether the access is  via 3GPP or via non-3GPP.
    Pei:
      type: string
      pattern: ^(imei-[0-9]{15}|imeisv-[0-9]{16}|mac((-[0-9a-fA-F]{2}){6})(-untrusted)?|eui((-[0-9a-fA-F]{2}){8})|.+)$
      description: "String representing a Permanent Equipment Identifier that may\
        \ contain - an IMEI or IMEISV, as  specified in clause 6.2 of 3GPP TS 23.003;\
        \ a MAC address for a 5G-RG or FN-RG via  wireline  access, with an indication\
        \ that this address cannot be trusted for regulatory purpose if this  address\
        \ cannot be used as an Equipment Identifier of the FN-RG, as specified in\
        \ clause 4.7.7  of 3GPP TS23.316. Examples are imei-012345678901234 or imeisv-0123456789012345.\
        \ \n"
    Mcc:
      type: string
      pattern: ^\d{3}$
      description: "Mobile Country Code part of the PLMN, comprising 3 digits, as\
        \ defined in clause 9.3.3.5 of 3GPP TS 38.413. \n"
    Mnc:
      type: string
      pattern: ^\d{2,3}$
      description: Mobile Network Code part of the PLMN, comprising 2 or 3 digits,
        as defined in clause 9.3.3.5 of 3GPP TS 38.413.
    PlmnId:
      type: object
      properties:
        mcc:
          $ref: '#/components/schemas/Mcc'
        mnc:
          $ref: '#/components/schemas/Mnc'
      description: 'When PlmnId needs to be converted to string (e.g. when used in
        maps as key), the string  shall be composed of three digits "mcc" followed
        by "-" and two or three digits "mnc".

        '
      required:
      - mcc
      - mnc
    Tac:
      type: string
      pattern: (^[A-Fa-f0-9]{4}$)|(^[A-Fa-f0-9]{6}$)
      description: "2 or 3-octet string identifying a tracking area code as specified\
        \ in clause 9.3.3.10  of 3GPP TS 38.413, in hexadecimal representation. Each\
        \ character in the string shall  take a value of \"0\" to \"9\", \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent 4 bits. The most significant\
        \ character representing the 4 most significant bits of the TAC shall  appear\
        \ first in the string, and the character representing the 4 least significant\
        \ bit  of the TAC shall appear last in the string. \n"
    Nid:
      type: string
      pattern: ^[A-Fa-f0-9]{11}$
      description: "This represents the Network Identifier, which together with a\
        \ PLMN ID is used to identify an SNPN (see 3GPP TS 23.003 and 3GPP TS 23.501\
        \ clause 5.30.2.1). \n"
    Tai:
      description: Contains the tracking area identity as described in 3GPP 23.003
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        tac:
          $ref: '#/components/schemas/Tac'
        nid:
          $ref: '#/components/schemas/Nid'
      required:
      - plmnId
      - tac
    EutraCellId:
      type: string
      pattern: ^[A-Fa-f0-9]{7}$
      description: "28-bit string identifying an E-UTRA Cell Id as specified in clause\
        \ 9.3.1.9 of  3GPP TS 38.413, in hexadecimal representation. Each character\
        \ in the string shall take a  value of \"0\" to \"9\", \"a\" to \"f\" or \"\
        A\" to \"F\" and shall represent 4 bits. The most  significant character representing\
        \ the 4 most significant bits of the Cell Id shall appear  first in the string,\
        \ and the character representing the 4 least significant bit of the  Cell\
        \ Id shall appear last in the string. \n"
    Ecgi:
      description: Contains the ECGI (E-UTRAN Cell Global Identity), as described
        in 3GPP 23.003
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        eutraCellId:
          $ref: '#/components/schemas/EutraCellId'
        nid:
          $ref: '#/components/schemas/Nid'
      required:
      - plmnId
      - eutraCellId
    DateTime:
      format: date-time
      type: string
      description: string with format 'date-time' as defined in OpenAPI.
    N3IwfId:
      type: string
      pattern: ^[A-Fa-f0-9]+$
      description: "This represents the identifier of the N3IWF ID as specified in\
        \ clause 9.3.1.57 of  3GPP TS 38.413 in hexadecimal representation. Each character\
        \ in the string shall take a value  of \"0\" to \"9\", \"a\" to \"f\" or \"\
        A\" to \"F\" and shall represent 4 bits. The most significant  character representing\
        \ the 4 most significant bits of the N3IWF ID shall appear first in the  string,\
        \ and the character representing the 4 least significant bit of the N3IWF\
        \ ID shall  appear last in the string. \n"
    GNbId:
      description: Provides the G-NB identifier.
      type: object
      properties:
        bitLength:
          type: integer
          minimum: 22
          maximum: 32
          description: 'Unsigned integer representing the bit length of the gNB ID
            as defined in clause 9.3.1.6 of 3GPP TS 38.413 [11], within the range
            22 to 32.

            '
        gNBValue:
          type: string
          pattern: ^[A-Fa-f0-9]{6,8}$
          description: 'This represents the identifier of the gNB. The value of the
            gNB ID shall be encoded in hexadecimal representation. Each character
            in the string shall take a value of "0" to "9", "a" to "f" or "A" to "F"
            and shall represent 4 bits. The padding 0 shall be added to make multiple
            nibbles,  the most significant character representing the padding 0 if
            required together with the 4 most significant bits of the gNB ID shall
            appear first in the string, and the character representing the 4 least
            significant bit of the gNB ID shall appear last in the string.

            '
      required:
      - bitLength
      - gNBValue
    NgeNbId:
      type: string
      pattern: ^(MacroNGeNB-[A-Fa-f0-9]{5}|LMacroNGeNB-[A-Fa-f0-9]{6}|SMacroNGeNB-[A-Fa-f0-9]{5})$
      description: "This represents the identifier of the ng-eNB ID as specified in\
        \ clause 9.3.1.8 of  3GPP TS 38.413. The value of the ng-eNB ID shall be encoded\
        \ in hexadecimal representation.  Each character in the string shall take\
        \ a value of \"0\" to \"9\", \"a\" to \"f\" or \"A\" to \"F\" and  shall represent\
        \ 4 bits. The padding 0 shall be added to make multiple nibbles, so the most\
        \  significant character representing the padding 0 if required together with\
        \ the 4 most  significant bits of the ng-eNB ID shall appear first in the\
        \ string, and the character  representing the 4 least significant bit of the\
        \ ng-eNB ID (to form a nibble) shall appear last  in the string. \n"
      example: SMacroNGeNB-34B89
    WAgfId:
      type: string
      pattern: ^[A-Fa-f0-9]+$
      description: "This represents the identifier of the W-AGF ID as specified in\
        \ clause 9.3.1.162 of  3GPP TS 38.413 in hexadecimal representation. Each\
        \ character in the string shall take a value  of \"0\" to \"9\", \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent 4 bits. The most significant\
        \  character representing the 4 most significant bits of the W-AGF ID shall\
        \ appear first in the  string, and the character representing the 4 least\
        \ significant bit of the W-AGF ID shall  appear last in the string. \n"
    TngfId:
      type: string
      pattern: ^[A-Fa-f0-9]+$
      description: "This represents the identifier of the TNGF ID as specified in\
        \ clause 9.3.1.161 of  3GPP TS 38.413  in hexadecimal representation. Each\
        \ character in the string shall take a value of \"0\" to \"9\", \"a\"  to\
        \ \"f\" or \"A\" to \"F\" and shall represent 4 bits. The most significant\
        \ character representing the  4 most significant bits of the TNGF ID shall\
        \ appear first in the string, and the character  representing the 4 least\
        \ significant bit of the TNGF ID shall appear last in the string. \n"
    ENbId:
      type: string
      pattern: ^(MacroeNB-[A-Fa-f0-9]{5}|LMacroeNB-[A-Fa-f0-9]{6}|SMacroeNB-[A-Fa-f0-9]{5}|HomeeNB-[A-Fa-f0-9]{7})$
      description: 'This represents the identifier of the eNB ID as specified in clause
        9.2.1.37 of  3GPP TS 36.413. The string shall be formatted with the following
        pattern  ''^(''MacroeNB-[A-Fa-f0-9]{5}|LMacroeNB-[A-Fa-f0-9]{6}|SMacroeNB-[A-Fa-f0-9]{5}
        |HomeeNB-[A-Fa-f0-9]{7})$''. The value of the eNB ID shall be encoded in hexadecimal
        representation. Each character in the  string shall take a value of "0" to
        "9", "a" to "f" or "A" to "F" and shall represent 4 bits.  The padding 0 shall
        be added to make multiple nibbles, so the most significant character  representing
        the padding 0 if required together with the 4 most significant bits of the
        eNB ID  shall appear first in the string, and the character representing the
        4 least significant bit  of the eNB ID (to form a nibble) shall appear last
        in the string.

        '
    GlobalRanNodeId:
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        n3IwfId:
          $ref: '#/components/schemas/N3IwfId'
        gNbId:
          $ref: '#/components/schemas/GNbId'
        ngeNbId:
          $ref: '#/components/schemas/NgeNbId'
        wagfId:
          $ref: '#/components/schemas/WAgfId'
        tngfId:
          $ref: '#/components/schemas/TngfId'
        nid:
          $ref: '#/components/schemas/Nid'
        eNbId:
          $ref: '#/components/schemas/ENbId'
      oneOf:
      - required:
        - n3IwfId
      - required:
        - gNbId
      - required:
        - ngeNbId
      - required:
        - wagfId
      - required:
        - tngfId
      - required:
        - eNbId
      description: 'One of the six attributes n3IwfId, gNbIdm, ngeNbId, wagfId, tngfId,
        eNbId shall be present.

        '
      required:
      - plmnId
    EutraLocation:
      description: Contains the E-UTRA user location.
      type: object
      properties:
        tai:
          $ref: '#/components/schemas/Tai'
        ignoreTai:
          type: boolean
          default: false
        ecgi:
          $ref: '#/components/schemas/Ecgi'
        ignoreEcgi:
          type: boolean
          default: false
          description: 'This flag when present shall indicate that the Ecgi shall
            be ignored When present, it shall be set as follows: - true: ecgi shall
            be ignored. - false (default): ecgi shall not be ignored.

            '
        ageOfLocationInformation:
          type: integer
          minimum: 0
          maximum: 32767
          description: 'The value represents the elapsed time in minutes since the
            last network contact of the mobile station.  Value "0" indicates that
            the location information was obtained after a successful paging procedure
            for Active Location Retrieval when the UE is in idle mode or after a successful
            NG-RAN location reporting procedure with the eNB when the UE is in connected
            mode.  Any other value than "0" indicates that the location information
            is the last known one.  See 3GPP TS 29.002 clause 17.7.8.

            '
        ueLocationTimestamp:
          $ref: '#/components/schemas/DateTime'
        geographicalInformation:
          type: string
          pattern: ^[0-9A-F]{16}$
          description: 'Refer to geographical Information. See 3GPP TS 23.032 clause
            7.3.2. Only the description of an ellipsoid point with uncertainty circle
            is allowed to be used.

            '
        geodeticInformation:
          type: string
          pattern: ^[0-9A-F]{20}$
          description: 'Refers to Calling Geodetic Location. See ITU-T Recommendation
            Q.763 (1999) [24] clause 3.88.2. Only the description of an ellipsoid
            point with uncertainty circle is allowed to be used.

            '
        globalNgenbId:
          $ref: '#/components/schemas/GlobalRanNodeId'
        globalENbId:
          $ref: '#/components/schemas/GlobalRanNodeId'
      required:
      - tai
      - ecgi
    NrCellId:
      type: string
      pattern: ^[A-Fa-f0-9]{9}$
      description: "36-bit string identifying an NR Cell Id as specified in clause\
        \ 9.3.1.7 of 3GPP TS 38.413,  in hexadecimal representation. Each character\
        \ in the string shall take a value of \"0\" to \"9\",  \"a\" to \"f\" or \"\
        A\" to \"F\" and shall represent 4 bits. The most significant character  representing\
        \ the 4 most significant bits of the Cell Id shall appear first in the string,\
        \ and  the character representing the 4 least significant bit of the Cell\
        \ Id shall appear last in the  string. \n"
    Ncgi:
      description: Contains the NCGI (NR Cell Global Identity), as described in 3GPP
        23.003
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        nrCellId:
          $ref: '#/components/schemas/NrCellId'
        nid:
          $ref: '#/components/schemas/Nid'
      required:
      - plmnId
      - nrCellId
    NrLocation:
      description: Contains the NR user location.
      type: object
      properties:
        tai:
          $ref: '#/components/schemas/Tai'
        ncgi:
          $ref: '#/components/schemas/Ncgi'
        ignoreNcgi:
          type: boolean
          default: false
        ageOfLocationInformation:
          type: integer
          minimum: 0
          maximum: 32767
          description: 'The value represents the elapsed time in minutes since the
            last network contact of the mobile station. Value "0" indicates that the
            location information was obtained after a successful paging procedure
            for Active Location Retrieval when the UE is in idle mode or after a successful  NG-RAN
            location reporting procedure with the eNB when the UE is in connected
            mode. Any other value than "0" indicates that the location information
            is the last known one. See 3GPP TS 29.002 clause 17.7.8.

            '
        ueLocationTimestamp:
          $ref: '#/components/schemas/DateTime'
        geographicalInformation:
          type: string
          pattern: ^[0-9A-F]{16}$
          description: 'Refer to geographical Information. See 3GPP TS 23.032 clause
            7.3.2. Only the description of an ellipsoid point with uncertainty circle
            is allowed to be used.

            '
        geodeticInformation:
          type: string
          pattern: ^[0-9A-F]{20}$
          description: 'Refers to Calling Geodetic Location. See ITU-T Recommendation
            Q.763 (1999) [24] clause 3.88.2. Only the description of an ellipsoid
            point with uncertainty circle is allowed to be used.

            '
        globalGnbId:
          $ref: '#/components/schemas/GlobalRanNodeId'
      required:
      - tai
      - ncgi
    Uinteger:
      type: integer
      minimum: 0
      description: Unsigned Integer, i.e. only value 0 and integers above 0 are permissible.
    TransportProtocol:
      anyOf:
      - type: string
        enum:
        - UDP
        - TCP
      - type: string
        description: "This string provides forward-compatibility with future extensions\
          \ to the enumeration but is not used to encode content defined in the present\
          \ version of this API. \n"
      description: "Possible values are:\n- UDP: User Datagram Protocol.\n- TCP: Transmission\
        \ Control Protocol. \n"
    Bytes:
      format: byte
      type: string
      description: string with format 'bytes' as defined in OpenAPI
    TnapId:
      description: Contain the TNAP Identifier see clause5.6.2 of 3GPP TS 23.501.
      type: object
      properties:
        ssId:
          type: string
          description: "This IE shall be present if the UE is accessing the 5GC via\
            \ a trusted WLAN access network.When present, it shall contain the SSID\
            \ of the access point to which the UE is attached, that is received over\
            \ NGAP,  see IEEE Std 802.11-2012. \n"
        bssId:
          type: string
          description: "When present, it shall contain the BSSID of the access point\
            \ to which the UE is attached, that is received over NGAP, see IEEE Std\
            \ 802.11-2012. \n"
        civicAddress:
          $ref: '#/components/schemas/Bytes'
    TwapId:
      description: 'Contain the TWAP Identifier as defined in clause 4.2.8.5.3 of
        3GPP TS 23.501 or the WLAN location information as defined in clause 4.5.7.2.8
        of 3GPP TS 23.402.

        '
      type: object
      required:
      - ssId
      properties:
        ssId:
          type: string
          description: "This IE shall contain the SSID of the access point to which\
            \ the UE is attached, that is received over NGAP, see IEEE Std 802.11-2012.\
            \ \n"
        bssId:
          type: string
          description: "When present, it shall contain the BSSID of the access point\
            \ to which the UE is attached, for trusted WLAN access, see IEEE Std 802.11-2012.\
            \ \n"
        civicAddress:
          $ref: '#/components/schemas/Bytes'
    HfcNId:
      type: string
      maxLength: 6
      description: 'This IE represents the identifier of the HFC node Id as specified
        in CableLabs WR-TR-5WWC-ARCH. It is provisioned by the wireline operator as
        part of wireline operations and may contain up to six characters.

        '
    HfcNodeId:
      description: REpresents the HFC Node Identifer received over NGAP.
      type: object
      required:
      - hfcNId
      properties:
        hfcNId:
          $ref: '#/components/schemas/HfcNId'
    LineType:
      anyOf:
      - type: string
        enum:
        - DSL
        - PON
      - type: string
        description: "This string provides forward-compatibility with future extensions\
          \ to the enumeration but is not used to encode content defined in the present\
          \ version of this API. \n"
      description: 'Possible values are:

        - DSL: Identifies a DSL line

        - PON: Identifies a PON line

        '
    Gci:
      type: string
      description: 'Global Cable Identifier uniquely identifying the connection between
        the 5G-CRG or FN-CRG to the 5GS. See clause 28.15.4 of 3GPP TS 23.003. This
        shall be encoded as a string per clause 28.15.4 of 3GPP TS 23.003, and compliant
        with the syntax specified  in clause 2.2  of IETF RFC 7542 for the username
        part of a NAI. The GCI value is specified in CableLabs WR-TR-5WWC-ARCH.

        '
    N3gaLocation:
      description: Contains the Non-3GPP access user location.
      type: object
      properties:
        n3gppTai:
          $ref: '#/components/schemas/Tai'
        n3IwfId:
          type: string
          pattern: ^[A-Fa-f0-9]+$
          description: "This IE shall contain the N3IWF identifier received over NGAP\
            \ and shall be encoded as a  string of hexadecimal characters. Each character\
            \ in the string shall take a value of \"0\"  to \"9\", \"a\" to \"f\"\
            \ or \"A\" to \"F\" and shall represent 4 bits. The most significant \
            \ character representing the 4 most significant bits of the N3IWF ID shall\
            \ appear first in  the string, and the character representing the 4 least\
            \ significant bit of the N3IWF ID  shall appear last in the string. \n"
        ueIpv4Addr:
          $ref: '#/components/schemas/Ipv4Addr'
        ueIpv6Addr:
          $ref: '#/components/schemas/Ipv6Addr'
        portNumber:
          $ref: '#/components/schemas/Uinteger'
        protocol:
          $ref: '#/components/schemas/TransportProtocol'
        tnapId:
          $ref: '#/components/schemas/TnapId'
        twapId:
          $ref: '#/components/schemas/TwapId'
        hfcNodeId:
          $ref: '#/components/schemas/HfcNodeId'
        gli:
          $ref: '#/components/schemas/Bytes'
        w5gbanLineType:
          $ref: '#/components/schemas/LineType'
        gci:
          $ref: '#/components/schemas/Gci'
    CellGlobalId:
      description: Contains a Cell Global Identification as defined in 3GPP TS 23.003,
        clause 4.3.1.
      type: object
      required:
      - plmnId
      - lac
      - cellId
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        lac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
        cellId:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
    ServiceAreaId:
      description: Contains a Service Area Identifier as defined in 3GPP TS 23.003,
        clause 12.5.
      type: object
      required:
      - plmnId
      - lac
      - sac
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        lac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
          description: Location Area Code.
        sac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
          description: Service Area Code.
    LocationAreaId:
      description: Contains a Location area identification as defined in 3GPP TS 23.003,
        clause 4.1.
      type: object
      required:
      - plmnId
      - lac
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        lac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
          description: Location Area Code.
    RoutingAreaId:
      description: Contains a Routing Area Identification as defined in 3GPP TS 23.003,
        clause 4.2.
      type: object
      required:
      - plmnId
      - lac
      - rac
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        lac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
          description: Location Area Code
        rac:
          type: string
          pattern: ^[A-Fa-f0-9]{2}$
          description: Routing Area Code
    UtraLocation:
      type: object
      oneOf:
      - required:
        - cgi
      - required:
        - sai
      - required:
        - lai
      description: Exactly one of cgi, sai or lai shall be present.
      properties:
        cgi:
          $ref: '#/components/schemas/CellGlobalId'
        sai:
          $ref: '#/components/schemas/ServiceAreaId'
        lai:
          $ref: '#/components/schemas/LocationAreaId'
        rai:
          $ref: '#/components/schemas/RoutingAreaId'
        ageOfLocationInformation:
          type: integer
          minimum: 0
          maximum: 32767
          description: "The value represents the elapsed time in minutes since the\
            \ last network contact of the mobile station.  Value \"0\" indicates that\
            \ the location information was obtained after a successful paging procedure\
            \ for  Active Location Retrieval when the UE is in idle mode\n or after\
            \ a successful location reporting procedure  the UE is in connected mode.\
            \ Any\nother value than \"0\" indicates that the location information\
            \ is the last known one.  See 3GPP TS 29.002 clause 17.7.8.\n"
        ueLocationTimestamp:
          $ref: '#/components/schemas/DateTime'
        geographicalInformation:
          type: string
          pattern: ^[0-9A-F]{16}$
          description: 'Refer to geographical Information.See 3GPP TS 23.032 clause
            7.3.2. Only the description of an ellipsoid point with uncertainty circle
            is allowed to be used.

            '
        geodeticInformation:
          type: string
          pattern: ^[0-9A-F]{20}$
          description: "Refers to Calling Geodetic Location. See ITU-T\_Recommendation\
            \ Q.763 (1999) clause 3.88.2. Only the description of an ellipsoid point\
            \ with uncertainty circle is allowed to be used.\n"
    GeraLocation:
      type: object
      oneOf:
      - required:
        - cgi
      - required:
        - sai
      - required:
        - lai
      description: Exactly one of cgi, sai or lai shall be present.
      properties:
        locationNumber:
          type: string
          description: Location number within the PLMN. See 3GPP TS 23.003, clause
            4.5.
        cgi:
          $ref: '#/components/schemas/CellGlobalId'
        sai:
          $ref: '#/components/schemas/ServiceAreaId'
        lai:
          $ref: '#/components/schemas/LocationAreaId'
        rai:
          $ref: '#/components/schemas/RoutingAreaId'
        vlrNumber:
          type: string
          description: VLR number. See 3GPP TS 23.003 clause 5.1.
        mscNumber:
          type: string
          description: MSC number. See 3GPP TS 23.003 clause 5.1.
        ageOfLocationInformation:
          type: integer
          minimum: 0
          maximum: 32767
          description: 'The value represents the elapsed time in minutes since the
            last network contact of the mobile station. Value "0" indicates that the
            location information was obtained after a successful paging procedure
            for  Active Location Retrieval when the UE is in idle mode or after a
            successful location reporting procedure the UE is in connected mode. Any
            other value than "0" indicates that the location information is the last
            known one. See 3GPP TS 29.002 clause 17.7.8.

            '
        ueLocationTimestamp:
          $ref: '#/components/schemas/DateTime'
        geographicalInformation:
          type: string
          pattern: ^[0-9A-F]{16}$
          description: 'Refer to geographical Information.See 3GPP TS 23.032 clause
            7.3.2. Only the description of an ellipsoid point with uncertainty circle
            is allowed to be used.

            '
        geodeticInformation:
          type: string
          pattern: ^[0-9A-F]{20}$
          description: 'Refers to Calling Geodetic Location.See ITU-T Recommendation
            Q.763 (1999) clause 3.88.2.  Only the description of an ellipsoid point
            with uncertainty circle is allowed to be used.

            '
    UserLocation:
      type: object
      properties:
        eutraLocation:
          $ref: '#/components/schemas/EutraLocation'
        nrLocation:
          $ref: '#/components/schemas/NrLocation'
        n3gaLocation:
          $ref: '#/components/schemas/N3gaLocation'
        utraLocation:
          $ref: '#/components/schemas/UtraLocation'
        geraLocation:
          $ref: '#/components/schemas/GeraLocation'
      description: 'At least one of eutraLocation, nrLocation and n3gaLocation shall
        be present. Several of them may be present.

        '
    TimeZone:
      type: string
      example: -08:00+1
      description: "String with format \"time-numoffset\" optionally appended by \"\
        daylightSavingTime\", where \n- \"time-numoffset\" shall represent the time\
        \ zone adjusted for daylight saving time and be\n   encoded as time-numoffset\
        \ as defined in clause\_5.6 of IETF RFC 3339; \n- \"daylightSavingTime\" shall\
        \ represent the adjustment that has been made and shall be\n   encoded as\
        \ \"+1\" or \"+2\" for a +1 or +2 hours adjustment. \n\nThe example is for\
        \ 8 hours behind UTC, +1 hour adjustment for Daylight Saving Time.\n"
    PlmnIdNid:
      description: 'Contains the serving core network operator PLMN ID and, for an
        SNPN, the NID that together with the PLMN ID identifies the SNPN.

        '
      type: object
      required:
      - mcc
      - mnc
      properties:
        mcc:
          $ref: '#/components/schemas/Mcc'
        mnc:
          $ref: '#/components/schemas/Mnc'
        nid:
          $ref: '#/components/schemas/Nid'
    RatType:
      anyOf:
      - type: string
        enum:
        - NR
        - EUTRA
        - WLAN
        - VIRTUAL
        - NBIOT
        - WIRELINE
        - WIRELINE_CABLE
        - WIRELINE_BBF
        - LTE-M
        - NR_U
        - EUTRA_U
        - TRUSTED_N3GA
        - TRUSTED_WLAN
        - UTRA
        - GERA
        - NR_LEO
        - NR_MEO
        - NR_GEO
        - NR_OTHER_SAT
        - NR_REDCAP
        - WB_E_UTRAN_LEO
        - WB_E_UTRAN_MEO
        - WB_E_UTRAN_GEO
        - WB_E_UTRAN_OTHERSAT
        - NB_IOT_LEO
        - NB_IOT_MEO
        - NB_IOT_GEO
        - NB_IOT_OTHERSAT
        - LTE_M_LEO
        - LTE_M_MEO
        - LTE_M_GEO
        - LTE_M_OTHERSAT
      - type: string
      description: Indicates the radio access used.
    GroupId:
      type: string
      pattern: ^[A-Fa-f0-9]{8}-[0-9]{3}-[0-9]{2,3}-([A-Fa-f0-9][A-Fa-f0-9]){1,10}$
      description: "String identifying a group of devices network internal globally\
        \ unique ID which identifies a set of IMSIs, as specified in clause 19.9 of\
        \ 3GPP TS 23.003. \n"
    RestrictionType:
      anyOf:
      - type: string
        enum:
        - ALLOWED_AREAS
        - NOT_ALLOWED_AREAS
      - type: string
      description: It contains the restriction type ALLOWED_AREAS or NOT_ALLOWED_AREAS.
    AreaCode:
      type: string
      description: Values are operator specific.
    Area:
      description: Provides area information.
      type: object
      oneOf:
      - required:
        - tacs
      - required:
        - areaCode
      properties:
        tacs:
          type: array
          items:
            $ref: '#/components/schemas/Tac'
          minItems: 1
        areaCode:
          $ref: '#/components/schemas/AreaCode'
    ServiceAreaRestriction:
      description: Provides information about allowed or not allowed areas.
      type: object
      properties:
        restrictionType:
          $ref: '#/components/schemas/RestrictionType'
        areas:
          type: array
          items:
            $ref: '#/components/schemas/Area'
        maxNumOfTAs:
          $ref: '#/components/schemas/Uinteger'
        maxNumOfTAsForNotAllowedAreas:
          $ref: '#/components/schemas/Uinteger'
      allOf:
      - oneOf:
        - not:
            required:
            - restrictionType
        - required:
          - areas
      - anyOf:
        - not:
            required:
            - restrictionType
            properties:
              restrictionType:
                type: string
                enum:
                - NOT_ALLOWED_AREAS
        - not:
            required:
            - maxNumOfTAs
      - anyOf:
        - not:
            required:
            - restrictionType
            properties:
              restrictionType:
                type: string
                enum:
                - ALLOWED_AREAS
        - not:
            required:
            - maxNumOfTAsForNotAllowedAreas
    WirelineArea:
      type: object
      properties:
        globalLineIds:
          type: array
          items:
            $ref: '#/components/schemas/Bytes'
          minItems: 1
        hfcNIds:
          type: array
          items:
            $ref: '#/components/schemas/HfcNId'
          minItems: 1
        areaCodeB:
          $ref: '#/components/schemas/AreaCode'
        areaCodeC:
          $ref: '#/components/schemas/AreaCode'
      description: 'One and only one of the "globLineIds", "hfcNIds", "areaCodeB"
        and "areaCodeC" attributes shall be included in a WirelineArea data structure

        '
    WirelineServiceAreaRestriction:
      type: object
      properties:
        restrictionType:
          $ref: '#/components/schemas/RestrictionType'
        areas:
          type: array
          items:
            $ref: '#/components/schemas/WirelineArea'
      description: 'The "restrictionType" attribute and the "areas" attribute shall
        be either both present or absent.  The empty array of areas is used when service
        is allowed/restricted nowhere.

        '
    RfspIndex:
      type: integer
      minimum: 1
      maximum: 256
      description: 'Unsigned integer representing the "Subscriber Profile ID for RAT/Frequency
        Priority"  as specified in 3GPP TS 36.413.

        '
    BitRate:
      type: string
      pattern: ^\d+(\.\d+)? (bps|Kbps|Mbps|Gbps|Tbps)$
      description: 'String representing a bit rate; the prefixes follow the standard
        symbols from The International System of Units, and represent x1000 multipliers,
        with the exception that prefix "K" is used to represent the standard symbol
        "k".

        '
    Ambr:
      description: Contains the maximum aggregated uplink and downlink bit rates.
      type: object
      properties:
        uplink:
          $ref: '#/components/schemas/BitRate'
        downlink:
          $ref: '#/components/schemas/BitRate'
      required:
      - uplink
      - downlink
    SliceMbr:
      description: MBR related to slice
      type: object
      properties:
        uplink:
          $ref: '#/components/schemas/BitRate'
        downlink:
          $ref: '#/components/schemas/BitRate'
      required:
      - uplink
      - downlink
    Snssai:
      type: object
      properties:
        sst:
          type: integer
          minimum: 0
          maximum: 255
          description: "Unsigned integer, within the range 0 to 255, representing\
            \ the Slice/Service Type.  It indicates the expected Network Slice behaviour\
            \ in terms of features and services. Values 0 to 127 correspond to the\
            \ standardized SST range. Values 128 to 255 correspond  to the Operator-specific\
            \ range. See clause 28.4.2 of 3GPP TS 23.003. Standardized values are\
            \ defined in clause 5.15.2.2 of 3GPP TS 23.501. \n"
        sd:
          type: string
          pattern: ^[A-Fa-f0-9]{6}$
          description: '3-octet string, representing the Slice Differentiator, in
            hexadecimal representation. Each character in the string shall take a
            value of "0" to "9", "a" to "f" or "A" to "F" and shall represent 4 bits.
            The most significant character representing the 4 most significant bits
            of the SD shall appear first in the string, and the character representing
            the 4 least significant bit of the SD shall appear last in the string.
            This is an optional parameter that complements the Slice/Service type(s)
            to allow to  differentiate amongst multiple Network Slices of the same
            Slice/Service type. This IE shall be absent if no SD value is associated
            with the SST.

            '
      description: 'When Snssai needs to be converted to string (e.g. when used in
        maps as key), the string shall be composed of one to three digits "sst" optionally
        followed by "-" and 6 hexadecimal digits "sd".

        '
      required:
      - sst
    MappingOfSnssai:
      description: Contains the mapping of S-NSSAI in the serving network and the
        value of the home network
      type: object
      required:
      - servingSnssai
      - homeSnssai
      properties:
        servingSnssai:
          $ref: '#/components/schemas/Snssai'
        homeSnssai:
          $ref: '#/components/schemas/Snssai'
    AmfId:
      type: string
      pattern: ^[A-Fa-f0-9]{6}$
      description: "String identifying the AMF ID composed of AMF Region ID (8 bits),\
        \ AMF Set ID (10 bits) and AMF  Pointer (6 bits) as specified in clause 2.10.1\
        \ of 3GPP TS 23.003. It is encoded as a string of  6 hexadecimal characters\
        \ (i.e., 24 bits). \n"
    Guami:
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnIdNid'
        amfId:
          $ref: '#/components/schemas/AmfId'
      required:
      - plmnId
      - amfId
      description: Globally Unique AMF Identifier constructed out of PLMN, Network
        and AMF identity.
