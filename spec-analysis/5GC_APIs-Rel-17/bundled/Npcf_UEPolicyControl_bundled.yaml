          $ref: '#/components/schemas/AccessTokenReq'
        nrfId:
          $ref: '#/components/schemas/Fqdn'
    CmState:
      description: Describes the connection management state of a UE
      anyOf:
      - type: string
        enum:
        - IDLE
        - CONNECTED
      - type: string
    RedirectResponse:
      description: 'The response shall include a Location header field containing
        a different URI  (pointing to a different URI of an other service instance),
        or the same URI if a request  is redirected to the same target resource via
        a different SCP.

        '
      type: object
      properties:
        cause:
          type: string
        targetScp:
          $ref: '#/components/schemas/Uri'
        targetSepp:
          $ref: '#/components/schemas/Uri'
    N1N2MessageTransferCause:
      description: Enumeration for N1N2Message Transfer Cause
      anyOf:
      - type: string
        enum:
        - ATTEMPTING_TO_REACH_UE
        - N1_N2_TRANSFER_INITIATED
        - WAITING_FOR_ASYNCHRONOUS_TRANSFER
        - UE_NOT_RESPONDING
        - N1_MSG_NOT_TRANSFERRED
        - N2_MSG_NOT_TRANSFERRED
        - UE_NOT_REACHABLE_FOR_SESSION
        - TEMPORARY_REJECT_REGISTRATION_ONGOING
        - TEMPORARY_REJECT_HANDOVER_ONGOING
        - REJECTION_DUE_TO_PAGING_RESTRICTION
        - AN_NOT_RESPONDING
        - FAILURE_CAUSE_UNSPECIFIED
      - type: string
  responses:
    '307':
      description: Temporary Redirect
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RedirectResponse'
      headers:
        Location:
          description: The URI pointing to the resource located on the redirect target
          required: true
          schema:
            type: string
        3gpp-Sbi-Target-Nf-Id:
          description: Identifier of target NF (service) instance towards which the
            request is redirected
          schema:
            type: string
    '308':
      description: Permanent Redirect
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RedirectResponse'
      headers:
        Location:
          description: The URI pointing to the resource located on the redirect target
          required: true
