openapi: 3.0.0
info:
  title: Nnef_EventExposure
  version: 1.2.0
  description: "NEF Event Exposure Service.  \n\xA9 2022 , 3GPP Organizational Partners\
    \ (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC).  \nAll rights reserved.\n"
servers:
- url: http://nef:8000/nnef-eventexposure/v1
security:
- {}
- oAuth2ClientCredentials:
  - nnef-eventexposure
externalDocs:
  description: '3GPP TS 29.591 V17.7.0; 5G System; Network Exposure Function Southbound
    Services; Stage 3.

    '
  url: https://www.3gpp.org/ftp/Specs/archive/29_series/29.591/
paths:
  /subscriptions:
    post:
      summary: subscribe to notifications
      operationId: CreateIndividualSubcription
      tags:
      - Subscriptions (Collection)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NefEventExposureSubsc'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NefEventExposureSubsc'
          headers:
            Location:
              description: 'Contains the URI of the newly created resource, according
                to the structure {apiRoot}/nnef-eventexposure/<apiVersion>/subscriptions/{subscriptionId}

                '
              required: true
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '411':
          $ref: '#/components/responses/411'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/default'
      callbacks:
        myNotification:
          '{$request.body#/notifUri}':
            post:
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/NefEventExposureNotif'
              responses:
                '204':
                  description: No Content, Notification was succesfull
                '307':
                  $ref: '#/components/responses/307'
                '308':
                  $ref: '#/components/responses/308'
                '400':
                  $ref: '#/components/responses/400'
                '401':
                  $ref: '#/components/responses/401'
                '403':
                  $ref: '#/components/responses/403'
                '404':
                  $ref: '#/components/responses/404'
                '411':
                  $ref: '#/components/responses/411'
                '413':
                  $ref: '#/components/responses/413'
                '415':
                  $ref: '#/components/responses/415'
                '429':
                  $ref: '#/components/responses/429'
                '500':
                  $ref: '#/components/responses/500'
                '503':
                  $ref: '#/components/responses/503'
                default:
                  $ref: '#/components/responses/default'
  /subscriptions/{subscriptionId}:
    get:
      summary: retrieve subscription
      operationId: GetIndividualSubcription
      tags:
      - IndividualSubscription (Document)
      parameters:
      - name: subscriptionId
        in: path
        description: Event Subscription ID
        required: true
        schema:
          type: string
      - name: supp-feat
        in: query
        description: Features supported by the NF service consumer
        required: false
        schema:
          $ref: '#/components/schemas/SupportedFeatures'
      responses:
        '200':
          description: OK. Resource representation is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NefEventExposureSubsc'
        '307':
          $ref: '#/components/responses/307'
        '308':
          $ref: '#/components/responses/308'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/default'
    put:
      summary: update subscription
      operationId: ReplaceIndividualSubcription
      tags:
      - IndividualSubscription (Document)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NefEventExposureSubsc'
      parameters:
      - name: subscriptionId
        in: path
        description: Event Subscription ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK. Resource was succesfully modified and representation is
            returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NefEventExposureSubsc'
        '204':
          description: No Content. Resource was succesfully modified
        '307':
          $ref: '#/components/responses/307'
        '308':
          $ref: '#/components/responses/308'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '411':
          $ref: '#/components/responses/411'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/default'
    delete:
      summary: unsubscribe from notifications
      operationId: DeleteIndividualSubcription
      tags:
      - IndividualSubscription (Document)
      parameters:
      - name: subscriptionId
        in: path
        description: Event Subscription ID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content. Resource was succesfully deleted
        '307':
          $ref: '#/components/responses/307'
        '308':
          $ref: '#/components/responses/308'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/default'
components:
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://nrf:8000/oauth2/token
          scopes:
            nnef-eventexposure: Access to the Nnef_EventExposure API
  schemas:
    NefEventExposureSubsc:
      description: Represents an Individual Network Exposure Event Subscription resource.
      type: object
      properties:
        dataAccProfId:
          type: string
        eventsSubs:
          type: array
          items:
            $ref: '#/components/schemas/NefEventSubs'
          minItems: 1
        eventsRepInfo:
          $ref: '#/components/schemas/ReportingInformation'
        notifUri:
          $ref: '#/components/schemas/Uri'
        notifId:
          type: string
        eventNotifs:
          type: array
          items:
            $ref: '#/components/schemas/NefEventNotification'
          minItems: 1
        suppFeat:
          $ref: '#/components/schemas/SupportedFeatures'
      required:
      - eventsSubs
      - notifId
      - notifUri
    NefEventExposureNotif:
      description: 'Represents notifications on network exposure event(s) that occurred
        for an Individual Network Exposure Event Subscription resource.

        '
      type: object
      properties:
        notifId:
          type: string
        eventNotifs:
          type: array
          items:
            $ref: '#/components/schemas/NefEventNotification'
          minItems: 1
      required:
      - notifId
      - eventNotifs
    NefEventNotification:
      description: Represents information related to an event to be reported.
      type: object
      properties:
        event:
          $ref: '#/components/schemas/NefEvent'
        timeStamp:
          $ref: '#/components/schemas/DateTime'
        svcExprcInfos:
          type: array
          items:
            $ref: '#/components/schemas/ServiceExperienceInfo'
          minItems: 1
        ueMobilityInfos:
          type: array
          items:
            $ref: '#/components/schemas/UeMobilityInfo'
          minItems: 1
        ueCommInfos:
          type: array
          items:
            $ref: '#/components/schemas/UeCommunicationInfo'
          minItems: 1
        excepInfos:
          type: array
          items:
            $ref: '#/components/schemas/ExceptionInfo'
          minItems: 1
        congestionInfos:
          type: array
          items:
            $ref: '#/components/schemas/UserDataCongestionCollection'
          minItems: 1
        perfDataInfos:
          type: array
          items:
            $ref: '#/components/schemas/PerformanceDataInfo'
          minItems: 1
        dispersionInfos:
          type: array
          items:
            $ref: '#/components/schemas/DispersionCollection'
          minItems: 1
        collBhvrInfs:
          type: array
          items:
            $ref: '#/components/schemas/CollectiveBehaviourInfo'
          minItems: 1
        msQoeMetrInfos:
          type: array
          items:
            $ref: '#/components/schemas/MsQoeMetricsCollection'
          minItems: 1
        msConsumpInfos:
          type: array
          items:
            $ref: '#/components/schemas/MsConsumptionCollection'
          minItems: 1
        msNetAssInvInfos:
          type: array
          items:
            $ref: '#/components/schemas/MsNetAssInvocationCollection'
          minItems: 1
        msDynPlyInvInfos:
          type: array
          items:
            $ref: '#/components/schemas/MsDynPolicyInvocationCollection'
          minItems: 1
        msAccActInfos:
          type: array
          items:
            $ref: '#/components/schemas/MSAccessActivityCollection'
          minItems: 1
      required:
      - event
      - timeStamp
    NefEventSubs:
      description: Represents an event to be subscribed and the related event filter
        information.
      type: object
      properties:
        event:
          $ref: '#/components/schemas/NefEvent'
        eventFilter:
          $ref: '#/components/schemas/NefEventFilter'
      required:
      - event
    NefEventFilter:
      description: Represents event filter information for an event.
      type: object
      properties:
        tgtUe:
          $ref: '#/components/schemas/TargetUeIdentification'
        appIds:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationId'
          minItems: 1
        locArea:
          $ref: '#/components/schemas/NetworkAreaInfo'
        collAttrs:
          type: array
          items:
            $ref: '#/components/schemas/CollectiveBehaviourFilter'
          minItems: 1
      required:
      - tgtUe
    TargetUeIdentification:
      description: Identifies the UE to which the request applies.
      type: object
      properties:
        supis:
          type: array
          items:
            $ref: '#/components/schemas/Supi'
          minItems: 1
        interGroupIds:
          type: array
          items:
            $ref: '#/components/schemas/GroupId'
          minItems: 1
        anyUeId:
          type: boolean
    ServiceExperienceInfo:
      description: Contains service experience information associated with an application.
      type: object
      properties:
        appId:
          $ref: '#/components/schemas/ApplicationId'
        supis:
          type: array
          items:
            $ref: '#/components/schemas/Supi'
          minItems: 1
        svcExpPerFlows:
          type: array
          items:
            $ref: '#/components/schemas/ServiceExperienceInfoPerFlow'
          minItems: 1
      required:
      - svcExpPerFlows
    UeMobilityInfo:
      description: Contains UE mobility information associated with an application.
      type: object
      properties:
        supi:
          $ref: '#/components/schemas/Supi'
        appId:
          $ref: '#/components/schemas/ApplicationId'
        ueTrajs:
          type: array
          items:
            $ref: '#/components/schemas/UeTrajectoryInfo'
          minItems: 1
      required:
      - supi
      - ueTrajs
    UeCommunicationInfo:
      description: Contains UE communication information associated with an application.
      type: object
      properties:
        supi:
          $ref: '#/components/schemas/Supi'
        interGroupId:
          $ref: '#/components/schemas/GroupId'
        appId:
          $ref: '#/components/schemas/ApplicationId'
        comms:
          type: array
          items:
            $ref: '#/components/schemas/CommunicationCollection'
          minItems: 1
      required:
      - comms
    UeTrajectoryInfo:
      description: Contains UE trajectory information.
      type: object
      properties:
        ts:
          $ref: '#/components/schemas/DateTime'
        location:
          $ref: '#/components/schemas/UserLocation'
      required:
      - ts
      - location
    PerformanceDataInfo:
      description: Contains Performance Data Analytics related information collection.
      type: object
      properties:
        appId:
          $ref: '#/components/schemas/ApplicationId'
        ueIpAddr:
          $ref: '#/components/schemas/IpAddr'
        ipTrafficFilter:
          $ref: '#/components/schemas/FlowInfo'
        userLoc:
          $ref: '#/components/schemas/UserLocation'
        appLocs:
          type: array
          items:
            $ref: '#/components/schemas/Dnai'
          minItems: 1
        asAddr:
          $ref: '#/components/schemas/AddrFqdn'
        perfData:
          $ref: '#/components/schemas/PerformanceData'
        timeStamp:
          $ref: '#/components/schemas/DateTime'
      required:
      - perfData
      - timeStamp
    NefEvent:
      description: Represents Network Exposure Events.
      anyOf:
      - type: string
        enum:
        - SVC_EXPERIENCE
        - UE_MOBILITY
        - UE_COMM
        - EXCEPTIONS
        - USER_DATA_CONGESTION
        - PERF_DATA
        - DISPERSION
        - COLLECTIVE_BEHAVIOUR
        - MS_QOE_METRICS
        - MS_CONSUMPTION
        - MS_NET_ASSIST_INVOCATION
        - MS_DYN_POLICY_INVOCATION
        - MS_ACCESS_ACTIVITY
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
    Supi:
      type: string
      pattern: ^(imsi-[0-9]{5,15}|nai-.+|gci-.+|gli-.+|.+)$
      description: "String identifying a Supi that shall contain either an IMSI, a\
        \ network specific identifier,\na Global Cable Identifier (GCI) or a Global\
        \ Line Identifier (GLI) as specified in clause \n2.2A of 3GPP TS 23.003. It\
        \ shall be formatted as follows\n - for an IMSI \"imsi-<imsi>\", where <imsi>\
        \ shall be formatted according to clause 2.2\n   of 3GPP TS 23.003 that describes\
        \ an IMSI.\n - for a network specific identifier \"nai-<nai>, where <nai>\
        \ shall be formatted\n   according to clause 28.7.2 of 3GPP TS 23.003 that\
        \ describes an NAI.\n - for a GCI \"gci-<gci>\", where <gci> shall be formatted\
        \ according to clause 28.15.2\n   of 3GPP TS 23.003.\n - for a GLI \"gli-<gli>\"\
        , where <gli> shall be formatted according to clause 28.16.2 of\n   3GPP TS\
        \ 23.003.To enable that the value is used as part of an URI, the string shall\n\
        \   only contain characters allowed according to the \"lower-with-hyphen\"\
        \ naming convention\n   defined in 3GPP TS 29.501.\n"
    GroupId:
      type: string
      pattern: ^[A-Fa-f0-9]{8}-[0-9]{3}-[0-9]{2,3}-([A-Fa-f0-9][A-Fa-f0-9]){1,10}$
      description: "String identifying a group of devices network internal globally\
        \ unique ID which identifies a set of IMSIs, as specified in clause 19.9 of\
        \ 3GPP TS 23.003. \n"
    ApplicationId:
      type: string
      description: String providing an application identifier.
    Mcc:
      type: string
      pattern: ^\d{3}$
      description: "Mobile Country Code part of the PLMN, comprising 3 digits, as\
        \ defined in clause 9.3.3.5 of 3GPP TS 38.413. \n"
    Mnc:
      type: string
      pattern: ^\d{2,3}$
      description: Mobile Network Code part of the PLMN, comprising 2 or 3 digits,
        as defined in clause 9.3.3.5 of 3GPP TS 38.413.
    PlmnId:
      type: object
      properties:
        mcc:
          $ref: '#/components/schemas/Mcc'
        mnc:
          $ref: '#/components/schemas/Mnc'
      description: 'When PlmnId needs to be converted to string (e.g. when used in
        maps as key), the string  shall be composed of three digits "mcc" followed
        by "-" and two or three digits "mnc".

        '
      required:
      - mcc
      - mnc
    EutraCellId:
      type: string
      pattern: ^[A-Fa-f0-9]{7}$
      description: "28-bit string identifying an E-UTRA Cell Id as specified in clause\
        \ 9.3.1.9 of  3GPP TS 38.413, in hexadecimal representation. Each character\
        \ in the string shall take a  value of \"0\" to \"9\", \"a\" to \"f\" or \"\
        A\" to \"F\" and shall represent 4 bits. The most  significant character representing\
        \ the 4 most significant bits of the Cell Id shall appear  first in the string,\
        \ and the character representing the 4 least significant bit of the  Cell\
        \ Id shall appear last in the string. \n"
    Nid:
      type: string
      pattern: ^[A-Fa-f0-9]{11}$
      description: "This represents the Network Identifier, which together with a\
        \ PLMN ID is used to identify an SNPN (see 3GPP TS 23.003 and 3GPP TS 23.501\
        \ clause 5.30.2.1). \n"
    Ecgi:
      description: Contains the ECGI (E-UTRAN Cell Global Identity), as described
        in 3GPP 23.003
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        eutraCellId:
          $ref: '#/components/schemas/EutraCellId'
        nid:
          $ref: '#/components/schemas/Nid'
      required:
      - plmnId
      - eutraCellId
    NrCellId:
      type: string
      pattern: ^[A-Fa-f0-9]{9}$
      description: "36-bit string identifying an NR Cell Id as specified in clause\
        \ 9.3.1.7 of 3GPP TS 38.413,  in hexadecimal representation. Each character\
        \ in the string shall take a value of \"0\" to \"9\",  \"a\" to \"f\" or \"\
        A\" to \"F\" and shall represent 4 bits. The most significant character  representing\
        \ the 4 most significant bits of the Cell Id shall appear first in the string,\
        \ and  the character representing the 4 least significant bit of the Cell\
        \ Id shall appear last in the  string. \n"
    Ncgi:
      description: Contains the NCGI (NR Cell Global Identity), as described in 3GPP
        23.003
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        nrCellId:
          $ref: '#/components/schemas/NrCellId'
        nid:
          $ref: '#/components/schemas/Nid'
      required:
      - plmnId
      - nrCellId
    N3IwfId:
      type: string
      pattern: ^[A-Fa-f0-9]+$
      description: "This represents the identifier of the N3IWF ID as specified in\
        \ clause 9.3.1.57 of  3GPP TS 38.413 in hexadecimal representation. Each character\
        \ in the string shall take a value  of \"0\" to \"9\", \"a\" to \"f\" or \"\
        A\" to \"F\" and shall represent 4 bits. The most significant  character representing\
        \ the 4 most significant bits of the N3IWF ID shall appear first in the  string,\
        \ and the character representing the 4 least significant bit of the N3IWF\
        \ ID shall  appear last in the string. \n"
    GNbId:
      description: Provides the G-NB identifier.
      type: object
      properties:
        bitLength:
          type: integer
          minimum: 22
          maximum: 32
          description: 'Unsigned integer representing the bit length of the gNB ID
            as defined in clause 9.3.1.6 of 3GPP TS 38.413 [11], within the range
            22 to 32.

            '
        gNBValue:
          type: string
          pattern: ^[A-Fa-f0-9]{6,8}$
          description: 'This represents the identifier of the gNB. The value of the
            gNB ID shall be encoded in hexadecimal representation. Each character
            in the string shall take a value of "0" to "9", "a" to "f" or "A" to "F"
            and shall represent 4 bits. The padding 0 shall be added to make multiple
            nibbles,  the most significant character representing the padding 0 if
            required together with the 4 most significant bits of the gNB ID shall
            appear first in the string, and the character representing the 4 least
            significant bit of the gNB ID shall appear last in the string.

            '
      required:
      - bitLength
      - gNBValue
    NgeNbId:
      type: string
      pattern: ^(MacroNGeNB-[A-Fa-f0-9]{5}|LMacroNGeNB-[A-Fa-f0-9]{6}|SMacroNGeNB-[A-Fa-f0-9]{5})$
      description: "This represents the identifier of the ng-eNB ID as specified in\
        \ clause 9.3.1.8 of  3GPP TS 38.413. The value of the ng-eNB ID shall be encoded\
        \ in hexadecimal representation.  Each character in the string shall take\
        \ a value of \"0\" to \"9\", \"a\" to \"f\" or \"A\" to \"F\" and  shall represent\
        \ 4 bits. The padding 0 shall be added to make multiple nibbles, so the most\
        \  significant character representing the padding 0 if required together with\
        \ the 4 most  significant bits of the ng-eNB ID shall appear first in the\
        \ string, and the character  representing the 4 least significant bit of the\
        \ ng-eNB ID (to form a nibble) shall appear last  in the string. \n"
      example: SMacroNGeNB-34B89
    WAgfId:
      type: string
      pattern: ^[A-Fa-f0-9]+$
      description: "This represents the identifier of the W-AGF ID as specified in\
        \ clause 9.3.1.162 of  3GPP TS 38.413 in hexadecimal representation. Each\
        \ character in the string shall take a value  of \"0\" to \"9\", \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent 4 bits. The most significant\
        \  character representing the 4 most significant bits of the W-AGF ID shall\
        \ appear first in the  string, and the character representing the 4 least\
        \ significant bit of the W-AGF ID shall  appear last in the string. \n"
    TngfId:
      type: string
      pattern: ^[A-Fa-f0-9]+$
      description: "This represents the identifier of the TNGF ID as specified in\
        \ clause 9.3.1.161 of  3GPP TS 38.413  in hexadecimal representation. Each\
        \ character in the string shall take a value of \"0\" to \"9\", \"a\"  to\
        \ \"f\" or \"A\" to \"F\" and shall represent 4 bits. The most significant\
        \ character representing the  4 most significant bits of the TNGF ID shall\
        \ appear first in the string, and the character  representing the 4 least\
        \ significant bit of the TNGF ID shall appear last in the string. \n"
    ENbId:
      type: string
      pattern: ^(MacroeNB-[A-Fa-f0-9]{5}|LMacroeNB-[A-Fa-f0-9]{6}|SMacroeNB-[A-Fa-f0-9]{5}|HomeeNB-[A-Fa-f0-9]{7})$
      description: 'This represents the identifier of the eNB ID as specified in clause
        9.2.1.37 of  3GPP TS 36.413. The string shall be formatted with the following
        pattern  ''^(''MacroeNB-[A-Fa-f0-9]{5}|LMacroeNB-[A-Fa-f0-9]{6}|SMacroeNB-[A-Fa-f0-9]{5}
        |HomeeNB-[A-Fa-f0-9]{7})$''. The value of the eNB ID shall be encoded in hexadecimal
        representation. Each character in the  string shall take a value of "0" to
        "9", "a" to "f" or "A" to "F" and shall represent 4 bits.  The padding 0 shall
        be added to make multiple nibbles, so the most significant character  representing
        the padding 0 if required together with the 4 most significant bits of the
        eNB ID  shall appear first in the string, and the character representing the
        4 least significant bit  of the eNB ID (to form a nibble) shall appear last
        in the string.

        '
    GlobalRanNodeId:
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        n3IwfId:
          $ref: '#/components/schemas/N3IwfId'
        gNbId:
          $ref: '#/components/schemas/GNbId'
        ngeNbId:
          $ref: '#/components/schemas/NgeNbId'
        wagfId:
          $ref: '#/components/schemas/WAgfId'
        tngfId:
          $ref: '#/components/schemas/TngfId'
        nid:
          $ref: '#/components/schemas/Nid'
        eNbId:
          $ref: '#/components/schemas/ENbId'
      oneOf:
      - required:
        - n3IwfId
      - required:
        - gNbId
      - required:
        - ngeNbId
      - required:
        - wagfId
      - required:
        - tngfId
      - required:
        - eNbId
      description: 'One of the six attributes n3IwfId, gNbIdm, ngeNbId, wagfId, tngfId,
        eNbId shall be present.

        '
      required:
      - plmnId
    Tac:
      type: string
      pattern: (^[A-Fa-f0-9]{4}$)|(^[A-Fa-f0-9]{6}$)
      description: "2 or 3-octet string identifying a tracking area code as specified\
        \ in clause 9.3.3.10  of 3GPP TS 38.413, in hexadecimal representation. Each\
        \ character in the string shall  take a value of \"0\" to \"9\", \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent 4 bits. The most significant\
        \ character representing the 4 most significant bits of the TAC shall  appear\
        \ first in the string, and the character representing the 4 least significant\
        \ bit  of the TAC shall appear last in the string. \n"
    Tai:
      description: Contains the tracking area identity as described in 3GPP 23.003
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        tac:
          $ref: '#/components/schemas/Tac'
        nid:
          $ref: '#/components/schemas/Nid'
      required:
      - plmnId
      - tac
    NetworkAreaInfo:
      description: 'Describes a network area information in which the NF service consumer
        requests the number of UEs.

        '
      type: object
      properties:
        ecgis:
          description: Contains a list of E-UTRA cell identities.
          type: array
          items:
            $ref: '#/components/schemas/Ecgi'
          minItems: 1
        ncgis:
          description: Contains a list of NR cell identities.
          type: array
          items:
            $ref: '#/components/schemas/Ncgi'
          minItems: 1
        gRanNodeIds:
          description: Contains a list of NG RAN nodes.
          type: array
          items:
            $ref: '#/components/schemas/GlobalRanNodeId'
          minItems: 1
        tais:
          description: Contains a list of tracking area identities.
          type: array
          items:
            $ref: '#/components/schemas/Tai'
          minItems: 1
    CollectiveBehaviourFilterType:
      description: Represents collective behaviour parameter type.
      anyOf:
      - type: string
        enum:
        - COLLECTIVE_ATTRIBUTE
        - DATA_PROCESSING
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
    CollectiveBehaviourFilter:
      description: Contains the collective behaviour filter information to be collected
        from UE.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/CollectiveBehaviourFilterType'
        value:
          type: string
          description: Value of the parameter type as in the type attribute.
        listOfUeInd:
          type: boolean
          description: 'Indicates whether request list of UE IDs that fulfill a collective
            behaviour within the area of interest. This attribute shall set to "true"
            if request the list of UE IDs, otherwise, set to "false". May only be
            present and sets to "true" if "AfEvent" sets to "COLLECTIVE_BEHAVIOUR".

            '
      required:
      - type
      - value
    NotificationMethod:
      anyOf:
      - type: string
        enum:
        - PERIODIC
        - ONE_TIME
        - ON_EVENT_DETECTION
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: 'Possible values are:

        - PERIODIC

        - ONE_TIME

        - ON_EVENT_DETECTION

        '
    Uinteger:
      type: integer
      minimum: 0
      description: Unsigned Integer, i.e. only value 0 and integers above 0 are permissible.
    DateTime:
      format: date-time
      type: string
      description: string with format 'date-time' as defined in OpenAPI.
    DurationSec:
      type: integer
      description: indicating a time in seconds.
    SamplingRatio:
      type: integer
      minimum: 1
      maximum: 100
      description: "Unsigned integer indicating Sampling Ratio (see clauses 4.15.1\
        \ of 3GPP TS 23.502), expressed in percent. \n"
    PartitioningCriteria:
      anyOf:
      - type: string
        enum:
        - TAC
        - SUBPLMN
        - GEOAREA
        - SNSSAI
        - DNN
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: 'Possible values are:

        - "TAC": Type Allocation Code

        - "SUBPLMN": Subscriber PLMN ID

        - "GEOAREA": Geographical area, i.e. list(s) of TAI(s)

        - "SNSSAI": S-NSSAI

        - "DNN": DNN

        '
    NotificationFlag:
      anyOf:
      - type: string
        enum:
        - ACTIVATE
        - DEACTIVATE
        - RETRIEVAL
      - type: string
        description: "This string provides forward-compatibility with future extensions\
          \ to the enumeration but is not used to encode content defined in the present\
          \ version of this API. \n"
      description: "Possible values are:\n- ACTIVATE: The event notification is activated.\n\
        - DEACTIVATE: The event notification is deactivated and shall be muted. The\
        \ available\n   event(s) shall be stored.\n- RETRIEVAL: The event notification\
        \ shall be sent to the NF service consumer(s),\n  after that, is muted again.\
        \ \n"
    ReportingInformation:
      description: Represents the type of reporting that the subscription requires.
      type: object
      properties:
        immRep:
          type: boolean
        notifMethod:
          $ref: '#/components/schemas/NotificationMethod'
        maxReportNbr:
          $ref: '#/components/schemas/Uinteger'
        monDur:
          $ref: '#/components/schemas/DateTime'
        repPeriod:
          $ref: '#/components/schemas/DurationSec'
        sampRatio:
          $ref: '#/components/schemas/SamplingRatio'
        partitionCriteria:
          type: array
          items:
            $ref: '#/components/schemas/PartitioningCriteria'
          minItems: 1
          description: Criteria for partitioning the UEs before applying the sampling
            ratio.
        grpRepTime:
          $ref: '#/components/schemas/DurationSec'
        notifFlag:
          $ref: '#/components/schemas/NotificationFlag'
    Uri:
      type: string
      description: String providing an URI formatted according to RFC 3986.
    Float:
      format: float
      type: number
      description: string with format 'float' as defined in OpenAPI.
    SvcExperience:
      description: Contains a mean opinion score with the customized range.
      type: object
      properties:
        mos:
          $ref: '#/components/schemas/Float'
        upperRange:
          $ref: '#/components/schemas/Float'
        lowerRange:
          $ref: '#/components/schemas/Float'
    schemas-DateTime:
      format: date-time
      type: string
      description: string with format "date-time" as defined in OpenAPI.
    TimeWindow:
      description: Represents a time window identified by a start time and a stop
        time.
      type: object
      properties:
        startTime:
          $ref: '#/components/schemas/schemas-DateTime'
        stopTime:
          $ref: '#/components/schemas/schemas-DateTime'
      required:
      - startTime
      - stopTime
    Dnai:
      type: string
      description: DNAI (Data network access identifier), see clause 5.6.7 of 3GPP
        TS 23.501.
    FlowInfo:
      description: Represents IP flow information.
      type: object
      properties:
        flowId:
          type: integer
          description: Indicates the IP flow identifier.
        flowDescriptions:
          type: array
          items:
            type: string
          description: 'Indicates the packet filters of the IP flow. Refer to clause
            5.3.8 of 3GPP TS 29.214 for encoding. It shall contain UL and/or DL IP
            flow description.

            '
          minItems: 1
          maxItems: 2
      required:
      - flowId
    MacAddr48:
      type: string
      pattern: ^([0-9a-fA-F]{2})((-[0-9a-fA-F]{2}){5})$
      description: 'String identifying a MAC address formatted in the hexadecimal
        notation according to clause 1.1 and clause 2.1 of RFC 7042.

        '
    FlowDescription:
      description: Defines a packet filter of an IP flow.
      type: string
    FlowDirection:
      anyOf:
      - type: string
        enum:
        - DOWNLINK
        - UPLINK
        - BIDIRECTIONAL
        - UNSPECIFIED
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: 'Possible values are

        - DOWNLINK: The corresponding filter applies for traffic to the UE.

        - UPLINK: The corresponding filter applies for traffic from the UE.

        - BIDIRECTIONAL: The corresponding filter applies for traffic both to and
        from the UE.

        - UNSPECIFIED: The corresponding filter applies for traffic to the UE (downlink),
        but has no specific direction declared. The service data flow detection shall
        apply the filter for uplink traffic as if the filter was bidirectional. The
        PCF shall not use the value UNSPECIFIED in filters created by the network
        in NW-initiated procedures. The PCF shall only include the value UNSPECIFIED
        in filters in UE-initiated procedures if the same value is received from the
        SMF.

        '
    EthFlowDescription:
      description: Identifies an Ethernet flow.
      type: object
      required:
      - ethType
      properties:
        destMacAddr:
          $ref: '#/components/schemas/MacAddr48'
        ethType:
          type: string
        fDesc:
          $ref: '#/components/schemas/FlowDescription'
        fDir:
          $ref: '#/components/schemas/FlowDirection'
        sourceMacAddr:
          $ref: '#/components/schemas/MacAddr48'
        vlanTags:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 2
        srcMacAddrEnd:
          $ref: '#/components/schemas/MacAddr48'
        destMacAddrEnd:
          $ref: '#/components/schemas/MacAddr48'
    ServiceExperienceInfoPerFlow:
      description: Contains service experience information associated with a service
        flow.
      type: object
      properties:
        svcExprc:
          $ref: '#/components/schemas/SvcExperience'
        timeIntev:
          $ref: '#/components/schemas/TimeWindow'
        dnai:
          $ref: '#/components/schemas/Dnai'
        ipTrafficFilter:
          $ref: '#/components/schemas/FlowInfo'
        ethTrafficFilter:
          $ref: '#/components/schemas/EthFlowDescription'
    EutraLocation:
      description: Contains the E-UTRA user location.
      type: object
      properties:
        tai:
          $ref: '#/components/schemas/Tai'
        ignoreTai:
          type: boolean
          default: false
        ecgi:
          $ref: '#/components/schemas/Ecgi'
        ignoreEcgi:
          type: boolean
          default: false
          description: 'This flag when present shall indicate that the Ecgi shall
            be ignored When present, it shall be set as follows: - true: ecgi shall
            be ignored. - false (default): ecgi shall not be ignored.

            '
        ageOfLocationInformation:
          type: integer
          minimum: 0
          maximum: 32767
          description: 'The value represents the elapsed time in minutes since the
            last network contact of the mobile station.  Value "0" indicates that
            the location information was obtained after a successful paging procedure
            for Active Location Retrieval when the UE is in idle mode or after a successful
            NG-RAN location reporting procedure with the eNB when the UE is in connected
            mode.  Any other value than "0" indicates that the location information
            is the last known one.  See 3GPP TS 29.002 clause 17.7.8.

            '
        ueLocationTimestamp:
          $ref: '#/components/schemas/DateTime'
        geographicalInformation:
          type: string
          pattern: ^[0-9A-F]{16}$
          description: 'Refer to geographical Information. See 3GPP TS 23.032 clause
            7.3.2. Only the description of an ellipsoid point with uncertainty circle
            is allowed to be used.

            '
        geodeticInformation:
          type: string
          pattern: ^[0-9A-F]{20}$
          description: 'Refers to Calling Geodetic Location. See ITU-T Recommendation
            Q.763 (1999) [24] clause 3.88.2. Only the description of an ellipsoid
            point with uncertainty circle is allowed to be used.

            '
        globalNgenbId:
          $ref: '#/components/schemas/GlobalRanNodeId'
        globalENbId:
          $ref: '#/components/schemas/GlobalRanNodeId'
      required:
      - tai
      - ecgi
    NrLocation:
      description: Contains the NR user location.
      type: object
      properties:
        tai:
          $ref: '#/components/schemas/Tai'
        ncgi:
          $ref: '#/components/schemas/Ncgi'
        ignoreNcgi:
          type: boolean
          default: false
        ageOfLocationInformation:
          type: integer
          minimum: 0
          maximum: 32767
          description: 'The value represents the elapsed time in minutes since the
            last network contact of the mobile station. Value "0" indicates that the
            location information was obtained after a successful paging procedure
            for Active Location Retrieval when the UE is in idle mode or after a successful  NG-RAN
            location reporting procedure with the eNB when the UE is in connected
            mode. Any other value than "0" indicates that the location information
            is the last known one. See 3GPP TS 29.002 clause 17.7.8.

            '
        ueLocationTimestamp:
          $ref: '#/components/schemas/DateTime'
        geographicalInformation:
          type: string
          pattern: ^[0-9A-F]{16}$
          description: 'Refer to geographical Information. See 3GPP TS 23.032 clause
            7.3.2. Only the description of an ellipsoid point with uncertainty circle
            is allowed to be used.

            '
        geodeticInformation:
          type: string
          pattern: ^[0-9A-F]{20}$
          description: 'Refers to Calling Geodetic Location. See ITU-T Recommendation
            Q.763 (1999) [24] clause 3.88.2. Only the description of an ellipsoid
            point with uncertainty circle is allowed to be used.

            '
        globalGnbId:
          $ref: '#/components/schemas/GlobalRanNodeId'
      required:
      - tai
      - ncgi
    Ipv4Addr:
      type: string
      pattern: ^(([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])$
      example: 198.51.100.1
      description: 'String identifying a IPv4 address formatted in the ''dotted decimal''
        notation as defined in RFC 1166.

        '
    Ipv6Addr:
      type: string
      allOf:
      - pattern: ^((:|(0?|([1-9a-f][0-9a-f]{0,3}))):)((0?|([1-9a-f][0-9a-f]{0,3})):){0,6}(:|(0?|([1-9a-f][0-9a-f]{0,3})))$
      - pattern: ^((([^:]+:){7}([^:]+))|((([^:]+:)*[^:]+)?::(([^:]+:)*[^:]+)?))$
      example: 2001:db8:85a3::8a2e:370:7334
      description: 'String identifying an IPv6 address formatted according to clause
        4 of RFC5952. The mixed IPv4 IPv6 notation according to clause 5 of RFC5952
        shall not be used.

        '
    TransportProtocol:
      anyOf:
      - type: string
        enum:
        - UDP
        - TCP
      - type: string
        description: "This string provides forward-compatibility with future extensions\
          \ to the enumeration but is not used to encode content defined in the present\
          \ version of this API. \n"
      description: "Possible values are:\n- UDP: User Datagram Protocol.\n- TCP: Transmission\
        \ Control Protocol. \n"
    Bytes:
      format: byte
      type: string
      description: string with format 'bytes' as defined in OpenAPI
    TnapId:
      description: Contain the TNAP Identifier see clause5.6.2 of 3GPP TS 23.501.
      type: object
      properties:
        ssId:
          type: string
          description: "This IE shall be present if the UE is accessing the 5GC via\
            \ a trusted WLAN access network.When present, it shall contain the SSID\
            \ of the access point to which the UE is attached, that is received over\
            \ NGAP,  see IEEE Std 802.11-2012. \n"
        bssId:
          type: string
          description: "When present, it shall contain the BSSID of the access point\
            \ to which the UE is attached, that is received over NGAP, see IEEE Std\
            \ 802.11-2012. \n"
        civicAddress:
          $ref: '#/components/schemas/Bytes'
    TwapId:
      description: 'Contain the TWAP Identifier as defined in clause 4.2.8.5.3 of
        3GPP TS 23.501 or the WLAN location information as defined in clause 4.5.7.2.8
        of 3GPP TS 23.402.

        '
      type: object
      required:
      - ssId
      properties:
        ssId:
          type: string
          description: "This IE shall contain the SSID of the access point to which\
            \ the UE is attached, that is received over NGAP, see IEEE Std 802.11-2012.\
            \ \n"
        bssId:
          type: string
          description: "When present, it shall contain the BSSID of the access point\
            \ to which the UE is attached, for trusted WLAN access, see IEEE Std 802.11-2012.\
            \ \n"
        civicAddress:
          $ref: '#/components/schemas/Bytes'
    HfcNId:
      type: string
      maxLength: 6
      description: 'This IE represents the identifier of the HFC node Id as specified
        in CableLabs WR-TR-5WWC-ARCH. It is provisioned by the wireline operator as
        part of wireline operations and may contain up to six characters.

        '
    HfcNodeId:
      description: REpresents the HFC Node Identifer received over NGAP.
      type: object
      required:
      - hfcNId
      properties:
        hfcNId:
          $ref: '#/components/schemas/HfcNId'
    LineType:
      anyOf:
      - type: string
        enum:
        - DSL
        - PON
      - type: string
        description: "This string provides forward-compatibility with future extensions\
          \ to the enumeration but is not used to encode content defined in the present\
          \ version of this API. \n"
      description: 'Possible values are:

        - DSL: Identifies a DSL line

        - PON: Identifies a PON line

        '
    Gci:
      type: string
      description: 'Global Cable Identifier uniquely identifying the connection between
        the 5G-CRG or FN-CRG to the 5GS. See clause 28.15.4 of 3GPP TS 23.003. This
        shall be encoded as a string per clause 28.15.4 of 3GPP TS 23.003, and compliant
        with the syntax specified  in clause 2.2  of IETF RFC 7542 for the username
        part of a NAI. The GCI value is specified in CableLabs WR-TR-5WWC-ARCH.

        '
    N3gaLocation:
      description: Contains the Non-3GPP access user location.
      type: object
      properties:
        n3gppTai:
          $ref: '#/components/schemas/Tai'
        n3IwfId:
          type: string
          pattern: ^[A-Fa-f0-9]+$
          description: "This IE shall contain the N3IWF identifier received over NGAP\
            \ and shall be encoded as a  string of hexadecimal characters. Each character\
            \ in the string shall take a value of \"0\"  to \"9\", \"a\" to \"f\"\
            \ or \"A\" to \"F\" and shall represent 4 bits. The most significant \
            \ character representing the 4 most significant bits of the N3IWF ID shall\
            \ appear first in  the string, and the character representing the 4 least\
            \ significant bit of the N3IWF ID  shall appear last in the string. \n"
        ueIpv4Addr:
          $ref: '#/components/schemas/Ipv4Addr'
        ueIpv6Addr:
          $ref: '#/components/schemas/Ipv6Addr'
        portNumber:
          $ref: '#/components/schemas/Uinteger'
        protocol:
          $ref: '#/components/schemas/TransportProtocol'
        tnapId:
          $ref: '#/components/schemas/TnapId'
        twapId:
          $ref: '#/components/schemas/TwapId'
        hfcNodeId:
          $ref: '#/components/schemas/HfcNodeId'
        gli:
          $ref: '#/components/schemas/Bytes'
        w5gbanLineType:
          $ref: '#/components/schemas/LineType'
        gci:
          $ref: '#/components/schemas/Gci'
    CellGlobalId:
      description: Contains a Cell Global Identification as defined in 3GPP TS 23.003,
        clause 4.3.1.
      type: object
      required:
      - plmnId
      - lac
      - cellId
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        lac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
        cellId:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
    ServiceAreaId:
      description: Contains a Service Area Identifier as defined in 3GPP TS 23.003,
        clause 12.5.
      type: object
      required:
      - plmnId
      - lac
      - sac
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        lac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
          description: Location Area Code.
        sac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
          description: Service Area Code.
    LocationAreaId:
      description: Contains a Location area identification as defined in 3GPP TS 23.003,
        clause 4.1.
      type: object
      required:
      - plmnId
      - lac
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        lac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
          description: Location Area Code.
    RoutingAreaId:
      description: Contains a Routing Area Identification as defined in 3GPP TS 23.003,
        clause 4.2.
      type: object
      required:
      - plmnId
      - lac
      - rac
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        lac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
          description: Location Area Code
        rac:
          type: string
          pattern: ^[A-Fa-f0-9]{2}$
          description: Routing Area Code
    UtraLocation:
      type: object
      oneOf:
      - required:
        - cgi
      - required:
        - sai
      - required:
        - lai
      description: Exactly one of cgi, sai or lai shall be present.
      properties:
        cgi:
          $ref: '#/components/schemas/CellGlobalId'
        sai:
          $ref: '#/components/schemas/ServiceAreaId'
        lai:
          $ref: '#/components/schemas/LocationAreaId'
        rai:
          $ref: '#/components/schemas/RoutingAreaId'
        ageOfLocationInformation:
          type: integer
          minimum: 0
          maximum: 32767
          description: "The value represents the elapsed time in minutes since the\
            \ last network contact of the mobile station.  Value \"0\" indicates that\
            \ the location information was obtained after a successful paging procedure\
            \ for  Active Location Retrieval when the UE is in idle mode\n or after\
            \ a successful location reporting procedure  the UE is in connected mode.\
            \ Any\nother value than \"0\" indicates that the location information\
            \ is the last known one.  See 3GPP TS 29.002 clause 17.7.8.\n"
        ueLocationTimestamp:
          $ref: '#/components/schemas/DateTime'
        geographicalInformation:
          type: string
          pattern: ^[0-9A-F]{16}$
          description: 'Refer to geographical Information.See 3GPP TS 23.032 clause
            7.3.2. Only the description of an ellipsoid point with uncertainty circle
            is allowed to be used.

            '
        geodeticInformation:
          type: string
          pattern: ^[0-9A-F]{20}$
          description: "Refers to Calling Geodetic Location. See ITU-T\_Recommendation\
            \ Q.763 (1999) clause 3.88.2. Only the description of an ellipsoid point\
            \ with uncertainty circle is allowed to be used.\n"
    GeraLocation:
      type: object
      oneOf:
      - required:
        - cgi
      - required:
        - sai
      - required:
        - lai
      description: Exactly one of cgi, sai or lai shall be present.
      properties:
        locationNumber:
          type: string
          description: Location number within the PLMN. See 3GPP TS 23.003, clause
            4.5.
        cgi:
          $ref: '#/components/schemas/CellGlobalId'
        sai:
          $ref: '#/components/schemas/ServiceAreaId'
        lai:
          $ref: '#/components/schemas/LocationAreaId'
        rai:
          $ref: '#/components/schemas/RoutingAreaId'
        vlrNumber:
          type: string
          description: VLR number. See 3GPP TS 23.003 clause 5.1.
        mscNumber:
          type: string
          description: MSC number. See 3GPP TS 23.003 clause 5.1.
        ageOfLocationInformation:
          type: integer
          minimum: 0
          maximum: 32767
          description: 'The value represents the elapsed time in minutes since the
            last network contact of the mobile station. Value "0" indicates that the
            location information was obtained after a successful paging procedure
            for  Active Location Retrieval when the UE is in idle mode or after a
            successful location reporting procedure the UE is in connected mode. Any
            other value than "0" indicates that the location information is the last
            known one. See 3GPP TS 29.002 clause 17.7.8.

            '
        ueLocationTimestamp:
          $ref: '#/components/schemas/DateTime'
        geographicalInformation:
          type: string
          pattern: ^[0-9A-F]{16}$
          description: 'Refer to geographical Information.See 3GPP TS 23.032 clause
            7.3.2. Only the description of an ellipsoid point with uncertainty circle
            is allowed to be used.

            '
        geodeticInformation:
          type: string
          pattern: ^[0-9A-F]{20}$
          description: 'Refers to Calling Geodetic Location.See ITU-T Recommendation
            Q.763 (1999) clause 3.88.2.  Only the description of an ellipsoid point
            with uncertainty circle is allowed to be used.

            '
    UserLocation:
      type: object
      properties:
        eutraLocation:
          $ref: '#/components/schemas/EutraLocation'
        nrLocation:
          $ref: '#/components/schemas/NrLocation'
        n3gaLocation:
          $ref: '#/components/schemas/N3gaLocation'
        utraLocation:
          $ref: '#/components/schemas/UtraLocation'
        geraLocation:
          $ref: '#/components/schemas/GeraLocation'
      description: 'At least one of eutraLocation, nrLocation and n3gaLocation shall
        be present. Several of them may be present.

        '
    Volume:
      type: integer
      format: int64
      minimum: 0
      description: Unsigned integer identifying a volume in units of bytes.
    CommunicationCollection:
      description: Contains communication information.
      type: object
      properties:
        startTime:
          $ref: '#/components/schemas/DateTime'
        endTime:
          $ref: '#/components/schemas/DateTime'
        ulVol:
          $ref: '#/components/schemas/Volume'
        dlVol:
          $ref: '#/components/schemas/Volume'
      required:
      - startTime
      - endTime
      - ulVol
      - dlVol
    ExceptionId:
      anyOf:
      - type: string
        enum:
        - UNEXPECTED_UE_LOCATION
        - UNEXPECTED_LONG_LIVE_FLOW
        - UNEXPECTED_LARGE_RATE_FLOW
        - UNEXPECTED_WAKEUP
        - SUSPICION_OF_DDOS_ATTACK
        - WRONG_DESTINATION_ADDRESS
        - TOO_FREQUENT_SERVICE_ACCESS
        - UNEXPECTED_RADIO_LINK_FAILURES
        - PING_PONG_ACROSS_CELLS
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: 'Possible values are:

        - UNEXPECTED_UE_LOCATION: Unexpected UE location

        - UNEXPECTED_LONG_LIVE_FLOW: Unexpected long-live rate flows

        - UNEXPECTED_LARGE_RATE_FLOW: Unexpected large rate flows

        - UNEXPECTED_WAKEUP: Unexpected wakeup

        - SUSPICION_OF_DDOS_ATTACK: Suspicion of DDoS attack

        - WRONG_DESTINATION_ADDRESS: Wrong destination address

        - TOO_FREQUENT_SERVICE_ACCESS: Too frequent Service Access

        - UNEXPECTED_RADIO_LINK_FAILURES: Unexpected radio link failures

        - PING_PONG_ACROSS_CELLS: Ping-ponging across neighbouring cells

        '
    ExceptionTrend:
      anyOf:
      - type: string
        enum:
        - UP
        - DOWN
        - UNKNOW
        - STABLE
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: 'Possible values are:

        - UP: Up trend of the exception level.

        - DOWN: Down trend of the exception level.

        - UNKNOW: Unknown trend of the exception level.

        - STABLE: Stable trend of the exception level.

        '
    Exception:
      description: Represents the Exception information.
      type: object
      properties:
        excepId:
          $ref: '#/components/schemas/ExceptionId'
        excepLevel:
          type: integer
        excepTrend:
          $ref: '#/components/schemas/ExceptionTrend'
      required:
      - excepId
    ExceptionInfo:
      description: Represents the exceptions information provided by the AF.
      type: object
      properties:
        ipTrafficFilter:
          $ref: '#/components/schemas/FlowInfo'
        ethTrafficFilter:
          $ref: '#/components/schemas/EthFlowDescription'
        exceps:
          type: array
          items:
            $ref: '#/components/schemas/Exception'
          minItems: 1
      required:
      - exceps
      oneOf:
      - required:
        - ipTrafficFilter
      - required:
        - ethTrafficFilter
    BitRate:
      type: string
      pattern: ^\d+(\.\d+)? (bps|Kbps|Mbps|Gbps|Tbps)$
      description: 'String representing a bit rate; the prefixes follow the standard
        symbols from The International System of Units, and represent x1000 multipliers,
        with the exception that prefix "K" is used to represent the standard symbol
        "k".

        '
    UserDataCongestionCollection:
      description: Contains User Data Congestion Analytics related information collection.
      type: object
      properties:
        appId:
          $ref: '#/components/schemas/ApplicationId'
        ipTrafficFilter:
          $ref: '#/components/schemas/FlowInfo'
        timeInterv:
          $ref: '#/components/schemas/TimeWindow'
        thrputUl:
          $ref: '#/components/schemas/BitRate'
        thrputDl:
          $ref: '#/components/schemas/BitRate'
        thrputPkUl:
          $ref: '#/components/schemas/BitRate'
        thrputPkDl:
          $ref: '#/components/schemas/BitRate'
      oneOf:
      - required:
        - appId
      - required:
        - ipTrafficFilter
    Ipv6Prefix:
      type: string
      allOf:
      - pattern: ^((:|(0?|([1-9a-f][0-9a-f]{0,3}))):)((0?|([1-9a-f][0-9a-f]{0,3})):){0,6}(:|(0?|([1-9a-f][0-9a-f]{0,3})))(\/(([0-9])|([0-9]{2})|(1[0-1][0-9])|(12[0-8])))$
      - pattern: ^((([^:]+:){7}([^:]+))|((([^:]+:)*[^:]+)?::(([^:]+:)*[^:]+)?))(\/.+)$
      example: 2001:db8:abcd:12::0/64
      description: 'String identifying an IPv6 address prefix formatted according
        to clause 4 of RFC 5952. IPv6Prefix data type may contain an individual /128
        IPv6 address.

        '
    IpAddr:
      description: Contains an IP adresse.
      type: object
      oneOf:
      - required:
        - ipv4Addr
      - required:
        - ipv6Addr
      - required:
        - ipv6Prefix
      properties:
        ipv4Addr:
          $ref: '#/components/schemas/Ipv4Addr'
        ipv6Addr:
          $ref: '#/components/schemas/Ipv6Addr'
        ipv6Prefix:
          $ref: '#/components/schemas/Ipv6Prefix'
    AddrFqdn:
      description: IP address and/or FQDN.
      type: object
      properties:
        ipAddr:
          $ref: '#/components/schemas/IpAddr'
        fqdn:
          type: string
          description: Indicates an FQDN.
    PacketDelBudget:
      type: integer
      minimum: 1
      description: 'Unsigned integer indicating Packet Delay Budget (see clauses 5.7.3.4
        and 5.7.4 of 3GPP TS 23.501), expressed in milliseconds.

        '
    PacketLossRate:
      type: integer
      minimum: 0
      maximum: 1000
      description: 'Unsigned integer indicating Packet Loss Rate (see clauses 5.7.2.8
        and 5.7.4 of 3GPP TS 23.501), expressed in tenth of percent.

        '
    PerformanceData:
      description: Contains Performance Data.
      type: object
      properties:
        pdb:
          $ref: '#/components/schemas/PacketDelBudget'
        plr:
          $ref: '#/components/schemas/PacketLossRate'
        thrputUl:
          $ref: '#/components/schemas/BitRate'
        thrputDl:
          $ref: '#/components/schemas/BitRate'
    Gpsi:
      type: string
      pattern: ^(msisdn-[0-9]{5,15}|extid-[^@]+@[^@]+|.+)$
      description: "String identifying a Gpsi shall contain either an External Id\
        \ or an MSISDN.  It shall be formatted as follows -External Identifier= \"\
        extid-'extid', where 'extid'  shall be formatted according to clause 19.7.2\
        \ of 3GPP TS 23.003 that describes an  External Identifier. \n"
    schemas-DurationSec:
      type: integer
      minimum: 0
      description: Unsigned integer identifying a period of time in units of seconds.
    UsageThreshold:
      description: Represents a usage threshold.
      type: object
      properties:
        duration:
          $ref: '#/components/schemas/schemas-DurationSec'
        totalVolume:
          $ref: '#/components/schemas/Volume'
        downlinkVolume:
          $ref: '#/components/schemas/Volume'
        uplinkVolume:
          $ref: '#/components/schemas/Volume'
    DispersionCollection:
      description: Contains the dispersion information collected for an AF.
      type: object
      properties:
        gpsi:
          $ref: '#/components/schemas/Gpsi'
        supi:
          $ref: '#/components/schemas/Supi'
        ueAddr:
          $ref: '#/components/schemas/IpAddr'
        dataUsage:
          $ref: '#/components/schemas/UsageThreshold'
        flowDesp:
          $ref: '#/components/schemas/FlowDescription'
        appId:
          $ref: '#/components/schemas/ApplicationId'
        dnais:
          type: array
          items:
            $ref: '#/components/schemas/Dnai'
          minItems: 1
        appDur:
          $ref: '#/components/schemas/DurationSec'
      required:
      - dataUsage
      oneOf:
      - required:
        - gpsi
      - required:
        - supi
      - required:
        - ueAddr
    Point:
      description: Ellipsoid Point.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - point
        properties:
          point:
            $ref: '#/components/schemas/GeographicalCoordinates'
    GADShape:
      description: Common base type for GAD shapes.
      type: object
      required:
      - shape
      properties:
        shape:
          $ref: '#/components/schemas/SupportedGADShapes'
      discriminator:
        propertyName: shape
        mapping:
          POINT: '#/components/schemas/Point'
          POINT_UNCERTAINTY_CIRCLE: '#/components/schemas/PointUncertaintyCircle'
          POINT_UNCERTAINTY_ELLIPSE: '#/components/schemas/PointUncertaintyEllipse'
          POLYGON: '#/components/schemas/Polygon'
          POINT_ALTITUDE: '#/components/schemas/PointAltitude'
          POINT_ALTITUDE_UNCERTAINTY: '#/components/schemas/PointAltitudeUncertainty'
          ELLIPSOID_ARC: '#/components/schemas/EllipsoidArc'
          LOCAL_2D_POINT_UNCERTAINTY_ELLIPSE: '#/components/schemas/Local2dPointUncertaintyEllipse'
          LOCAL_3D_POINT_UNCERTAINTY_ELLIPSOID: '#/components/schemas/Local3dPointUncertaintyEllipsoid'
    GeographicalCoordinates:
      description: Geographical coordinates.
      type: object
      required:
      - lon
      - lat
      properties:
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
    Uncertainty:
      description: Indicates value of uncertainty.
      type: number
      format: float
      minimum: 0
    PointUncertaintyCircle:
      description: Ellipsoid point with uncertainty circle.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - point
        - uncertainty
        properties:
          point:
            $ref: '#/components/schemas/GeographicalCoordinates'
          uncertainty:
            $ref: '#/components/schemas/Uncertainty'
    Orientation:
      description: Indicates value of orientation angle.
      type: integer
      minimum: 0
      maximum: 180
    UncertaintyEllipse:
      description: Ellipse with uncertainty.
      type: object
      required:
      - semiMajor
      - semiMinor
      - orientationMajor
      properties:
        semiMajor:
          $ref: '#/components/schemas/Uncertainty'
        semiMinor:
          $ref: '#/components/schemas/Uncertainty'
        orientationMajor:
          $ref: '#/components/schemas/Orientation'
    Confidence:
      description: Indicates value of confidence.
      type: integer
      minimum: 0
      maximum: 100
    PointUncertaintyEllipse:
      description: Ellipsoid point with uncertainty ellipse.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - point
        - uncertaintyEllipse
        - confidence
        properties:
          point:
            $ref: '#/components/schemas/GeographicalCoordinates'
          uncertaintyEllipse:
            $ref: '#/components/schemas/UncertaintyEllipse'
          confidence:
            $ref: '#/components/schemas/Confidence'
    PointList:
      description: List of points.
      type: array
      items:
        $ref: '#/components/schemas/GeographicalCoordinates'
      minItems: 3
      maxItems: 15
    Polygon:
      description: Polygon.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - pointList
        properties:
          pointList:
            $ref: '#/components/schemas/PointList'
    Altitude:
      description: Indicates value of altitude.
      type: number
      format: double
      minimum: -32767
      maximum: 32767
    PointAltitude:
      description: Ellipsoid point with altitude.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - point
        - altitude
        properties:
          point:
            $ref: '#/components/schemas/GeographicalCoordinates'
          altitude:
            $ref: '#/components/schemas/Altitude'
    PointAltitudeUncertainty:
      description: Ellipsoid point with altitude and uncertainty ellipsoid.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - point
        - altitude
        - uncertaintyEllipse
        - uncertaintyAltitude
        - confidence
        properties:
          point:
            $ref: '#/components/schemas/GeographicalCoordinates'
          altitude:
            $ref: '#/components/schemas/Altitude'
          uncertaintyEllipse:
            $ref: '#/components/schemas/UncertaintyEllipse'
          uncertaintyAltitude:
            $ref: '#/components/schemas/Uncertainty'
          confidence:
            $ref: '#/components/schemas/Confidence'
          vConfidence:
            $ref: '#/components/schemas/Confidence'
    InnerRadius:
      description: Indicates value of the inner radius.
      type: integer
      format: int32
      minimum: 0
      maximum: 327675
    Angle:
      description: Indicates value of angle.
      type: integer
      minimum: 0
      maximum: 360
    EllipsoidArc:
      description: Ellipsoid Arc.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - point
        - innerRadius
        - uncertaintyRadius
        - offsetAngle
        - includedAngle
        - confidence
        properties:
          point:
            $ref: '#/components/schemas/GeographicalCoordinates'
          innerRadius:
            $ref: '#/components/schemas/InnerRadius'
          uncertaintyRadius:
            $ref: '#/components/schemas/Uncertainty'
          offsetAngle:
            $ref: '#/components/schemas/Angle'
          includedAngle:
            $ref: '#/components/schemas/Angle'
          confidence:
            $ref: '#/components/schemas/Confidence'
    LocalOrigin:
      description: Indicates a Local origin in a reference system
      type: object
      properties:
        coordinateId:
          type: string
        point:
          $ref: '#/components/schemas/GeographicalCoordinates'
    RelativeCartesianLocation:
      description: Relative Cartesian Location
      type: object
      required:
      - x
      - y
      properties:
        x:
          $ref: '#/components/schemas/Float'
        y:
          $ref: '#/components/schemas/Float'
        z:
          $ref: '#/components/schemas/Float'
    Local2dPointUncertaintyEllipse:
      description: Local 2D point with uncertainty ellipse
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - localOrigin
        - point
        - uncertaintyEllipse
        - confidence
        properties:
          localOrigin:
            $ref: '#/components/schemas/LocalOrigin'
          point:
            $ref: '#/components/schemas/RelativeCartesianLocation'
          uncertaintyEllipse:
            $ref: '#/components/schemas/UncertaintyEllipse'
          confidence:
            $ref: '#/components/schemas/Confidence'
    UncertaintyEllipsoid:
      description: Ellipsoid with uncertainty
      type: object
      required:
      - semiMajor
      - semiMinor
      - vertical
      - orientationMajor
      properties:
        semiMajor:
          $ref: '#/components/schemas/Uncertainty'
        semiMinor:
          $ref: '#/components/schemas/Uncertainty'
        vertical:
          $ref: '#/components/schemas/Uncertainty'
        orientationMajor:
          $ref: '#/components/schemas/Orientation'
    Local3dPointUncertaintyEllipsoid:
      description: Local 3D point with uncertainty ellipsoid
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - localOrigin
        - point
        - uncertaintyEllipsoid
        - confidence
        properties:
          localOrigin:
            $ref: '#/components/schemas/LocalOrigin'
          point:
            $ref: '#/components/schemas/RelativeCartesianLocation'
          uncertaintyEllipsoid:
            $ref: '#/components/schemas/UncertaintyEllipsoid'
          confidence:
            $ref: '#/components/schemas/Confidence'
    SupportedGADShapes:
      description: Indicates supported GAD shapes.
      anyOf:
      - type: string
        enum:
        - POINT
        - POINT_UNCERTAINTY_CIRCLE
        - POINT_UNCERTAINTY_ELLIPSE
        - POLYGON
        - POINT_ALTITUDE
        - POINT_ALTITUDE_UNCERTAINTY
        - ELLIPSOID_ARC
        - LOCAL_2D_POINT_UNCERTAINTY_ELLIPSE
        - LOCAL_3D_POINT_UNCERTAINTY_ELLIPSOID
      - type: string
    GeographicArea:
      description: Geographic area specified by different shape.
      anyOf:
      - $ref: '#/components/schemas/Point'
      - $ref: '#/components/schemas/PointUncertaintyCircle'
      - $ref: '#/components/schemas/PointUncertaintyEllipse'
      - $ref: '#/components/schemas/Polygon'
      - $ref: '#/components/schemas/PointAltitude'
      - $ref: '#/components/schemas/PointAltitudeUncertainty'
      - $ref: '#/components/schemas/EllipsoidArc'
    CivicAddress:
      description: Indicates a Civic address.
      type: object
      properties:
        country:
          type: string
        A1:
          type: string
        A2:
          type: string
        A3:
          type: string
        A4:
          type: string
        A5:
          type: string
        A6:
          type: string
        PRD:
          type: string
        POD:
          type: string
        STS:
          type: string
        HNO:
          type: string
        HNS:
          type: string
        LMK:
          type: string
        LOC:
          type: string
        NAM:
          type: string
        PC:
          type: string
        BLD:
          type: string
        UNIT:
          type: string
        FLR:
          type: string
        ROOM:
          type: string
        PLC:
          type: string
        PCN:
          type: string
        POBOX:
          type: string
        ADDCODE:
          type: string
        SEAT:
          type: string
        RD:
          type: string
        RDSEC:
          type: string
        RDBR:
          type: string
        RDSUBBR:
          type: string
        PRM:
          type: string
        POM:
          type: string
        usageRules:
          type: string
        method:
          type: string
        providedBy:
          type: string
    LocationArea5G:
      description: Represents a user location area when the UE is attached to 5G.
      type: object
      properties:
        geographicAreas:
          type: array
          items:
            $ref: '#/components/schemas/GeographicArea'
          minItems: 0
          description: Identifies a list of geographic area of the user where the
