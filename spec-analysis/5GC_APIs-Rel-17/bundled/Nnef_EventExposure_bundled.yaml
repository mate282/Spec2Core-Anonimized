        civicAddresses:
          type: array
          items:
            $ref: '#/components/schemas/CivicAddress'
          minItems: 0
          description: Identifies a list of civic addresses of the user where the
            UE is located.
        nwAreaInfo:
          $ref: '#/components/schemas/NetworkAreaInfo'
    PerUeAttribute:
      description: UE application data collected per UE.
      type: object
      properties:
        ueDest:
          $ref: '#/components/schemas/LocationArea5G'
        route:
          type: string
        avgSpeed:
          $ref: '#/components/schemas/BitRate'
        timeOfArrival:
          $ref: '#/components/schemas/DateTime'
    CollectiveBehaviourInfo:
      description: Contains the collective behaviour information to be reported to
        the subscriber.
      type: object
      properties:
        colAttrib:
          type: array
          items:
            $ref: '#/components/schemas/PerUeAttribute'
          minItems: 1
        noOfUes:
          type: integer
          description: Total number of UEs that fulfil a collective within the area
            of interest.
        appIds:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationId'
          minItems: 1
        extUeIds:
          type: array
          items:
            $ref: '#/components/schemas/Gpsi'
          minItems: 1
        ueIds:
          type: array
          items:
            $ref: '#/components/schemas/Supi'
          minItems: 1
      required:
      - colAttrib
      oneOf:
      - required:
        - extUeIds
      - required:
        - ueIds
    MsQoeMetricsCollection:
      description: 'Contains the Media Streaming QoE metrics information collected
        for an UE Application via AF.

        '
      type: object
      properties:
        msQoeMetrics:
          type: array
          items:
            type: string
          minItems: 1
      required:
      - msQoeMetrics
    MsConsumptionCollection:
      description: 'Contains the Media Streaming Consumption information collected
        for an UE Application via AF.

        '
      type: object
      properties:
        msConsumps:
          type: array
          items:
            type: string
            description: 'Represents the Media Streaming Consumption reports with
              formatting as specified in  clause 11.3.3 of 3GPP TS 26.512 [30], if
              required for Media Streaming UE Application.

              '
          minItems: 1
      required:
      - msConsumps
    ResourceId:
      type: string
      description: String chosen by the 5GMS AF to serve as an identifier in a resource
        URI.
    IpPacketFilterSet:
      type: object
      required:
      - direction
      properties:
        srcIp:
          type: string
        dstIp:
          type: string
        protocol:
          type: integer
        srcPort:
          type: integer
        dstPort:
          type: integer
        toSTc:
          type: string
        flowLabel:
          type: integer
        spi:
          type: integer
        direction:
          type: string
    ServiceDataFlowDescription:
      type: object
      properties:
        flowDescription:
          $ref: '#/components/schemas/IpPacketFilterSet'
        domainName:
          type: string
    MediaType:
      description: Indicates the media type of a media component.
      anyOf:
      - type: string
        enum:
        - AUDIO
        - VIDEO
        - DATA
        - APPLICATION
        - CONTROL
        - TEXT
        - MESSAGE
        - OTHER
      - type: string
    M5QoSSpecification:
      type: object
      required:
      - marBwDlBitRate
      - marBwUlBitRate
      - mirBwDlBitRate
      - mirBwUlBitRate
      properties:
        marBwDlBitRate:
          $ref: '#/components/schemas/BitRate'
        marBwUlBitRate:
          $ref: '#/components/schemas/BitRate'
        minDesBwDlBitRate:
          $ref: '#/components/schemas/BitRate'
        minDesBwUlBitRate:
          $ref: '#/components/schemas/BitRate'
        mirBwDlBitRate:
          $ref: '#/components/schemas/BitRate'
        mirBwUlBitRate:
          $ref: '#/components/schemas/BitRate'
        desLatency:
          type: integer
          minimum: 0
        desLoss:
          type: integer
          minimum: 0
    AbsoluteUrl:
      type: string
      format: uri
      description: Absolute Uniform Resource Locator, conforming with the "absolute-URI"
        production specified in IETF RFC 3986, section 4.3 in which the scheme part
        is "http" or "https". Note that the "query" suffix is permitted by this production
        but the "fragment" suffix is not.
    NetworkAssistanceSession:
      description: A representation of a Network Assistance Session resource.
      type: object
      required:
      - naSessionId
      - provisioningSessionId
      - serviceDataFlowDescriptions
      properties:
        naSessionId:
          $ref: '#/components/schemas/ResourceId'
        provisioningSessionId:
          $ref: '#/components/schemas/ResourceId'
        serviceDataFlowDescriptions:
          type: array
          items:
            $ref: '#/components/schemas/ServiceDataFlowDescription'
          minItems: 1
        mediaType:
          $ref: '#/components/schemas/MediaType'
        policyTemplateId:
          $ref: '#/components/schemas/ResourceId'
        requestedQoS:
          $ref: '#/components/schemas/M5QoSSpecification'
        recommendedQoS:
          $ref: '#/components/schemas/M5QoSSpecification'
        notficationURL:
          $ref: '#/components/schemas/AbsoluteUrl'
    MsNetAssInvocationCollection:
      description: 'Contains the Media Streaming Network Assistance invocation collected
        for an UE Application  via AF.

        '
      type: object
      properties:
        msNetAssInvocs:
          type: array
          items:
            $ref: '#/components/schemas/NetworkAssistanceSession'
          minItems: 1
      required:
      - msNetAssInvocs
    DynamicPolicy:
      description: A representation of a Dynamic Policy resource.
      type: object
      required:
      - dynamicPolicyId
      - policyTemplateId
      - serviceDataFlowDescriptions
      - provisioningSessionId
      properties:
        dynamicPolicyId:
          $ref: '#/components/schemas/ResourceId'
        policyTemplateId:
          $ref: '#/components/schemas/ResourceId'
        serviceDataFlowDescriptions:
          type: array
          items:
            $ref: '#/components/schemas/ServiceDataFlowDescription'
        mediaType:
          $ref: '#/components/schemas/MediaType'
        provisioningSessionId:
          $ref: '#/components/schemas/ResourceId'
        qosSpecification:
          $ref: '#/components/schemas/M5QoSSpecification'
        enforcementMethod:
          type: string
        enforcementBitRate:
          type: integer
    MsDynPolicyInvocationCollection:
      description: 'Contains the Media Streaming Dynamic Policy invocation collected
        for an UE Application via AF.

        '
      type: object
      properties:
        msDynPlyInvocs:
          type: array
          items:
            $ref: '#/components/schemas/DynamicPolicy'
          minItems: 1
      required:
      - msDynPlyInvocs
    BaseRecord:
      description: Abstract base data type for UE data reporting records.
      type: object
      properties:
        timestamp:
          $ref: '#/components/schemas/DateTime'
      required:
      - timestamp
    Uint16:
      type: integer
      minimum: 0
      maximum: 65535
      description: Integer where the allowed values correspond to the value range
        of an unsigned 16-bit integer.
    EndpointAddress:
      type: object
      required:
      - portNumber
      properties:
        hostname:
          type: string
        ipv4Addr:
          $ref: '#/components/schemas/Ipv4Addr'
        ipv6Addr:
          $ref: '#/components/schemas/Ipv6Addr'
        portNumber:
          $ref: '#/components/schemas/Uint16'
    CacheStatus:
      anyOf:
      - type: string
        enum:
        - HIT
        - MISS
        - EXPIRED
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
    MediaStreamingAccessRecord:
      allOf:
      - $ref: '#/components/schemas/BaseRecord'
      - type: object
        required:
        - mediaStreamHandlerEndpointAddress
        - applicationServerEndpointAddress
        - requestMessage
        - responseMessage
        - processingLatency
        properties:
          mediaStreamHandlerEndpointAddress:
            $ref: '#/components/schemas/EndpointAddress'
          applicationServerEndpointAddress:
            $ref: '#/components/schemas/EndpointAddress'
          sessionIdentifier:
            type: string
          requestMessage:
            type: object
            required:
            - method
            - url
            - protocolVersion
            - size
            - bodySize
            properties:
              method:
                type: string
              url:
                $ref: '#/components/schemas/AbsoluteUrl'
              protocolVersion:
                type: string
              range:
                type: string
              size:
                $ref: '#/components/schemas/Uinteger'
              bodySize:
                $ref: '#/components/schemas/Uinteger'
              contentType:
                type: string
              userAgent:
                type: string
              userIdentity:
                type: string
              referer:
                $ref: '#/components/schemas/AbsoluteUrl'
          cacheStatus:
            $ref: '#/components/schemas/CacheStatus'
          responseMessage:
            type: object
            required:
            - responseCode
            - size
            - bodySize
            properties:
              responseCode:
                $ref: '#/components/schemas/Uinteger'
              size:
                $ref: '#/components/schemas/Uinteger'
              bodySize:
                $ref: '#/components/schemas/Uinteger'
              contentType:
                type: string
          processingLatency:
            $ref: '#/components/schemas/Float'
          connectionMetrics:
            type: object
            required:
            - meanNetworkRoundTripTime
            - networkRoundTripTimeVariation
            - congestionWindowSize
            properties:
              meanNetworkRoundTripTime:
                $ref: '#/components/schemas/Float'
              networkRoundTripTimeVariation:
                $ref: '#/components/schemas/Float'
              congestionWindowSize:
                $ref: '#/components/schemas/Uinteger'
    MSAccessActivityCollection:
      description: Contains Media Streaming access activity collected for an UE Application
        via AF.
      type: object
      properties:
        msAccActs:
          type: array
          items:
            $ref: '#/components/schemas/MediaStreamingAccessRecord'
          minItems: 1
      required:
      - msAccActs
    SupportedFeatures:
      type: string
      pattern: ^[A-Fa-f0-9]*$
      description: "A string used to indicate the features supported by an API that\
        \ is used as defined in clause  6.6 in 3GPP TS 29.500. The string shall contain\
        \ a bitmask indicating supported features in  hexadecimal representation Each\
        \ character in the string shall take a value of \"0\" to \"9\",  \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent the support of 4 features as\
        \ described in  table\_5.2.2-3. The most significant character representing\
        \ the highest-numbered features shall  appear first in the string, and the\
        \ character representing features 1 to 4 shall appear last  in the string.\
        \ The list of features and their numbering (starting with 1) are defined \
        \ separately for each API. If the string contains a lower number of characters\
        \ than there are  defined features for an API, all features that would be\
        \ represented by characters that are not  present in the string are not supported.\n"
    InvalidParam:
      type: object
      properties:
        param:
          type: string
          description: 'If the invalid parameter is an attribute in a JSON body, this
            IE shall contain the  attribute''s name and shall be encoded as a JSON
            Pointer. If the invalid parameter is  an HTTP header, this IE shall be
            formatted as the concatenation of the string "header "  plus the name
            of such header. If the invalid parameter is a query parameter, this IE  shall
            be formatted as the concatenation of the string "query " plus the name
            of such  query parameter. If the invalid parameter is a variable part
            in the path of a resource  URI, this IE shall contain the name of the
            variable, including the symbols "{" and "}"  used in OpenAPI specification
            as the notation to represent variable path segments.

            '
        reason:
          type: string
          description: 'A human-readable reason, e.g. "must be a positive integer".
            In cases involving failed  operations in a PATCH request, the reason string
            should identify the operation that  failed using the operation''s array
            index to assist in correlation of the invalid  parameter with the failed
            operation, e.g." Replacement value invalid for attribute  (failed operation
            index= 4)"

            '
      required:
      - param
      description: It contains an invalid parameter and a related description.
    AccessTokenErr:
      description: Error returned in the access token response message
      type: object
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - invalid_request
          - invalid_client
          - invalid_grant
          - unauthorized_client
          - unsupported_grant_type
          - invalid_scope
        error_description:
          type: string
        error_uri:
          type: string
    NfInstanceId:
      type: string
      format: uuid
      description: "String uniquely identifying a NF instance. The format of the NF\
        \ Instance ID shall be a  Universally Unique Identifier (UUID) version 4,\
        \ as described in IETF RFC 4122. \n"
    NFType:
      description: NF types known to NRF
      anyOf:
      - type: string
        enum:
        - NRF
        - UDM
        - AMF
        - SMF
        - AUSF
        - NEF
        - PCF
        - SMSF
        - NSSF
        - UDR
        - LMF
        - GMLC
        - 5G_EIR
        - SEPP
        - UPF
        - N3IWF
        - AF
        - UDSF
        - BSF
        - CHF
        - NWDAF
        - PCSCF
        - CBCF
        - HSS
        - UCMF
        - SOR_AF
        - SPAF
        - MME
        - SCSAS
        - SCEF
        - SCP
        - NSSAAF
        - ICSCF
        - SCSCF
        - DRA
        - IMS_AS
        - AANF
        - 5G_DDNMF
        - NSACF
        - MFAF
        - EASDF
        - DCCF
        - MB_SMF
        - TSCTSF
        - ADRF
        - GBA_BSF
        - CEF
        - MB_UPF
        - NSWOF
        - PKMF
        - MNPF
        - SMS_GMSC
        - SMS_IWMSC
        - MBSF
        - MBSTF
        - PANF
        - IP_SM_GW
        - SMS_ROUTER
      - type: string
    Snssai:
      type: object
      properties:
        sst:
          type: integer
          minimum: 0
          maximum: 255
          description: "Unsigned integer, within the range 0 to 255, representing\
            \ the Slice/Service Type.  It indicates the expected Network Slice behaviour\
            \ in terms of features and services. Values 0 to 127 correspond to the\
            \ standardized SST range. Values 128 to 255 correspond  to the Operator-specific\
            \ range. See clause 28.4.2 of 3GPP TS 23.003. Standardized values are\
            \ defined in clause 5.15.2.2 of 3GPP TS 23.501. \n"
        sd:
          type: string
          pattern: ^[A-Fa-f0-9]{6}$
          description: '3-octet string, representing the Slice Differentiator, in
            hexadecimal representation. Each character in the string shall take a
            value of "0" to "9", "a" to "f" or "A" to "F" and shall represent 4 bits.
            The most significant character representing the 4 most significant bits
            of the SD shall appear first in the string, and the character representing
            the 4 least significant bit of the SD shall appear last in the string.
            This is an optional parameter that complements the Slice/Service type(s)
            to allow to  differentiate amongst multiple Network Slices of the same
            Slice/Service type. This IE shall be absent if no SD value is associated
            with the SST.

            '
      description: 'When Snssai needs to be converted to string (e.g. when used in
        maps as key), the string shall be composed of one to three digits "sst" optionally
        followed by "-" and 6 hexadecimal digits "sd".

        '
      required:
      - sst
    Fqdn:
      description: Fully Qualified Domain Name
      type: string
      pattern: ^([0-9A-Za-z]([-0-9A-Za-z]{0,61}[0-9A-Za-z])?\.)+[A-Za-z]{2,63}\.?$
      minLength: 4
      maxLength: 253
    PlmnIdNid:
      description: 'Contains the serving core network operator PLMN ID and, for an
        SNPN, the NID that together with the PLMN ID identifies the SNPN.

        '
      type: object
      required:
      - mcc
      - mnc
      properties:
        mcc:
          $ref: '#/components/schemas/Mcc'
        mnc:
          $ref: '#/components/schemas/Mnc'
        nid:
          $ref: '#/components/schemas/Nid'
    NfSetId:
      type: string
      description: "NF Set Identifier (see clause 28.12 of 3GPP TS 23.003), formatted\
        \ as the following string \"set<Set ID>.<nftype>set.5gc.mnc<MNC>.mcc<MCC>\"\
        , or  \"set<SetID>.<NFType>set.5gc.nid<NID>.mnc<MNC>.mcc<MCC>\" with  <MCC>\
        \ encoded as defined in clause 5.4.2 (\"Mcc\" data type definition)  <MNC>\
        \ encoding the Mobile Network Code part of the PLMN, comprising 3 digits.\
        \ \n  If there are only 2 significant digits in the MNC, one \"0\" digit shall\
        \ be inserted \n  at the left side to fill the 3 digits coding of MNC.  Pattern:\
        \ '^[0-9]{3}$'\n<NFType> encoded as a value defined in Table 6.1.6.3.3-1 of\
        \ 3GPP TS 29.510 but \n  with lower case characters <Set ID> encoded as a\
        \ string of characters consisting of \n  alphabetic characters (A-Z and a-z),\
        \ digits (0-9) and/or the hyphen (-) and that \n  shall end with either an\
        \ alphabetic character or a digit. \n"
    NfServiceSetId:
      type: string
      description: "NF Service Set Identifier (see clause 28.12 of 3GPP TS 23.003)\
        \ formatted as the following  string \"set<Set ID>.sn<Service Name>.nfi<NF\
        \ Instance ID>.5gc.mnc<MNC>.mcc<MCC>\", or  \"set<SetID>.sn<ServiceName>.nfi<NFInstanceID>.5gc.nid<NID>.mnc<MNC>.mcc<MCC>\"\
        \ with  <MCC> encoded as defined in clause 5.4.2 (\"Mcc\" data type definition)\
        \   <MNC> encoding the Mobile Network Code part of the PLMN, comprising 3\
        \ digits. \n  If there are only 2 significant digits in the MNC, one \"0\"\
        \ digit shall be inserted \n  at the left side to fill the 3 digits coding\
        \ of MNC.  Pattern: '^[0-9]{3}$'\n<NID> encoded as defined in clause\_5.4.2\
        \ (\"Nid\" data type definition)  <NFInstanceId> encoded as defined in clause\
        \ 5.3.2  <ServiceName> encoded as defined in 3GPP TS 29.510  <Set ID> encoded\
        \ as a string of characters consisting of alphabetic \n  characters (A-Z and\
        \ a-z), digits (0-9) and/or the hyphen (-) and that shall end \n  with either\
        \ an alphabetic character or a digit.\n"
    AccessTokenReq:
      description: Contains information related to the access token request
      type: object
      required:
      - grant_type
      - nfInstanceId
      - scope
      properties:
        grant_type:
          type: string
          enum:
          - client_credentials
        nfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        nfType:
          $ref: '#/components/schemas/NFType'
        targetNfType:
          $ref: '#/components/schemas/NFType'
        scope:
          type: string
          pattern: ^([a-zA-Z0-9_:-]+)( [a-zA-Z0-9_:-]+)*$
        targetNfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        requesterPlmn:
          $ref: '#/components/schemas/PlmnId'
        requesterPlmnList:
          type: array
          items:
            $ref: '#/components/schemas/PlmnId'
          minItems: 2
        requesterSnssaiList:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        requesterFqdn:
          $ref: '#/components/schemas/Fqdn'
        requesterSnpnList:
          type: array
          items:
            $ref: '#/components/schemas/PlmnIdNid'
          minItems: 1
        targetPlmn:
          $ref: '#/components/schemas/PlmnId'
        targetSnpn:
          $ref: '#/components/schemas/PlmnIdNid'
        targetSnssaiList:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        targetNsiList:
          type: array
          items:
            type: string
          minItems: 1
        targetNfSetId:
          $ref: '#/components/schemas/NfSetId'
        targetNfServiceSetId:
          $ref: '#/components/schemas/NfServiceSetId'
        hnrfAccessTokenUri:
          $ref: '#/components/schemas/Uri'
        sourceNfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
    ProblemDetails:
      description: Provides additional information in an error response.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/Uri'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of
            the problem.
        instance:
          $ref: '#/components/schemas/Uri'
        cause:
          type: string
          description: 'A machine-readable application error cause specific to this
            occurrence of the problem.  This IE should be present and provide application-related
            error information, if available.

            '
        invalidParams:
          type: array
          items:
            $ref: '#/components/schemas/InvalidParam'
          minItems: 1
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        accessTokenError:
          $ref: '#/components/schemas/AccessTokenErr'
        accessTokenRequest:
          $ref: '#/components/schemas/AccessTokenReq'
        nrfId:
          $ref: '#/components/schemas/Fqdn'
    RedirectResponse:
      description: 'The response shall include a Location header field containing
        a different URI  (pointing to a different URI of an other service instance),
        or the same URI if a request  is redirected to the same target resource via
        a different SCP.

        '
      type: object
      properties:
        cause:
          type: string
        targetScp:
          $ref: '#/components/schemas/Uri'
        targetSepp:
          $ref: '#/components/schemas/Uri'
  responses:
    '307':
      description: Temporary Redirect
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RedirectResponse'
      headers:
        Location:
          description: The URI pointing to the resource located on the redirect target
          required: true
          schema:
            type: string
        3gpp-Sbi-Target-Nf-Id:
          description: Identifier of target NF (service) instance towards which the
            request is redirected
          schema:
            type: string
    '308':
      description: Permanent Redirect
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RedirectResponse'
      headers:
        Location:
          description: The URI pointing to the resource located on the redirect target
          required: true
          schema:
            type: string
        3gpp-Sbi-Target-Nf-Id:
          description: '''Identifier of target NF (service) instance towards which
            the request is redirected''

            '
          schema:
            type: string
    '400':
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '401':
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '403':
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '404':
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '406':
      description: 406 Not Acceptable
    '411':
      description: Length Required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '413':
      description: Payload Too Large
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '415':
      description: Unsupported Media Type
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '429':
      description: Too Many Requests
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '500':
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '503':
      description: Service Unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    default:
      description: Generic Error
