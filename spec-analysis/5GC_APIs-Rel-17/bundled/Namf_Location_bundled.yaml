openapi: 3.0.0
info:
  version: 1.2.4
  title: Namf_Location
  description: "AMF Location Service.  \n\xA9 2023, 3GPP Organizational Partners (ARIB,\
    \ ATIS, CCSA, ETSI, TSDSI, TTA, TTC).  \nAll rights reserved.\n"
servers:
- url: http://amf:8000/namf-loc/v1
security:
- {}
- oAuth2ClientCredentials:
  - namf-loc
externalDocs:
  description: 3GPP TS 29.518 V17.12.0; 5G System; Access and Mobility Management
    Services
  url: https://www.3gpp.org/ftp/Specs/archive/29_series/29.518/
paths:
  /{ueContextId}/provide-pos-info:
    post:
      summary: Namf_Location ProvidePositioningInfo service Operation
      tags:
      - Individual UE context (Document)
      operationId: ProvidePositioningInfo
      parameters:
      - name: ueContextId
        in: path
        description: UE Context Identifier
        required: true
        schema:
          type: string
          pattern: ^(imsi-[0-9]{5,15}|nai-.+|gli-.+|gci-.+|imei-[0-9]{15}|imeisv-[0-9]{16}|.+)$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPosInfo'
        required: true
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvidePosInfo'
        '204':
          description: Successful accept of location request with no information returned.
        '307':
          $ref: '#/components/responses/307'
        '308':
          $ref: '#/components/responses/308'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '411':
          $ref: '#/components/responses/411'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        '504':
          $ref: '#/components/responses/504'
        default:
          description: Unexpected error
      callbacks:
        onUELocationNotification:
          '{$request.body#/locationNotificationUri}':
            post:
              requestBody:
                description: UE Location Event Notification
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/NotifiedPosInfo'
              responses:
                '204':
                  description: Expected response to a successful callback processing
                '307':
                  $ref: '#/components/responses/307'
                '308':
                  $ref: '#/components/responses/308'
                '400':
                  $ref: '#/components/responses/400'
                '403':
                  $ref: '#/components/responses/403'
                '411':
                  $ref: '#/components/responses/411'
                '413':
                  $ref: '#/components/responses/413'
                '415':
                  $ref: '#/components/responses/415'
                '429':
                  $ref: '#/components/responses/429'
                '500':
                  $ref: '#/components/responses/500'
                '503':
                  $ref: '#/components/responses/503'
  /{ueContextId}/provide-loc-info:
    post:
      summary: Namf_Location ProvideLocationInfo service Operation
      tags:
      - Individual UE context (Document)
      operationId: ProvideLocationInfo
      parameters:
      - name: ueContextId
        in: path
        description: UE Context Identifier
        required: true
        schema:
          type: string
          pattern: ^(imsi-[0-9]{5,15}|nai-.+|gli-.+|gci-.+|imei-[0-9]{15}|imeisv-[0-9]{16}|.+)$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestLocInfo'
        required: true
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvideLocInfo'
        '307':
          $ref: '#/components/responses/307'
        '308':
          $ref: '#/components/responses/308'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '411':
          $ref: '#/components/responses/411'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          description: Unexpected error
  /{ueContextId}/cancel-pos-info:
    post:
      summary: Namf_Location CancelLocation service operation
      tags:
      - Individual UE context (Document)
      operationId: CancelLocation
      parameters:
      - name: ueContextId
        in: path
        description: UE Context Identifier
        required: true
        schema:
          type: string
          pattern: ^(imsi-[0-9]{5,15}|nai-.+|gli-.+|gci-.+|imei-[0-9]{15}|imeisv-[0-9]{16}|.+)$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelPosInfo'
        required: true
      responses:
        '204':
          description: Expected response to a successful cancellation
        '307':
          $ref: '#/components/responses/307'
        '308':
          $ref: '#/components/responses/308'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '411':
          $ref: '#/components/responses/411'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        '504':
          $ref: '#/components/responses/504'
        default:
          $ref: '#/components/responses/default'
components:
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://nrf:8000/oauth2/token
          scopes:
            namf-loc: Access to the Namf_Location API
  schemas:
    RequestPosInfo:
      description: Data within Provide Positioning Information Request
      type: object
      properties:
        lcsClientType:
          $ref: '#/components/schemas/ExternalClientType'
        lcsLocation:
          $ref: '#/components/schemas/LocationType'
        supi:
          $ref: '#/components/schemas/Supi'
        gpsi:
          $ref: '#/components/schemas/Gpsi'
        priority:
          $ref: '#/components/schemas/LcsPriority'
        lcsQoS:
          $ref: '#/components/schemas/LocationQoS'
        velocityRequested:
          $ref: '#/components/schemas/VelocityRequested'
        lcsSupportedGADShapes:
          $ref: '#/components/schemas/SupportedGADShapes'
        additionalLcsSuppGADShapes:
          type: array
          items:
            $ref: '#/components/schemas/SupportedGADShapes'
          minItems: 1
        locationNotificationUri:
          $ref: '#/components/schemas/Uri'
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        oldGuami:
          $ref: '#/components/schemas/Guami'
        pei:
          $ref: '#/components/schemas/Pei'
        lcsServiceType:
          $ref: '#/components/schemas/LcsServiceType'
        ldrType:
          $ref: '#/components/schemas/LdrType'
        hgmlcCallBackURI:
          $ref: '#/components/schemas/Uri'
        ldrReference:
          $ref: '#/components/schemas/LdrReference'
        periodicEventInfo:
          $ref: '#/components/schemas/PeriodicEventInfo'
        areaEventInfo:
          $ref: '#/components/schemas/AreaEventInfo'
        motionEventInfo:
          $ref: '#/components/schemas/MotionEventInfo'
        externalClientIdentification:
          $ref: '#/components/schemas/ExternalClientIdentification'
        afID:
          $ref: '#/components/schemas/NfInstanceId'
        codeWord:
          $ref: '#/components/schemas/CodeWord'
        uePrivacyRequirements:
          $ref: '#/components/schemas/UePrivacyRequirements'
        scheduledLocTime:
          $ref: '#/components/schemas/DateTime'
        reliableLocReq:
          type: boolean
          default: false
        integrityRequirements:
          $ref: '#/components/schemas/IntegrityRequirements'
      required:
      - lcsClientType
      - lcsLocation
    ProvidePosInfo:
      description: Data within Provide Positioning Information Response
      type: object
      properties:
        locationEstimate:
          $ref: '#/components/schemas/GeographicArea'
        localLocationEstimate:
          $ref: '#/components/schemas/LocalArea'
        accuracyFulfilmentIndicator:
          $ref: '#/components/schemas/AccuracyFulfilmentIndicator'
        ageOfLocationEstimate:
          $ref: '#/components/schemas/AgeOfLocationEstimate'
        timestampOfLocationEstimate:
          $ref: '#/components/schemas/DateTime'
        velocityEstimate:
          $ref: '#/components/schemas/VelocityEstimate'
        positioningDataList:
          type: array
          items:
            $ref: '#/components/schemas/PositioningMethodAndUsage'
          minItems: 0
          maxItems: 9
        gnssPositioningDataList:
          type: array
          items:
            $ref: '#/components/schemas/GnssPositioningMethodAndUsage'
          minItems: 0
          maxItems: 9
        ecgi:
          $ref: '#/components/schemas/Ecgi'
        ncgi:
          $ref: '#/components/schemas/Ncgi'
        targetServingNode:
          $ref: '#/components/schemas/NfInstanceId'
        targetMmeName:
          $ref: '#/components/schemas/Fqdn'
        targetMmeRealm:
          $ref: '#/components/schemas/Fqdn'
        utranSrvccInd:
          type: boolean
        civicAddress:
          $ref: '#/components/schemas/CivicAddress'
        barometricPressure:
          $ref: '#/components/schemas/BarometricPressure'
        altitude:
          $ref: '#/components/schemas/Altitude'
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        servingLMFIdentification:
          $ref: '#/components/schemas/LMFIdentification'
        locationPrivacyVerResult:
          $ref: '#/components/schemas/LocationPrivacyVerResult'
        achievedQos:
          $ref: '#/components/schemas/MinorLocationQoS'
        acceptedPeriodicEventInfo:
          $ref: '#/components/schemas/PeriodicEventInfo'
        haGnssMetrics:
          $ref: '#/components/schemas/HighAccuracyGnssMetrics'
    NotifiedPosInfo:
      description: Data within EventNotify notification
      type: object
      properties:
        locationEvent:
          $ref: '#/components/schemas/LocationEvent'
        supi:
          $ref: '#/components/schemas/Supi'
        gpsi:
          $ref: '#/components/schemas/Gpsi'
        pei:
          $ref: '#/components/schemas/Pei'
        locationEstimate:
          $ref: '#/components/schemas/GeographicArea'
        localLocationEstimate:
          $ref: '#/components/schemas/LocalArea'
        ageOfLocationEstimate:
          $ref: '#/components/schemas/AgeOfLocationEstimate'
        timestampOfLocationEstimate:
          $ref: '#/components/schemas/DateTime'
        velocityEstimate:
          $ref: '#/components/schemas/VelocityEstimate'
        positioningDataList:
          type: array
          items:
            $ref: '#/components/schemas/PositioningMethodAndUsage'
          minItems: 0
          maxItems: 9
        gnssPositioningDataList:
          type: array
          items:
            $ref: '#/components/schemas/GnssPositioningMethodAndUsage'
          minItems: 0
          maxItems: 9
        ecgi:
          $ref: '#/components/schemas/Ecgi'
        ncgi:
          $ref: '#/components/schemas/Ncgi'
        servingNode:
          $ref: '#/components/schemas/NfInstanceId'
        targetMmeName:
          $ref: '#/components/schemas/Fqdn'
        targetMmeRealm:
          $ref: '#/components/schemas/Fqdn'
        utranSrvccInd:
          type: boolean
        civicAddress:
          $ref: '#/components/schemas/CivicAddress'
        barometricPressure:
          $ref: '#/components/schemas/BarometricPressure'
        altitude:
          $ref: '#/components/schemas/Altitude'
        hgmlcCallBackURI:
          $ref: '#/components/schemas/Uri'
        ldrReference:
          $ref: '#/components/schemas/LdrReference'
        servingLMFIdentification:
          $ref: '#/components/schemas/LMFIdentification'
        terminationCause:
          $ref: '#/components/schemas/TerminationCause'
        achievedQos:
          $ref: '#/components/schemas/MinorLocationQoS'
        mscServerId:
          $ref: '#/components/schemas/E164Number'
        haGnssMetrics:
          $ref: '#/components/schemas/HighAccuracyGnssMetrics'
      required:
      - locationEvent
    RequestLocInfo:
      description: Data within Provide Location Information Request
      type: object
      properties:
        req5gsLoc:
          type: boolean
          default: false
        reqCurrentLoc:
          type: boolean
          default: false
        reqRatType:
          type: boolean
          default: false
        reqTimeZone:
          type: boolean
          default: false
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
    ProvideLocInfo:
      description: Data within Provide Location Information Response
      type: object
      properties:
        currentLoc:
          type: boolean
        location:
          $ref: '#/components/schemas/UserLocation'
        additionalLocation:
          $ref: '#/components/schemas/UserLocation'
        geoInfo:
          $ref: '#/components/schemas/GeographicArea'
        locationAge:
          $ref: '#/components/schemas/AgeOfLocationEstimate'
        ratType:
          $ref: '#/components/schemas/RatType'
        timezone:
          $ref: '#/components/schemas/TimeZone'
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        oldGuami:
          $ref: '#/components/schemas/Guami'
    CancelPosInfo:
      description: Data within a Cancel Location Request
      type: object
      properties:
        supi:
          $ref: '#/components/schemas/Supi'
        hgmlcCallBackURI:
          $ref: '#/components/schemas/Uri'
        ldrReference:
          $ref: '#/components/schemas/LdrReference'
        servingLMFIdentification:
          $ref: '#/components/schemas/LMFIdentification'
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
      required:
      - supi
      - hgmlcCallBackURI
      - ldrReference
    LocationType:
      description: Type of location measurement requested
      anyOf:
      - type: string
        enum:
        - CURRENT_LOCATION
        - CURRENT_OR_LAST_KNOWN_LOCATION
        - NOTIFICATION_VERIFICATION_ONLY
        - DEFERRED_LOCATION
      - type: string
    LocationEvent:
      description: Type of events initiating location procedures
      anyOf:
      - type: string
        enum:
        - EMERGENCY_CALL_ORIGINATION
        - EMERGENCY_CALL_RELEASE
        - EMERGENCY_CALL_HANDOVER
        - ACTIVATION_OF_DEFERRED_LOCATION
        - UE_MOBILITY_FOR_DEFERRED_LOCATION
        - CANCELLATION_OF_DEFERRED_LOCATION
      - type: string
    LocationPrivacyVerResult:
      description: The result of location privacy verification by UE
      anyOf:
      - type: string
        enum:
        - LOCATION_ALLOWED
        - LOCATION_NOT_ALLOWED
        - RESPONSE_TIME_OUT
      - type: string
    ExternalClientType:
      description: Indicates types of External Clients.
      anyOf:
      - type: string
        enum:
        - EMERGENCY_SERVICES
        - VALUE_ADDED_SERVICES
        - PLMN_OPERATOR_SERVICES
        - LAWFUL_INTERCEPT_SERVICES
        - PLMN_OPERATOR_BROADCAST_SERVICES
        - PLMN_OPERATOR_OM
        - PLMN_OPERATOR_ANONYMOUS_STATISTICS
        - PLMN_OPERATOR_TARGET_MS_SERVICE_SUPPORT
      - type: string
    Supi:
      type: string
      pattern: ^(imsi-[0-9]{5,15}|nai-.+|gci-.+|gli-.+|.+)$
      description: "String identifying a Supi that shall contain either an IMSI, a\
        \ network specific identifier,\na Global Cable Identifier (GCI) or a Global\
        \ Line Identifier (GLI) as specified in clause \n2.2A of 3GPP TS 23.003. It\
        \ shall be formatted as follows\n - for an IMSI \"imsi-<imsi>\", where <imsi>\
        \ shall be formatted according to clause 2.2\n   of 3GPP TS 23.003 that describes\
        \ an IMSI.\n - for a network specific identifier \"nai-<nai>, where <nai>\
        \ shall be formatted\n   according to clause 28.7.2 of 3GPP TS 23.003 that\
        \ describes an NAI.\n - for a GCI \"gci-<gci>\", where <gci> shall be formatted\
        \ according to clause 28.15.2\n   of 3GPP TS 23.003.\n - for a GLI \"gli-<gli>\"\
        , where <gli> shall be formatted according to clause 28.16.2 of\n   3GPP TS\
        \ 23.003.To enable that the value is used as part of an URI, the string shall\n\
        \   only contain characters allowed according to the \"lower-with-hyphen\"\
        \ naming convention\n   defined in 3GPP TS 29.501.\n"
    Gpsi:
      type: string
      pattern: ^(msisdn-[0-9]{5,15}|extid-[^@]+@[^@]+|.+)$
      description: "String identifying a Gpsi shall contain either an External Id\
        \ or an MSISDN.  It shall be formatted as follows -External Identifier= \"\
        extid-'extid', where 'extid'  shall be formatted according to clause 19.7.2\
        \ of 3GPP TS 23.003 that describes an  External Identifier. \n"
    LcsPriority:
      description: Indicates priority of the LCS client.
      anyOf:
      - type: string
        enum:
        - HIGHEST_PRIORITY
        - NORMAL_PRIORITY
      - type: string
    Accuracy:
      description: Indicates value of accuracy.
      type: number
      format: float
      minimum: 0
    ResponseTime:
      description: Indicates acceptable delay of location request.
      anyOf:
      - type: string
        enum:
        - LOW_DELAY
        - DELAY_TOLERANT
        - NO_DELAY
      - type: string
    MinorLocationQoS:
      description: Contain Minor Location QoS.
      type: object
      properties:
        hAccuracy:
          $ref: '#/components/schemas/Accuracy'
        vAccuracy:
          $ref: '#/components/schemas/Accuracy'
    LcsQosClass:
      description: Specifies LCS QoS class.
      anyOf:
      - type: string
        enum:
        - BEST_EFFORT
        - ASSURED
        - MULTIPLE_QOS
      - type: string
    LocationQoS:
      description: QoS of Location request.
      type: object
      properties:
        hAccuracy:
          $ref: '#/components/schemas/Accuracy'
        vAccuracy:
          $ref: '#/components/schemas/Accuracy'
        verticalRequested:
          type: boolean
        responseTime:
          $ref: '#/components/schemas/ResponseTime'
        minorLocQoses:
          type: array
          items:
            $ref: '#/components/schemas/MinorLocationQoS'
          minItems: 1
          maxItems: 2
        lcsQosClass:
          $ref: '#/components/schemas/LcsQosClass'
    VelocityRequested:
      description: Indicates velocity requirement.
      anyOf:
      - type: string
        enum:
        - VELOCITY_IS_NOT_REQUESTED
        - VELOCITY_IS_REQUESTED
      - type: string
    SupportedGADShapes:
      description: Indicates supported GAD shapes.
      anyOf:
      - type: string
        enum:
        - POINT
        - POINT_UNCERTAINTY_CIRCLE
        - POINT_UNCERTAINTY_ELLIPSE
        - POLYGON
        - POINT_ALTITUDE
        - POINT_ALTITUDE_UNCERTAINTY
        - ELLIPSOID_ARC
        - LOCAL_2D_POINT_UNCERTAINTY_ELLIPSE
        - LOCAL_3D_POINT_UNCERTAINTY_ELLIPSOID
      - type: string
    Uri:
      type: string
      description: String providing an URI formatted according to RFC 3986.
    SupportedFeatures:
      type: string
      pattern: ^[A-Fa-f0-9]*$
      description: "A string used to indicate the features supported by an API that\
        \ is used as defined in clause  6.6 in 3GPP TS 29.500. The string shall contain\
        \ a bitmask indicating supported features in  hexadecimal representation Each\
        \ character in the string shall take a value of \"0\" to \"9\",  \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent the support of 4 features as\
        \ described in  table\_5.2.2-3. The most significant character representing\
        \ the highest-numbered features shall  appear first in the string, and the\
        \ character representing features 1 to 4 shall appear last  in the string.\
        \ The list of features and their numbering (starting with 1) are defined \
        \ separately for each API. If the string contains a lower number of characters\
        \ than there are  defined features for an API, all features that would be\
        \ represented by characters that are not  present in the string are not supported.\n"
    Mcc:
      type: string
      pattern: ^\d{3}$
      description: "Mobile Country Code part of the PLMN, comprising 3 digits, as\
        \ defined in clause 9.3.3.5 of 3GPP TS 38.413. \n"
    Mnc:
      type: string
      pattern: ^\d{2,3}$
      description: Mobile Network Code part of the PLMN, comprising 2 or 3 digits,
        as defined in clause 9.3.3.5 of 3GPP TS 38.413.
    Nid:
      type: string
      pattern: ^[A-Fa-f0-9]{11}$
      description: "This represents the Network Identifier, which together with a\
        \ PLMN ID is used to identify an SNPN (see 3GPP TS 23.003 and 3GPP TS 23.501\
        \ clause 5.30.2.1). \n"
    PlmnIdNid:
      description: 'Contains the serving core network operator PLMN ID and, for an
        SNPN, the NID that together with the PLMN ID identifies the SNPN.

        '
      type: object
      required:
      - mcc
      - mnc
      properties:
        mcc:
          $ref: '#/components/schemas/Mcc'
        mnc:
          $ref: '#/components/schemas/Mnc'
        nid:
          $ref: '#/components/schemas/Nid'
    AmfId:
      type: string
      pattern: ^[A-Fa-f0-9]{6}$
      description: "String identifying the AMF ID composed of AMF Region ID (8 bits),\
        \ AMF Set ID (10 bits) and AMF  Pointer (6 bits) as specified in clause 2.10.1\
        \ of 3GPP TS 23.003. It is encoded as a string of  6 hexadecimal characters\
        \ (i.e., 24 bits). \n"
    Guami:
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnIdNid'
        amfId:
          $ref: '#/components/schemas/AmfId'
      required:
      - plmnId
      - amfId
      description: Globally Unique AMF Identifier constructed out of PLMN, Network
        and AMF identity.
    Pei:
      type: string
      pattern: ^(imei-[0-9]{15}|imeisv-[0-9]{16}|mac((-[0-9a-fA-F]{2}){6})(-untrusted)?|eui((-[0-9a-fA-F]{2}){8})|.+)$
      description: "String representing a Permanent Equipment Identifier that may\
        \ contain - an IMEI or IMEISV, as  specified in clause 6.2 of 3GPP TS 23.003;\
        \ a MAC address for a 5G-RG or FN-RG via  wireline  access, with an indication\
        \ that this address cannot be trusted for regulatory purpose if this  address\
        \ cannot be used as an Equipment Identifier of the FN-RG, as specified in\
        \ clause 4.7.7  of 3GPP TS23.316. Examples are imei-012345678901234 or imeisv-0123456789012345.\
        \ \n"
    LcsServiceType:
      description: LCS service type.
      type: integer
      minimum: 0
      maximum: 127
    LdrType:
      description: Indicates LDR types.
      anyOf:
      - type: string
        enum:
        - UE_AVAILABLE
        - PERIODIC
        - ENTERING_INTO_AREA
        - LEAVING_FROM_AREA
        - BEING_INSIDE_AREA
        - MOTION
      - type: string
    LdrReference:
      description: LDR Reference.
      type: string
      minLength: 2
      maxLength: 510
    ReportingAmount:
      description: Number of required periodic event reports.
      type: integer
      minimum: 1
      maximum: 8639999
    ReportingInterval:
      description: Event reporting periodic interval in seconds.
      type: integer
      minimum: 1
      maximum: 8639999
    ReportingIntervalMs:
      description: Event reporting periodic interval in milliseconds.
      type: integer
      minimum: 1
      maximum: 999
    PeriodicEventInfo:
      description: Indicates the information of periodic event reporting.
      type: object
      required:
      - reportingAmount
      - reportingInterval
      properties:
        reportingAmount:
          $ref: '#/components/schemas/ReportingAmount'
        reportingInterval:
          $ref: '#/components/schemas/ReportingInterval'
        reportingInfiniteInd:
          type: boolean
          enum:
          - true
        reportingIntervalMs:
          $ref: '#/components/schemas/ReportingIntervalMs'
    ReportingAreaType:
      description: Indicates type of event reporting area.
      anyOf:
      - type: string
        enum:
        - EPS_TRACKING_AREA_IDENTITY
        - E-UTRAN_CELL_GLOBAL_IDENTIFICATION
        - 5GS_TRACKING_AREA_IDENTITY
        - NR_CELL_GLOBAL_IDENTITY
      - type: string
    PlmnId:
      type: object
      properties:
        mcc:
          $ref: '#/components/schemas/Mcc'
        mnc:
          $ref: '#/components/schemas/Mnc'
      description: 'When PlmnId needs to be converted to string (e.g. when used in
        maps as key), the string  shall be composed of three digits "mcc" followed
        by "-" and two or three digits "mnc".

        '
      required:
      - mcc
      - mnc
    Tac:
      type: string
      pattern: (^[A-Fa-f0-9]{4}$)|(^[A-Fa-f0-9]{6}$)
      description: "2 or 3-octet string identifying a tracking area code as specified\
        \ in clause 9.3.3.10  of 3GPP TS 38.413, in hexadecimal representation. Each\
        \ character in the string shall  take a value of \"0\" to \"9\", \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent 4 bits. The most significant\
        \ character representing the 4 most significant bits of the TAC shall  appear\
        \ first in the string, and the character representing the 4 least significant\
        \ bit  of the TAC shall appear last in the string. \n"
    Tai:
      description: Contains the tracking area identity as described in 3GPP 23.003
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        tac:
          $ref: '#/components/schemas/Tac'
        nid:
          $ref: '#/components/schemas/Nid'
      required:
      - plmnId
      - tac
    EutraCellId:
      type: string
      pattern: ^[A-Fa-f0-9]{7}$
      description: "28-bit string identifying an E-UTRA Cell Id as specified in clause\
        \ 9.3.1.9 of  3GPP TS 38.413, in hexadecimal representation. Each character\
        \ in the string shall take a  value of \"0\" to \"9\", \"a\" to \"f\" or \"\
        A\" to \"F\" and shall represent 4 bits. The most  significant character representing\
        \ the 4 most significant bits of the Cell Id shall appear  first in the string,\
        \ and the character representing the 4 least significant bit of the  Cell\
        \ Id shall appear last in the string. \n"
    Ecgi:
      description: Contains the ECGI (E-UTRAN Cell Global Identity), as described
        in 3GPP 23.003
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        eutraCellId:
          $ref: '#/components/schemas/EutraCellId'
        nid:
          $ref: '#/components/schemas/Nid'
      required:
      - plmnId
      - eutraCellId
    NrCellId:
      type: string
      pattern: ^[A-Fa-f0-9]{9}$
      description: "36-bit string identifying an NR Cell Id as specified in clause\
        \ 9.3.1.7 of 3GPP TS 38.413,  in hexadecimal representation. Each character\
        \ in the string shall take a value of \"0\" to \"9\",  \"a\" to \"f\" or \"\
        A\" to \"F\" and shall represent 4 bits. The most significant character  representing\
        \ the 4 most significant bits of the Cell Id shall appear first in the string,\
        \ and  the character representing the 4 least significant bit of the Cell\
        \ Id shall appear last in the  string. \n"
    Ncgi:
      description: Contains the NCGI (NR Cell Global Identity), as described in 3GPP
        23.003
      type: object
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        nrCellId:
          $ref: '#/components/schemas/NrCellId'
        nid:
          $ref: '#/components/schemas/Nid'
      required:
      - plmnId
      - nrCellId
    ReportingArea:
      description: Indicates an area for event reporting.
      type: object
      required:
      - areaType
      properties:
        areaType:
          $ref: '#/components/schemas/ReportingAreaType'
        tai:
          $ref: '#/components/schemas/Tai'
        ecgi:
          $ref: '#/components/schemas/Ecgi'
        ncgi:
          $ref: '#/components/schemas/Ncgi'
    OccurrenceInfo:
      description: Specifies occurrence of event reporting.
      anyOf:
      - type: string
        enum:
        - ONE_TIME_EVENT
        - MULTIPLE_TIME_EVENT
      - type: string
    MinimumInterval:
      description: Minimum interval between event reports.
      type: integer
      minimum: 1
      maximum: 32767
    MaximumInterval:
      description: Maximum interval between event reports.
      type: integer
      minimum: 1
      maximum: 86400
    SamplingInterval:
      description: Maximum time interval between consecutive evaluations by a UE of
        a trigger event.
      type: integer
      minimum: 1
      maximum: 3600
    ReportingDuration:
      description: Maximum duration of event reporting.
      type: integer
      minimum: 1
      maximum: 8640000
    AreaEventInfo:
      description: Indicates the information of area based event reporting.
      type: object
      required:
      - areaDefinition
      properties:
        areaDefinition:
          type: array
          items:
            $ref: '#/components/schemas/ReportingArea'
          minItems: 1
          maxItems: 250
        occurrenceInfo:
          $ref: '#/components/schemas/OccurrenceInfo'
        minimumInterval:
          $ref: '#/components/schemas/MinimumInterval'
        maximumInterval:
          $ref: '#/components/schemas/MaximumInterval'
        samplingInterval:
          $ref: '#/components/schemas/SamplingInterval'
        reportingDuration:
          $ref: '#/components/schemas/ReportingDuration'
        reportingLocationReq:
          type: boolean
          default: true
    LinearDistance:
      description: Minimum straight line distance moved by a UE to trigger a motion
        event report.
      type: integer
      minimum: 1
      maximum: 10000
    MotionEventInfo:
      description: Indicates the information of motion based event reporting.
      type: object
      required:
      - linearDistance
      properties:
        linearDistance:
          $ref: '#/components/schemas/LinearDistance'
        occurrenceInfo:
          $ref: '#/components/schemas/OccurrenceInfo'
        minimumInterval:
          $ref: '#/components/schemas/MinimumInterval'
        maximumInterval:
          $ref: '#/components/schemas/MaximumInterval'
        samplingInterval:
          $ref: '#/components/schemas/SamplingInterval'
        reportingDuration:
          $ref: '#/components/schemas/ReportingDuration'
        reportingLocationReq:
          type: boolean
          default: true
    ExternalClientIdentification:
      description: Contains the external client identification
      type: string
    NfInstanceId:
      type: string
      format: uuid
      description: "String uniquely identifying a NF instance. The format of the NF\
        \ Instance ID shall be a  Universally Unique Identifier (UUID) version 4,\
        \ as described in IETF RFC 4122. \n"
    CodeWord:
      description: Contains the codeword
      type: string
    LcsServiceAuth:
      anyOf:
      - type: string
        enum:
        - LOCATION_ALLOWED_WITH_NOTIFICATION
        - LOCATION_ALLOWED_WITHOUT_NOTIFICATION
        - LOCATION_ALLOWED_WITHOUT_RESPONSE
        - LOCATION_RESTRICTED_WITHOUT_RESPONSE
        - NOTIFICATION_ONLY
        - NOTIFICATION_AND_VERIFICATION_ONLY
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: "Possible values are:\n- \"LOCATION_ALLOWED_WITH_NOTIFICATION\"\
        : Location allowed with notification\n- \"LOCATION_ALLOWED_WITHOUT_NOTIFICATION\"\
        : Location allowed without notification\n- \"LOCATION_ALLOWED_WITHOUT_RESPONSE\"\
        : Location with notification and privacy\n   verification; location allowed\
        \ if no response\n- \"LOCATION_RESTRICTED_WITHOUT_RESPONSE\": Location with\
        \ notification and privacy\n  verification; location restricted if no response\n\
        - \"NOTIFICATION_ONLY\": Notification only\n- \"NOTIFICATION_AND_VERIFICATION_ONLY\"\
        : Notification and privacy verification only\n"
    UePrivacyRequirements:
      description: UE privacy requirements from (H)GMLC to the serving AMF or VGMLC(in
        the roaming case) for the target UE
      type: object
      properties:
        lcsServiceAuthInfo:
          $ref: '#/components/schemas/LcsServiceAuth'
        codeWordCheck:
          type: boolean
    DateTime:
      format: date-time
      type: string
      description: string with format 'date-time' as defined in OpenAPI.
    TimeToAlert:
      description: Contains the time-to-alert
      type: integer
      minimum: 1
      maximum: 300
    TargetIntegrityRisk:
      description: Contains the target integrity risk
      type: integer
      minimum: 10
      maximum: 90
    HorizontalProtectionLevel:
      description: Contains the Horizontal Protection Level
      type: integer
      minimum: 0
      maximum: 50000
    VerticalProtectionLevel:
      description: Contains the Vertical Protection Level
      type: integer
      minimum: 0
      maximum: 50000
    AlertLimit:
      description: Alert Limit.
      type: object
      required:
      - horizontalProtectionLevel
      properties:
        horizontalProtectionLevel:
          $ref: '#/components/schemas/HorizontalProtectionLevel'
        verticalProtectionLevel:
          $ref: '#/components/schemas/VerticalProtectionLevel'
    IntegrityRequirements:
      description: integrity requirements.
      type: object
      properties:
        timeToAlert:
          $ref: '#/components/schemas/TimeToAlert'
        targetIntegrityRisk:
          $ref: '#/components/schemas/TargetIntegrityRisk'
        alertLimit:
          $ref: '#/components/schemas/AlertLimit'
    Point:
      description: Ellipsoid Point.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - point
        properties:
          point:
            $ref: '#/components/schemas/GeographicalCoordinates'
    GADShape:
