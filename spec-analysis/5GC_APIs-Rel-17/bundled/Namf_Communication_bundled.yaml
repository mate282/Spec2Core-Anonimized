          '
      description: 'Possible values are:

        - ASCENDING: Threshold is crossed in ascending direction.

        - DESCENDING: Threshold is crossed in descending direction.

        - CROSSED: Threshold is crossed either in ascending or descending direction.

        '
    PacketDelBudget:
      type: integer
      minimum: 1
      description: 'Unsigned integer indicating Packet Delay Budget (see clauses 5.7.3.4
        and 5.7.4 of 3GPP TS 23.501), expressed in milliseconds.

        '
    PacketLossRate:
      type: integer
      minimum: 0
      maximum: 1000
      description: 'Unsigned integer indicating Packet Loss Rate (see clauses 5.7.2.8
        and 5.7.4 of 3GPP TS 23.501), expressed in tenth of percent.

        '
    Float:
      format: float
      type: number
      description: string with format 'float' as defined in OpenAPI.
    ThresholdLevel:
      description: Represents a threshold level.
      type: object
      properties:
        congLevel:
          type: integer
        nfLoadLevel:
          type: integer
        nfCpuUsage:
          type: integer
        nfMemoryUsage:
          type: integer
        nfStorageUsage:
          type: integer
        avgTrafficRate:
          $ref: '#/components/schemas/BitRate'
        maxTrafficRate:
          $ref: '#/components/schemas/BitRate'
        avgPacketDelay:
          $ref: '#/components/schemas/PacketDelBudget'
        maxPacketDelay:
          $ref: '#/components/schemas/PacketDelBudget'
        avgPacketLossRate:
          $ref: '#/components/schemas/PacketLossRate'
        svcExpLevel:
          $ref: '#/components/schemas/Float'
    NetworkAreaInfo:
      description: 'Describes a network area information in which the NF service consumer
        requests the number of UEs.

        '
      type: object
      properties:
        ecgis:
          description: Contains a list of E-UTRA cell identities.
          type: array
          items:
            $ref: '#/components/schemas/Ecgi'
          minItems: 1
        ncgis:
          description: Contains a list of NR cell identities.
          type: array
          items:
            $ref: '#/components/schemas/Ncgi'
          minItems: 1
        gRanNodeIds:
          description: Contains a list of NG RAN nodes.
          type: array
          items:
            $ref: '#/components/schemas/GlobalRanNodeId'
          minItems: 1
        tais:
          description: Contains a list of tracking area identities.
          type: array
          items:
            $ref: '#/components/schemas/Tai'
          minItems: 1
    NsiIdInfo:
      description: Represents the S-NSSAI and the optionally associated Network Slice
        Instance(s).
      type: object
      properties:
        snssai:
          $ref: '#/components/schemas/Snssai'
        nsiIds:
          type: array
          items:
            $ref: '#/components/schemas/NsiId'
          minItems: 1
      required:
      - snssai
    QosResourceType:
      anyOf:
      - type: string
        enum:
        - NON_GBR
        - NON_CRITICAL_GBR
        - CRITICAL_GBR
      - type: string
      description: "The enumeration QosResourceType indicates whether a QoS Flow is\
        \ non-GBR, delay critical GBR, or non-delay critical GBR (see clauses 5.7.3.4\
        \ and 5.7.3.5 of 3GPP TS 23.501). It shall comply with the provisions defined\
        \ in table 5.5.3.6-1. \n"
    PacketErrRate:
      type: string
      pattern: ^([0-9]E-[0-9])$
      description: 'String representing Packet Error Rate (see clause 5.7.3.5 and
        5.7.4 of 3GPP TS 23.501, expressed as a "scalar x 10-k" where the scalar and
        the exponent k are each encoded as one decimal digit.

        '
    QosRequirement:
      description: Represents the QoS requirements.
      type: object
      properties:
        5qi:
          $ref: '#/components/schemas/5Qi'
        gfbrUl:
          $ref: '#/components/schemas/BitRate'
        gfbrDl:
          $ref: '#/components/schemas/BitRate'
        resType:
          $ref: '#/components/schemas/QosResourceType'
        pdb:
          $ref: '#/components/schemas/PacketDelBudget'
        per:
          $ref: '#/components/schemas/PacketErrRate'
      oneOf:
      - required:
        - 5qi
      - required:
        - resType
    TimeUnit:
      anyOf:
      - type: string
        enum:
        - MINUTE
        - HOUR
        - DAY
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: 'Possible values are:

        - MINUTE: Time unit is per minute.

        - HOUR: Time unit is per hour.

        - DAY: Time unit is per day.

        '
    RetainabilityThreshold:
      description: Represents a QoS flow retainability threshold.
      type: object
      properties:
        relFlowNum:
          $ref: '#/components/schemas/Uinteger'
        relTimeUnit:
          $ref: '#/components/schemas/TimeUnit'
        relFlowRatio:
          $ref: '#/components/schemas/SamplingRatio'
      oneOf:
      - allOf:
        - required:
          - relFlowNum
        - required:
          - relTimeUnit
      - required:
        - relFlowRatio
    TargetUeInformation:
      description: Identifies the target UE information.
      type: object
      properties:
        anyUe:
          type: boolean
        supis:
          type: array
          items:
            $ref: '#/components/schemas/Supi'
          minItems: 1
        gpsis:
          type: array
          items:
            $ref: '#/components/schemas/Gpsi'
          minItems: 1
        intGroupIds:
          type: array
          items:
            $ref: '#/components/schemas/GroupId'
          minItems: 1
    NetworkPerfType:
      anyOf:
      - type: string
        enum:
        - GNB_ACTIVE_RATIO
        - GNB_COMPUTING_USAGE
        - GNB_MEMORY_USAGE
        - GNB_DISK_USAGE
        - NUM_OF_UE
        - SESS_SUCC_RATIO
        - HO_SUCC_RATIO
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: "Possible values are:\n- GNB_ACTIVE_RATIO: Indicates that the network\
        \ performance requirement is gNodeB active (i.e. up and running) rate. Indicates\
        \ the ratio of gNB active (i.e. up and running) number to the total number\
        \ of gNB\n- GNB_COMPUTING_USAGE: Indicates gNodeB computing resource usage.\n\
        - GNB_MEMORY_USAGE: Indicates gNodeB memory usage.\n- GNB_DISK_USAGE: Indicates\
        \ gNodeB disk usage.\n- NUM_OF_UE: Indicates number of UEs.\n- SESS_SUCC_RATIO:\
        \ Indicates ratio of successful setup of PDU sessions to total PDU session\
        \ setup attempts.\n- HO_SUCC_RATIO: Indicates Ratio of successful handovers\
        \ to the total handover attempts. \n"
    NetworkPerfRequirement:
      description: Represents a network performance requirement.
      type: object
      properties:
        nwPerfType:
          $ref: '#/components/schemas/NetworkPerfType'
        relativeRatio:
          $ref: '#/components/schemas/SamplingRatio'
        absoluteNum:
          $ref: '#/components/schemas/Uinteger'
      required:
      - nwPerfType
    BwRequirement:
      description: Represents bandwidth requirements.
      type: object
      properties:
        appId:
          $ref: '#/components/schemas/ApplicationId'
        marBwDl:
          $ref: '#/components/schemas/BitRate'
        marBwUl:
          $ref: '#/components/schemas/BitRate'
        mirBwDl:
          $ref: '#/components/schemas/BitRate'
        mirBwUl:
          $ref: '#/components/schemas/BitRate'
      required:
      - appId
    ExceptionId:
      anyOf:
      - type: string
        enum:
        - UNEXPECTED_UE_LOCATION
        - UNEXPECTED_LONG_LIVE_FLOW
        - UNEXPECTED_LARGE_RATE_FLOW
        - UNEXPECTED_WAKEUP
        - SUSPICION_OF_DDOS_ATTACK
        - WRONG_DESTINATION_ADDRESS
        - TOO_FREQUENT_SERVICE_ACCESS
        - UNEXPECTED_RADIO_LINK_FAILURES
        - PING_PONG_ACROSS_CELLS
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: 'Possible values are:

        - UNEXPECTED_UE_LOCATION: Unexpected UE location

        - UNEXPECTED_LONG_LIVE_FLOW: Unexpected long-live rate flows

        - UNEXPECTED_LARGE_RATE_FLOW: Unexpected large rate flows

        - UNEXPECTED_WAKEUP: Unexpected wakeup

        - SUSPICION_OF_DDOS_ATTACK: Suspicion of DDoS attack

        - WRONG_DESTINATION_ADDRESS: Wrong destination address

        - TOO_FREQUENT_SERVICE_ACCESS: Too frequent Service Access

        - UNEXPECTED_RADIO_LINK_FAILURES: Unexpected radio link failures

        - PING_PONG_ACROSS_CELLS: Ping-ponging across neighbouring cells

        '
    ExceptionTrend:
      anyOf:
      - type: string
        enum:
        - UP
        - DOWN
        - UNKNOW
        - STABLE
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: 'Possible values are:

        - UP: Up trend of the exception level.

        - DOWN: Down trend of the exception level.

        - UNKNOW: Unknown trend of the exception level.

        - STABLE: Stable trend of the exception level.

        '
    Exception:
      description: Represents the Exception information.
      type: object
      properties:
        excepId:
          $ref: '#/components/schemas/ExceptionId'
        excepLevel:
          type: integer
        excepTrend:
          $ref: '#/components/schemas/ExceptionTrend'
      required:
      - excepId
    ExpectedAnalyticsType:
      anyOf:
      - type: string
        enum:
        - MOBILITY
        - COMMUN
        - MOBILITY_AND_COMMUN
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: 'Possible values are:

        - MOBILITY: Mobility related abnormal behaviour analytics is expected by the
        consumer.

        - COMMUN: Communication related abnormal behaviour analytics is expected by
        the consumer.

        - MOBILITY_AND_COMMUN: Both mobility and communication related abnormal behaviour
        analytics is expected by the consumer.

        '
    Point:
      description: Ellipsoid Point.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - point
        properties:
          point:
            $ref: '#/components/schemas/GeographicalCoordinates'
    GADShape:
      description: Common base type for GAD shapes.
      type: object
      required:
      - shape
      properties:
        shape:
          $ref: '#/components/schemas/SupportedGADShapes'
      discriminator:
        propertyName: shape
        mapping:
          POINT: '#/components/schemas/Point'
          POINT_UNCERTAINTY_CIRCLE: '#/components/schemas/PointUncertaintyCircle'
          POINT_UNCERTAINTY_ELLIPSE: '#/components/schemas/PointUncertaintyEllipse'
          POLYGON: '#/components/schemas/Polygon'
          POINT_ALTITUDE: '#/components/schemas/PointAltitude'
          POINT_ALTITUDE_UNCERTAINTY: '#/components/schemas/PointAltitudeUncertainty'
          ELLIPSOID_ARC: '#/components/schemas/EllipsoidArc'
          LOCAL_2D_POINT_UNCERTAINTY_ELLIPSE: '#/components/schemas/Local2dPointUncertaintyEllipse'
          LOCAL_3D_POINT_UNCERTAINTY_ELLIPSOID: '#/components/schemas/Local3dPointUncertaintyEllipsoid'
    GeographicalCoordinates:
      description: Geographical coordinates.
      type: object
      required:
      - lon
      - lat
      properties:
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
    Uncertainty:
      description: Indicates value of uncertainty.
      type: number
      format: float
      minimum: 0
    PointUncertaintyCircle:
      description: Ellipsoid point with uncertainty circle.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - point
        - uncertainty
        properties:
          point:
            $ref: '#/components/schemas/GeographicalCoordinates'
          uncertainty:
            $ref: '#/components/schemas/Uncertainty'
    Orientation:
      description: Indicates value of orientation angle.
      type: integer
      minimum: 0
      maximum: 180
    UncertaintyEllipse:
      description: Ellipse with uncertainty.
      type: object
      required:
      - semiMajor
      - semiMinor
      - orientationMajor
      properties:
        semiMajor:
          $ref: '#/components/schemas/Uncertainty'
        semiMinor:
          $ref: '#/components/schemas/Uncertainty'
        orientationMajor:
          $ref: '#/components/schemas/Orientation'
    Confidence:
      description: Indicates value of confidence.
      type: integer
      minimum: 0
      maximum: 100
    PointUncertaintyEllipse:
      description: Ellipsoid point with uncertainty ellipse.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - point
        - uncertaintyEllipse
        - confidence
        properties:
          point:
            $ref: '#/components/schemas/GeographicalCoordinates'
          uncertaintyEllipse:
            $ref: '#/components/schemas/UncertaintyEllipse'
          confidence:
            $ref: '#/components/schemas/Confidence'
    PointList:
      description: List of points.
      type: array
      items:
        $ref: '#/components/schemas/GeographicalCoordinates'
      minItems: 3
      maxItems: 15
    Polygon:
      description: Polygon.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - pointList
        properties:
          pointList:
            $ref: '#/components/schemas/PointList'
    Altitude:
      description: Indicates value of altitude.
      type: number
      format: double
      minimum: -32767
      maximum: 32767
    PointAltitude:
      description: Ellipsoid point with altitude.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - point
        - altitude
        properties:
          point:
            $ref: '#/components/schemas/GeographicalCoordinates'
          altitude:
            $ref: '#/components/schemas/Altitude'
    PointAltitudeUncertainty:
      description: Ellipsoid point with altitude and uncertainty ellipsoid.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - point
        - altitude
        - uncertaintyEllipse
        - uncertaintyAltitude
        - confidence
        properties:
          point:
            $ref: '#/components/schemas/GeographicalCoordinates'
          altitude:
            $ref: '#/components/schemas/Altitude'
          uncertaintyEllipse:
            $ref: '#/components/schemas/UncertaintyEllipse'
          uncertaintyAltitude:
            $ref: '#/components/schemas/Uncertainty'
          confidence:
            $ref: '#/components/schemas/Confidence'
          vConfidence:
            $ref: '#/components/schemas/Confidence'
    InnerRadius:
      description: Indicates value of the inner radius.
      type: integer
      format: int32
      minimum: 0
      maximum: 327675
    Angle:
      description: Indicates value of angle.
      type: integer
      minimum: 0
      maximum: 360
    EllipsoidArc:
      description: Ellipsoid Arc.
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - point
        - innerRadius
        - uncertaintyRadius
        - offsetAngle
        - includedAngle
        - confidence
        properties:
          point:
            $ref: '#/components/schemas/GeographicalCoordinates'
          innerRadius:
            $ref: '#/components/schemas/InnerRadius'
          uncertaintyRadius:
            $ref: '#/components/schemas/Uncertainty'
          offsetAngle:
            $ref: '#/components/schemas/Angle'
          includedAngle:
            $ref: '#/components/schemas/Angle'
          confidence:
            $ref: '#/components/schemas/Confidence'
    LocalOrigin:
      description: Indicates a Local origin in a reference system
      type: object
      properties:
        coordinateId:
          type: string
        point:
          $ref: '#/components/schemas/GeographicalCoordinates'
    RelativeCartesianLocation:
      description: Relative Cartesian Location
      type: object
      required:
      - x
      - y
      properties:
        x:
          $ref: '#/components/schemas/Float'
        y:
          $ref: '#/components/schemas/Float'
        z:
          $ref: '#/components/schemas/Float'
    Local2dPointUncertaintyEllipse:
      description: Local 2D point with uncertainty ellipse
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - localOrigin
        - point
        - uncertaintyEllipse
        - confidence
        properties:
          localOrigin:
            $ref: '#/components/schemas/LocalOrigin'
          point:
            $ref: '#/components/schemas/RelativeCartesianLocation'
          uncertaintyEllipse:
            $ref: '#/components/schemas/UncertaintyEllipse'
          confidence:
            $ref: '#/components/schemas/Confidence'
    UncertaintyEllipsoid:
      description: Ellipsoid with uncertainty
      type: object
      required:
      - semiMajor
      - semiMinor
      - vertical
      - orientationMajor
      properties:
        semiMajor:
          $ref: '#/components/schemas/Uncertainty'
        semiMinor:
          $ref: '#/components/schemas/Uncertainty'
        vertical:
          $ref: '#/components/schemas/Uncertainty'
        orientationMajor:
          $ref: '#/components/schemas/Orientation'
    Local3dPointUncertaintyEllipsoid:
      description: Local 3D point with uncertainty ellipsoid
      allOf:
      - $ref: '#/components/schemas/GADShape'
      - type: object
        required:
        - localOrigin
        - point
        - uncertaintyEllipsoid
        - confidence
        properties:
          localOrigin:
            $ref: '#/components/schemas/LocalOrigin'
          point:
            $ref: '#/components/schemas/RelativeCartesianLocation'
          uncertaintyEllipsoid:
            $ref: '#/components/schemas/UncertaintyEllipsoid'
          confidence:
            $ref: '#/components/schemas/Confidence'
    SupportedGADShapes:
      description: Indicates supported GAD shapes.
      anyOf:
      - type: string
        enum:
        - POINT
        - POINT_UNCERTAINTY_CIRCLE
        - POINT_UNCERTAINTY_ELLIPSE
        - POLYGON
        - POINT_ALTITUDE
        - POINT_ALTITUDE_UNCERTAINTY
        - ELLIPSOID_ARC
        - LOCAL_2D_POINT_UNCERTAINTY_ELLIPSE
        - LOCAL_3D_POINT_UNCERTAINTY_ELLIPSOID
