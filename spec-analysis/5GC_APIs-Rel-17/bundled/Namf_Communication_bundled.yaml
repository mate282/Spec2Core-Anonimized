        enum:
        - UNIFORM_DIST_DATA
        - NO_OUTLIERS
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: 'Possible values are:

        - UNIFORM_DIST_DATA: Indicates the use of data samples that are uniformly
        distributed according to the different aspects of the requested analytics.

        - NO_OUTLIERS: Indicates that the data samples shall disregard data samples
        that are at the extreme boundaries of the value range.

        '
    OutputStrategy:
      anyOf:
      - type: string
        enum:
