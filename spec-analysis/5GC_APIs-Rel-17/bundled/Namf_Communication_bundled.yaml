        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: 'Possible values are:

        - BINARY: Indicates that the analytics shall only be reported when the requested
        level of accuracy is reached within a cycle of periodic notification.

        - GRADIENT: Indicates that the analytics shall be reported according with
        the periodicity irrespective of whether the requested level of accuracy has
        been reached or not.

        '
    AnalyticsMetadataIndication:
