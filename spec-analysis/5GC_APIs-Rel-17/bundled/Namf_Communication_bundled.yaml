      - type: string
    AmfEventSubscription:
      description: Represents an individual event subscription resource on AMF
      type: object
      properties:
        eventList:
          type: array
          items:
            $ref: '#/components/schemas/AmfEvent'
          minItems: 1
        eventNotifyUri:
          $ref: '#/components/schemas/Uri'
        notifyCorrelationId:
          type: string
        nfId:
          $ref: '#/components/schemas/NfInstanceId'
        subsChangeNotifyUri:
          $ref: '#/components/schemas/Uri'
        subsChangeNotifyCorrelationId:
          type: string
        supi:
          $ref: '#/components/schemas/Supi'
        groupId:
          $ref: '#/components/schemas/GroupId'
        excludeSupiList:
          type: array
          items:
            $ref: '#/components/schemas/Supi'
          minItems: 1
        excludeGpsiList:
          type: array
          items:
            $ref: '#/components/schemas/Gpsi'
          minItems: 1
        includeSupiList:
          type: array
          items:
            $ref: '#/components/schemas/Supi'
          minItems: 1
        includeGpsiList:
          type: array
          items:
            $ref: '#/components/schemas/Gpsi'
          minItems: 1
        gpsi:
          $ref: '#/components/schemas/Gpsi'
        pei:
          $ref: '#/components/schemas/Pei'
        anyUE:
          type: boolean
        options:
          $ref: '#/components/schemas/AmfEventMode'
        sourceNfType:
          $ref: '#/components/schemas/NFType'
      required:
      - eventList
      - eventNotifyUri
      - notifyCorrelationId
      - nfId
    AccessType:
      type: string
      enum:
      - 3GPP_ACCESS
      - NON_3GPP_ACCESS
      description: Indicates whether the access is  via 3GPP or via non-3GPP.
    EutraLocation:
      description: Contains the E-UTRA user location.
      type: object
      properties:
        tai:
          $ref: '#/components/schemas/Tai'
        ignoreTai:
          type: boolean
          default: false
        ecgi:
          $ref: '#/components/schemas/Ecgi'
        ignoreEcgi:
          type: boolean
          default: false
          description: 'This flag when present shall indicate that the Ecgi shall
            be ignored When present, it shall be set as follows: - true: ecgi shall
            be ignored. - false (default): ecgi shall not be ignored.

            '
        ageOfLocationInformation:
          type: integer
          minimum: 0
          maximum: 32767
          description: 'The value represents the elapsed time in minutes since the
            last network contact of the mobile station.  Value "0" indicates that
            the location information was obtained after a successful paging procedure
            for Active Location Retrieval when the UE is in idle mode or after a successful
            NG-RAN location reporting procedure with the eNB when the UE is in connected
            mode.  Any other value than "0" indicates that the location information
            is the last known one.  See 3GPP TS 29.002 clause 17.7.8.

            '
        ueLocationTimestamp:
          $ref: '#/components/schemas/DateTime'
        geographicalInformation:
          type: string
          pattern: ^[0-9A-F]{16}$
          description: 'Refer to geographical Information. See 3GPP TS 23.032 clause
            7.3.2. Only the description of an ellipsoid point with uncertainty circle
            is allowed to be used.

            '
        geodeticInformation:
          type: string
          pattern: ^[0-9A-F]{20}$
          description: 'Refers to Calling Geodetic Location. See ITU-T Recommendation
            Q.763 (1999) [24] clause 3.88.2. Only the description of an ellipsoid
            point with uncertainty circle is allowed to be used.

            '
        globalNgenbId:
          $ref: '#/components/schemas/GlobalRanNodeId'
        globalENbId:
          $ref: '#/components/schemas/GlobalRanNodeId'
      required:
      - tai
      - ecgi
    NrLocation:
      description: Contains the NR user location.
      type: object
      properties:
        tai:
          $ref: '#/components/schemas/Tai'
        ncgi:
          $ref: '#/components/schemas/Ncgi'
        ignoreNcgi:
          type: boolean
          default: false
        ageOfLocationInformation:
          type: integer
          minimum: 0
          maximum: 32767
          description: 'The value represents the elapsed time in minutes since the
            last network contact of the mobile station. Value "0" indicates that the
            location information was obtained after a successful paging procedure
            for Active Location Retrieval when the UE is in idle mode or after a successful  NG-RAN
            location reporting procedure with the eNB when the UE is in connected
            mode. Any other value than "0" indicates that the location information
            is the last known one. See 3GPP TS 29.002 clause 17.7.8.

            '
        ueLocationTimestamp:
          $ref: '#/components/schemas/DateTime'
        geographicalInformation:
          type: string
          pattern: ^[0-9A-F]{16}$
          description: 'Refer to geographical Information. See 3GPP TS 23.032 clause
            7.3.2. Only the description of an ellipsoid point with uncertainty circle
            is allowed to be used.

            '
        geodeticInformation:
          type: string
          pattern: ^[0-9A-F]{20}$
          description: 'Refers to Calling Geodetic Location. See ITU-T Recommendation
            Q.763 (1999) [24] clause 3.88.2. Only the description of an ellipsoid
            point with uncertainty circle is allowed to be used.

            '
        globalGnbId:
          $ref: '#/components/schemas/GlobalRanNodeId'
      required:
      - tai
      - ncgi
    TransportProtocol:
      anyOf:
      - type: string
        enum:
        - UDP
        - TCP
      - type: string
        description: "This string provides forward-compatibility with future extensions\
          \ to the enumeration but is not used to encode content defined in the present\
          \ version of this API. \n"
      description: "Possible values are:\n- UDP: User Datagram Protocol.\n- TCP: Transmission\
        \ Control Protocol. \n"
    TnapId:
      description: Contain the TNAP Identifier see clause5.6.2 of 3GPP TS 23.501.
      type: object
      properties:
        ssId:
          type: string
          description: "This IE shall be present if the UE is accessing the 5GC via\
            \ a trusted WLAN access network.When present, it shall contain the SSID\
            \ of the access point to which the UE is attached, that is received over\
            \ NGAP,  see IEEE Std 802.11-2012. \n"
        bssId:
          type: string
          description: "When present, it shall contain the BSSID of the access point\
            \ to which the UE is attached, that is received over NGAP, see IEEE Std\
            \ 802.11-2012. \n"
        civicAddress:
          $ref: '#/components/schemas/Bytes'
    TwapId:
      description: 'Contain the TWAP Identifier as defined in clause 4.2.8.5.3 of
        3GPP TS 23.501 or the WLAN location information as defined in clause 4.5.7.2.8
        of 3GPP TS 23.402.

        '
      type: object
      required:
      - ssId
      properties:
        ssId:
          type: string
          description: "This IE shall contain the SSID of the access point to which\
            \ the UE is attached, that is received over NGAP, see IEEE Std 802.11-2012.\
            \ \n"
        bssId:
          type: string
          description: "When present, it shall contain the BSSID of the access point\
            \ to which the UE is attached, for trusted WLAN access, see IEEE Std 802.11-2012.\
            \ \n"
        civicAddress:
          $ref: '#/components/schemas/Bytes'
    HfcNId:
      type: string
      maxLength: 6
      description: 'This IE represents the identifier of the HFC node Id as specified
        in CableLabs WR-TR-5WWC-ARCH. It is provisioned by the wireline operator as
        part of wireline operations and may contain up to six characters.

        '
    HfcNodeId:
      description: REpresents the HFC Node Identifer received over NGAP.
      type: object
      required:
      - hfcNId
      properties:
        hfcNId:
          $ref: '#/components/schemas/HfcNId'
    LineType:
      anyOf:
      - type: string
        enum:
        - DSL
        - PON
      - type: string
        description: "This string provides forward-compatibility with future extensions\
          \ to the enumeration but is not used to encode content defined in the present\
          \ version of this API. \n"
      description: 'Possible values are:

        - DSL: Identifies a DSL line

        - PON: Identifies a PON line

        '
    Gci:
      type: string
      description: 'Global Cable Identifier uniquely identifying the connection between
        the 5G-CRG or FN-CRG to the 5GS. See clause 28.15.4 of 3GPP TS 23.003. This
        shall be encoded as a string per clause 28.15.4 of 3GPP TS 23.003, and compliant
        with the syntax specified  in clause 2.2  of IETF RFC 7542 for the username
        part of a NAI. The GCI value is specified in CableLabs WR-TR-5WWC-ARCH.

        '
    N3gaLocation:
      description: Contains the Non-3GPP access user location.
      type: object
      properties:
        n3gppTai:
          $ref: '#/components/schemas/Tai'
        n3IwfId:
          type: string
          pattern: ^[A-Fa-f0-9]+$
          description: "This IE shall contain the N3IWF identifier received over NGAP\
            \ and shall be encoded as a  string of hexadecimal characters. Each character\
            \ in the string shall take a value of \"0\"  to \"9\", \"a\" to \"f\"\
            \ or \"A\" to \"F\" and shall represent 4 bits. The most significant \
            \ character representing the 4 most significant bits of the N3IWF ID shall\
            \ appear first in  the string, and the character representing the 4 least\
            \ significant bit of the N3IWF ID  shall appear last in the string. \n"
        ueIpv4Addr:
          $ref: '#/components/schemas/Ipv4Addr'
        ueIpv6Addr:
          $ref: '#/components/schemas/Ipv6Addr'
        portNumber:
          $ref: '#/components/schemas/Uinteger'
        protocol:
          $ref: '#/components/schemas/TransportProtocol'
        tnapId:
          $ref: '#/components/schemas/TnapId'
        twapId:
          $ref: '#/components/schemas/TwapId'
        hfcNodeId:
          $ref: '#/components/schemas/HfcNodeId'
        gli:
          $ref: '#/components/schemas/Bytes'
        w5gbanLineType:
          $ref: '#/components/schemas/LineType'
        gci:
          $ref: '#/components/schemas/Gci'
    CellGlobalId:
      description: Contains a Cell Global Identification as defined in 3GPP TS 23.003,
        clause 4.3.1.
      type: object
      required:
      - plmnId
      - lac
      - cellId
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        lac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
        cellId:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
    ServiceAreaId:
      description: Contains a Service Area Identifier as defined in 3GPP TS 23.003,
        clause 12.5.
      type: object
      required:
      - plmnId
      - lac
      - sac
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        lac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
          description: Location Area Code.
        sac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
          description: Service Area Code.
    LocationAreaId:
      description: Contains a Location area identification as defined in 3GPP TS 23.003,
        clause 4.1.
      type: object
      required:
      - plmnId
      - lac
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        lac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
          description: Location Area Code.
    RoutingAreaId:
      description: Contains a Routing Area Identification as defined in 3GPP TS 23.003,
        clause 4.2.
      type: object
      required:
      - plmnId
      - lac
      - rac
      properties:
        plmnId:
          $ref: '#/components/schemas/PlmnId'
        lac:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
          description: Location Area Code
        rac:
          type: string
          pattern: ^[A-Fa-f0-9]{2}$
          description: Routing Area Code
    UtraLocation:
      type: object
      oneOf:
      - required:
        - cgi
      - required:
        - sai
      - required:
        - lai
      description: Exactly one of cgi, sai or lai shall be present.
      properties:
        cgi:
          $ref: '#/components/schemas/CellGlobalId'
        sai:
          $ref: '#/components/schemas/ServiceAreaId'
        lai:
          $ref: '#/components/schemas/LocationAreaId'
        rai:
          $ref: '#/components/schemas/RoutingAreaId'
        ageOfLocationInformation:
          type: integer
          minimum: 0
          maximum: 32767
          description: "The value represents the elapsed time in minutes since the\
            \ last network contact of the mobile station.  Value \"0\" indicates that\
            \ the location information was obtained after a successful paging procedure\
            \ for  Active Location Retrieval when the UE is in idle mode\n or after\
            \ a successful location reporting procedure  the UE is in connected mode.\
            \ Any\nother value than \"0\" indicates that the location information\
            \ is the last known one.  See 3GPP TS 29.002 clause 17.7.8.\n"
        ueLocationTimestamp:
          $ref: '#/components/schemas/DateTime'
        geographicalInformation:
          type: string
          pattern: ^[0-9A-F]{16}$
          description: 'Refer to geographical Information.See 3GPP TS 23.032 clause
            7.3.2. Only the description of an ellipsoid point with uncertainty circle
            is allowed to be used.

            '
        geodeticInformation:
          type: string
          pattern: ^[0-9A-F]{20}$
          description: "Refers to Calling Geodetic Location. See ITU-T\_Recommendation\
            \ Q.763 (1999) clause 3.88.2. Only the description of an ellipsoid point\
            \ with uncertainty circle is allowed to be used.\n"
    GeraLocation:
      type: object
      oneOf:
      - required:
        - cgi
      - required:
        - sai
      - required:
        - lai
      description: Exactly one of cgi, sai or lai shall be present.
      properties:
        locationNumber:
          type: string
          description: Location number within the PLMN. See 3GPP TS 23.003, clause
            4.5.
        cgi:
          $ref: '#/components/schemas/CellGlobalId'
        sai:
          $ref: '#/components/schemas/ServiceAreaId'
        lai:
          $ref: '#/components/schemas/LocationAreaId'
        rai:
          $ref: '#/components/schemas/RoutingAreaId'
        vlrNumber:
          type: string
          description: VLR number. See 3GPP TS 23.003 clause 5.1.
        mscNumber:
          type: string
          description: MSC number. See 3GPP TS 23.003 clause 5.1.
        ageOfLocationInformation:
          type: integer
          minimum: 0
          maximum: 32767
          description: 'The value represents the elapsed time in minutes since the
            last network contact of the mobile station. Value "0" indicates that the
            location information was obtained after a successful paging procedure
            for  Active Location Retrieval when the UE is in idle mode or after a
            successful location reporting procedure the UE is in connected mode. Any
            other value than "0" indicates that the location information is the last
            known one. See 3GPP TS 29.002 clause 17.7.8.

            '
        ueLocationTimestamp:
          $ref: '#/components/schemas/DateTime'
        geographicalInformation:
          type: string
          pattern: ^[0-9A-F]{16}$
          description: 'Refer to geographical Information.See 3GPP TS 23.032 clause
            7.3.2. Only the description of an ellipsoid point with uncertainty circle
            is allowed to be used.

            '
        geodeticInformation:
          type: string
          pattern: ^[0-9A-F]{20}$
          description: 'Refers to Calling Geodetic Location.See ITU-T Recommendation
            Q.763 (1999) clause 3.88.2.  Only the description of an ellipsoid point
            with uncertainty circle is allowed to be used.

            '
    UserLocation:
      type: object
      properties:
        eutraLocation:
          $ref: '#/components/schemas/EutraLocation'
        nrLocation:
          $ref: '#/components/schemas/NrLocation'
        n3gaLocation:
          $ref: '#/components/schemas/N3gaLocation'
        utraLocation:
          $ref: '#/components/schemas/UtraLocation'
        geraLocation:
          $ref: '#/components/schemas/GeraLocation'
      description: 'At least one of eutraLocation, nrLocation and n3gaLocation shall
        be present. Several of them may be present.

        '
    DayOfWeek:
      type: integer
      minimum: 1
      maximum: 7
      description: 'integer between and including 1 and 7 denoting a weekday. 1 shall
        indicate Monday, and the subsequent weekdays  shall be indicated with the
        next higher numbers. 7 shall indicate Sunday.

        '
    TimeOfDay:
      type: string
      description: "String with format partial-time or full-time as defined in clause\
        \ 5.6 of IETF RFC 3339. Examples, 20:15:00, 20:15:00-08:00 (for 8 hours behind\
        \ UTC). \n"
    ScheduledCommunicationTime:
      description: Identifies time and day of the week when the UE is available for
        communication.
      type: object
      properties:
        daysOfWeek:
          type: array
          items:
            $ref: '#/components/schemas/DayOfWeek'
          minItems: 1
          maxItems: 6
          description: 'Identifies the day(s) of the week. If absent, it indicates
            every day of the week.

            '
        timeOfDayStart:
          $ref: '#/components/schemas/TimeOfDay'
        timeOfDayEnd:
          $ref: '#/components/schemas/TimeOfDay'
    StationaryIndication:
      anyOf:
      - type: string
        enum:
        - STATIONARY
        - MOBILE
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: 'Possible values are:

        - STATIONARY: Identifies the UE is stationary

        - MOBILE: Identifies the UE is mobile

        '
    TrafficProfile:
      anyOf:
      - type: string
        enum:
        - SINGLE_TRANS_UL
        - SINGLE_TRANS_DL
        - DUAL_TRANS_UL_FIRST
        - DUAL_TRANS_DL_FIRST
        - MULTI_TRANS
      - type: string
        description: "This string provides forward-compatibility with future extensions\
          \ to the enumeration but is not used to encode content defined in the present\
          \ version of this API. \n"
      description: "Possible values are:\n- SINGLE_TRANS_UL: Uplink single packet\
        \ transmission.\n- SINGLE_TRANS_DL: Downlink single packet transmission.\n\
        - DUAL_TRANS_UL_FIRST: Dual packet transmission, firstly uplink packet transmission\n\
        \  with subsequent downlink packet transmission.\n- DUAL_TRANS_DL_FIRST: Dual\
        \ packet transmission, firstly downlink packet transmission\n  with subsequent\
        \ uplink packet transmission. \n"
    BatteryIndication:
      type: object
      properties:
        batteryInd:
          type: boolean
          description: 'This IE shall indicate whether the UE is battery powered or
            not. true: the UE is battery powered; false or absent: the UE is not battery
            powered

            '
        replaceableInd:
          type: boolean
          description: 'This IE shall indicate whether the battery of the UE is replaceable
            or not. true: the battery of the UE is replaceable; false or absent: the
            battery of the UE is not replaceable.

            '
        rechargeableInd:
          type: boolean
          description: 'This IE shall indicate whether the battery of the UE is rechargeable
            or not. true: the battery of UE is rechargeable; false or absent: the
            battery of the UE is not rechargeable.

            '
      description: 'Parameters "replaceableInd" and "rechargeableInd" are only included
        if the value of Parameter "batteryInd" is true.

        '
    AuthStatus:
      anyOf:
      - type: string
        enum:
        - EAP_SUCCESS
        - EAP_FAILURE
        - PENDING
      - type: string
        description: "This string provides forward-compatibility with future extensions\
          \ to the enumeration but is not used to encode content defined in the present\
          \ version of this API. \n"
      description: "Possible values are:\n- \"EAP_SUCCESS\": The NSSAA status is EAP-Success.\n\
        - \"EAP_FAILURE\": The NSSAA status is EAP-Failure.\n- \"PENDING\": The NSSAA\
        \ status is Pending. \n"
    NssaaStatus:
      description: contains the Subscribed S-NSSAI subject to NSSAA procedure and
        the status.
      type: object
      required:
      - snssai
      - status
      properties:
        snssai:
          $ref: '#/components/schemas/Snssai'
        status:
          $ref: '#/components/schemas/AuthStatus'
    PduSessionId:
      type: integer
      minimum: 0
      maximum: 255
      description: "Unsigned integer identifying a PDU session, within the range 0\
        \ to 255, as specified in  clause 11.2.3.1b, bits 1 to 8, of 3GPP TS 24.007.\
        \ If the PDU Session ID is allocated by the  Core Network for UEs not supporting\
        \ N1 mode, reserved range 64 to 95 is used. PDU Session ID  within the reserved\
        \ range is only visible in the Core Network. \n"
    ArpPriorityLevel:
      type: integer
      minimum: 1
      maximum: 15
      nullable: true
      description: "nullable true shall not be used for this attribute. Unsigned integer\
        \ indicating the ARP Priority Level (see clause 5.7.2.2 of 3GPP TS 23.501,\
        \ within the range 1 to 15.Values are ordered in decreasing order of priority,\
        \ i.e. with 1 as the highest priority and 15 as the lowest priority. \n"
    PreemptionCapability:
      anyOf:
      - type: string
        enum:
        - NOT_PREEMPT
        - MAY_PREEMPT
      - type: string
      description: 'The enumeration PreemptionCapability indicates the pre-emption
        capability of a request on other QoS flows. See clause 5.7.2.2 of 3GPP TS
        23.501. It shall comply with the provisions defined in table 5.5.3.1-1.

        '
    PreemptionVulnerability:
      anyOf:
      - type: string
        enum:
        - NOT_PREEMPTABLE
        - PREEMPTABLE
      - type: string
      description: 'The enumeration PreemptionVulnerability indicates the pre-emption
        vulnerability of the QoS flow to pre-emption from other QoS flows. See clause
        5.7.2.2 of 3GPP TS 23.501. It shall comply with the provisions defined in
        table 5.5.3.2-1

        '
    Arp:
      description: Contains Allocation and Retention Priority information.
      type: object
      properties:
        priorityLevel:
          $ref: '#/components/schemas/ArpPriorityLevel'
        preemptCap:
          $ref: '#/components/schemas/PreemptionCapability'
        preemptVuln:
          $ref: '#/components/schemas/PreemptionVulnerability'
      required:
      - priorityLevel
      - preemptCap
      - preemptVuln
    EbiArpMapping:
      description: EBI to ARP mapping
      type: object
      properties:
        epsBearerId:
          $ref: '#/components/schemas/EpsBearerId'
        arp:
          $ref: '#/components/schemas/Arp'
      required:
      - epsBearerId
      - arp
    ScheduledCommunicationType:
      anyOf:
      - type: string
        enum:
        - DOWNLINK_ONLY
        - UPLINK_ONLY
        - BIDIRECTIONAL
      - type: string
      description: 'Possible values are:

        -DOWNLINK_ONLY: Downlink only

        -UPLINK_ONLY: Uplink only

        -BIDIRECTIONA: Bi-directional

        '
    CnAssistedRanPara:
      description: SMF derived CN assisted RAN parameters tuning
      type: object
      properties:
        stationaryIndication:
          $ref: '#/components/schemas/StationaryIndication'
        communicationDurationTime:
          $ref: '#/components/schemas/DurationSec'
        periodicTime:
          $ref: '#/components/schemas/DurationSec'
        scheduledCommunicationTime:
          $ref: '#/components/schemas/ScheduledCommunicationTime'
        scheduledCommunicationType:
          $ref: '#/components/schemas/ScheduledCommunicationType'
        trafficProfile:
          $ref: '#/components/schemas/TrafficProfile'
        batteryIndication:
          $ref: '#/components/schemas/BatteryIndication'
    Fqdn:
      description: Fully Qualified Domain Name
      type: string
      pattern: ^([0-9A-Za-z]([-0-9A-Za-z]{0,61}[0-9A-Za-z])?\.)+[A-Za-z]{2,63}\.?$
      minLength: 4
      maxLength: 253
    Ipv6Prefix:
      type: string
      allOf:
      - pattern: ^((:|(0?|([1-9a-f][0-9a-f]{0,3}))):)((0?|([1-9a-f][0-9a-f]{0,3})):){0,6}(:|(0?|([1-9a-f][0-9a-f]{0,3})))(\/(([0-9])|([0-9]{2})|(1[0-1][0-9])|(12[0-8])))$
      - pattern: ^((([^:]+:){7}([^:]+))|((([^:]+:)*[^:]+)?::(([^:]+:)*[^:]+)?))(\/.+)$
      example: 2001:db8:abcd:12::0/64
      description: 'String identifying an IPv6 address prefix formatted according
        to clause 4 of RFC 5952. IPv6Prefix data type may contain an individual /128
        IPv6 address.

        '
    IpAddress:
      type: object
      oneOf:
      - required:
        - ipv4Addr
      - required:
        - ipv6Addr
      - required:
        - ipv6Prefix
      properties:
        ipv4Addr:
          $ref: '#/components/schemas/Ipv4Addr'
        ipv6Addr:
          $ref: '#/components/schemas/Ipv6Addr'
        ipv6Prefix:
          $ref: '#/components/schemas/Ipv6Prefix'
    SupportedFeatures:
      type: string
      pattern: ^[A-Fa-f0-9]*$
      description: "A string used to indicate the features supported by an API that\
        \ is used as defined in clause  6.6 in 3GPP TS 29.500. The string shall contain\
        \ a bitmask indicating supported features in  hexadecimal representation Each\
        \ character in the string shall take a value of \"0\" to \"9\",  \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent the support of 4 features as\
        \ described in  table\_5.2.2-3. The most significant character representing\
        \ the highest-numbered features shall  appear first in the string, and the\
        \ character representing features 1 to 4 shall appear last  in the string.\
        \ The list of features and their numbering (starting with 1) are defined \
        \ separately for each API. If the string contains a lower number of characters\
        \ than there are  defined features for an API, all features that would be\
        \ represented by characters that are not  present in the string are not supported.\n"
    EpsIwkPgw:
      type: object
      required:
      - pgwFqdn
      - smfInstanceId
      properties:
        pgwFqdn:
          $ref: '#/components/schemas/Fqdn'
        smfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        plmnId:
          $ref: '#/components/schemas/PlmnId'
    EpsInterworkingInfo:
      type: object
      properties:
        epsIwkPgws:
          description: A map (list of key-value pairs where Dnn serves as key) of
            EpsIwkPgws
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EpsIwkPgw'
    TraceDepth:
      anyOf:
      - type: string
        enum:
        - MINIMUM
        - MEDIUM
        - MAXIMUM
        - MINIMUM_WO_VENDOR_EXTENSION
        - MEDIUM_WO_VENDOR_EXTENSION
        - MAXIMUM_WO_VENDOR_EXTENSION
      - type: string
      description: 'The enumeration TraceDepth defines how detailed information should
        be recorded in the trace. See 3GPP TS 32.422 for further description of the
        values. It shall comply with the provisions defined in table 5.6.3.1-1

        '
    TraceData:
      description: contains Trace control and configuration parameters.
      type: object
      nullable: true
      properties:
        traceRef:
          type: string
          pattern: ^[0-9]{3}[0-9]{2,3}-[A-Fa-f0-9]{6}$
          description: 'Trace Reference (see 3GPP TS 32.422).It shall be encoded as
            the concatenation of MCC, MNC and Trace ID as follows: <MCC><MNC>-<Trace
            ID> The Trace ID shall be encoded as a 3 octet string in hexadecimal representation.
            Each character in the Trace ID string shall take a value of "0" to "9",
            "a" to "f" or "A" to "F" and shall represent 4 bits. The most significant
            character representing the 4 most significant bits of the Trace ID shall
            appear first  in the string, and the character representing the 4 least
            significant bit of the Trace ID shall appear last in the string.

            '
        traceDepth:
          $ref: '#/components/schemas/TraceDepth'
        neTypeList:
          type: string
          pattern: ^[A-Fa-f0-9]+$
          description: 'List of NE Types (see 3GPP TS 32.422).It shall be encoded
            as an octet string in hexadecimal representation. Each character in the
            string shall take a value of "0" to "9", "a" to "f" or "A" to "F" and
            shall represent 4 bits. The most significant character representing the
            4 most significant bits shall Appear first in the string, and the character
            representing the 4 least significant bit shall appear last in the string.Octets
            shall be coded according to 3GPP TS 32.422.

            '
        eventList:
          type: string
          pattern: ^[A-Fa-f0-9]+$
          description: 'Triggering events (see 3GPP TS 32.422).It shall be encoded
            as an octet string in hexadecimal representation. Each character in the
            string shall take a value of "0" to "9", "a" to "f" or "A" to "F" and
            shall represent 4 bits. The most significant character representing the
            4 most significant bits shall appear first in the string, and the character
            representing the 4 least significant bit shall appear last in the string.
            Octets shall be coded according to 3GPP TS 32.422.

            '
        collectionEntityIpv4Addr:
          $ref: '#/components/schemas/Ipv4Addr'
        collectionEntityIpv6Addr:
          $ref: '#/components/schemas/Ipv6Addr'
        traceReportingConsumerUri:
          $ref: '#/components/schemas/Uri'
        interfaceList:
          type: string
          pattern: ^[A-Fa-f0-9]+$
          description: 'List of Interfaces (see 3GPP TS 32.422).It shall be encoded
            as an octet string in hexadecimal representation. Each character in the
            string shall take a value of "0" to "9", "a" to "f" or "A" to "F" and
            shall represent 4 bits. The most significant character representing the
            4 most significant bits shall appear first in the string, and the character
            representing the  4 least significant bit shall appear last in the string.
            Octets shall be coded according to 3GPP TS 32.422. If this attribute is
            not present, all the interfaces applicable to the list of NE types indicated
            in the neTypeList attribute should be traced.

            '
      required:
      - traceRef
      - traceDepth
      - neTypeList
      - eventList
    StnSr:
