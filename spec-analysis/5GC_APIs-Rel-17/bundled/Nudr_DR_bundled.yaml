        - nudr-dr
        - nudr-dr:subscription-data:authentication-subscription:read
      parameters:
      - name: ueId
        in: path
        description: UE id
        required: true
        schema:
          $ref: '#/components/schemas/Supi'
      - name: supported-features
        in: query
        description: Supported Features
        schema:
          $ref: '#/components/schemas/SupportedFeatures'
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationSubscription'
        default:
          $ref: '#/components/responses/default'
    patch:
      summary: modify the authentication subscription data of a UE
      operationId: ModifyAuthenticationSubscription
      tags:
      - Authentication Subscription (Document)
      security:
      - {}
      - oAuth2ClientCredentials:
        - nudr-dr
      - oAuth2ClientCredentials:
        - nudr-dr
        - nudr-dr:subscription-data:authentication-subscription:modify
      parameters:
      - name: ueId
        in: path
        description: UE id
        required: true
        schema:
          $ref: '#/components/schemas/Supi'
      - name: supported-features
        in: query
        description: Features required to be supported by the target NF
        schema:
          $ref: '#/components/schemas/SupportedFeatures'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PatchItem'
        required: true
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchResult'
        '204':
          description: Expected response to a valid request
        '403':
          description: modification is rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/default'
