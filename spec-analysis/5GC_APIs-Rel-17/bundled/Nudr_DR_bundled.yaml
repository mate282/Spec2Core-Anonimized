        amInfluEntries:
          type: array
          items:
            $ref: '#/components/schemas/AmInfluData'
          minItems: 1
          description: The AM Influence Data entries stored in the UDR that match
            a subscription.
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        resetIds:
          type: array
          items:
            type: string
