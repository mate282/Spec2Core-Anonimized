  schemas:
    DataRestorationNotification:
      description: Contains identities representing those UEs potentially affected
        by a data-loss event at the UDR
      type: object
      properties:
        supiRanges:
          type: array
          items:
            $ref: '#/components/schemas/SupiRange'
          minItems: 1
        gpsiRanges:
          type: array
          items:
            $ref: '#/components/schemas/IdentityRange'
          minItems: 1
        resetIds:
          type: array
          items:
            type: string
          minItems: 1
        sNssaiList:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        dnnList:
          type: array
          items:
            $ref: '#/components/schemas/Dnn'
          minItems: 1
        udrGroupId:
          $ref: '#/components/schemas/NfGroupId'
    Supi:
      type: string
      pattern: ^(imsi-[0-9]{5,15}|nai-.+|gci-.+|gli-.+|.+)$
      description: "String identifying a Supi that shall contain either an IMSI, a\
        \ network specific identifier,\na Global Cable Identifier (GCI) or a Global\
        \ Line Identifier (GLI) as specified in clause \n2.2A of 3GPP TS 23.003. It\
        \ shall be formatted as follows\n - for an IMSI \"imsi-<imsi>\", where <imsi>\
        \ shall be formatted according to clause 2.2\n   of 3GPP TS 23.003 that describes\
        \ an IMSI.\n - for a network specific identifier \"nai-<nai>, where <nai>\
        \ shall be formatted\n   according to clause 28.7.2 of 3GPP TS 23.003 that\
        \ describes an NAI.\n - for a GCI \"gci-<gci>\", where <gci> shall be formatted\
        \ according to clause 28.15.2\n   of 3GPP TS 23.003.\n - for a GLI \"gli-<gli>\"\
        , where <gli> shall be formatted according to clause 28.16.2 of\n   3GPP TS\
        \ 23.003.To enable that the value is used as part of an URI, the string shall\n\
        \   only contain characters allowed according to the \"lower-with-hyphen\"\
        \ naming convention\n   defined in 3GPP TS 29.501.\n"
    SupportedFeatures:
      type: string
      pattern: ^[A-Fa-f0-9]*$
      description: "A string used to indicate the features supported by an API that\
        \ is used as defined in clause  6.6 in 3GPP TS 29.500. The string shall contain\
        \ a bitmask indicating supported features in  hexadecimal representation Each\
        \ character in the string shall take a value of \"0\" to \"9\",  \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent the support of 4 features as\
        \ described in  table\_5.2.2-3. The most significant character representing\
        \ the highest-numbered features shall  appear first in the string, and the\
        \ character representing features 1 to 4 shall appear last  in the string.\
        \ The list of features and their numbering (starting with 1) are defined \
        \ separately for each API. If the string contains a lower number of characters\
        \ than there are  defined features for an API, all features that would be\
        \ represented by characters that are not  present in the string are not supported.\n"
    AuthMethod:
      description: Contains the Authentication Method.
      anyOf:
      - type: string
        enum:
        - 5G_AKA
        - EAP_AKA_PRIME
        - EAP_TLS
        - EAP_TTLS
        - NONE
      - type: string
    SqnScheme:
      description: Scheme for generation of Sequence Numbers.
      anyOf:
      - type: string
        enum:
        - GENERAL
        - NON_TIME_BASED
        - TIME_BASED
      - type: string
    Sign:
      description: Sign of the DIF value.
      type: string
      enum:
      - POSITIVE
      - NEGATIVE
    SequenceNumber:
      description: Contains the SQN.
      type: object
      properties:
        sqnScheme:
          $ref: '#/components/schemas/SqnScheme'
        sqn:
          type: string
          pattern: ^[A-Fa-f0-9]{12}$
        lastIndexes:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
            description: A map(list of key-value pairs) where type of node serves
              as key
        indLength:
          type: integer
          minimum: 0
        difSign:
          $ref: '#/components/schemas/Sign'
    NfGroupId:
      type: string
      description: Identifier of a group of NFs.
    AuthenticationSubscription:
      description: A UE's authentication data.
      type: object
      required:
      - authenticationMethod
      properties:
        authenticationMethod:
          $ref: '#/components/schemas/AuthMethod'
        encPermanentKey:
          type: string
        protectionParameterId:
          type: string
        sequenceNumber:
          $ref: '#/components/schemas/SequenceNumber'
        authenticationManagementField:
          type: string
          pattern: ^[A-Fa-f0-9]{4}$
        algorithmId:
          type: string
        encOpcKey:
          type: string
        encTopcKey:
          type: string
        vectorGenerationInHss:
          type: boolean
          default: false
        hssGroupId:
          $ref: '#/components/schemas/NfGroupId'
        n5gcAuthMethod:
          $ref: '#/components/schemas/AuthMethod'
        rgAuthenticationInd:
          type: boolean
          default: false
        supi:
          $ref: '#/components/schemas/Supi'
        akmaAllowed:
          type: boolean
          default: false
        routingId:
          type: string
          pattern: ^[0-9]{1,4}$
    PatchOperation:
      anyOf:
      - type: string
        enum:
        - add
        - copy
        - move
        - remove
        - replace
        - test
      - type: string
      description: Operations as defined in IETF RFC 6902.
    PatchItem:
      type: object
      properties:
        op:
          $ref: '#/components/schemas/PatchOperation'
        path:
          type: string
          description: 'contains a JSON pointer value (as defined in IETF RFC 6901)
            that references a location of a resource on which the patch operation
            shall be performed.

            '
        from:
          type: string
          description: 'indicates the path of the source JSON element (according to
            JSON Pointer syntax) being moved or copied to the location indicated by
            the "path" attribute.

            '
        value: {}
      required:
      - op
      - path
      description: it contains information on data to be changed.
    ReportItem:
      type: object
      required:
      - path
      properties:
        path:
          type: string
          description: 'Contains a JSON pointer value (as defined in IETF RFC 6901)
            that references a  location of a resource to which the modification is
            subject.

            '
        reason:
          type: string
          description: 'A human-readable reason providing details on the reported
            modification failure.  The reason string should identify the operation
            that failed using the operation''s  array index to assist in correlation
            of the invalid parameter with the failed  operation, e.g. "Replacement
            value invalid for attribute (failed operation index= 4)".

            '
      description: indicates performed modivications.
    PatchResult:
      description: The execution report result on failed modification.
      type: object
      required:
      - report
      properties:
        report:
          type: array
          items:
            $ref: '#/components/schemas/ReportItem'
          minItems: 1
          description: 'The execution report contains an array of report items. Each
            report item indicates one  failed modification.

            '
    Uri:
      type: string
      description: String providing an URI formatted according to RFC 3986.
    InvalidParam:
      type: object
      properties:
        param:
          type: string
          description: 'If the invalid parameter is an attribute in a JSON body, this
            IE shall contain the  attribute''s name and shall be encoded as a JSON
            Pointer. If the invalid parameter is  an HTTP header, this IE shall be
            formatted as the concatenation of the string "header "  plus the name
            of such header. If the invalid parameter is a query parameter, this IE  shall
            be formatted as the concatenation of the string "query " plus the name
            of such  query parameter. If the invalid parameter is a variable part
            in the path of a resource  URI, this IE shall contain the name of the
            variable, including the symbols "{" and "}"  used in OpenAPI specification
            as the notation to represent variable path segments.

            '
        reason:
          type: string
          description: 'A human-readable reason, e.g. "must be a positive integer".
            In cases involving failed  operations in a PATCH request, the reason string
            should identify the operation that  failed using the operation''s array
            index to assist in correlation of the invalid  parameter with the failed
            operation, e.g." Replacement value invalid for attribute  (failed operation
            index= 4)"

            '
      required:
      - param
      description: It contains an invalid parameter and a related description.
    AccessTokenErr:
      description: Error returned in the access token response message
      type: object
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - invalid_request
          - invalid_client
          - invalid_grant
          - unauthorized_client
          - unsupported_grant_type
          - invalid_scope
        error_description:
          type: string
        error_uri:
          type: string
    NfInstanceId:
      type: string
      format: uuid
      description: "String uniquely identifying a NF instance. The format of the NF\
        \ Instance ID shall be a  Universally Unique Identifier (UUID) version 4,\
        \ as described in IETF RFC 4122. \n"
    NFType:
      description: NF types known to NRF
      anyOf:
      - type: string
        enum:
        - NRF
        - UDM
        - AMF
        - SMF
        - AUSF
        - NEF
        - PCF
        - SMSF
        - NSSF
        - UDR
        - LMF
        - GMLC
        - 5G_EIR
        - SEPP
        - UPF
        - N3IWF
        - AF
        - UDSF
        - BSF
        - CHF
        - NWDAF
        - PCSCF
        - CBCF
        - HSS
        - UCMF
        - SOR_AF
        - SPAF
        - MME
        - SCSAS
        - SCEF
        - SCP
        - NSSAAF
        - ICSCF
        - SCSCF
        - DRA
        - IMS_AS
        - AANF
        - 5G_DDNMF
        - NSACF
        - MFAF
        - EASDF
        - DCCF
        - MB_SMF
        - TSCTSF
        - ADRF
        - GBA_BSF
        - CEF
        - MB_UPF
        - NSWOF
        - PKMF
        - MNPF
        - SMS_GMSC
        - SMS_IWMSC
        - MBSF
        - MBSTF
        - PANF
        - IP_SM_GW
        - SMS_ROUTER
      - type: string
    Mcc:
      type: string
      pattern: ^\d{3}$
      description: "Mobile Country Code part of the PLMN, comprising 3 digits, as\
        \ defined in clause 9.3.3.5 of 3GPP TS 38.413. \n"
    Mnc:
      type: string
      pattern: ^\d{2,3}$
      description: Mobile Network Code part of the PLMN, comprising 2 or 3 digits,
        as defined in clause 9.3.3.5 of 3GPP TS 38.413.
    PlmnId:
      type: object
      properties:
        mcc:
          $ref: '#/components/schemas/Mcc'
        mnc:
          $ref: '#/components/schemas/Mnc'
      description: 'When PlmnId needs to be converted to string (e.g. when used in
        maps as key), the string  shall be composed of three digits "mcc" followed
        by "-" and two or three digits "mnc".

        '
      required:
      - mcc
      - mnc
    Snssai:
      type: object
      properties:
        sst:
          type: integer
          minimum: 0
          maximum: 255
          description: "Unsigned integer, within the range 0 to 255, representing\
            \ the Slice/Service Type.  It indicates the expected Network Slice behaviour\
            \ in terms of features and services. Values 0 to 127 correspond to the\
            \ standardized SST range. Values 128 to 255 correspond  to the Operator-specific\
            \ range. See clause 28.4.2 of 3GPP TS 23.003. Standardized values are\
            \ defined in clause 5.15.2.2 of 3GPP TS 23.501. \n"
        sd:
          type: string
          pattern: ^[A-Fa-f0-9]{6}$
          description: '3-octet string, representing the Slice Differentiator, in
            hexadecimal representation. Each character in the string shall take a
            value of "0" to "9", "a" to "f" or "A" to "F" and shall represent 4 bits.
            The most significant character representing the 4 most significant bits
            of the SD shall appear first in the string, and the character representing
            the 4 least significant bit of the SD shall appear last in the string.
            This is an optional parameter that complements the Slice/Service type(s)
            to allow to  differentiate amongst multiple Network Slices of the same
            Slice/Service type. This IE shall be absent if no SD value is associated
            with the SST.

            '
      description: 'When Snssai needs to be converted to string (e.g. when used in
        maps as key), the string shall be composed of one to three digits "sst" optionally
        followed by "-" and 6 hexadecimal digits "sd".

        '
      required:
      - sst
    Fqdn:
      description: Fully Qualified Domain Name
      type: string
      pattern: ^([0-9A-Za-z]([-0-9A-Za-z]{0,61}[0-9A-Za-z])?\.)+[A-Za-z]{2,63}\.?$
      minLength: 4
      maxLength: 253
    Nid:
      type: string
      pattern: ^[A-Fa-f0-9]{11}$
      description: "This represents the Network Identifier, which together with a\
        \ PLMN ID is used to identify an SNPN (see 3GPP TS 23.003 and 3GPP TS 23.501\
        \ clause 5.30.2.1). \n"
    PlmnIdNid:
      description: 'Contains the serving core network operator PLMN ID and, for an
        SNPN, the NID that together with the PLMN ID identifies the SNPN.

        '
      type: object
      required:
      - mcc
      - mnc
      properties:
        mcc:
          $ref: '#/components/schemas/Mcc'
        mnc:
          $ref: '#/components/schemas/Mnc'
        nid:
          $ref: '#/components/schemas/Nid'
    NfSetId:
      type: string
      description: "NF Set Identifier (see clause 28.12 of 3GPP TS 23.003), formatted\
        \ as the following string \"set<Set ID>.<nftype>set.5gc.mnc<MNC>.mcc<MCC>\"\
        , or  \"set<SetID>.<NFType>set.5gc.nid<NID>.mnc<MNC>.mcc<MCC>\" with  <MCC>\
        \ encoded as defined in clause 5.4.2 (\"Mcc\" data type definition)  <MNC>\
        \ encoding the Mobile Network Code part of the PLMN, comprising 3 digits.\
        \ \n  If there are only 2 significant digits in the MNC, one \"0\" digit shall\
        \ be inserted \n  at the left side to fill the 3 digits coding of MNC.  Pattern:\
        \ '^[0-9]{3}$'\n<NFType> encoded as a value defined in Table 6.1.6.3.3-1 of\
        \ 3GPP TS 29.510 but \n  with lower case characters <Set ID> encoded as a\
        \ string of characters consisting of \n  alphabetic characters (A-Z and a-z),\
        \ digits (0-9) and/or the hyphen (-) and that \n  shall end with either an\
        \ alphabetic character or a digit. \n"
    NfServiceSetId:
      type: string
      description: "NF Service Set Identifier (see clause 28.12 of 3GPP TS 23.003)\
        \ formatted as the following  string \"set<Set ID>.sn<Service Name>.nfi<NF\
        \ Instance ID>.5gc.mnc<MNC>.mcc<MCC>\", or  \"set<SetID>.sn<ServiceName>.nfi<NFInstanceID>.5gc.nid<NID>.mnc<MNC>.mcc<MCC>\"\
        \ with  <MCC> encoded as defined in clause 5.4.2 (\"Mcc\" data type definition)\
        \   <MNC> encoding the Mobile Network Code part of the PLMN, comprising 3\
        \ digits. \n  If there are only 2 significant digits in the MNC, one \"0\"\
        \ digit shall be inserted \n  at the left side to fill the 3 digits coding\
        \ of MNC.  Pattern: '^[0-9]{3}$'\n<NID> encoded as defined in clause\_5.4.2\
        \ (\"Nid\" data type definition)  <NFInstanceId> encoded as defined in clause\
        \ 5.3.2  <ServiceName> encoded as defined in 3GPP TS 29.510  <Set ID> encoded\
        \ as a string of characters consisting of alphabetic \n  characters (A-Z and\
        \ a-z), digits (0-9) and/or the hyphen (-) and that shall end \n  with either\
        \ an alphabetic character or a digit.\n"
    AccessTokenReq:
      description: Contains information related to the access token request
      type: object
      required:
      - grant_type
      - nfInstanceId
      - scope
      properties:
        grant_type:
          type: string
          enum:
          - client_credentials
        nfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        nfType:
          $ref: '#/components/schemas/NFType'
        targetNfType:
          $ref: '#/components/schemas/NFType'
        scope:
          type: string
          pattern: ^([a-zA-Z0-9_:-]+)( [a-zA-Z0-9_:-]+)*$
        targetNfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        requesterPlmn:
          $ref: '#/components/schemas/PlmnId'
        requesterPlmnList:
          type: array
          items:
            $ref: '#/components/schemas/PlmnId'
          minItems: 2
        requesterSnssaiList:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        requesterFqdn:
          $ref: '#/components/schemas/Fqdn'
        requesterSnpnList:
          type: array
          items:
            $ref: '#/components/schemas/PlmnIdNid'
          minItems: 1
        targetPlmn:
          $ref: '#/components/schemas/PlmnId'
        targetSnpn:
          $ref: '#/components/schemas/PlmnIdNid'
        targetSnssaiList:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        targetNsiList:
          type: array
          items:
            type: string
          minItems: 1
        targetNfSetId:
          $ref: '#/components/schemas/NfSetId'
        targetNfServiceSetId:
          $ref: '#/components/schemas/NfServiceSetId'
        hnrfAccessTokenUri:
          $ref: '#/components/schemas/Uri'
        sourceNfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
    ProblemDetails:
      description: Provides additional information in an error response.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/Uri'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of
            the problem.
        instance:
          $ref: '#/components/schemas/Uri'
        cause:
          type: string
          description: 'A machine-readable application error cause specific to this
            occurrence of the problem.  This IE should be present and provide application-related
            error information, if available.

            '
        invalidParams:
          type: array
          items:
            $ref: '#/components/schemas/InvalidParam'
          minItems: 1
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        accessTokenError:
          $ref: '#/components/schemas/AccessTokenErr'
        accessTokenRequest:
          $ref: '#/components/schemas/AccessTokenReq'
        nrfId:
          $ref: '#/components/schemas/Fqdn'
    Success:
      type: boolean
    DateTime:
      format: date-time
      type: string
      description: string with format 'date-time' as defined in OpenAPI.
    AuthType:
      anyOf:
      - type: string
        enum:
        - 5G_AKA
        - EAP_AKA_PRIME
        - EAP_TLS
        - NONE
        - EAP_TTLS
      - type: string
    ServingNetworkName:
      type: string
      pattern: ^(5G:mnc[0-9]{3}[.]mcc[0-9]{3}[.]3gppnetwork[.]org(:[A-F0-9]{11})?)|5G:NSWO$
    AuthEvent:
      type: object
      required:
      - nfInstanceId
      - success
      - timeStamp
      - authType
      - servingNetworkName
      properties:
        nfInstanceId:
          $ref: '#/components/schemas/NfInstanceId'
        success:
          $ref: '#/components/schemas/Success'
        timeStamp:
          $ref: '#/components/schemas/DateTime'
        authType:
          $ref: '#/components/schemas/AuthType'
        servingNetworkName:
          $ref: '#/components/schemas/ServingNetworkName'
        authRemovalInd:
          type: boolean
          default: false
        nfSetId:
          $ref: '#/components/schemas/NfSetId'
        resetIds:
          type: array
          items:
            type: string
          minItems: 1
        dataRestorationCallbackUri:
          $ref: '#/components/schemas/Uri'
        udrRestartInd:
          type: boolean
          default: false
    UeUpdateStatus:
      description: Status of the procedure.
      type: string
      enum:
      - NOT_SENT
      - SENT_NO_ACK_REQUIRED
      - WAITING_FOR_ACK
      - ACK_RECEIVED
      - NEGATIVE_ACK_RECEIVED
    SorMac:
      description: MAC value for protecting SOR procedure (SoR-MAC-IAUSF and SoR-XMAC-IUE).
      type: string
      pattern: ^[A-Fa-f0-9]{32}$
    SorData:
      description: Used to store the status of the latest SOR data update.
      type: object
      properties:
        provisioningTime:
          $ref: '#/components/schemas/DateTime'
        ueUpdateStatus:
          $ref: '#/components/schemas/UeUpdateStatus'
        sorXmacIue:
          $ref: '#/components/schemas/SorMac'
        sorMacIue:
          $ref: '#/components/schemas/SorMac'
        meSupportOfSorCmci:
          type: boolean
      required:
      - provisioningTime
      - ueUpdateStatus
    VarUeId:
      type: string
      pattern: ^(imsi-[0-9]{5,15}|nai-.+|msisdn-[0-9]{5,15}|extid-[^@]+@[^@]+|gci-.+|gli-.+|.+)$
      description: String represents the SUPI or GPSI
    UpuMac:
      description: MAC value for protecting UPU procedure (UPU-MAC-IAUSF and UPU-MAC-IUE).
      type: string
      pattern: ^[A-Fa-f0-9]{32}$
    UpuData:
      description: Used to store the status of the latest UPU data update.
      type: object
      properties:
        provisioningTime:
          $ref: '#/components/schemas/DateTime'
        ueUpdateStatus:
          $ref: '#/components/schemas/UeUpdateStatus'
        upuXmacIue:
          $ref: '#/components/schemas/UpuMac'
        upuMacIue:
          $ref: '#/components/schemas/UpuMac'
      required:
      - provisioningTime
      - ueUpdateStatus
    CagAckData:
      description: Used to store the status of the latest CAG data update.
      type: object
      properties:
        provisioningTime:
          $ref: '#/components/schemas/DateTime'
        ueUpdateStatus:
          $ref: '#/components/schemas/UeUpdateStatus'
      required:
      - provisioningTime
      - ueUpdateStatus
    NssaiAckData:
      description: Used to store the status of the latest NSSAI data update.
      type: object
      properties:
        provisioningTime:
          $ref: '#/components/schemas/DateTime'
        ueUpdateStatus:
          $ref: '#/components/schemas/UeUpdateStatus'
      required:
      - provisioningTime
      - ueUpdateStatus
    VarPlmnId:
      description: PLMN Id (MCC, MNC) or SNPN Id (MCC, MNC, NID).
      type: string
      pattern: ^[0-9]{5,6}(-[A-Fa-f0-9]{11})?$
    DataSetName:
      description: The name of data set.
      anyOf:
      - type: string
        enum:
        - AM
        - SMF_SEL
        - SMS_SUB
        - SM
        - TRACE
        - SMS_MNG
        - LCS_PRIVACY
        - LCS_MO
        - LCS_BCA
        - V2X
        - PROSE
        - ODB
        - EE_PROF
        - PP_PROF
        - NIDD_AUTH
        - USER_CONSENT
        - MBS
      - type: string
    DatasetNames:
      description: The list of names of data sets.
      type: array
      items:
        $ref: '#/components/schemas/DataSetName'
      minItems: 1
      uniqueItems: true
    Gpsi:
      type: string
      pattern: ^(msisdn-[0-9]{5,15}|extid-[^@]+@[^@]+|.+)$
      description: "String identifying a Gpsi shall contain either an External Id\
        \ or an MSISDN.  It shall be formatted as follows -External Identifier= \"\
        extid-'extid', where 'extid'  shall be formatted according to clause 19.7.2\
        \ of 3GPP TS 23.003 that describes an  External Identifier. \n"
    GroupId:
      type: string
      pattern: ^[A-Fa-f0-9]{8}-[0-9]{3}-[0-9]{2,3}-([A-Fa-f0-9][A-Fa-f0-9]){1,10}$
      description: "String identifying a group of devices network internal globally\
        \ unique ID which identifies a set of IMSIs, as specified in clause 19.9 of\
        \ 3GPP TS 23.003. \n"
    SharedDataId:
      type: string
      pattern: ^[0-9]{5,6}-.+$
    BitRate:
      type: string
      pattern: ^\d+(\.\d+)? (bps|Kbps|Mbps|Gbps|Tbps)$
      description: 'String representing a bit rate; the prefixes follow the standard
        symbols from The International System of Units, and represent x1000 multipliers,
        with the exception that prefix "K" is used to represent the standard symbol
        "k".

        '
    Ambr:
      description: Contains the maximum aggregated uplink and downlink bit rates.
      type: object
      properties:
        uplink:
          $ref: '#/components/schemas/BitRate'
        downlink:
          $ref: '#/components/schemas/BitRate'
      required:
      - uplink
      - downlink
    NullValue:
      enum:
      - null
      description: JSON's null value.
    AmbrRm:
      anyOf:
      - $ref: '#/components/schemas/Ambr'
      - $ref: '#/components/schemas/NullValue'
      description: 'This data type is defined in the same way as the ''Ambr'' data
        type, but with the OpenAPI ''nullable: true'' property."

        '
    SliceMbr:
      description: MBR related to slice
      type: object
      properties:
        uplink:
          $ref: '#/components/schemas/BitRate'
        downlink:
          $ref: '#/components/schemas/BitRate'
      required:
      - uplink
      - downlink
    SliceMbrRm:
      description: 'SliceMbr with nullable: true'
      anyOf:
      - $ref: '#/components/schemas/SliceMbr'
      - $ref: '#/components/schemas/NullValue'
    NsSrg:
      type: string
      description: 'String providing a Network Slice Simultaneous Registration Group.
        See clause 5.15.12 of  3GPP TS 23.501

        '
    AdditionalSnssaiData:
      type: object
      properties:
        requiredAuthnAuthz:
          type: boolean
        subscribedUeSliceMbr:
          $ref: '#/components/schemas/SliceMbrRm'
        subscribedNsSrgList:
          type: array
          items:
            $ref: '#/components/schemas/NsSrg'
          minItems: 1
    Nssai:
      type: object
      required:
      - defaultSingleNssais
      properties:
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        defaultSingleNssais:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        singleNssais:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        provisioningTime:
          $ref: '#/components/schemas/DateTime'
        additionalSnssaiData:
          description: A map(list of key-value pairs) where singleNssai serves as
            key of AdditionalSnssaiData
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AdditionalSnssaiData'
          minProperties: 1
        suppressNssrgInd:
          type: boolean
      nullable: true
    RatType:
      anyOf:
      - type: string
        enum:
        - NR
        - EUTRA
        - WLAN
        - VIRTUAL
        - NBIOT
        - WIRELINE
        - WIRELINE_CABLE
        - WIRELINE_BBF
        - LTE-M
        - NR_U
        - EUTRA_U
        - TRUSTED_N3GA
        - TRUSTED_WLAN
        - UTRA
        - GERA
        - NR_LEO
        - NR_MEO
        - NR_GEO
        - NR_OTHER_SAT
        - NR_REDCAP
        - WB_E_UTRAN_LEO
        - WB_E_UTRAN_MEO
        - WB_E_UTRAN_GEO
        - WB_E_UTRAN_OTHERSAT
        - NB_IOT_LEO
        - NB_IOT_MEO
        - NB_IOT_GEO
        - NB_IOT_OTHERSAT
        - LTE_M_LEO
        - LTE_M_MEO
        - LTE_M_GEO
        - LTE_M_OTHERSAT
      - type: string
      description: Indicates the radio access used.
    Tac:
      type: string
      pattern: (^[A-Fa-f0-9]{4}$)|(^[A-Fa-f0-9]{6}$)
      description: "2 or 3-octet string identifying a tracking area code as specified\
        \ in clause 9.3.3.10  of 3GPP TS 38.413, in hexadecimal representation. Each\
        \ character in the string shall  take a value of \"0\" to \"9\", \"a\" to\
        \ \"f\" or \"A\" to \"F\" and shall represent 4 bits. The most significant\
        \ character representing the 4 most significant bits of the TAC shall  appear\
        \ first in the string, and the character representing the 4 least significant\
        \ bit  of the TAC shall appear last in the string. \n"
    AreaCode:
      type: string
      description: Values are operator specific.
    Area:
      description: Provides area information.
      type: object
      oneOf:
      - required:
        - tacs
      - required:
        - areaCode
      properties:
        tacs:
          type: array
          items:
            $ref: '#/components/schemas/Tac'
          minItems: 1
        areaCode:
          $ref: '#/components/schemas/AreaCode'
    RestrictionType:
      anyOf:
      - type: string
        enum:
        - ALLOWED_AREAS
        - NOT_ALLOWED_AREAS
      - type: string
      description: It contains the restriction type ALLOWED_AREAS or NOT_ALLOWED_AREAS.
    Uinteger:
      type: integer
      minimum: 0
      description: Unsigned Integer, i.e. only value 0 and integers above 0 are permissible.
    ServiceAreaRestriction:
      description: Provides information about allowed or not allowed areas.
      type: object
      properties:
        restrictionType:
          $ref: '#/components/schemas/RestrictionType'
        areas:
          type: array
          items:
            $ref: '#/components/schemas/Area'
        maxNumOfTAs:
          $ref: '#/components/schemas/Uinteger'
        maxNumOfTAsForNotAllowedAreas:
          $ref: '#/components/schemas/Uinteger'
      allOf:
      - oneOf:
        - not:
            required:
            - restrictionType
        - required:
          - areas
      - anyOf:
        - not:
            required:
            - restrictionType
            properties:
              restrictionType:
                type: string
                enum:
                - NOT_ALLOWED_AREAS
        - not:
            required:
            - maxNumOfTAs
      - anyOf:
        - not:
            required:
            - restrictionType
            properties:
              restrictionType:
                type: string
                enum:
                - ALLOWED_AREAS
        - not:
            required:
            - maxNumOfTAsForNotAllowedAreas
    CoreNetworkType:
      anyOf:
      - type: string
        enum:
        - 5GC
        - EPC
      - type: string
      description: It contains the Core Network type 5GC or EPC.
    RfspIndexRm:
      type: integer
