        - SERVICE_AREA_COVRG_OUTCOME
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
    ServiceAreaCoverageInfo:
      description: It represents a list of Tracking Areas within a serving network.
      type: object
      required:
      - tacList
      properties:
        tacList:
          type: array
          description: Indicates a list of Tracking Areas where the service is allowed.
          items:
            $ref: '#/components/schemas/Tac'
        servingNetwork:
          $ref: '#/components/schemas/PlmnIdNid'
    AmInfluData:
      description: Represents the AM Influence Data.
      type: object
      properties:
        appIds:
          type: array
          items:
            type: string
          minItems: 1
          description: Identifies one or more applications.
        dnnSnssaiInfos:
          type: array
          items:
            $ref: '#/components/schemas/DnnSnssaiInformation'
          minItems: 1
          description: Identifies one or more DNN, S-NSSAI combinations.
        interGroupId:
          $ref: '#/components/schemas/GroupId'
        supi:
          $ref: '#/components/schemas/Supi'
        anyUeInd:
          type: boolean
          description: Indicates whether the data is applicable for any UE.
        policyDuration:
          $ref: '#/components/schemas/DurationSec'
        evSubs:
          type: array
          items:
            $ref: '#/components/schemas/AmInfluEvent'
          minItems: 1
          description: List of AM related events for which a subscription is required.
        notifUri:
          $ref: '#/components/schemas/Uri'
        notifCorrId:
          type: string
          description: Notification correlation identifier.
        headers:
          type: array
          description: Contains the headers provisioned by the NEF.
          items:
            type: string
          minItems: 1
        thruReq:
          type: boolean
          description: Indicates whether high throughput is desired for the indicated
            UE traffic.
        covReq:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAreaCoverageInfo'
          minItems: 1
          description: Indicates the service area coverage requirement.
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        resUri:
          $ref: '#/components/schemas/Uri'
        resetIds:
          type: array
          items:
            type: string
          minItems: 1
