          - thruReq
        - required:
          - covReq
      - oneOf:
        - required:
          - supi
        - required:
          - interGroupId
        - required:
          - anyUeInd
    ApplicationDataSubs:
      description: Identifies a subscription to application data change notification.
      type: object
      properties:
        notificationUri:
          $ref: '#/components/schemas/Uri'
        dataFilters:
          type: array
          items:
            $ref: '#/components/schemas/DataFilter'
