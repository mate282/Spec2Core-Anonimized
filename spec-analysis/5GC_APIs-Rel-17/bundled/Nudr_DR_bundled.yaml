        - GNSS
        - E_CELL_ID
      - type: string
      description: 'The enumeration LoggingDurationMdt defines Logging Duration for
        MDT in the trace. See 3GPP TS 32.422 for further description of the values.
        It shall comply with the provisions defined in table 5.6.3.13-1.

        '
    CollectionPeriodRmmLteMdt:
