openapi: 3.0.0
info:
  version: 2.2.5
  title: Nudr_DataRepository API OpenAPI file
  description: "Unified Data Repository Service.  \n\xA9 2024, 3GPP Organizational\
    \ Partners (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC).  \nAll rights reserved.\n"
servers:
- description: API root
  url: http://udr:8000/nudr-dr/v2
security:
- {}
- oAuth2ClientCredentials:
  - nudr-dr
externalDocs:
  description: 3GPP TS 29.504 V17.14.0; 5G System; Unified Data Repository Services;
    Stage 3
  url: https://www.3gpp.org/ftp/Specs/archive/29_series/29.504/
