        snssais:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        internalGroupIds:
          type: array
          items:
            $ref: '#/components/schemas/GroupId'
          minItems: 1
        supis:
          type: array
          items:
            $ref: '#/components/schemas/Supi'
          minItems: 1
        appIds:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationId'
          minItems: 1
        ueIpv4s:
          type: array
          items:
            $ref: '#/components/schemas/Ipv4Addr'
          minItems: 1
        ueIpv6s:
          type: array
          items:
            $ref: '#/components/schemas/Ipv6Addr'
          minItems: 1
        ueMacs:
          type: array
          items:
            $ref: '#/components/schemas/MacAddr48'
          minItems: 1
        anyUeInd:
          type: boolean
