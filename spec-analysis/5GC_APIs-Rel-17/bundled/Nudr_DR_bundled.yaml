        timeZoneTs:
          $ref: '#/components/schemas/DateTime'
        accessType:
          $ref: '#/components/schemas/AccessType'
        regStates:
          type: array
          items:
            $ref: '#/components/schemas/RmInfo'
        regStatesTs:
