        '
    ReportingTrigger:
      anyOf:
      - type: string
        enum:
        - PERIODICAL
        - EVENT_A2
        - EVENT_A2_PERIODIC
        - ALL_RRM_EVENT_TRIGGERS
      - type: string
      description: 'The enumeration ReportingTrigger defines Reporting Triggers for
        MDT in the trace. See 3GPP TS 32.42] for further  description of the values.
        It shall comply with the provisions defined in table 5.6.3.8-1.

        '
    ReportIntervalMdt:
      anyOf:
      - type: string
        enum:
        - 120
        - 240
        - 480
        - 640
        - 1024
        - 2048
        - 5120
        - 10240
        - 60000
        - 360000
        - 720000
        - 1800000
        - 3600000
      - type: string
      description: 'The enumeration ReportIntervalMdt defines Report Interval for
        MDT in the trace. See 3GPP TS 32.422 for further description of the values.
        It shall comply with the provisions defined in table 5.6.3.9-1.

        '
    ReportIntervalNrMdt:
      anyOf:
      - type: string
        enum:
        - 120
        - 240
        - 480
        - 640
        - 1024
        - 2048
        - 5120
        - 10240
        - 20480
        - 40960
        - 60000
        - 360000
        - 720000
        - 1800000
        - 3600000
      - type: string
      description: 'The enumeration ReportIntervalNrMdt defines Report Interval in
