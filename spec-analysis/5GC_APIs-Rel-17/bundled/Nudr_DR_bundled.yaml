      description: Represents the PFDs and related data for the application.
      type: object
      properties:
        applicationId:
          $ref: '#/components/schemas/ApplicationId'
        pfds:
          type: array
          items:
            $ref: '#/components/schemas/PfdContent'
          minItems: 1
        cachingTime:
          $ref: '#/components/schemas/DateTime'
        suppFeat:
          $ref: '#/components/schemas/SupportedFeatures'
        resetIds:
          type: array
          items:
            type: string
          minItems: 1
        allowedDelay:
          $ref: '#/components/schemas/DurationSec'
      required:
      - applicationId
      - pfds
    FlowDescription:
      description: Defines a packet filter of an IP flow.
      type: string
    FlowDirection:
      anyOf:
      - type: string
        enum:
        - DOWNLINK
        - UPLINK
        - BIDIRECTIONAL
        - UNSPECIFIED
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: 'Possible values are

        - DOWNLINK: The corresponding filter applies for traffic to the UE.

        - UPLINK: The corresponding filter applies for traffic from the UE.

        - BIDIRECTIONAL: The corresponding filter applies for traffic both to and
        from the UE.

        - UNSPECIFIED: The corresponding filter applies for traffic to the UE (downlink),
        but has no specific direction declared. The service data flow detection shall
        apply the filter for uplink traffic as if the filter was bidirectional. The
        PCF shall not use the value UNSPECIFIED in filters created by the network
        in NW-initiated procedures. The PCF shall only include the value UNSPECIFIED
        in filters in UE-initiated procedures if the same value is received from the
        SMF.

        '
    EthFlowDescription:
      description: Identifies an Ethernet flow.
      type: object
      required:
      - ethType
      properties:
        destMacAddr:
          $ref: '#/components/schemas/MacAddr48'
        ethType:
          type: string
        fDesc:
          $ref: '#/components/schemas/FlowDescription'
        fDir:
          $ref: '#/components/schemas/FlowDirection'
        sourceMacAddr:
          $ref: '#/components/schemas/MacAddr48'
        vlanTags:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 2
        srcMacAddrEnd:
          $ref: '#/components/schemas/MacAddr48'
        destMacAddrEnd:
          $ref: '#/components/schemas/MacAddr48'
    FlowInfo:
      description: Represents IP flow information.
      type: object
      properties:
        flowId:
          type: integer
          description: Indicates the IP flow identifier.
        flowDescriptions:
          type: array
          items:
            type: string
          description: 'Indicates the packet filters of the IP flow. Refer to clause
            5.3.8 of 3GPP TS 29.214 for encoding. It shall contain UL and/or DL IP
            flow description.

            '
          minItems: 1
          maxItems: 2
      required:
      - flowId
    Dnai:
      type: string
      description: DNAI (Data network access identifier), see clause 5.6.7 of 3GPP
        TS 23.501.
    RouteInformation:
      type: object
      properties:
        ipv4Addr:
          $ref: '#/components/schemas/Ipv4Addr'
        ipv6Addr:
          $ref: '#/components/schemas/Ipv6Addr'
        portNumber:
          $ref: '#/components/schemas/Uinteger'
      required:
      - portNumber
      nullable: true
      description: "At least one of the \"ipv4Addr\" attribute and the \"ipv6Addr\"\
        \ attribute shall be included in the \"RouteInformation\" data type. \n"
    RouteToLocation:
      type: object
      properties:
        dnai:
          $ref: '#/components/schemas/Dnai'
        routeInfo:
          $ref: '#/components/schemas/RouteInformation'
        routeProfId:
          type: string
          nullable: true
          description: Identifies the routing profile Id.
      required:
      - dnai
      anyOf:
      - required:
        - routeInfo
      - required:
        - routeProfId
      nullable: true
      description: 'At least one of the "routeInfo" attribute and the "routeProfId"
        attribute shall be included in the "RouteToLocation" data type.

        '
    TemporalValidity:
      description: Indicates the time interval(s) during which the AF request is to
        be applied.
      type: object
      properties:
        startTime:
          $ref: '#/components/schemas/DateTime'
        stopTime:
          $ref: '#/components/schemas/DateTime'
    SubscribedEvent:
      anyOf:
      - type: string
        enum:
        - UP_PATH_CHANGE
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: 'Possible values are:

        - UP_PATH_CHANGE: The AF requests to be notified when the UP path changes
        for the PDU session.

        '
    DnaiChangeType:
      anyOf:
      - type: string
        enum:
        - EARLY
        - EARLY_LATE
        - LATE
      - type: string
        description: "This string provides forward-compatibility with future extensions\
          \ to the enumeration but is not used to encode  content defined in the present\
          \ version of this API. \n"
      description: "Possible values are:\n- EARLY: Early notification of UP path reconfiguration.\n\
        - EARLY_LATE: Early and late notification of UP path reconfiguration. This\
        \ value shall\n  only be present in the subscription to the DNAI change event.\n\
        - LATE: Late notification of UP path reconfiguration. \n"
    TrafficInfluData:
      description: Represents the Traffic Influence Data.
      type: object
      properties:
        upPathChgNotifCorreId:
          type: string
          description: 'Contains the Notification Correlation Id allocated by the
            NEF for the UP path change notification.

            '
        appReloInd:
          type: boolean
          description: 'Identifies whether an application can be relocated once a
            location of the application has been selected.

            '
        afAppId:
          type: string
          description: Identifies an application.
        dnn:
          $ref: '#/components/schemas/Dnn'
        ethTrafficFilters:
          type: array
          items:
            $ref: '#/components/schemas/EthFlowDescription'
          minItems: 1
          description: 'Identifies Ethernet packet filters. Either "trafficFilters"
            or "ethTrafficFilters" shall be included if applicable.

            '
        snssai:
          $ref: '#/components/schemas/Snssai'
        interGroupId:
          $ref: '#/components/schemas/GroupId'
        supi:
          $ref: '#/components/schemas/Supi'
        trafficFilters:
          type: array
          items:
            $ref: '#/components/schemas/FlowInfo'
          minItems: 1
          description: 'Identifies IP packet filters. Either "trafficFilters" or "ethTrafficFilters"
            shall be included if applicable.

            '
        trafficRoutes:
          type: array
          items:
            $ref: '#/components/schemas/RouteToLocation'
          minItems: 1
          description: Identifies the N6 traffic routing requirement.
        traffCorreInd:
          type: boolean
        validStartTime:
          $ref: '#/components/schemas/DateTime'
        validEndTime:
          $ref: '#/components/schemas/DateTime'
        tempValidities:
          type: array
          items:
            $ref: '#/components/schemas/TemporalValidity'
          minItems: 1
          description: Identifies the temporal validities for the N6 traffic routing
            requirement.
        nwAreaInfo:
          $ref: '#/components/schemas/schemas-NetworkAreaInfo'
        upPathChgNotifUri:
          $ref: '#/components/schemas/Uri'
        headers:
          description: Contains the headers provisioned by the NEF.
          type: array
          items:
            type: string
          minItems: 1
        subscribedEvents:
          type: array
          items:
            $ref: '#/components/schemas/SubscribedEvent'
          minItems: 1
        dnaiChgType:
          $ref: '#/components/schemas/DnaiChangeType'
        afAckInd:
          type: boolean
        addrPreserInd:
          type: boolean
        maxAllowedUpLat:
          $ref: '#/components/schemas/Uinteger'
        simConnInd:
          type: boolean
          description: 'Indicates whether simultaneous connectivity should be temporarily
            maintained for the source and target PSA.

            '
        simConnTerm:
          $ref: '#/components/schemas/DurationSec'
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        resUri:
          $ref: '#/components/schemas/Uri'
        resetIds:
          type: array
          items:
            type: string
          minItems: 1
      allOf:
      - oneOf:
        - required:
          - afAppId
        - required:
          - trafficFilters
        - required:
          - ethTrafficFilters
      - oneOf:
        - required:
          - supi
        - required:
          - interGroupId
    UintegerRm:
      type: integer
      minimum: 0
      description: 'Unsigned Integer, i.e. only value 0 and integers above 0 are permissible
        with the OpenAPI ''nullable: true'' property.

        '
      nullable: true
    TrafficInfluDataPatch:
      description: Represents the Traffic Influence Data to be updated in the UDR.
      type: object
      properties:
        upPathChgNotifCorreId:
          type: string
          description: 'Contains the Notification Correlation Id allocated by the
            NEF for the UP path change notification.

            '
        appReloInd:
          type: boolean
          description: 'Identifies whether an application can be relocated once a
            location of the application has been selected.

            '
        ethTrafficFilters:
          type: array
          items:
            $ref: '#/components/schemas/EthFlowDescription'
          minItems: 1
          description: 'Identifies Ethernet packet filters. Either "trafficFilters"
            or "ethTrafficFilters" shall be included if applicable.

            '
        trafficFilters:
          type: array
          items:
            $ref: '#/components/schemas/FlowInfo'
          minItems: 1
          description: 'Identifies IP packet filters. Either "trafficFilters" or "ethTrafficFilters"
            shall be included if applicable.

            '
        trafficRoutes:
          type: array
          items:
            $ref: '#/components/schemas/RouteToLocation'
          minItems: 1
          description: Identifies the N6 traffic routing requirement.
        traffCorreInd:
          type: boolean
        validStartTime:
          $ref: '#/components/schemas/DateTime'
        validEndTime:
          $ref: '#/components/schemas/DateTime'
        tempValidities:
          type: array
          items:
            $ref: '#/components/schemas/TemporalValidity'
          minItems: 1
          nullable: true
          description: Identifies the temporal validities for the N6 traffic routing
            requirement.
        nwAreaInfo:
          $ref: '#/components/schemas/schemas-NetworkAreaInfo'
        upPathChgNotifUri:
          $ref: '#/components/schemas/Uri'
        headers:
          description: Contains the headers provisioned by the NEF.
          type: array
          items:
            type: string
          minItems: 1
        afAckInd:
          type: boolean
        addrPreserInd:
          type: boolean
        maxAllowedUpLat:
          $ref: '#/components/schemas/UintegerRm'
        simConnInd:
          type: boolean
          description: 'Indicates whether simultaneous connectivity should be temporarily
            maintained for the source and target PSA.

            '
        simConnTerm:
          $ref: '#/components/schemas/DurationSecRm'
    BdtPolicyData:
      description: Represents applied BDT policy data.
      type: object
      properties:
        interGroupId:
          $ref: '#/components/schemas/GroupId'
        supi:
          $ref: '#/components/schemas/Supi'
        bdtRefId:
          $ref: '#/components/schemas/BdtReferenceId'
        dnn:
          $ref: '#/components/schemas/Dnn'
        snssai:
          $ref: '#/components/schemas/Snssai'
        resUri:
          $ref: '#/components/schemas/Uri'
        resetIds:
          type: array
          items:
            type: string
          minItems: 1
      required:
      - bdtRefId
    BdtPolicyDataPatch:
      description: 'Represents modification instructions to be performed on the applied
        BDT policy data.

        '
      type: object
      properties:
        bdtRefId:
          $ref: '#/components/schemas/BdtReferenceId'
      required:
      - bdtRefId
    AccessRightStatus:
      anyOf:
      - type: string
        enum:
        - FULLY_ALLOWED
        - PREVIEW_ALLOWED
        - NO_ALLOWED
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: 'Possible values are:

        - FULLY_ALLOWED: The User is fully allowed to access to the channel.

        - PREVIEW_ALLOWED: The User is preview allowed to access to the channel.

        - NO_ALLOWED: The User is not allowed to access to the channel.

        '
    MulticastAccessControl:
      description: Represents multicast address access control information.
      type: object
      properties:
        srcIpv4Addr:
          $ref: '#/components/schemas/Ipv4Addr'
        srcIpv6Addr:
          $ref: '#/components/schemas/Ipv6Addr'
        multicastV4Addr:
          $ref: '#/components/schemas/Ipv4Addr'
        multicastV6Addr:
          $ref: '#/components/schemas/Ipv6Addr'
        accStatus:
          $ref: '#/components/schemas/AccessRightStatus'
      required:
      - accStatus
    IptvConfigData:
      description: Represents IPTV configuration data information.
      type: object
      properties:
        supi:
          $ref: '#/components/schemas/Supi'
        interGroupId:
          description: Identifies a group of users.
        dnn:
          $ref: '#/components/schemas/Dnn'
        snssai:
          $ref: '#/components/schemas/Snssai'
        afAppId:
          type: string
        multiAccCtrls:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MulticastAccessControl'
          minProperties: 1
          description: 'Identifies a list of multicast address access control information.
            Any string value can be used as a key of the map.

            '
        suppFeat:
          $ref: '#/components/schemas/SupportedFeatures'
        resUri:
          $ref: '#/components/schemas/Uri'
        resetIds:
          type: array
          items:
            type: string
          minItems: 1
      required:
      - afAppId
      - multiAccCtrls
      oneOf:
      - required:
        - interGroupId
      - required:
        - supi
    IptvConfigDataPatch:
      description: 'Represents the parameters to request the modification of an IPTV
        Configuration resource.

        '
      type: object
      properties:
        multiAccCtrls:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MulticastAccessControl'
          minProperties: 1
          description: 'Identifies a list of multicast address access control information.
            Any string value can be used as a key of the map.

            '
    schemas-Ipv4Addr:
      type: string
      description: string identifying a Ipv4 address formatted in the "dotted decimal"
        notation as defined in IETF RFC 1166.
    schemas-Ipv6Addr:
      type: string
      description: string identifying a Ipv6 address formatted according to clause
        4 in IETF RFC 5952. The mixed Ipv4 Ipv6 notation according to clause 5 of
        IETF RFC 5952 shall not be used.
    ParameterOverPc5:
      description: 'Represents configuration parameters for V2X communications over
        PC5 reference point.

        '
      type: string
    ParameterOverUu:
      description: 'Represents configuration parameters for V2X communications over
        Uu reference point.

        '
      type: string
    ParamForProSeDd:
      description: Represents the service parameters for 5G ProSe direct discovery.
      type: string
    ParamForProSeDc:
      description: Represents the service parameters for 5G ProSe direct communications.
      type: string
    ParamForProSeU2NRelUe:
      description: Represents the service parameters for 5G ProSe UE-to-network relay
        UE.
      type: string
    ParamForProSeRemUe:
      description: Represents the service parameters for 5G ProSe Remate UE.
      type: string
    schemas-AppDescriptor:
      description: Represents an operation system and the corresponding applications.
      type: object
      properties:
        osId:
          $ref: '#/components/schemas/OsId'
        appIds:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ApplicationId'
          minProperties: 1
          description: 'Identifies applications that are running on the UE''s operating
            system. Any string value can be used as a key of the map.

            '
      required:
      - osId
      - appIds
    ConnectionCapabilities:
      anyOf:
      - type: string
        enum:
        - IMS
        - MMS
        - SUPL
        - INTERNET
      - type: string
        description: 'This string provides forward-compatibility with future extensions
          to the enumeration but is not used to encode content defined in the present
          version of this API.

          '
      description: "Possible values are\n  - IMS: Indicates the connection capability\
        \ to support IMS service.\n  - MMS: Indicates the connection capability to\
        \ support MMS service.\n  - SUPL: Indicates the connection capability to support\
        \ SUPL service.\n  - INTERNET: Indicates the connection capability to support\
        \ Internet service.\n"
    TrafficDescriptorComponents:
      description: Traffic descriptor components for the requested URSP.
      type: object
      properties:
        appDescs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/schemas-AppDescriptor'
          minProperties: 1
          description: Describes the operation systems and the corresponding applications
            for each operation systems. The key of map is osId.
        flowDescs:
          type: array
          items:
            type: string
          minItems: 1
          description: Represents a 3-tuple with protocol, server ip and server port
            for UL/DL application traffic. The content of the string has the same
            encoding as the IPFilterRule AVP value as defined in IETF RFC 6733.
        domainDescs:
          type: array
          items:
            type: string
          minItems: 1
          description: FQDN(s) or a regular expression which are used as a domain
            name matching criteria.
        ethFlowDescs:
          type: array
          items:
            $ref: '#/components/schemas/EthFlowDescription'
          minItems: 1
          description: Descriptor(s) for destination information of non-IP traffic
            in which only ethernet flow description is defined.
        dnns:
          type: array
          items:
            $ref: '#/components/schemas/Dnn'
          minItems: 1
          description: This is matched against the DNN information provided by the
            application.
        connCaps:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionCapabilities'
          minItems: 1
          description: This is matched against the information provided by a UE application
            when it requests a network connection with certain capabilities.
      anyOf:
      - required:
        - appDescs
      - required:
        - flowDescs
      - required:
        - domainDescs
      - required:
        - ethFlowDescs
      - required:
        - dnns
      - required:
        - connCaps
    GeographicalArea:
      description: Contains geographical area information (e.g.a civic address or
        shapes).
      type: object
      properties:
        civicAddress:
          $ref: '#/components/schemas/CivicAddress'
        shapes:
          $ref: '#/components/schemas/GeographicArea'
    RouteSelectionParameterSet:
      description: 'Contains parameters that can be used to guide the Route Selection
        Descriptors of the URSP.

        '
      type: object
      properties:
        dnn:
          $ref: '#/components/schemas/Dnn'
        snssai:
          $ref: '#/components/schemas/Snssai'
        precedence:
          $ref: '#/components/schemas/Uinteger'
        spatialValidityAreas:
          type: array
          items:
            $ref: '#/components/schemas/GeographicalArea'
          minItems: 1
          description: 'Indicates where the route selection parameters apply. It may
            correspond to a geographical area, for example using a geographic shape
            that is known to the AF and is configured by the operator to correspond
            to a list of or TAIs.

            '
        spatialValidityTais:
          type: array
          items:
            $ref: '#/components/schemas/Tai'
          minItems: 1
          description: 'Indicates the TAIs in which the route selection parameters
            apply. This attribute is  applicable only within the 5GC and it shall
            not be included in the request messages of  untrusted AFs for URSP guidance.

            '
    UrspRuleRequest:
      description: Contains parameters that can be used to guide the URSP.
      type: object
      properties:
        trafficDesc:
          $ref: '#/components/schemas/TrafficDescriptorComponents'
        relatPrecedence:
          $ref: '#/components/schemas/Uinteger'
        routeSelParamSets:
          type: array
          items:
            $ref: '#/components/schemas/RouteSelectionParameterSet'
          minItems: 1
          description: 'Sets of parameters that may be used to guide the Route Selection
            Descriptors of the  URSP.

            '
    Event:
      anyOf:
      - type: string
        enum:
        - SUCCESS_UE_POL_DEL_SP
        - UNSUCCESS_UE_POL_DEL_SP
      - type: string
        description: 'This string identifies AF subscribe to event(s) notifications
          related to AF provisioned service parameters.

          '
      description: "Possible values are:\n- SUCCESS_UE_POL_DEL_SP: Successful UE Policy\
        \ Delivery related to \n  the invocation of AF provisioned Service Parameters.\n\
        - UNSUCCESS_UE_POL_DEL_SP: Unsuccessful UE Policy Delivery related to the\
        \ invocation of AF\n   provisioned Service Parameters.\n"
    ServiceParameterData:
      description: Represents the service parameter data.
      type: object
      properties:
        appId:
          type: string
          description: Identifies an application.
        dnn:
          $ref: '#/components/schemas/Dnn'
        snssai:
          $ref: '#/components/schemas/Snssai'
        interGroupId:
          $ref: '#/components/schemas/GroupId'
        supi:
          $ref: '#/components/schemas/Supi'
        ueIpv4:
          $ref: '#/components/schemas/schemas-Ipv4Addr'
        ueIpv6:
          $ref: '#/components/schemas/schemas-Ipv6Addr'
        ueMac:
          $ref: '#/components/schemas/MacAddr48'
        anyUeInd:
          type: boolean
        paramOverPc5:
          $ref: '#/components/schemas/ParameterOverPc5'
        paramOverUu:
          $ref: '#/components/schemas/ParameterOverUu'
        paramForProSeDd:
          $ref: '#/components/schemas/ParamForProSeDd'
        paramForProSeDc:
          $ref: '#/components/schemas/ParamForProSeDc'
        paramForProSeU2NRelUe:
          $ref: '#/components/schemas/ParamForProSeU2NRelUe'
        paramForProSeRemUe:
          $ref: '#/components/schemas/ParamForProSeRemUe'
        urspGuidance:
          type: array
          items:
            $ref: '#/components/schemas/UrspRuleRequest'
          minItems: 1
          description: Contains the service parameter used to guide the URSP.
        deliveryEvents:
          type: array
          items:
            $ref: '#/components/schemas/Event'
          minItems: 1
          description: Contains the outcome of the UE Policy Delivery.
        policDelivNotifCorreId:
          type: string
          description: 'Contains the Notification Correlation Id allocated by the
            NEF for the notification of UE Policy delivery outcome.

            '
        policDelivNotifUri:
          $ref: '#/components/schemas/Uri'
        suppFeat:
          $ref: '#/components/schemas/SupportedFeatures'
        resUri:
          $ref: '#/components/schemas/Uri'
        headers:
          description: Contains the headers provisioned by the NEF.
          type: array
          items:
            type: string
          minItems: 1
        resetIds:
          type: array
          items:
            type: string
          minItems: 1
    ServiceParameterDataPatch:
      description: Represents the service parameter data that can be updated.
      type: object
      properties:
        paramOverPc5:
          $ref: '#/components/schemas/ParameterOverPc5'
        paramOverUu:
          $ref: '#/components/schemas/ParameterOverUu'
        paramForProSeDd:
          $ref: '#/components/schemas/ParamForProSeDd'
        paramForProSeDc:
          $ref: '#/components/schemas/ParamForProSeDc'
        paramForProSeU2NRelUe:
          $ref: '#/components/schemas/ParamForProSeU2NRelUe'
        paramForProSeRemUe:
          $ref: '#/components/schemas/ParamForProSeRemUe'
        urspInfluence:
          type: array
          items:
            $ref: '#/components/schemas/UrspRuleRequest'
          minItems: 1
          deprecated: true
          description: 'Contains the service parameter used to influence the URSP.
            This attribute is deprecated by the urspGuidance attribute.

            '
        urspGuidance:
          type: array
          items:
            $ref: '#/components/schemas/UrspRuleRequest'
          minItems: 1
          nullable: true
          description: 'Contains the service parameter used to influence the URSP.

            '
        deliveryEvents:
          type: array
          items:
            $ref: '#/components/schemas/Event'
          minItems: 1
          description: Contains the outcome of the UE Policy Delivery.
        policDelivNotifUri:
          $ref: '#/components/schemas/Uri'
        headers:
          description: Contains the headers provisioned by the NEF.
          type: array
          items:
            type: string
          minItems: 1
    TrafficInfluSub:
      description: Represents traffic influence subscription data.
      type: object
      properties:
        dnns:
          type: array
          items:
            $ref: '#/components/schemas/Dnn'
          minItems: 1
          description: Each element identifies a DNN.
        snssais:
          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
          description: Each element identifies a slice.
        internalGroupIds:
          type: array
          items:
            $ref: '#/components/schemas/GroupId'
          minItems: 1
          description: Each element identifies a group of users.
        supis:
          type: array
          items:
            $ref: '#/components/schemas/Supi'
          minItems: 1
          description: Each element identifies the user.
        notificationUri:
          $ref: '#/components/schemas/Uri'
        expiry:
          $ref: '#/components/schemas/DateTime'
        supportedFeatures:
          $ref: '#/components/schemas/SupportedFeatures'
        resetIds:
          type: array
          items:
            type: string
          minItems: 1
