        - IMMEDIATE_MDT_AND_TRACE
        - RLF_REPORTS_ONLY
        - RCEF_REPORTS_ONLY
        - LOGGED_MBSFN_MDT
      - type: string
      description: 'The enumeration JobType defines Job Type in the trace. See 3GPP
