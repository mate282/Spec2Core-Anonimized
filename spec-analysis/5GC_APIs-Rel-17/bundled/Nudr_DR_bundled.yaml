          minItems: 1
        nrCellIdList:
          type: array
          items:
            $ref: '#/components/schemas/NrCellId'
          minItems: 1
        tacList:
          type: array
          items:
            $ref: '#/components/schemas/Tac'
          minItems: 1
        tacInfoPerPlmn:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TacInfo'
          minProperties: 1
          description: 'A map (list of key-value pairs) where PlmnId converted to
            a string serves as key

            '
    MeasurementLteForMdt:
