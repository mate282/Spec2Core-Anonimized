      - type: string
        enum:
        - 1024
        - 1280
        - 2048
        - 2560
        - 5120
        - 10240
        - 60000
      - type: string
      description: 'The enumeration CollectionPeriodRmmLteMdt defines Collection period
        for RRM measurements LTE for MDT in the trace. See 3GPP TS 32.422 for further
        description of the values. It shall comply with the provisions defined in
        table 5.6.3.15-1.

        '
    CollectionPeriodRmmNrMdt:
      anyOf:
      - type: string
        enum:
        - 1024
        - 2048
        - 5120
        - 10240
        - 60000
      - type: string
      description: 'The enumeration CollectionPeriodRmmNrMdt defines Collection period
        for RRM measurements NR for MDT in the trace. See 3GPP TS 32.422 for further
        description of the values. It shall comply with the provisions defined in
        table 5.6.3.19-1

        '
    MeasurementPeriodLteMdt:
      anyOf:
      - type: string
        enum:
        - 1024
        - 1280
        - 2048
        - 2560
        - 5120
        - 10240
        - 60000
      - type: string
      description: 'The enumeration MeasurementPeriodLteMdt defines Measurement period
        LTE for MDT in the trace.  See 3GPP TS 32.422 for further description of the
        values. It shall comply with the provisions defined in table 5.6.3.16-1.

        '
    MbsfnArea:
      description: Contains an MBSFN area information.
      type: object
      properties:
        mbsfnAreaId:
          type: integer
          minimum: 0
          maximum: 255
          description: This IE shall contain the MBSFN Area ID.
        carrierFrequency:
          type: integer
          minimum: 0
          maximum: 262143
          description: When present, this IE shall contain the Carrier Frequency (EARFCN).
    ArfcnValueNR:
      type: integer
      minimum: 0
      maximum: 3279165
      description: 'Integer value indicating the ARFCN applicable for a downlink,
        uplink or bi-directional (TDD) NR global frequency raster, as definition of
        "ARFCN-ValueNR" IE in clause 6.3.2 of 3GPP TS 38.331.

        '
    PhysCellId:
      type: integer
      minimum: 0
      maximum: 1007
      description: 'Integer value identifying the physical cell identity (PCI), as
        definition of "PhysCellId" IE  in clause 6.3.2 of 3GPP TS 38.331.

        '
    InterFreqTargetInfo:
      description: Indicates the Inter Frequency Target information.
      required:
      - dlCarrierFreq
      type: object
      properties:
        dlCarrierFreq:
          $ref: '#/components/schemas/ArfcnValueNR'
        cellIdList:
          type: array
          items:
            $ref: '#/components/schemas/PhysCellId'
          minItems: 1
          maxItems: 32
          description: 'When present, this IE shall contain a list of the physical
            cell identities where the UE is requested to perform measurement logging
            for the indicated frequency.

            '
    MdtConfiguration:
      description: contains contain MDT configuration data.
      type: object
      required:
      - jobType
      properties:
        jobType:
          $ref: '#/components/schemas/JobType'
        reportType:
          $ref: '#/components/schemas/ReportTypeMdt'
        areaScope:
          $ref: '#/components/schemas/AreaScope'
        measurementLteList:
          type: array
          items:
            $ref: '#/components/schemas/MeasurementLteForMdt'
        measurementNrList:
          type: array
          items:
            $ref: '#/components/schemas/MeasurementNrForMdt'
          minItems: 1
        sensorMeasurementList:
          type: array
          items:
            $ref: '#/components/schemas/SensorMeasurement'
          minItems: 1
        reportingTriggerList:
          type: array
          items:
            $ref: '#/components/schemas/ReportingTrigger'
          minItems: 1
        reportInterval:
          $ref: '#/components/schemas/ReportIntervalMdt'
        reportIntervalNr:
          $ref: '#/components/schemas/ReportIntervalNrMdt'
        reportAmount:
          $ref: '#/components/schemas/ReportAmountMdt'
        eventThresholdRsrp:
          type: integer
          minimum: 0
          maximum: 97
          description: 'This IE shall be present if the report trigger parameter is
            configured for A2 event reporting or A2 event triggered periodic reporting
            and the job type parameter is configured for Immediate MDT or combined
            Immediate MDT and Trace in LTE. When present, this IE shall indicate the
            Event Threshold for RSRP, and the value shall be between 0-97.

            '
        eventThresholdRsrpNr:
          type: integer
          minimum: 0
          maximum: 127
          description: 'This IE shall be present if the report trigger parameter is
            configured for A2 event reporting or A2 event triggered periodic reporting
            and the job type parameter is configured for Immediate MDT or combined
            Immediate MDT and Trace in NR. When present, this IE shall indicate the
            Event Threshold for RSRP, and the value shall be between 0-127.

            '
        eventThresholdRsrq:
          type: integer
          minimum: 0
          maximum: 34
          description: 'This IE shall be present if the report trigger parameter is
            configured for A2 event reporting or A2 event triggered periodic reporting
            and the job type parameter is configured for Immediate MDT or combined
            Immediate MDT and Trace in LTE.When present, this IE shall indicate the
            Event Threshold for RSRQ, and the value shall be between 0-34.

            '
        eventThresholdRsrqNr:
          type: integer
          minimum: 0
          maximum: 127
          description: 'This IE shall be present if the report trigger parameter is
            configured for A2 event reporting or A2 event triggered periodic reporting
            and the job type parameter is configured for Immediate MDT or combined
            Immediate MDT and Trace in NR.When present, this IE shall indicate the
            Event Threshold for RSRQ, and the value shall be between 0-127.

            '
        eventList:
          type: array
          items:
            $ref: '#/components/schemas/EventForMdt'
          minItems: 1
        loggingInterval:
          $ref: '#/components/schemas/LoggingIntervalMdt'
        loggingIntervalNr:
          $ref: '#/components/schemas/LoggingIntervalNrMdt'
        loggingDuration:
          $ref: '#/components/schemas/LoggingDurationMdt'
        loggingDurationNr:
          $ref: '#/components/schemas/LoggingDurationNrMdt'
        positioningMethod:
          $ref: '#/components/schemas/PositioningMethodMdt'
        addPositioningMethodList:
          type: array
          items:
            $ref: '#/components/schemas/PositioningMethodMdt'
          minItems: 1
        collectionPeriodRmmLte:
          $ref: '#/components/schemas/CollectionPeriodRmmLteMdt'
        collectionPeriodRmmNr:
          $ref: '#/components/schemas/CollectionPeriodRmmNrMdt'
        measurementPeriodLte:
          $ref: '#/components/schemas/MeasurementPeriodLteMdt'
        mdtAllowedPlmnIdList:
          type: array
          items:
            $ref: '#/components/schemas/PlmnId'
          minItems: 1
          maxItems: 16
        mbsfnAreaList:
          type: array
          items:
            $ref: '#/components/schemas/MbsfnArea'
          minItems: 1
          maxItems: 8
        interFreqTargetList:
          type: array
          items:
            $ref: '#/components/schemas/InterFreqTargetInfo'
          minItems: 1
          maxItems: 8
    TraceDepth:
      anyOf:
      - type: string
        enum:
        - MINIMUM
        - MEDIUM
        - MAXIMUM
        - MINIMUM_WO_VENDOR_EXTENSION
        - MEDIUM_WO_VENDOR_EXTENSION
        - MAXIMUM_WO_VENDOR_EXTENSION
      - type: string
      description: 'The enumeration TraceDepth defines how detailed information should
        be recorded in the trace. See 3GPP TS 32.422 for further description of the
        values. It shall comply with the provisions defined in table 5.6.3.1-1

        '
    Ipv4Addr:
      type: string
      pattern: ^(([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])$
      example: 198.51.100.1
      description: 'String identifying a IPv4 address formatted in the ''dotted decimal''
        notation as defined in RFC 1166.

        '
    Ipv6Addr:
      type: string
      allOf:
      - pattern: ^((:|(0?|([1-9a-f][0-9a-f]{0,3}))):)((0?|([1-9a-f][0-9a-f]{0,3})):){0,6}(:|(0?|([1-9a-f][0-9a-f]{0,3})))$
      - pattern: ^((([^:]+:){7}([^:]+))|((([^:]+:)*[^:]+)?::(([^:]+:)*[^:]+)?))$
      example: 2001:db8:85a3::8a2e:370:7334
      description: 'String identifying an IPv6 address formatted according to clause
        4 of RFC5952. The mixed IPv4 IPv6 notation according to clause 5 of RFC5952
        shall not be used.

        '
    TraceData:
      description: contains Trace control and configuration parameters.
      type: object
      nullable: true
      properties:
        traceRef:
          type: string
          pattern: ^[0-9]{3}[0-9]{2,3}-[A-Fa-f0-9]{6}$
          description: 'Trace Reference (see 3GPP TS 32.422).It shall be encoded as
            the concatenation of MCC, MNC and Trace ID as follows: <MCC><MNC>-<Trace
            ID> The Trace ID shall be encoded as a 3 octet string in hexadecimal representation.
            Each character in the Trace ID string shall take a value of "0" to "9",
            "a" to "f" or "A" to "F" and shall represent 4 bits. The most significant
            character representing the 4 most significant bits of the Trace ID shall
            appear first  in the string, and the character representing the 4 least
            significant bit of the Trace ID shall appear last in the string.

            '
        traceDepth:
          $ref: '#/components/schemas/TraceDepth'
        neTypeList:
          type: string
          pattern: ^[A-Fa-f0-9]+$
          description: 'List of NE Types (see 3GPP TS 32.422).It shall be encoded
            as an octet string in hexadecimal representation. Each character in the
            string shall take a value of "0" to "9", "a" to "f" or "A" to "F" and
            shall represent 4 bits. The most significant character representing the
            4 most significant bits shall Appear first in the string, and the character
            representing the 4 least significant bit shall appear last in the string.Octets
            shall be coded according to 3GPP TS 32.422.

            '
        eventList:
          type: string
          pattern: ^[A-Fa-f0-9]+$
          description: 'Triggering events (see 3GPP TS 32.422).It shall be encoded
            as an octet string in hexadecimal representation. Each character in the
            string shall take a value of "0" to "9", "a" to "f" or "A" to "F" and
            shall represent 4 bits. The most significant character representing the
            4 most significant bits shall appear first in the string, and the character
            representing the 4 least significant bit shall appear last in the string.
            Octets shall be coded according to 3GPP TS 32.422.

            '
        collectionEntityIpv4Addr:
          $ref: '#/components/schemas/Ipv4Addr'
        collectionEntityIpv6Addr:
          $ref: '#/components/schemas/Ipv6Addr'
        traceReportingConsumerUri:
          $ref: '#/components/schemas/Uri'
        interfaceList:
          type: string
          pattern: ^[A-Fa-f0-9]+$
          description: 'List of Interfaces (see 3GPP TS 32.422).It shall be encoded
            as an octet string in hexadecimal representation. Each character in the
            string shall take a value of "0" to "9", "a" to "f" or "A" to "F" and
            shall represent 4 bits. The most significant character representing the
            4 most significant bits shall appear first in the string, and the character
            representing the  4 least significant bit shall appear last in the string.
            Octets shall be coded according to 3GPP TS 32.422. If this attribute is
            not present, all the interfaces applicable to the list of NE types indicated
            in the neTypeList attribute should be traced.

            '
      required:
      - traceRef
      - traceDepth
      - neTypeList
      - eventList
    CagId:
      type: string
      pattern: ^[A-Fa-f0-9]{8}$
      description: String containing a Closed Access Group Identifier.
    CagInfo:
      type: object
