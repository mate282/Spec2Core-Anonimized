          type: array
          items:
            $ref: '#/components/schemas/Snssai'
          minItems: 1
        routingId:
          $ref: '#/components/schemas/RoutingId'
        drei:
          type: boolean
        aol:
          type: boolean
    UpuRegInd:
      type: boolean
    UpuAckInd:
      description: Contains the indication of whether the acknowledgement from UE
        is needed.
      type: boolean
    CounterUpu:
      description: CounterUPU.
      type: string
      pattern: ^[A-Fa-f0-9]{4}$
    UpuInfo:
      type: object
      properties:
        upuDataList:
          type: array
          items:
            $ref: '#/components/schemas/schemas-UpuData'
          minItems: 1
        upuRegInd:
          $ref: '#/components/schemas/UpuRegInd'
        upuAckInd:
          $ref: '#/components/schemas/UpuAckInd'
        upuMacIausf:
          $ref: '#/components/schemas/UpuMac'
        counterUpu:
          $ref: '#/components/schemas/CounterUpu'
        provisioningTime:
          $ref: '#/components/schemas/DateTime'
        upuTransparentContainer:
          $ref: '#/components/schemas/Bytes'
      required:
      - provisioningTime
    MicoAllowed:
      type: boolean
    OdbPacketServices:
      anyOf:
      - anyOf:
        - type: string
          enum:
          - ALL_PACKET_SERVICES
          - ROAMER_ACCESS_HPLMN_AP
          - ROAMER_ACCESS_VPLMN_AP
        - type: string
      - $ref: '#/components/schemas/NullValue'
      description: 'The enumeration OdbPacketServices defines the Barring of Packet
        Oriented Services. See 3GPP TS 23.015 for further description. It shall comply
        with the provisions defined in table 5.7.3.2-1

        '
    Dnn:
      type: string
      description: 'String representing a Data Network as defined in clause 9A of
        3GPP TS 23.003;  it shall contain either a DNN Network Identifier, or a full
        DNN with both the Network  Identifier and Operator Identifier, as specified
        in 3GPP TS 23.003 clause 9.1.1 and 9.1.2. It shall be coded as string in which
        the labels are separated by dots  (e.g. "Label1.Label2.Label3").

        '
    WildcardDnn:
      type: string
      pattern: ^[*]$
      description: String representing the Wildcard DNN. It shall contain the string
